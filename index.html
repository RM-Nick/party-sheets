from an open container, or pouring the contents from a vial.<\/p>"},"teleport":{"n":"Teleport","l":7,"sc":"Conjuration","t":"Action","r":"10 ft","c":"V","d":"Instantaneous","conc":false,"rit":false,"cls":["Bard","Sorcerer","Wizard"],"src":"XPHB","u":"https://5e.tools/spells.html#teleport_xphb","srd":true,"h":"<p>This spell instantly transports you and up to eight willing creatures that you can see within range, or a single object that you can see within range, to a destination you select. If you target an object, it must be Large or smaller, and it can't be held or carried by an unwilling creature.<\/p><p>The destination you choose must be known to you, and it must be on the same plane of existence as you. Your familiarity with the destination determines whether you arrive there successfully. The DM rolls 1d100 and consults the Teleportation Outcome table and the explanations after it.<\/p><div class=\"tw\"><table><caption>Teleportation Outcome<\/caption><tr><th>Familiarity<\/th><th>Mishap<\/th><th>Similar Area<\/th><th>Off Target<\/th><th>On Target<\/th><\/tr><tr><td>Permanent circle<\/td><td>—<\/td><td>—<\/td><td>—<\/td><td>01-00<\/td><\/tr><tr><td>Linked object<\/td><td>—<\/td><td>—<\/td><td>—<\/td><td>01-00<\/td><\/tr><tr><td>Very familiar<\/td><td>01-05<\/td><td>06-13<\/td><td>14-24<\/td><td>25-00<\/td><\/tr><tr><td>Seen casually<\/td><td>01-33<\/td><td>34-43<\/td><td>44-53<\/td><td>54-00<\/td><\/tr><tr><td>Viewed once or described<\/td><td>01-43<\/td><td>44-53<\/td><td>54-73<\/td><td>74-00<\/td><\/tr><tr><td>False destination<\/td><td>01-50<\/td><td>51-00<\/td><td>—<\/td><td>—<\/td><\/tr><\/table><\/div><p><b><i>Familiarity.<\/i><\/b> Here are the meanings of the terms in the table's Familiarity column:<\/p><ul><li>\"Permanent circle\" means a permanent teleportation circle whose sigil sequence you know.<\/li><li>\"Linked object\" means you possess an object taken from the desired destination within the last six months, such as a book from a wizard's library.<\/li><li>\"Very familiar\" is a place you have visited often, a place you have carefully studied, or a place you can see when you cast the spell.<\/li><li>\"Seen casually\" is a place you have seen more than once but with which you aren't very familiar.<\/li><li>\"Viewed once or described\" is a place you have seen once, possibly using magic, or a place you know through someone else's description, perhaps from a map.<\/li><li>\"False destination\" is a place that doesn't exist. Perhaps you tried to scry an enemy's sanctum but instead viewed an illusion, or you are attempting to teleport to a location that no longer exists.<\/li><\/ul><p><b><i>Mishap.<\/i><\/b> The spell's unpredictable magic results in a difficult journey. Each teleporting creature (or the target object) takes 3d10 Force damage, and the DM rerolls on the table to see where you wind up (multiple mishaps can occur, dealing damage each time).<\/p><p><b><i>Similar Area.<\/i><\/b> You and your group (or the target object) appear in a different area that's visually or thematically similar to the target area. You appear in the closest similar place. If you are heading for your home laboratory, for example, you might appear in another person's laboratory in the same city.<\/p><p><b><i>Off Target.<\/i><\/b> You and your group (or the target object) appear 2d12 miles away from the destination in a random direction. Roll 1d8 for the direction: 1, east; 2, southeast; 3, south; 4, southwest; 5, west; 6, northwest; 7, north; or 8, northeast.<\/p><p><b><i>On Target.<\/i><\/b> You and your group (or the target object) appear where you intended.<\/p>"},"teleportation circle":{"n":"Teleportation Circle","l":5,"sc":"Conjuration","t":"1 minute","r":"10 ft","c":"V, M (rare inks worth 50+ GP, which the spell consumes)","d":"1 round","conc":false,"rit":false,"cls":["Bard","Sorcerer","Warlock","Wizard"],"src":"XPHB","u":"https://5e.tools/spells.html#teleportation%20circle_xphb","srd":true,"h":"<p>As you cast the spell, you draw a 5-foot-radius circle on the ground inscribed with sigils that link your location to a permanent teleportation circle of your choice whose sigil sequence you know and that is on the same plane of existence as you. A shimmering portal opens within the circle you drew and remains open until the end of your next turn. Any creature that enters the portal instantly appears within 5 feet of the destination circle or in the nearest unoccupied space if that space is occupied.<\/p><p>Many major temples, guildhalls, and other important places have permanent teleportation circles. Each circle includes a unique sigil sequence—a string of runes arranged in a particular pattern.<\/p><p>When you first gain the ability to cast this spell, you learn the sigil sequences for two destinations on the Material Plane, determined by the DM. You might learn additional sigil sequences during your adventures. You can commit a new sigil sequence to memory after studying it for 1 minute.<\/p><p>You can create a permanent teleportation circle by casting this spell in the same location every day for 365 days.<\/p>"},"tenser's floating disk":{"n":"Tenser's Floating Disk","l":1,"sc":"Conjuration","t":"Action","r":"30 ft","c":"V, S, M (a drop of mercury)","d":"1 hour","conc":false,"rit":true,"cls":["Wizard"],"src":"XPHB","u":"https://5e.tools/spells.html#tenser%27s%20floating%20disk_xphb","srd":true,"h":"<p>This spell creates a circular, horizontal plane of force, 3 feet in diameter and 1 inch thick, that floats 3 feet above the ground in an unoccupied space of your choice that you can see within range. The disk remains for the duration and can hold up to 500 pounds. If more weight is placed on it, the spell ends, and everything on the disk falls to the ground.<\/p><p>The disk is immobile while you are within 20 feet of it. If you move more than 20 feet away from it, the disk follows you so that it remains within 20 feet of you. It can move across uneven terrain, up or down stairs, slopes and the like, but it can't cross an elevation change of 10 feet or more. For example, the disk can't move across a 10-foot-deep pit, nor could it leave such a pit if it was created at the bottom.<\/p><p>If you move more than 100 feet from the disk (typically because it can't move around an obstacle to follow you), the spell ends.<\/p>"},"thaumaturgy":{"n":"Thaumaturgy","l":0,"sc":"Transmutation","t":"Action","r":"30 ft","c":"V","d":"1 minute","conc":false,"rit":false,"cls":["Cleric"],"src":"XPHB","u":"https://5e.tools/spells.html#thaumaturgy_xphb","srd":true,"h":"<p>You manifest a minor wonder within range. You create one of the effects below within range. If you cast this spell multiple times, you can have up to three of its 1-minute effects active at a time.<\/p><p><b><i>Altered Eyes.<\/i><\/b> You alter the appearance of your eyes for 1 minute.<\/p><p><b><i>Booming Voice.<\/i><\/b> Your voice booms up to three times as loud as normal for 1 minute. For the duration, you have <a class=\"lk\" data-l=\"rule|advantage\">Advantage<\/a> on Charisma (<a class=\"lk\" data-l=\"skill|intimidation\">Intimidation<\/a>) checks.<\/p><p><b><i>Fire Play.<\/i><\/b> You cause flames to flicker, brighten, dim, or change color for 1 minute.<\/p><p><b><i>Invisible Hand.<\/i><\/b> You instantaneously cause an unlocked door or window to fly open or slam shut.<\/p><p><b><i>Phantom Sound.<\/i><\/b> You create an instantaneous sound that originates from a point of your choice within range, such as a rumble of thunder, the cry of a raven, or ominous whispers.<\/p><p><b><i>Tremors.<\/i><\/b> You cause harmless tremors in the ground for 1 minute.<\/p>"},"thorn whip":{"n":"Thorn Whip","l":0,"sc":"Transmutation","t":"Action","r":"30 ft","c":"V, S, M (the stem of a plant with thorns)","d":"Instantaneous","conc":false,"rit":false,"cls":["Druid"],"src":"XPHB","u":"https://5e.tools/spells.html#thorn%20whip_xphb","srd":false,"h":"<p>Melee spell attack against a creature within 30 ft: 1d6 Piercing, and if it is Large or smaller you can pull it up to 10 ft towards you.<\/p>","hl":"<p>Cantrip upgrade: 2d6 at level 5, 3d6 at 11, 4d6 at 17.<\/p>","own":true},"thunderclap":{"n":"Thunderclap","l":0,"sc":"Evocation","t":"Action","r":"Self (5-ft Emanation)","c":"S","d":"Instantaneous","conc":false,"rit":false,"cls":["Bard","Druid","Sorcerer","Warlock","Wizard"],"src":"XPHB","u":"https://5e.tools/spells.html#thunderclap_xphb","srd":false,"h":"<p>Each creature within 5 ft of you makes a Constitution save or takes 1d6 Thunder damage. The noise carries 100 ft.<\/p>","hl":"<p>Cantrip upgrade: 2d6 at level 5, 3d6 at 11, 4d6 at 17.<\/p>","own":true},"thunderwave":{"n":"Thunderwave","l":1,"sc":"Evocation","t":"Action","r":"Self (15-ft Cube)","c":"V, S","d":"Instantaneous","conc":false,"rit":false,"cls":["Bard","Druid","Sorcerer","Wizard"],"src":"XPHB","u":"https://5e.tools/spells.html#thunderwave_xphb","srd":true,"h":"<p>You unleash a wave of thunderous energy. Each creature in a 15-foot <a class=\"lk\" data-l=\"rule|cube [area of effect]\">Cube<\/a> originating from you makes a Constitution saving throw. On a failed save, a creature takes 2d8 Thunder damage and is pushed 10 feet away from you. On a successful save, a creature takes half as much damage only.<\/p><p>In addition, unsecured objects that are entirely within the <a class=\"lk\" data-l=\"rule|cube [area of effect]\">Cube<\/a> are pushed 10 feet away from you, and a thunderous boom is audible within 300 feet.<\/p>","hl":"<p><b><i>Using a Higher-Level Spell Slot.<\/i><\/b> The damage increases by 1d8 for each spell slot level above 1.<\/p>"},"time stop":{"n":"Time Stop","l":9,"sc":"Transmutation","t":"Action","r":"Self","c":"V","d":"Instantaneous","conc":false,"rit":false,"cls":["Sorcerer","Wizard"],"src":"XPHB","u":"https://5e.tools/spells.html#time%20stop_xphb","srd":true,"h":"<p>You briefly stop the flow of time for everyone but yourself. No time passes for other creatures, while you take 1d4 + 1 turns in a row, during which you can use actions and move as normal.<\/p><p>This spell ends if one of the actions you use during this period, or any effects that you create during it, affects a creature other than you or an object being worn or carried by someone other than you. In addition, the spell ends if you move to a place more than 1,000 feet from the location where you cast it.<\/p>"},"toll the dead":{"n":"Toll the Dead","l":0,"sc":"Necromancy","t":"Action","r":"60 ft","c":"V, S","d":"Instantaneous","conc":false,"rit":false,"cls":["Cleric","Warlock","Wizard"],"src":"XPHB","u":"https://5e.tools/spells.html#toll%20the%20dead_xphb","srd":false,"h":"<p>One creature you can see makes a Wisdom save or takes 1d8 Necrotic, or 1d12 Necrotic if it is already missing any <a class=\"lk\" data-l=\"rule|hit points\">Hit Points<\/a>.<\/p>","hl":"<p>Cantrip upgrade: one extra die at levels 5, 11 and 17.<\/p>","own":true},"tongues":{"n":"Tongues","l":3,"sc":"Divination","t":"Action","r":"Touch","c":"V, M (a miniature ziggurat)","d":"1 hour","conc":false,"rit":false,"cls":["Bard","Cleric","Sorcerer","Warlock","Wizard"],"src":"XPHB","u":"https://5e.tools/spells.html#tongues_xphb","srd":true,"h":"<p>This spell grants the creature you touch the ability to understand any spoken or signed language that it hears or sees. Moreover, when the target communicates by speaking or signing, any creature that knows at least one language can understand it if that creature can hear the speech or see the signing.<\/p>"},"true polymorph":{"n":"True Polymorph","l":9,"sc":"Transmutation","t":"Action","r":"30 ft","c":"V, S, M (a drop of mercury, a dollop of gum arabic, and a wisp of smoke)","d":"Up to 1 hour","conc":true,"rit":false,"cls":["Bard","Warlock","Wizard"],"src":"XPHB","u":"https://5e.tools/spells.html#true%20polymorph_xphb","srd":true,"h":"<p>Choose one creature or nonmagical object that you can see within range. The creature shape-shifts into a different creature or a nonmagical object, or the object shape-shifts into a creature (the object must be neither worn nor carried). The transformation lasts for the duration or until the target dies or is destroyed, but if you maintain <a class=\"lk\" data-l=\"cond|concentration\">Concentration<\/a> on this spell for the full duration, the spell lasts until dispelled.<\/p><p>An unwilling creature can make a Wisdom saving throw, and if it succeeds, it isn't affected by this spell.<\/p><p><b><i>Creature into Creature.<\/i><\/b> If you turn a creature into another kind of creature, the new form can be any kind you choose that has a <a class=\"lk\" data-l=\"rule|challenge rating\">Challenge Rating<\/a> equal to or less than the target's <a class=\"lk\" data-l=\"rule|challenge rating\">Challenge Rating<\/a> or level. The target's game statistics are replaced by the stat block of the new form, but it retains its <a class=\"lk\" data-l=\"rule|hit points\">Hit Points<\/a>, <a class=\"lk\" data-l=\"rule|hit point dice\">Hit Point Dice<\/a>, alignment, and personality.<\/p><p>The target gains a number of <a class=\"lk\" data-l=\"rule|temporary hit points\">Temporary Hit Points<\/a> equal to the <a class=\"lk\" data-l=\"rule|hit points\">Hit Points<\/a> of the new form. These <a class=\"lk\" data-l=\"rule|temporary hit points\">Temporary Hit Points<\/a> vanish if any remain when the spell ends.<\/p><p>The target is limited in the actions it can perform by the anatomy of its new form, and it can't speak or cast spells.<\/p><p>The target's gear melds into the new form. The creature can't use or otherwise benefit from any of that equipment.<\/p><p><b><i>Object into Creature.<\/i><\/b> You can turn an object into any kind of creature, as long as the creature's size is no larger than the object's size and the creature has a <a class=\"lk\" data-l=\"rule|challenge rating\">Challenge Rating<\/a> of 9 or lower. The creature is <a class=\"lk\" data-l=\"rule|friendly [attitude]\">Friendly<\/a> to you and your allies. In combat, it takes its turns immediately after yours, and it obeys your commands.<\/p><p>If the spell lasts more than an hour, you no longer control the creature. It might remain <a class=\"lk\" data-l=\"rule|friendly [attitude]\">Friendly<\/a> to you, depending on how you have treated it.<\/p><p><b><i>Creature into Object.<\/i><\/b> If you turn a creature into an object, it transforms along with whatever it is wearing and carrying into that form, as long as the object's size is no larger than the creature's size. The creature's statistics become those of the object, and the creature has no memory of time spent in this form after the spell ends and it returns to normal.<\/p>"},"true seeing":{"n":"True Seeing","l":6,"sc":"Divination","t":"Action","r":"Touch","c":"V, S, M (mushroom powder worth 25+ GP, which the spell consumes)","d":"1 hour","conc":false,"rit":false,"cls":["Bard","Cleric","Sorcerer","Warlock","Wizard"],"src":"XPHB","u":"https://5e.tools/spells.html#true%20seeing_xphb","srd":true,"h":"<p>For the duration, the willing creature you touch has <a class=\"lk\" data-l=\"sense|truesight\">Truesight<\/a> with a range of 120 feet.<\/p>"},"true strike":{"n":"True Strike","l":0,"sc":"Divination","t":"Action","r":"Self","c":"S, M (a weapon with which you have proficiency and that is worth 1+ CP)","d":"Instantaneous","conc":false,"rit":false,"cls":["Bard","Sorcerer","Warlock","Wizard"],"src":"XPHB","u":"https://5e.tools/spells.html#true%20strike_xphb","srd":true,"h":"<p>Guided by a flash of magical insight, you make one attack with the weapon used in the spell's casting. The attack uses your spellcasting ability for the attack and damage rolls instead of using Strength or Dexterity. If the attack deals damage, it can be Radiant damage or the weapon's normal damage type (your choice).<\/p>","hl":"<p><b><i>Cantrip Upgrade.<\/i><\/b> Whether you deal Radiant damage or the weapon's normal damage type, the attack deals extra Radiant damage when you reach levels 5 (1d6), 11 (2d6), and 17 (3d6).<\/p>"},"unseen servant":{"n":"Unseen Servant","l":1,"sc":"Conjuration","t":"Action","r":"60 ft","c":"V, S, M (a bit of string and of wood)","d":"1 hour","conc":false,"rit":true,"cls":["Bard","Warlock","Wizard"],"src":"XPHB","u":"https://5e.tools/spells.html#unseen%20servant_xphb","srd":true,"h":"<p>This spell creates an <a class=\"lk\" data-l=\"cond|invisible\">Invisible<\/a>, mindless, shapeless, Medium force that performs simple tasks at your command until the spell ends. The servant springs into existence in an unoccupied space on the ground within range. It has AC 10, 1 <a class=\"lk\" data-l=\"rule|hit points\">Hit Point<\/a>, and a Strength of 2, and it can't attack. If it drops to 0 <a class=\"lk\" data-l=\"rule|hit points\">Hit Points<\/a>, the spell ends.<\/p><p>Once on each of your turns as a <a class=\"lk\" data-l=\"rule|bonus action\">Bonus Action<\/a>, you can mentally command the servant to move up to 15 feet and interact with an object. The servant can perform simple tasks that a human could do, such as fetching things, cleaning, mending, folding clothes, lighting fires, serving food, and pouring drinks. Once you give the command, the servant performs the task to the best of its ability until it completes the task, then waits for your next command.<\/p><p>If you command the servant to perform a task that would move it more than 60 feet away from you, the spell ends.<\/p>"},"vampiric touch":{"n":"Vampiric Touch","l":3,"sc":"Necromancy","t":"Action","r":"Self","c":"V, S","d":"Up to 1 minute","conc":true,"rit":false,"cls":["Sorcerer","Warlock","Wizard"],"src":"XPHB","u":"https://5e.tools/spells.html#vampiric%20touch_xphb","srd":true,"h":"<p>The touch of your shadow-wreathed hand can siphon life force from others to heal your wounds. Make a melee spell attack against one creature within reach. On a hit, the target takes 3d6 Necrotic damage, and you regain <a class=\"lk\" data-l=\"rule|hit points\">Hit Points<\/a> equal to half the amount of Necrotic damage dealt.<\/p><p>Until the spell ends, you can make the attack again on each of your turns as a <a class=\"lk\" data-l=\"act|magic\">Magic<\/a> action, targeting the same creature or a different one.<\/p>","hl":"<p><b><i>Using a Higher-Level Spell Slot.<\/i><\/b> The damage increases by 1d6 for each spell slot level above 3.<\/p>"},"vicious mockery":{"n":"Vicious Mockery","l":0,"sc":"Enchantment","t":"Action","r":"60 ft","c":"V","d":"Instantaneous","conc":false,"rit":false,"cls":["Bard"],"src":"XPHB","u":"https://5e.tools/spells.html#vicious%20mockery_xphb","srd":true,"h":"<p>You unleash a string of insults laced with subtle enchantments at one creature you can see or hear within range. The target must succeed on a Wisdom saving throw or take 1d6 Psychic damage and have <a class=\"lk\" data-l=\"rule|disadvantage\">Disadvantage<\/a> on the next attack roll it makes before the end of its next turn.<\/p>","hl":"<p><b><i>Cantrip Upgrade.<\/i><\/b> The damage increases by 1d6 when you reach levels 5 (2d6), 11 (3d6), and 17 (4d6).<\/p>"},"vitriolic sphere":{"n":"Vitriolic Sphere","l":4,"sc":"Evocation","t":"Action","r":"150 ft","c":"V, S, M (a drop of bile)","d":"Instantaneous","conc":false,"rit":false,"cls":["Sorcerer","Wizard"],"src":"XPHB","u":"https://5e.tools/spells.html#vitriolic%20sphere_xphb","srd":true,"h":"<p>You point at a location within range, and a glowing, 1-foot-diameter ball of acid streaks there and explodes in a 20-foot-radius <a class=\"lk\" data-l=\"rule|sphere [area of effect]\">Sphere<\/a>. Each creature in that area makes a Dexterity saving throw. On a failed save, a creature takes 10d4 Acid damage and another 5d4 Acid damage at the end of its next turn. On a successful save, a creature takes half the initial damage only.<\/p>","hl":"<p><b><i>Using a Higher-Level Spell Slot.<\/i><\/b> The initial damage increases by 2d4 for each spell slot level above 4.<\/p>"},"wall of fire":{"n":"Wall of Fire","l":4,"sc":"Evocation","t":"Action","r":"120 ft","c":"V, S, M (a piece of charcoal)","d":"Up to 1 minute","conc":true,"rit":false,"cls":["Druid","Sorcerer","Wizard"],"src":"XPHB","u":"https://5e.tools/spells.html#wall%20of%20fire_xphb","srd":true,"h":"<p>You create a wall of fire on a solid surface within range. You can make the wall up to 60 feet long, 20 feet high, and 1 foot thick, or a ringed wall up to 20 feet in diameter, 20 feet high, and 1 foot thick. The wall is opaque and lasts for the duration.<\/p><p>When the wall appears, each creature in its area makes a Dexterity saving throw, taking 5d8 Fire damage on a failed save or half as much damage on a successful one.<\/p><p>One side of the wall, selected by you when you cast this spell, deals 5d8 Fire damage to each creature that ends its turn within 10 feet of that side or inside the wall. A creature takes the same damage when it enters the wall for the first time on a turn or ends its turn there. The other side of the wall deals no damage.<\/p>","hl":"<p><b><i>Using a Higher-Level Spell Slot.<\/i><\/b> The damage increases by 1d8 for each spell slot level above 4.<\/p>"},"wall of stone":{"n":"Wall of Stone","l":5,"sc":"Evocation","t":"Action","r":"120 ft","c":"V, S, M (a cube of granite)","d":"Up to 10 minutes","conc":true,"rit":false,"cls":["Druid","Sorcerer","Wizard"],"src":"XPHB","u":"https://5e.tools/spells.html#wall%20of%20stone_xphb","srd":true,"h":"<p>A nonmagical wall of solid stone springs into existence at a point you choose within range. The wall is 6 inches thick and is composed of ten 10-foot-by-10-foot panels. Each panel must be contiguous with another panel. Alternatively, you can create 10-foot-by-20-foot panels that are only 3 inches thick.<\/p><p>If the wall cuts through a creature's space when it appears, the creature is pushed to one side of the wall (you choose which side). If a creature would be surrounded on all sides by the wall (or the wall and another solid surface), that creature can make a Dexterity saving throw. On a success, it can use its <a class=\"lk\" data-l=\"rule|reaction\">Reaction<\/a> to move up to its <a class=\"lk\" data-l=\"rule|speed\">Speed<\/a> so that it is no longer enclosed by the wall.<\/p><p>The wall can have any shape you desire, though it can't occupy the same space as a creature or object. The wall doesn't need to be vertical or rest on a firm foundation. It must, however, merge with and be solidly supported by existing stone. Thus, you can use this spell to bridge a chasm or create a ramp.<\/p><p>If you create a span greater than 20 feet in length, you must halve the size of each panel to create supports. You can crudely shape the wall to create battlements and the like.<\/p><p>The wall is an object made of stone that can be damaged and thus breached. Each panel has AC 15 and 30 <a class=\"lk\" data-l=\"rule|hit points\">Hit Points<\/a> per inch of thickness, and it has <a class=\"lk\" data-l=\"rule|immunity\">Immunity<\/a> to Poison and Psychic damage. Reducing a panel to 0 <a class=\"lk\" data-l=\"rule|hit points\">Hit Points<\/a> destroys it and might cause connected panels to collapse at the DM's discretion.<\/p><p>If you maintain your <a class=\"lk\" data-l=\"cond|concentration\">Concentration<\/a> on this spell for its full duration, the wall becomes permanent and can't be dispelled. Otherwise, the wall disappears when the spell ends.<\/p>"},"water breathing":{"n":"Water Breathing","l":3,"sc":"Transmutation","t":"Action","r":"30 ft","c":"V, S, M (a short reed)","d":"24 hours","conc":false,"rit":true,"cls":["Druid","Ranger","Sorcerer","Wizard"],"src":"XPHB","u":"https://5e.tools/spells.html#water%20breathing_xphb","srd":true,"h":"<p>This spell grants up to ten willing creatures of your choice within range the ability to breathe underwater until the spell ends. Affected creatures also retain their normal mode of respiration.<\/p>"},"water walk":{"n":"Water Walk","l":3,"sc":"Transmutation","t":"Action","r":"30 ft","c":"V, S, M (a piece of cork)","d":"1 hour","conc":false,"rit":true,"cls":["Cleric","Druid","Ranger","Sorcerer"],"src":"XPHB","u":"https://5e.tools/spells.html#water%20walk_xphb","srd":true,"h":"<p>This spell grants the ability to move across any liquid surface—such as water, acid, mud, snow, quicksand, or lava—as if it were harmless solid ground (creatures crossing molten lava can still take damage from the heat). Up to ten willing creatures of your choice within range gain this ability for the duration.<\/p><p>An affected target must take a <a class=\"lk\" data-l=\"rule|bonus action\">Bonus Action<\/a> to pass from the liquid's surface into the liquid itself and vice versa, but if the target falls into the liquid, the target passes through the surface into the liquid below.<\/p>"},"web":{"n":"Web","l":2,"sc":"Conjuration","t":"Action","r":"60 ft","c":"V, S, M (a bit of spiderweb)","d":"Up to 1 hour","conc":true,"rit":false,"cls":["Sorcerer","Wizard"],"src":"XPHB","u":"https://5e.tools/spells.html#web_xphb","srd":true,"h":"<p>You conjure a mass of sticky webbing at a point within range. The webs fill a 20-foot <a class=\"lk\" data-l=\"rule|cube [area of effect]\">Cube<\/a> there for the duration. The webs are <a class=\"lk\" data-l=\"rule|difficult terrain\">Difficult Terrain<\/a>, and the area within them is <a class=\"lk\" data-l=\"rule|lightly obscured\">Lightly Obscured<\/a>.<\/p><p>If the webs aren't anchored between two solid masses (such as walls or trees) or layered across a floor, wall, or ceiling, the web collapses on itself, and the spell ends at the start of your next turn. Webs layered over a flat surface have a depth of 5 feet.<\/p><p>The first time a creature enters the webs on a turn or starts its turn there, it must succeed on a Dexterity saving throw or have the <a class=\"lk\" data-l=\"cond|restrained\">Restrained<\/a> condition while in the webs or until it breaks free.<\/p><p>A creature <a class=\"lk\" data-l=\"cond|restrained\">Restrained<\/a> by the webs can take an action to make a Strength (<a class=\"lk\" data-l=\"skill|athletics\">Athletics<\/a>) check against your spell save DC. If it succeeds, it is no longer <a class=\"lk\" data-l=\"cond|restrained\">Restrained<\/a>.<\/p><p>The webs are flammable. Any 5-foot <a class=\"lk\" data-l=\"rule|cube [area of effect]\">Cube<\/a> of webs exposed to fire burns away in 1 round, dealing 2d4 Fire damage to any creature that starts its turn in the fire.<\/p>"},"weird":{"n":"Weird","l":9,"sc":"Illusion","t":"Action","r":"120 ft","c":"V, S","d":"Up to 1 minute","conc":true,"rit":false,"cls":["Warlock","Wizard"],"src":"XPHB","u":"https://5e.tools/spells.html#weird_xphb","srd":true,"h":"<p>You try to create illusory terrors in others' minds. Each creature of your choice in a 30-foot-radius <a class=\"lk\" data-l=\"rule|sphere [area of effect]\">Sphere<\/a> centered on a point within range makes a Wisdom saving throw. On a failed save, a target takes 10d10 Psychic damage and has the <a class=\"lk\" data-l=\"cond|frightened\">Frightened<\/a> condition for the duration. On a successful save, a target takes half as much damage only.<\/p><p>A <a class=\"lk\" data-l=\"cond|frightened\">Frightened<\/a> target makes a Wisdom saving throw at the end of each of its turns. On a failed save, it takes 5d10 Psychic damage. On a successful save, the spell ends on that target.<\/p>"},"wish":{"n":"Wish","l":9,"sc":"Conjuration","t":"Action","r":"Self","c":"V","d":"Instantaneous","conc":false,"rit":false,"cls":["Sorcerer","Wizard"],"src":"XPHB","u":"https://5e.tools/spells.html#wish_xphb","srd":true,"h":"<p>Wish is the mightiest spell a mortal can cast. By simply speaking aloud, you can alter reality itself.<\/p><p>The basic use of this spell is to duplicate any other spell of level 8 or lower. If you use it this way, you don't need to meet any requirements to cast that spell, including costly components. The spell simply takes effect.<\/p><p>Alternatively, you can create one of the following effects of your choice:<\/p><ul><li><b>Object Creation<\/b> You create one object of up to 25,000 GP in value that isn't a magic item. The object can be no more than 300 feet in any dimension, and it appears in an unoccupied space that you can see on the ground.<\/li><li><b>Instant Health<\/b> You allow yourself and up to twenty creatures that you can see to regain all <a class=\"lk\" data-l=\"rule|hit points\">Hit Points<\/a>, and you end all effects on them listed in the <a class=\"lk\" data-l=\"spell|greater restoration\">Greater Restoration<\/a> spell.<\/li><li><b>Resistance<\/b> You grant up to ten creatures that you can see <a class=\"lk\" data-l=\"rule|resistance\">Resistance<\/a> to one damage type that you choose. This <a class=\"lk\" data-l=\"rule|resistance\">Resistance<\/a> is permanent.<\/li><li><b>Spell Immunity<\/b> You grant up to ten creatures you can see immunity to a single spell or other magical effect for 8 hours.<\/li><li><b>Sudden Learning<\/b> You replace one of your feats with another feat for which you are eligible. You lose all the benefits of the old feat and gain the benefits of the new one. You can't replace a feat that is a prerequisite for any of your other feats or features.<\/li><li><b>Roll Redo<\/b> You undo a single recent event by forcing a reroll of any die roll made within the last round (including your last turn). Reality reshapes itself to accommodate the new result. For example, a Wish spell could undo an ally's failed saving throw or a foe's <a class=\"lk\" data-l=\"rule|critical hit\">Critical Hit<\/a>. You can force the reroll to be made with <a class=\"lk\" data-l=\"rule|advantage\">Advantage<\/a> or <a class=\"lk\" data-l=\"rule|disadvantage\">Disadvantage<\/a>, and you choose whether to use the reroll or the original roll.<\/li><li><b>Reshape Reality<\/b> You may wish for something not included in any of the other effects. To do so, state your wish to the DM as precisely as possible. The DM has great latitude in ruling what occurs in such an instance; the greater the wish, the greater the likelihood that something goes wrong. This spell might simply fail, the effect you desire might be achieved only in part, or you might suffer an unforeseen consequence as a result of how you worded the wish. For example, wishing that a villain were dead might propel you forward in time to a period when that villain is no longer alive, effectively removing you from the game. Similarly, wishing for a Legendary magic item or an Artifact might instantly transport you to the presence of the item's current owner. If your wish is granted and its effects have consequences for a whole community, region, or world, you are likely to attract powerful foes. If your wish would affect a god, the god's divine servants might instantly intervene to prevent it or to encourage you to craft the wish in a particular way. If your wish would undo the multiverse itself, threaten the City of Sigil, or affect the Lady of Pain in any way, you see an image of her in your mind for a moment; she shakes her head, and your wish fails.<\/li><\/ul><p>The stress of casting Wish to produce any effect other than duplicating another spell weakens you. After enduring that stress, each time you cast a spell until you finish a <a class=\"lk\" data-l=\"rule|long rest\">Long Rest<\/a>, you take 1d10 Necrotic damage per level of that spell. This damage can't be reduced or prevented in any way. In addition, your Strength score becomes 3 for 2d4 days. For each of those days that you spend resting and doing nothing more than light activity, your remaining recovery time decreases by 2 days. Finally, there is a 33 percent chance that you are unable to cast <a class=\"lk\" data-l=\"spell|wish\">Wish<\/a> ever again if you suffer this stress.<\/p>"},"witch bolt":{"n":"Witch Bolt","l":1,"sc":"Evocation","t":"Action","r":"60 ft","c":"V, S, M (a twig struck by lightning)","d":"Up to 1 minute","conc":true,"rit":false,"cls":["Sorcerer","Warlock","Wizard"],"src":"XPHB","u":"https://5e.tools/spells.html#witch%20bolt_xphb","srd":false,"h":"<p>Ranged spell attack: 2d12 Lightning on a hit. On each later turn you can use a <a class=\"lk\" data-l=\"rule|bonus action\">Bonus Action<\/a> to deal 1d12 Lightning to the same target automatically, even if the first attack missed. Ends if the target leaves range or has Total <a class=\"lk\" data-l=\"rule|cover\">Cover<\/a> from you.<\/p>","hl":"<p>+1d12 initial damage per slot level above 1.<\/p>","own":true},"word of radiance":{"n":"Word of Radiance","l":0,"sc":"Evocation","t":"Action","r":"Self (5-ft Emanation)","c":"V, M (a sunburst token)","d":"Instantaneous","conc":false,"rit":false,"cls":["Cleric"],"src":"XPHB","u":"https://5e.tools/spells.html#word%20of%20radiance_xphb","srd":false,"h":"<p>Creatures of your choice that you can see within 5 ft of you make a Constitution save or take 1d6 Radiant damage.<\/p>","hl":"<p>Cantrip upgrade: 2d6 at level 5, 3d6 at 11, 4d6 at 17.<\/p>","own":true},"mold earth":{"n":"Mold Earth","l":0,"sc":"Transmutation","t":"Action","r":"30 ft","c":"S","d":"Instantaneous","conc":false,"rit":false,"cls":["Druid","Sorcerer","Wizard"],"src":"XGE","u":"https://5e.tools/spells.html#mold%20earth_xge","srd":false,"h":"<p>Work a 5-ft cube of dirt or stone you can see in range: instantly dig out loose earth and dump it up to 5 ft away, mark it with shapes, colours or words for 1 hour, or turn ground into <a class=\"lk\" data-l=\"rule|difficult terrain\">Difficult Terrain<\/a> (or back to normal) for 1 hour. Up to two lasting effects at a time; dismiss one with an action.<\/p>","own":true},"encode thoughts":{"n":"Encode Thoughts","l":0,"sc":"Enchantment","t":"Action","r":"Self","c":"S","d":"8 hours","conc":false,"rit":false,"cls":[],"src":"GGR","u":"https://5e.tools/spells.html#encode%20thoughts_ggr","srd":false,"h":"<p>Pull a memory, idea or message from your mind into a ribbon-like thought strand that you can hand to someone. While concentrating on a mind-reading effect (such as <a class=\"lk\" data-l=\"spell|detect thoughts\">Detect Thoughts<\/a>) you can encode the thoughts you are reading instead. Casting this while holding a strand lets you receive what it holds.<\/p>","own":true}},"classes":{"Warlock":{"hd":8,"saves":["wis","cha"],"feats":[{"lv":1,"n":"Eldritch Invocations","h":"<p>You have unearthed Eldritch Invocations, pieces of forbidden knowledge that imbue you with an abiding magical ability or other lessons. You gain one invocation of your choice, such as Pact of the Tome. Invocations are described in the \"Eldritch Invocation Options\" section later in this class's description.<\/p><p><b><i>Prerequisites.<\/i><\/b> If an invocation has a prerequisite, you must meet it to learn that invocation. For example, if an invocation requires you to be a level 5+ Warlock, you can select the invocation once you reach Warlock level 5.<\/p><p><b><i>Replacing and Gaining Invocations.<\/i><\/b> Whenever you gain a Warlock level, you can replace one of your invocations with another one for which you qualify. You can't replace an invocation if it's a prerequisite for another invocation that you have.<\/p><p>When you gain certain Warlock levels, you gain more invocations of your choice, as shown in the Invocations column of the Warlock Features table.<\/p><p>You can't pick the same invocation more than once unless its description says otherwise.<\/p>"},{"lv":1,"n":"Pact Magic","h":"<p>Through occult ceremony, you have formed a pact with a mysterious entity to gain magical powers. The entity is a voice in the shadows—its identity unclear—but its boon to you is concrete: the ability to cast spells. See 7 for the rules on spellcasting. The information below details how you use those rules with Warlock spells, which appear in the Warlock spell list later in the class's description.<\/p><p><b><i>Cantrips.<\/i><\/b> You know two Warlock cantrips of your choice. <a class=\"lk\" data-l=\"spell|eldritch blast\">Eldritch Blast<\/a> and <a class=\"lk\" data-l=\"spell|prestidigitation\">Prestidigitation<\/a> are recommended. Whenever you gain a Warlock level, you can replace one of your cantrips from this feature with another Warlock cantrip of your choice.<\/p><p>When you reach Warlock levels 4 and 10, you learn another Warlock cantrip of your choice, as shown in the Cantrips column of the Warlock Features table.<\/p><p><b><i>Spell Slots.<\/i><\/b> The Warlock Features table shows how many spell slots you have to cast your Warlock spells of levels 1–5. The table also shows the level of those slots, all of which are the same level. You regain all expended Pact Magic spell slots when you finish a <a class=\"lk\" data-l=\"rule|short rest\">Short<\/a> or <a class=\"lk\" data-l=\"rule|long rest\">Long Rest<\/a>.<\/p><p>For example, when you're a level 5 Warlock, you have two level 3 spell slots. To cast the level 1 spell <a class=\"lk\" data-l=\"spell|witch bolt\">Witch Bolt<\/a>, you must spend one of those slots, and you cast it as a level 3 spell.<\/p><p><b><i>Prepared Spells of Level 1+.<\/i><\/b> You prepare the list of level 1+ spells that are available for you to cast with this feature. To start, choose two level 1 Warlock spells. <a class=\"lk\" data-l=\"spell|charm person\">Charm Person<\/a> and <a class=\"lk\" data-l=\"spell|hex\">Hex<\/a> are recommended.<\/p><p>The number of spells on your list increases as you gain Warlock levels, as shown in the Prepared Spells column of the Warlock Features table. Whenever that number increases, choose additional Warlock spells until the number of spells on your list matches the number in the table. The chosen spells must be of a level no higher than what's shown in the table's Slot Level column for your level. When you reach level 6, for example, you learn a new Warlock spell, which can be of levels 1–3.<\/p><p>If another Warlock feature gives you spells that you always have prepared, those spells don't count against the number of spells you can prepare with this feature, but those spells otherwise count as Warlock spells for you.<\/p><p><b><i>Changing Your Prepared Spells.<\/i><\/b> Whenever you gain a Warlock level, you can replace one spell on your list with another Warlock spell of an eligible level.<\/p><p><b><i>Spellcasting Ability.<\/i><\/b> Charisma is the spellcasting ability for your Warlock spells.<\/p><p><b><i>Spellcasting Focus.<\/i><\/b> You can use an Arcane Focus as a <a class=\"lk\" data-l=\"rule|spellcasting focus\">Spellcasting Focus<\/a> for your Warlock spells.<\/p>"},{"lv":2,"n":"Magical Cunning","h":"<p>You can perform an esoteric rite for 1 minute. At the end of it, you regain expended Pact Magic spell slots but no more than a number equal to half your maximum (round up). Once you use this feature, you can't do so again until you finish a <a class=\"lk\" data-l=\"rule|long rest\">Long Rest<\/a>.<\/p>"},{"lv":3,"n":"Warlock Subclass","h":"<p>You gain a Warlock subclass of your choice. A subclass is a specialization that grants you features at certain Warlock levels. For the rest of your career, you gain each of your subclass's features that are of your Warlock level or lower.<\/p>"},{"lv":4,"n":"Ability Score Improvement","h":"<p>You gain the <a class=\"lk\" data-l=\"feat|ability score improvement\">Ability Score Improvement<\/a> feat or another feat of your choice for which you qualify. You gain this feature again at Warlock levels 8, 12, and 16.<\/p>"},{"lv":8,"n":"Ability Score Improvement","h":"<p>You gain the <a class=\"lk\" data-l=\"feat|ability score improvement\">Ability Score Improvement<\/a> Feat or another feat of your choice for which you qualify.<\/p>"},{"lv":9,"n":"Contact Patron","h":"<p>In the past, you usually contacted your patron through intermediaries. Now you can communicate directly; you always have the <a class=\"lk\" data-l=\"spell|contact other plane\">Contact Other Plane<\/a> spell prepared. With this feature, you can cast the spell without expending a spell slot to contact your patron, and you automatically succeed on the spell's saving throw.<\/p><p>Once you cast the spell with this feature, you can't do so in this way again until you finish a <a class=\"lk\" data-l=\"rule|long rest\">Long Rest<\/a>.<\/p>"},{"lv":11,"n":"Mystic Arcanum","h":"<p>Your patron grants you a magical secret called an arcanum. Choose one level 6 Warlock spell as this arcanum.<\/p><p>You can cast your arcanum spell once without expending a spell slot, and you must finish a <a class=\"lk\" data-l=\"rule|long rest\">Long Rest<\/a> before you can cast it in this way again.<\/p><p>As shown in the Warlock Features table, you gain another Warlock spell of your choice that can be cast in this way when you reach Warlock levels 13 (level 7 spell), 15 (level 8 spell), and 17 (level 9 spell). You regain all uses of your Mystic Arcanum when you finish a <a class=\"lk\" data-l=\"rule|long rest\">Long Rest<\/a>.<\/p><p>Whenever you gain a Warlock level, you can replace one of your arcanum spells with another Warlock spell of the same level.<\/p>"},{"lv":12,"n":"Ability Score Improvement","h":"<p>You gain the <a class=\"lk\" data-l=\"feat|ability score improvement\">Ability Score Improvement<\/a> Feat or another feat of your choice for which you qualify.<\/p>"},{"lv":13,"n":"Mystic Arcanum","h":"<p>You gain a level 7 Warlock Spell of your choice.<\/p>"},{"lv":15,"n":"Mystic Arcanum","h":"<p>You gain a level 8 Warlock Spell of your choice.<\/p>"},{"lv":16,"n":"Ability Score Improvement","h":"<p>You gain the <a class=\"lk\" data-l=\"feat|ability score improvement\">Ability Score Improvement<\/a> Feat or another feat of your choice for which you qualify.<\/p>"},{"lv":17,"n":"Mystic Arcanum","h":"<p>You gain a level 9 Warlock Spell of your choice.<\/p>"},{"lv":19,"n":"Epic Boon","h":"<p>You gain an Epic Boon feat or another feat of your choice for which you qualify. <a class=\"lk\" data-l=\"feat|boon of fate\">Boon of Fate<\/a> is recommended.<\/p>"},{"lv":20,"n":"Eldritch Master","h":"<p>When you use your Magical Cunning feature, you regain all your expended Pact Magic spell slots.<\/p>"}],"table":[{"inv":1,"can":2,"prep":2,"slots":1,"sl":1},{"inv":3,"can":2,"prep":3,"slots":2,"sl":1},{"inv":3,"can":2,"prep":4,"slots":2,"sl":2},{"inv":3,"can":3,"prep":5,"slots":2,"sl":2},{"inv":5,"can":3,"prep":6,"slots":2,"sl":3},{"inv":5,"can":3,"prep":7,"slots":2,"sl":3},{"inv":6,"can":3,"prep":8,"slots":2,"sl":4},{"inv":6,"can":3,"prep":9,"slots":2,"sl":4},{"inv":7,"can":3,"prep":10,"slots":2,"sl":5},{"inv":7,"can":4,"prep":10,"slots":2,"sl":5},{"inv":7,"can":4,"prep":11,"slots":3,"sl":5},{"inv":8,"can":4,"prep":11,"slots":3,"sl":5},{"inv":8,"can":4,"prep":12,"slots":3,"sl":5},{"inv":8,"can":4,"prep":12,"slots":3,"sl":5},{"inv":9,"can":4,"prep":13,"slots":3,"sl":5},{"inv":9,"can":4,"prep":13,"slots":3,"sl":5},{"inv":9,"can":4,"prep":14,"slots":4,"sl":5},{"inv":10,"can":4,"prep":14,"slots":4,"sl":5},{"inv":10,"can":4,"prep":15,"slots":4,"sl":5},{"inv":10,"can":4,"prep":15,"slots":4,"sl":5}],"asi":[4,8,12,16],"boon":19,"u":"https://5e.tools/classes.html#warlock_xphb"},"Sorcerer":{"hd":6,"saves":["con","cha"],"feats":[{"lv":1,"n":"Innate Sorcery","h":"<p>An event in your past left an indelible mark on you, infusing you with simmering magic. As a <a class=\"lk\" data-l=\"rule|bonus action\">Bonus Action<\/a>, you can unleash that magic for 1 minute, during which you gain the following benefits:<\/p><ul><li>The spell save DC of your Sorcerer spells increases by 1.<\/li><li>You have <a class=\"lk\" data-l=\"rule|advantage\">Advantage<\/a> on the attack rolls of Sorcerer spells you cast.<\/li><\/ul><p>You can use this feature twice, and you regain all expended uses of it when you finish a <a class=\"lk\" data-l=\"rule|long rest\">Long Rest<\/a>.<\/p>"},{"lv":1,"n":"Spellcasting","h":"<p>Drawing from your innate magic, you can cast spells. See 7 for the rules on spellcasting. The information below details how you use those rules with Sorcerer spells, which appear in the Sorcerer spell list later in the class's description.<\/p><p><b><i>Cantrips.<\/i><\/b> You know four Sorcerer cantrips of your choice. <a class=\"lk\" data-l=\"spell|light\">Light<\/a>, <a class=\"lk\" data-l=\"spell|prestidigitation\">Prestidigitation<\/a>, <a class=\"lk\" data-l=\"spell|shocking grasp\">Shocking Grasp<\/a>, and <a class=\"lk\" data-l=\"spell|sorcerous burst\">Sorcerous Burst<\/a> are recommended. Whenever you gain a Sorcerer level, you can replace one of your cantrips from this feature with another Sorcerer cantrip of your choice.<\/p><p>When you reach Sorcerer levels 4 and 10, you learn another Sorcerer cantrip of your choice, as shown in the Cantrips column of the Sorcerer Features table.<\/p><p><b><i>Spell Slots.<\/i><\/b> The Sorcerer Features table shows how many spell slots you have to cast your level 1+ spells. You regain all expended slots when you finish a <a class=\"lk\" data-l=\"rule|long rest\">Long Rest<\/a>.<\/p><p><b><i>Prepared Spells of Level 1+.<\/i><\/b> You prepare the list of level 1+ spells that are available for you to cast with this feature. To start, choose two level 1 Sorcerer spells. <a class=\"lk\" data-l=\"spell|burning hands\">Burning Hands<\/a> and <a class=\"lk\" data-l=\"spell|detect magic\">Detect Magic<\/a> are recommended.<\/p><p>The number of spells on your list increases as you gain Sorcerer levels, as shown in the Prepared Spells column of the Sorcerer Features table. Whenever that number increases, choose additional Sorcerer spells until the number of spells on your list matches the number in the Sorcerer Features table. The chosen spells must be of a level for which you have spell slots. For example, if you're a level 3 Sorcerer, your list of prepared spells can include six Sorcerer spells of level 1 or 2 in any combination.<\/p><p>If another Sorcerer feature gives you spells that you always have prepared, those spells don't count against the number of spells you can prepare with this feature, but those spells otherwise count as Sorcerer spells for you.<\/p><p><b><i>Changing Your Prepared Spells.<\/i><\/b> Whenever you gain a Sorcerer level, you can replace one spell on your list with another Sorcerer spell for which you have spell slots.<\/p><p><b><i>Spellcasting Ability.<\/i><\/b> Charisma is your spellcasting ability for your Sorcerer spells.<\/p><p><b><i>Spellcasting Focus.<\/i><\/b> You can use an Arcane Focus as a <a class=\"lk\" data-l=\"rule|spellcasting focus\">Spellcasting Focus<\/a> for your Sorcerer spells.<\/p>"},{"lv":2,"n":"Font of Magic","h":"<p>You can tap into the wellspring of magic within yourself. This wellspring is represented by Sorcery Points, which allow you to create a variety of magical effects.<\/p><p>You have 2 Sorcery Points, and you gain more as you reach higher levels, as shown in the Sorcery Points column of the Sorcerer Features table. You can't have more Sorcery Points than the number shown in the table for your level. You regain all expended Sorcery Points when you finish a <a class=\"lk\" data-l=\"rule|long rest\">Long Rest<\/a>.<\/p><p>You can use your Sorcery Points to fuel the options below, along with other features, such as Metamagic, that use those points.<\/p><p><b><i>Converting Spell Slots to Sorcery Points.<\/i><\/b> You can expend a spell slot to gain a number of Sorcery Points equal to the slot's level (no action required).<\/p><p><b><i>Creating Spell Slots.<\/i><\/b> As a <a class=\"lk\" data-l=\"rule|bonus action\">Bonus Action<\/a>, you can transform unexpended Sorcery Points into one spell slot. The Creating Spell Slots table shows the cost of creating a spell slot of a given level, and it lists the minimum Sorcerer level you must be to create a slot. You can create a spell slot no higher than level 5.<\/p><p>Any spell slot you create with this feature vanishes when you finish a <a class=\"lk\" data-l=\"rule|long rest\">Long Rest<\/a>.<\/p><div class=\"tw\"><table><caption>Creating Spell Slots<\/caption><tr><th>Spell Slot Level<\/th><th>Sorcery Point Cost<\/th><th>Min. Sorcerer Level<\/th><\/tr><tr><td>1<\/td><td>2<\/td><td>2<\/td><\/tr><tr><td>2<\/td><td>3<\/td><td>3<\/td><\/tr><tr><td>3<\/td><td>5<\/td><td>5<\/td><\/tr><tr><td>4<\/td><td>6<\/td><td>7<\/td><\/tr><tr><td>5<\/td><td>7<\/td><td>9<\/td><\/tr><\/table><\/div>"},{"lv":2,"n":"Metamagic","h":"<p>Because your magic flows from within, you can alter your spells to suit your needs; you gain two Metamagic options of your choice from \"Metamagic Options\" later in this class's description. You use the chosen options to temporarily modify spells you cast. To use an option, you must spend the number of Sorcery Points that it costs.<\/p><p>You can use only one Metamagic option on a spell when you cast it unless otherwise noted in one of those options.<\/p><p>Whenever you gain a Sorcerer level, you can replace one of your Metamagic options with one you don't know. You gain two more options at Sorcerer level 10 and two more at Sorcerer level 17.<\/p>"},{"lv":3,"n":"Sorcerer Subclass","h":"<p>You gain a Sorcerer subclass of your choice. A subclass is a specialization that grants you features at certain Sorcerer levels. For the rest of your career, you gain each of your subclass's features that are of your Sorcerer level or lower.<\/p>"},{"lv":4,"n":"Ability Score Improvement","h":"<p>You gain the <a class=\"lk\" data-l=\"feat|ability score improvement\">Ability Score Improvement<\/a> feat or another feat of your choice for which you qualify. You gain this feature again at Sorcerer levels 8, 12, and 16.<\/p>"},{"lv":5,"n":"Sorcerous Restoration","h":"<p>When you finish a <a class=\"lk\" data-l=\"rule|short rest\">Short Rest<\/a>, you can regain expended Sorcery Points, but no more than a number equal to half your Sorcerer level (round down). Once you use this feature, you can't do so again until you finish a <a class=\"lk\" data-l=\"rule|long rest\">Long Rest<\/a>.<\/p>"},{"lv":7,"n":"Sorcery Incarnate","h":"<p>If you have no uses of Innate Sorcery left, you can use it if you spend 2 Sorcery Points when you take the <a class=\"lk\" data-l=\"rule|bonus action\">Bonus Action<\/a> to activate it.<\/p><p>In addition, while your Innate Sorcery feature is active, you can use up to two of your Metamagic options on each spell you cast.<\/p>"},{"lv":8,"n":"Ability Score Improvement","h":"<p>You gain the <a class=\"lk\" data-l=\"feat|ability score improvement\">Ability Score Improvement<\/a> feat or another feat of your choice for which you qualify.<\/p>"},{"lv":10,"n":"Metamagic","h":"<p>Because your magic flows from within you, you can alter your spells to suit your needs; you gain two Metamagic options of your choice from the \"Metamagic Options\" section later in this class's description.<\/p><p>You can use only one Metamagic option on a spell when you cast it, unless otherwise noted in one of those options.<\/p><p>Whenever you gain a Sorcerer level, you can replace one of your Metamagic options with one you don't know.<\/p>"},{"lv":12,"n":"Ability Score Improvement","h":"<p>You gain the <a class=\"lk\" data-l=\"feat|ability score improvement\">Ability Score Improvement<\/a> feat or another feat of your choice for which you qualify.<\/p>"},{"lv":16,"n":"Ability Score Improvement","h":"<p>You gain the <a class=\"lk\" data-l=\"feat|ability score improvement\">Ability Score Improvement<\/a> feat or another feat of your choice for which you qualify.<\/p>"},{"lv":17,"n":"Metamagic","h":"<p>Because your magic flows from within you, you can alter your spells to suit your needs; you gain two Metamagic options of your choice from the \"Metamagic Options\" section later in this class's description.<\/p><p>You can use only one Metamagic option on a spell when you cast it, unless otherwise noted in one of those options.<\/p><p>Whenever you gain a Sorcerer level, you can replace one of your Metamagic options with one you don't know.<\/p>"},{"lv":19,"n":"Epic Boon","h":"<p>You gain an Epic Boon feat or another feat of your choice for which you qualify. <a class=\"lk\" data-l=\"feat|boon of dimensional travel\">Boon of Dimensional Travel<\/a> is recommended.<\/p>"},{"lv":20,"n":"Arcane Apotheosis","h":"<p>While your Innate Sorcery feature is active, you can use one Metamagic option on each of your turns without spending Sorcery Points on it.<\/p>"}],"table":[{"sp":0,"can":4,"prep":2,"slots":[2,0,0,0,0,0,0,0,0]},{"sp":2,"can":4,"prep":4,"slots":[3,0,0,0,0,0,0,0,0]},{"sp":3,"can":4,"prep":6,"slots":[4,2,0,0,0,0,0,0,0]},{"sp":4,"can":5,"prep":7,"slots":[4,3,0,0,0,0,0,0,0]},{"sp":5,"can":5,"prep":9,"slots":[4,3,2,0,0,0,0,0,0]},{"sp":6,"can":5,"prep":10,"slots":[4,3,3,0,0,0,0,0,0]},{"sp":7,"can":5,"prep":11,"slots":[4,3,3,1,0,0,0,0,0]},{"sp":8,"can":5,"prep":12,"slots":[4,3,3,2,0,0,0,0,0]},{"sp":9,"can":5,"prep":14,"slots":[4,3,3,3,1,0,0,0,0]},{"sp":10,"can":6,"prep":15,"slots":[4,3,3,3,2,0,0,0,0]},{"sp":11,"can":6,"prep":16,"slots":[4,3,3,3,2,1,0,0,0]},{"sp":12,"can":6,"prep":16,"slots":[4,3,3,3,2,1,0,0,0]},{"sp":13,"can":6,"prep":17,"slots":[4,3,3,3,2,1,1,0,0]},{"sp":14,"can":6,"prep":17,"slots":[4,3,3,3,2,1,1,0,0]},{"sp":15,"can":6,"prep":18,"slots":[4,3,3,3,2,1,1,1,0]},{"sp":16,"can":6,"prep":18,"slots":[4,3,3,3,2,1,1,1,0]},{"sp":17,"can":6,"prep":19,"slots":[4,3,3,3,2,1,1,1,1]},{"sp":18,"can":6,"prep":20,"slots":[4,3,3,3,3,1,1,1,1]},{"sp":19,"can":6,"prep":21,"slots":[4,3,3,3,3,2,1,1,1]},{"sp":20,"can":6,"prep":22,"slots":[4,3,3,3,3,2,2,1,1]}],"asi":[4,8,12,16],"boon":19,"meta":{"2":2,"10":4,"17":6},"u":"https://5e.tools/classes.html#sorcerer_xphb"},"Rogue":{"hd":8,"saves":["dex","int"],"feats":[{"lv":1,"n":"Expertise","h":"<p>You gain <a class=\"lk\" data-l=\"rule|expertise\">Expertise<\/a> in two of your skill proficiencies of your choice. <a class=\"lk\" data-l=\"skill|sleight of hand\">Sleight of Hand<\/a> and <a class=\"lk\" data-l=\"skill|stealth\">Stealth<\/a> are recommended if you have proficiency in them.<\/p><p>At Rogue level 6, you gain <a class=\"lk\" data-l=\"rule|expertise\">Expertise<\/a> in two more of your skill proficiencies of your choice.<\/p>"},{"lv":1,"n":"Sneak Attack","h":"<p>You know how to strike subtly and exploit a foe's distraction. Once per turn, you can deal an extra 1d6 damage to one creature you hit with an attack roll if you have <a class=\"lk\" data-l=\"rule|advantage\">Advantage<\/a> on the roll and the attack uses a Finesse or a Ranged weapon. The extra damage's type is the same as the weapon's type.<\/p><p>You don't need <a class=\"lk\" data-l=\"rule|advantage\">Advantage<\/a> on the attack roll if at least one of your allies is within 5 feet of the target, the ally doesn't have the <a class=\"lk\" data-l=\"cond|incapacitated\">Incapacitated<\/a> condition, and you don't have <a class=\"lk\" data-l=\"rule|disadvantage\">Disadvantage<\/a> on the attack roll.<\/p><p>The extra damage increases as you gain Rogue levels, as shown in the Sneak Attack column of the Rogue Features table.<\/p>"},{"lv":1,"n":"Thieves' Cant","h":"<p>You picked up various languages in the communities where you plied your roguish talents. You know Thieves' Cant and one other language of your choice, which you choose from the language tables in 2.<\/p>"},{"lv":1,"n":"Weapon Mastery","h":"<p>Your training with weapons allows you to use the mastery properties of two kinds of weapons of your choice with which you have proficiency, such as Daggers and Shortbows.<\/p><p>Whenever you finish a <a class=\"lk\" data-l=\"rule|long rest\">Long Rest<\/a>, you can change the kinds of weapons you chose. For example, you could switch to using the mastery properties of Scimitars and Shortswords.<\/p>"},{"lv":2,"n":"Cunning Action","h":"<p>Your quick thinking and agility allow you to move and act quickly. On your turn, you can take one of the following actions as a <a class=\"lk\" data-l=\"rule|bonus action\">Bonus Action<\/a>: <a class=\"lk\" data-l=\"act|dash\">Dash<\/a>, <a class=\"lk\" data-l=\"act|disengage\">Disengage<\/a>, or <a class=\"lk\" data-l=\"act|hide\">Hide<\/a>.<\/p>"},{"lv":3,"n":"Rogue Subclass","h":"<p>You gain a Rogue subclass of your choice. A subclass is a specialization that grants you features at certain Rogue levels. For the rest of your career, you gain each of your subclass's features that are of your Rogue level or lower.<\/p>"},{"lv":3,"n":"Steady Aim","h":"<p>As a <a class=\"lk\" data-l=\"rule|bonus action\">Bonus Action<\/a>, you give yourself <a class=\"lk\" data-l=\"rule|advantage\">Advantage<\/a> on your next attack roll on the current turn. You can use this feature only if you haven't moved during this turn, and after you use it, your <a class=\"lk\" data-l=\"rule|speed\">Speed<\/a> is 0 until the end of the current turn.<\/p>"},{"lv":4,"n":"Ability Score Improvement","h":"<p>You gain the <a class=\"lk\" data-l=\"feat|ability score improvement\">Ability Score Improvement<\/a> feat or another feat of your choice for which you qualify. You gain this feature again at Rogue levels 8, 10, 12, and 16.<\/p>"},{"lv":5,"n":"Cunning Strike","h":"<p>You've developed cunning ways to use your Sneak Attack. When you deal Sneak Attack damage, you can add one of the following Cunning Strike effects. Each effect has a die cost, which is the number of Sneak Attack damage dice you must forgo to add the effect. You remove the die before rolling, and the effect occurs immediately after the attack's damage is dealt. For example, if you add the Poison effect, remove 1d6 from the Sneak Attack's damage before rolling.<\/p><p>If a Cunning Strike effect requires a saving throw, the DC equals 8 plus your Dexterity modifier and <a class=\"lk\" data-l=\"rule|proficiency\">Proficiency Bonus<\/a>.<\/p>"},{"lv":5,"n":"Poison (Cost: 1d6)","h":"<p>You add a toxin to your strike, forcing the target to make a Constitution saving throw. On a failed save, the target has the <a class=\"lk\" data-l=\"cond|poisoned\">Poisoned<\/a> condition for 1 minute. At the end of each of its turns, the <a class=\"lk\" data-l=\"cond|poisoned\">Poisoned<\/a> target repeats the save, ending the effect on itself on a success.<\/p><p>To use this effect, you must have a Poisoner's Kit on your person.<\/p>"},{"lv":5,"n":"Trip (Cost: 1d6)","h":"<p>If the target is Large or smaller, it must succeed on a Dexterity saving throw or have the <a class=\"lk\" data-l=\"cond|prone\">Prone<\/a> condition.<\/p>"},{"lv":5,"n":"Uncanny Dodge","h":"<p>When an attacker that you can see hits you with an attack roll, you can take a <a class=\"lk\" data-l=\"rule|reaction\">Reaction<\/a> to halve the attack's damage against you (round down).<\/p>"},{"lv":5,"n":"Withdraw (Cost: 1d6)","h":"<p>Immediately after the attack, you move up to half your <a class=\"lk\" data-l=\"rule|speed\">Speed<\/a> without provoking <a class=\"lk\" data-l=\"act|opportunity attack\">Opportunity Attacks<\/a>.<\/p>"},{"lv":6,"n":"Expertise","h":"<p>You gain <a class=\"lk\" data-l=\"rule|expertise\">Expertise<\/a> in two of your Skill Proficiencies of your choice.<\/p>"},{"lv":7,"n":"Evasion","h":"<p>You can nimbly dodge out of the way of certain dangers. When you're subjected to an effect that allows you to make a Dexterity saving throw to take only half damage, you instead take no damage if you succeed on the saving throw and only half damage if you fail. You can't use this feature if you have the <a class=\"lk\" data-l=\"cond|incapacitated\">Incapacitated<\/a> condition.<\/p>"},{"lv":7,"n":"Reliable Talent","h":"<p>Whenever you make an ability check that uses one of your skill or tool proficiencies, you can treat a d20 roll of 9 or lower as a 10.<\/p>"},{"lv":8,"n":"Ability Score Improvement","h":"<p>You gain the <a class=\"lk\" data-l=\"feat|ability score improvement\">Ability Score Improvement<\/a> feat or another feat of your choice for which you qualify.<\/p>"},{"lv":10,"n":"Ability Score Improvement","h":"<p>You gain the <a class=\"lk\" data-l=\"feat|ability score improvement\">Ability Score Improvement<\/a> feat or another feat of your choice for which you qualify.<\/p>"},{"lv":11,"n":"Improved Cunning Strike","h":"<p>You can use up to two Cunning Strike effects when you deal Sneak Attack damage, paying the die cost for each effect.<\/p>"},{"lv":12,"n":"Ability Score Improvement","h":"<p>You gain the <a class=\"lk\" data-l=\"feat|ability score improvement\">Ability Score Improvement<\/a> feat or another feat of your choice for which you qualify.<\/p>"},{"lv":14,"n":"Daze (Cost: 2d6)","h":"<p>The target must succeed on a Constitution saving throw, or on its next turn, it can do only one of the following: move or take an action or a <a class=\"lk\" data-l=\"rule|bonus action\">Bonus Action<\/a>.<\/p>"},{"lv":14,"n":"Devious Strikes","h":"<p>You've practiced new ways to use your Sneak Attack deviously. The following effects are now among your Cunning Strike options.<\/p>"},{"lv":14,"n":"Knock Out (Cost: 6d6)","h":"<p>The target must succeed on a Constitution saving throw, or it has the <a class=\"lk\" data-l=\"cond|unconscious\">Unconscious<\/a> condition for 1 minute or until it takes any damage. The <a class=\"lk\" data-l=\"cond|unconscious\">Unconscious<\/a> target repeats the save at the end of each of its turns, ending the effect on itself on a success.<\/p>"},{"lv":14,"n":"Obscure (Cost: 3d6)","h":"<p>The target must succeed on a Dexterity saving throw, or it has the <a class=\"lk\" data-l=\"cond|blinded\">Blinded<\/a> condition until the end of its next turn.<\/p>"},{"lv":15,"n":"Slippery Mind","h":"<p>Your cunning mind is exceptionally difficult to control. You gain proficiency in Wisdom and Charisma saving throws.<\/p>"},{"lv":16,"n":"Ability Score Improvement","h":"<p>You gain the <a class=\"lk\" data-l=\"feat|ability score improvement\">Ability Score Improvement<\/a> feat or another feat of your choice for which you qualify.<\/p>"},{"lv":18,"n":"Elusive","h":"<p>You're so evasive that attackers rarely gain the upper hand against you. No attack roll can have <a class=\"lk\" data-l=\"rule|advantage\">Advantage<\/a> against you unless you have the <a class=\"lk\" data-l=\"cond|incapacitated\">Incapacitated<\/a> condition.<\/p>"},{"lv":19,"n":"Epic Boon","h":"<p>You gain an Epic Boon feat or another feat of your choice for which you qualify. <a class=\"lk\" data-l=\"feat|boon of the night spirit\">Boon of the Night Spirit<\/a> is recommended.<\/p>"},{"lv":20,"n":"Stroke of Luck","h":"<p>You have a marvelous knack for succeeding when you need to. If you fail a <a class=\"lk\" data-l=\"rule|d20 test\">D20 Test<\/a>, you can turn the roll into a 20.<\/p><p>Once you use this feature, you can't use it again until you finish a <a class=\"lk\" data-l=\"rule|short rest\">Short<\/a> or <a class=\"lk\" data-l=\"rule|long rest\">Long Rest<\/a>.<\/p>"}],"table":[{"sa":1},{"sa":1},{"sa":2},{"sa":2},{"sa":3},{"sa":3},{"sa":4},{"sa":4},{"sa":5},{"sa":5},{"sa":6},{"sa":6},{"sa":7},{"sa":7},{"sa":8},{"sa":8},{"sa":9},{"sa":9},{"sa":10},{"sa":10}],"asi":[4,8,10,12,16],"boon":19,"u":"https://5e.tools/classes.html#rogue_xphb"}},"subclasses":{"Celestial":[{"lv":3,"n":"Celestial Spells","h":"<p>You always have these prepared: <a class=\"lk\" data-l=\"spell|light\">Light<\/a> and <a class=\"lk\" data-l=\"spell|sacred flame\">Sacred Flame<\/a> (cantrips), <a class=\"lk\" data-l=\"spell|aid\">Aid<\/a>, <a class=\"lk\" data-l=\"spell|cure wounds\">Cure Wounds<\/a>, <a class=\"lk\" data-l=\"spell|guiding bolt\">Guiding Bolt<\/a> and <a class=\"lk\" data-l=\"spell|lesser restoration\">Lesser Restoration<\/a>. Level 5 adds <a class=\"lk\" data-l=\"spell|daylight\">Daylight<\/a> and <a class=\"lk\" data-l=\"spell|revivify\">Revivify<\/a>, level 7 <a class=\"lk\" data-l=\"spell|guardian of faith\">Guardian of Faith<\/a> and <a class=\"lk\" data-l=\"spell|wall of fire\">Wall of Fire<\/a>, level 9 <a class=\"lk\" data-l=\"spell|greater restoration\">Greater Restoration<\/a> and <a class=\"lk\" data-l=\"spell|summon celestial\">Summon Celestial<\/a>. They don&#x27;t count against your prepared spells.<\/p>","own":true},{"lv":3,"n":"Healing Light","h":"<p>You have a pool of d6s equal to 1 + your Warlock level. <a class=\"lk\" data-l=\"rule|bonus action\">Bonus Action<\/a>: heal yourself or a creature you can see within 60 ft by spending dice from the pool, up to your pact ability modifier at once (minimum 1), and restore the total rolled. The pool refills on a <a class=\"lk\" data-l=\"rule|long rest\">Long Rest<\/a>. (The rules say Charisma; this sheet runs the pact on Intelligence.)<\/p>","own":true},{"lv":6,"n":"Radiant Soul","h":"<p>You have <a class=\"lk\" data-l=\"rule|resistance\">Resistance<\/a> to Radiant damage. Once per turn, when one of your spells deals Radiant or Fire damage, add your pact ability modifier to that spell&#x27;s damage against one target.<\/p>","own":true},{"lv":10,"n":"Celestial Resilience","h":"<p>Whenever you use Magical Cunning or finish a Short or <a class=\"lk\" data-l=\"rule|long rest\">Long Rest<\/a>, gain <a class=\"lk\" data-l=\"rule|temporary hit points\">Temporary Hit Points<\/a> equal to your Warlock level + your pact ability modifier. Up to five creatures you can see also gain half your Warlock level + that modifier.<\/p>","own":true},{"lv":14,"n":"Searing Vengeance","h":"<p>Once per <a class=\"lk\" data-l=\"rule|long rest\">Long Rest<\/a>, when you or an ally within 60 ft is about to make a <a class=\"lk\" data-l=\"rule|death saving throw\">Death Saving Throw<\/a>, they instead regain half their Hit Point maximum and can stand up from <a class=\"lk\" data-l=\"cond|prone\">Prone<\/a>. Creatures of your choice within 30 ft of them take 2d8 + your pact ability modifier Radiant damage and are <a class=\"lk\" data-l=\"cond|blinded\">Blinded<\/a> until the end of the turn.<\/p>","own":true}],"Aberrant":[{"lv":3,"n":"Psionic Spells","h":"<p>You always have these prepared: <a class=\"lk\" data-l=\"spell|mind sliver\">Mind Sliver<\/a>, <a class=\"lk\" data-l=\"spell|arms of hadar\">Arms of Hadar<\/a>, <a class=\"lk\" data-l=\"spell|calm emotions\">Calm Emotions<\/a>, <a class=\"lk\" data-l=\"spell|detect thoughts\">Detect Thoughts<\/a> and <a class=\"lk\" data-l=\"spell|dissonant whispers\">Dissonant Whispers<\/a>. Level 5 adds <a class=\"lk\" data-l=\"spell|hunger of hadar\">Hunger of Hadar<\/a> and <a class=\"lk\" data-l=\"spell|sending\">Sending<\/a>, level 7 Evard&#x27;s Black Tentacles and <a class=\"lk\" data-l=\"spell|summon aberration\">Summon Aberration<\/a>, level 9 Rary&#x27;s Telepathic Bond and <a class=\"lk\" data-l=\"spell|telekinesis\">Telekinesis<\/a>. They don&#x27;t count against your prepared spells.<\/p>","own":true},{"lv":3,"n":"Telepathic Speech","h":"<p><a class=\"lk\" data-l=\"rule|bonus action\">Bonus Action<\/a>: link minds with a creature you can see within 30 ft. You can talk telepathically while within a number of miles equal to your Charisma modifier (minimum 1), for minutes equal to your Sorcerer level, using a language you both know. Linking someone new ends the old link.<\/p>","own":true},{"lv":6,"n":"Psionic Sorcery","h":"<p>You can cast your level 1+ Psionic Spells by spending Sorcery Points equal to the spell&#x27;s level instead of a slot. Cast this way they need no Verbal or Somatic components, and no Material components unless the material is consumed or has a cost.<\/p>","own":true},{"lv":6,"n":"Psychic Defenses","h":"<p><a class=\"lk\" data-l=\"rule|resistance\">Resistance<\/a> to Psychic damage, and <a class=\"lk\" data-l=\"rule|advantage\">Advantage<\/a> on saves to avoid or end the <a class=\"lk\" data-l=\"cond|charmed\">Charmed<\/a> or <a class=\"lk\" data-l=\"cond|frightened\">Frightened<\/a> conditions.<\/p>","own":true},{"lv":14,"n":"Revelation in Flesh","h":"<p><a class=\"lk\" data-l=\"rule|bonus action\">Bonus Action<\/a>: spend 1 or more Sorcery Points to transform for 10 minutes, gaining one benefit per point: swim speed of twice your <a class=\"lk\" data-l=\"rule|speed\">Speed<\/a> and water breathing; fly speed equal to your <a class=\"lk\" data-l=\"rule|speed\">Speed<\/a> with hover; see <a class=\"lk\" data-l=\"cond|invisible\">Invisible<\/a> creatures within 60 ft; or squeeze through 1-inch gaps and spend 5 ft of movement to escape non-magical restraints or a grapple.<\/p>","own":true},{"lv":18,"n":"Warping Implosion","h":"<p><a class=\"lk\" data-l=\"act|magic\">Magic action<\/a>: teleport up to 120 ft to a space you can see. Each creature within 30 ft of where you left makes a Strength save against your spell DC: 3d10 Force and pulled towards your old space on a fail, half damage only on a success. Once per <a class=\"lk\" data-l=\"rule|long rest\">Long Rest<\/a>, or spend 5 Sorcery Points to use it again.<\/p>","own":true}],"Assassin":[{"lv":3,"n":"Assassin's Tools","h":"<p>You gain a Disguise Kit and a Poisoner&#x27;s Kit and proficiency with both.<\/p>","own":true},{"lv":3,"n":"Assassinate","h":"<p><a class=\"lk\" data-l=\"rule|advantage\">Advantage<\/a> on <a class=\"lk\" data-l=\"rule|initiative\">Initiative<\/a> rolls. In the first round of combat you have <a class=\"lk\" data-l=\"rule|advantage\">Advantage<\/a> on attacks against any creature that hasn&#x27;t taken a turn yet, and a Sneak Attack hit that round deals extra damage equal to your Rogue level.<\/p>","own":true},{"lv":9,"n":"Infiltration Expertise","h":"<p>After an hour studying someone you can perfectly mimic their speech, handwriting or both. Steady Aim no longer drops your <a class=\"lk\" data-l=\"rule|speed\">Speed<\/a> to 0.<\/p>","own":true},{"lv":13,"n":"Envenom Weapons","h":"<p>When you use the Poison option of Cunning Strike, a target that fails the save also takes 2d6 Poison damage, ignoring Poison <a class=\"lk\" data-l=\"rule|resistance\">Resistance<\/a>.<\/p>","own":true},{"lv":17,"n":"Death Strike","h":"<p>When your Sneak Attack hits in the first round of combat, the target makes a Constitution save (DC 8 + Dex modifier + Proficiency Bonus) or the attack&#x27;s damage is doubled.<\/p>","own":true}]},"subSpells":{"Celestial":{"1":["light","sacred flame"],"3":["aid","cure wounds","guiding bolt","lesser restoration"],"5":["daylight","revivify"],"7":["guardian of faith","wall of fire"],"9":["greater restoration","summon celestial"]},"Aberrant":{"3":["mind sliver","arms of hadar","calm emotions","detect thoughts","dissonant whispers"],"5":["hunger of hadar","sending"],"7":["evard's black tentacles","summon aberration"],"9":["rary's telepathic bond","telekinesis"]}},"invocations":[{"n":"Armor of Shadows","lv":1,"pact":null,"cantrip":false,"rep":false,"h":"<p>You can cast <a class=\"lk\" data-l=\"spell|mage armor\">Mage Armor<\/a> on yourself without expending a spell slot.<\/p>","u":"https://5e.tools/optionalfeatures.html#armor%20of%20shadows_xphb"},{"n":"Eldritch Mind","lv":1,"pact":null,"cantrip":false,"rep":false,"h":"<p>You have <a class=\"lk\" data-l=\"rule|advantage\">Advantage<\/a> on Constitution saving throws that you make to maintain <a class=\"lk\" data-l=\"cond|concentration\">Concentration<\/a>.<\/p>","u":"https://5e.tools/optionalfeatures.html#eldritch%20mind_xphb"},{"n":"Pact of the Blade","lv":1,"pact":null,"cantrip":false,"rep":false,"h":"<p>As a <a class=\"lk\" data-l=\"rule|bonus action\">Bonus Action<\/a>, you can conjure a pact weapon in your hand—a Simple or Martial Melee weapon of your choice with which you bond—or create a bond with a magic weapon you touch; you can't bond with a magic weapon if someone else is attuned to it or another Warlock is bonded with it. Until the bond ends, you have proficiency with the weapon, and you can use it as a <a class=\"lk\" data-l=\"rule|spellcasting focus\">Spellcasting Focus<\/a>.<\/p><p>Whenever you attack with the bonded weapon, you can use your Charisma modifier for the attack and damage rolls instead of using Strength or Dexterity; and you can cause the weapon to deal Necrotic, Psychic, or Radiant damage or its normal damage type.<\/p><p>Your bond with the weapon ends if you use this feature's <a class=\"lk\" data-l=\"rule|bonus action\">Bonus Action<\/a> again, if the weapon is more than 5 feet away from you for 1 minute or more, or if you die. A conjured weapon disappears when the bond ends.<\/p>","u":"https://5e.tools/optionalfeatures.html#pact%20of%20the%20blade_xphb"},{"n":"Pact of the Chain","lv":1,"pact":null,"cantrip":false,"rep":false,"h":"<p>You learn the <a class=\"lk\" data-l=\"spell|find familiar\">Find Familiar<\/a> spell and can cast it as a <a class=\"lk\" data-l=\"act|magic\">Magic<\/a> action without expending a spell slot.<\/p><p>When you cast the spell, you choose one of the normal forms for your familiar or one of the following special forms: Imp, Pseudodragon, Quasit, Skeleton, Slaad Tadpole, Sphinx of Wonder, Sprite, or Venomous Snake (see appendix B for the familiar's stat block).<\/p><p>Additionally, when you take the <a class=\"lk\" data-l=\"act|attack\">Attack<\/a> action, you can forgo one of your own attacks to allow your familiar to make one attack of its own with its <a class=\"lk\" data-l=\"rule|reaction\">Reaction<\/a>.<\/p>","u":"https://5e.tools/optionalfeatures.html#pact%20of%20the%20chain_xphb"},{"n":"Pact of the Tome","lv":1,"pact":null,"cantrip":false,"rep":false,"h":"<p>Stitching together strands of shadow, you conjure forth a book in your hand at the end of a <a class=\"lk\" data-l=\"rule|short rest\">Short<\/a> or <a class=\"lk\" data-l=\"rule|long rest\">Long Rest<\/a>. This Book of Shadows (you determine its appearance) contains eldritch magic that only you can access, granting you the benefits below. The book disappears if you conjure another book with this feature or if you die.<\/p><p><b><i>Cantrips and Rituals.<\/i><\/b> When the book appears, choose three cantrips, and choose two level 1 spells that have the <a class=\"lk\" data-l=\"rule|ritual\">Ritual<\/a> tag. The spells can be from any class's spell list, and they must be spells you don't already have prepared. While the book is on your person, you have the chosen spells prepared, and they function as Warlock spells for you.<\/p><p><b><i>Spellcasting Focus.<\/i><\/b> You can use the book as a <a class=\"lk\" data-l=\"rule|spellcasting focus\">Spellcasting Focus<\/a>.<\/p>","u":"https://5e.tools/optionalfeatures.html#pact%20of%20the%20tome_xphb"},{"n":"Agonizing Blast","lv":2,"pact":null,"cantrip":true,"rep":false,"h":"<p>Choose one of your known Warlock cantrips that deals damage. You can add your Charisma modifier to that spell's damage rolls.<\/p><p><b><i>Repeatable.<\/i><\/b> You can gain this invocation more than once. Each time you do so, choose a different eligible cantrip.<\/p>","u":"https://5e.tools/optionalfeatures.html#agonizing%20blast_xphb"},{"n":"Devil's Sight","lv":2,"pact":null,"cantrip":false,"rep":false,"h":"<p>You can see normally in <a class=\"lk\" data-l=\"rule|dim light\">Dim Light<\/a> and <a class=\"lk\" data-l=\"rule|darkness\">Darkness<\/a>—both magical and nonmagical—within 120 feet of yourself.<\/p>","u":"https://5e.tools/optionalfeatures.html#devil%27s%20sight_xphb"},{"n":"Eldritch Spear","lv":2,"pact":null,"cantrip":true,"rep":false,"h":"<p>Choose one of your known Warlock cantrips that deals damage and has a range of 10+ feet. When you cast that spell, its range increases by a number of feet equal to 30 times your Warlock level.<\/p><p><b><i>Repeatable.<\/i><\/b> You can gain this invocation more than once. Each time you do so, choose a different eligible cantrip.<\/p>","u":"https://5e.tools/optionalfeatures.html#eldritch%20spear_xphb"},{"n":"Fiendish Vigor","lv":2,"pact":null,"cantrip":false,"rep":false,"h":"<p>You can cast <a class=\"lk\" data-l=\"spell|false life\">False Life<\/a> on yourself without expending a spell slot. When you cast the spell with this feature, you don't roll the die for the <a class=\"lk\" data-l=\"rule|temporary hit points\">Temporary Hit Points<\/a>; you automatically get the highest number on the die.<\/p>","u":"https://5e.tools/optionalfeatures.html#fiendish%20vigor_xphb"},{"n":"Lessons of the First Ones","lv":2,"pact":null,"cantrip":false,"rep":false,"h":"<p>You have received knowledge from an elder entity of the multiverse, allowing you to gain one Origin feat of your choice.<\/p><p><b><i>Repeatable.<\/i><\/b> You can gain this invocation more than once. Each time you do so, choose a different Origin feat.<\/p>","u":"https://5e.tools/optionalfeatures.html#lessons%20of%20the%20first%20ones_xphb"},{"n":"Mask of Many Faces","lv":2,"pact":null,"cantrip":false,"rep":false,"h":"<p>You can cast <a class=\"lk\" data-l=\"spell|disguise self\">Disguise Self<\/a> without expending a spell slot.<\/p>","u":"https://5e.tools/optionalfeatures.html#mask%20of%20many%20faces_xphb"},{"n":"Misty Visions","lv":2,"pact":null,"cantrip":false,"rep":false,"h":"<p>You can cast <a class=\"lk\" data-l=\"spell|silent image\">Silent Image<\/a> without expending a spell slot.<\/p>","u":"https://5e.tools/optionalfeatures.html#misty%20visions_xphb"},{"n":"Otherworldly Leap","lv":2,"pact":null,"cantrip":false,"rep":false,"h":"<p>You can cast <a class=\"lk\" data-l=\"spell|jump\">Jump<\/a> on yourself without expending a spell slot.<\/p>","u":"https://5e.tools/optionalfeatures.html#otherworldly%20leap_xphb"},{"n":"Repelling Blast","lv":2,"pact":null,"cantrip":true,"rep":false,"h":"<p>Choose one of your known Warlock cantrips that requires an attack roll. When you hit a Large or smaller creature with that cantrip, you can push the creature up to 10 feet straight away from you.<\/p><p><b><i>Repeatable.<\/i><\/b> You can gain this invocation more than once. Each time you do so, choose a different eligible cantrip.<\/p>","u":"https://5e.tools/optionalfeatures.html#repelling%20blast_xphb"},{"n":"Ascendant Step","lv":5,"pact":null,"cantrip":false,"rep":false,"h":"<p>You can cast <a class=\"lk\" data-l=\"spell|levitate\">Levitate<\/a> on yourself without expending a spell slot.<\/p>","u":"https://5e.tools/optionalfeatures.html#ascendant%20step_xphb"},{"n":"Eldritch Smite","lv":5,"pact":"Pact Of The Blade","cantrip":false,"rep":false,"h":"<p>Once per turn when you hit a creature with your pact weapon, you can expend a Pact Magic spell slot to deal an extra 1d8 Force damage to the target, plus another 1d8 per level of the spell slot, and you can give the target the <a class=\"lk\" data-l=\"cond|prone\">Prone<\/a> condition if it is Huge or smaller.<\/p>","u":"https://5e.tools/optionalfeatures.html#eldritch%20smite_xphb"},{"n":"Gaze of Two Minds","lv":5,"pact":null,"cantrip":false,"rep":false,"h":"<p>You can use a <a class=\"lk\" data-l=\"rule|bonus action\">Bonus Action<\/a> to touch a willing creature and perceive through its senses until the end of your next turn. As long as the creature is on the same plane of existence as you, you can take a <a class=\"lk\" data-l=\"rule|bonus action\">Bonus Action<\/a> on subsequent turns to maintain this connection, extending the duration until the end of your next turn. The connection ends if you don't maintain it in this way.<\/p><p>While perceiving through the other creature's senses, you benefit from any special senses possessed by that creature, and you can cast spells as if you were in your space or the other creature's space if the two of you are within 60 feet of each other.<\/p>","u":"https://5e.tools/optionalfeatures.html#gaze%20of%20two%20minds_xphb"},{"n":"Gift of the Depths","lv":5,"pact":null,"cantrip":false,"rep":false,"h":"<p>You can breathe underwater, and you gain a <a class=\"lk\" data-l=\"rule|swim speed\">Swim Speed<\/a> equal to your <a class=\"lk\" data-l=\"rule|speed\">Speed<\/a>.<\/p><p>You can also cast <a class=\"lk\" data-l=\"spell|water breathing\">Water Breathing<\/a> once without expending a spell slot. You regain the ability to cast it in this way again when you finish a <a class=\"lk\" data-l=\"rule|long rest\">Long Rest<\/a>.<\/p>","u":"https://5e.tools/optionalfeatures.html#gift%20of%20the%20depths_xphb"},{"n":"Investment of the Chain Master","lv":5,"
