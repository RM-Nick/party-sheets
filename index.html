 is Difficult Terrain or it isn't.<\/p><p>A space is Difficult Terrain if the space contains any of the following or something similar:<\/p><ul><li>A creature that isn't Tiny or your ally<\/li><li>Furniture that is sized for creatures of your size or larger<\/li><li>Heavy snow, ice, rubble, or undergrowth<\/li><li>Liquid that's between shin- and waist-deep<\/li><li>A narrow opening sized for a creature one size smaller than you<\/li><li>A slope of 20 degrees or more<\/li><\/ul>","u":"https://5e.tools/variantrules.html#difficult%20terrain_xphb"},"rule|difficulty class":{"n":"Difficulty Class","h":"<p>A Difficulty Class (DC) is the target number for an ability check or a <a class=\"lk\" data-l=\"rule|saving throw\">saving throw<\/a>.<\/p>","u":"https://5e.tools/variantrules.html#difficulty%20class_xphb"},"rule|dim light":{"n":"Dim Light","h":"<p>An area with Dim Light is <a class=\"lk\" data-l=\"rule|lightly obscured\">Lightly Obscured<\/a>.<\/p>","u":"https://5e.tools/variantrules.html#dim%20light_xphb"},"rule|disadvantage":{"n":"Disadvantage","h":"<p>If you have Disadvantage on a <a class=\"lk\" data-l=\"rule|d20 test\">D20 Test<\/a>, roll two d20s and use the lower roll. A roll can't be affected by more than one Disadvantage, and <a class=\"lk\" data-l=\"rule|advantage\">Advantage<\/a> and Disadvantage on the same roll cancel each other.<\/p>","u":"https://5e.tools/variantrules.html#disadvantage_xphb"},"rule|emanation [area of effect]":{"n":"Emanation","h":"<p>An Emanation is an area of effect that extends in straight lines from a creature or an object in all directions. The effect that creates an Emanation specifies the distance it extends.<\/p><p>An Emanation moves with the creature or object that is its origin unless it is an instantaneous or a stationary effect.<\/p><p>An Emanation's origin (creature or object) isn't included in the area of effect unless its creator decides otherwise.<\/p>","u":"https://5e.tools/variantrules.html#emanation%20%5Barea%20of%20effect%5D_xphb"},"rule|encounter":{"n":"Encounter","h":"<p>An encounter is a scene in an adventure that is part of at least one of the game's three pillars: social interaction, exploration, or combat.<\/p>","u":"https://5e.tools/variantrules.html#encounter_xphb"},"rule|enemy":{"n":"Enemy","h":"<p>A creature is your enemy if it fights against you in combat, actively works to harm you, or is designated as your enemy by the rules or DM.<\/p>","u":"https://5e.tools/variantrules.html#enemy_xphb"},"rule|experience points":{"n":"Experience Points","h":"<p>As they overcome challenges and complete adventures, characters earn Experience Points (XP) which are awarded by the Dungeon Master. When a character's XP total crosses certain thresholds, the character's level increases. The Dungeon Master's Guide provides guidance on awarding XP.<\/p>","u":"https://5e.tools/variantrules.html#experience%20points_xphb"},"rule|expertise":{"n":"Expertise","h":"<p>Expertise is a feature that enhances your use of a skill proficiency. When you make an ability check with a skill proficiency in which you have Expertise, your <a class=\"lk\" data-l=\"rule|proficiency\">Proficiency Bonus<\/a> is doubled for that check unless the bonus is doubled by another feature.<\/p><p>If you gain Expertise, you gain it in one <a class=\"lk\" data-l=\"rule|skill\">skill<\/a> in which you have proficiency. You can't have Expertise in the same skill proficiency more than once.<\/p>","u":"https://5e.tools/variantrules.html#expertise_xphb"},"rule|fly speed":{"n":"Fly Speed","h":"<p>A Fly Speed can be used to travel through the air. While you have a Fly Speed, you can stay aloft until you land, fall, or die.<\/p>","u":"https://5e.tools/variantrules.html#fly%20speed_xphb"},"rule|flying":{"n":"Flying","h":"<p>A variety of effects allow a creature to fly. While flying, you fall if you have the <a class=\"lk\" data-l=\"cond|incapacitated\">Incapacitated<\/a> or <a class=\"lk\" data-l=\"cond|prone\">Prone<\/a> condition or your <a class=\"lk\" data-l=\"rule|fly speed\">Fly Speed<\/a> is reduced to 0. You can stay aloft in those circumstances if you can hover.<\/p>","u":"https://5e.tools/variantrules.html#flying_xphb"},"rule|friendly [attitude]":{"n":"Friendly","h":"<p>A Friendly creature views you favorably. You have <a class=\"lk\" data-l=\"rule|advantage\">advantage<\/a> on an ability check to influence a Friendly creature.<\/p>","u":"https://5e.tools/variantrules.html#friendly%20%5Battitude%5D_xphb"},"rule|grappling":{"n":"Grappling","h":"<p>A creature can grapple another creature. Characters typically grapple by using an <a class=\"lk\" data-l=\"rule|unarmed strike\">Unarmed Strike<\/a>. Many <a class=\"lk\" data-l=\"rule|monster\">monsters<\/a> have special attacks that allow them to quickly grapple prey. However a grapple is initiated, it follows these rules.<\/p><p><b><i>Grappled Condition.<\/i><\/b> Successfully grappling a creature gives it the <a class=\"lk\" data-l=\"cond|grappled\">Grappled<\/a> condition.<\/p><p><b><i>One Grapple per Hand.<\/i><\/b> A creature must have a hand free to grapple another creature. Some stat blocks and game effects allow a creature to grapple using a tentacle, a maw, or another body part. Whatever part a grappler uses, it can grapple only one creature at a time with that part, and the grappler can't use that part to target another creature unless it ends the grapple.<\/p><p><b><i>Ending a Grapple.<\/i><\/b> A Grappled creature can use its action to make a Strength (<a class=\"lk\" data-l=\"skill|athletics\">Athletics<\/a>) or Dexterity (<a class=\"lk\" data-l=\"skill|acrobatics\">Acrobatics<\/a>) check against the grapple's escape DC, ending the <a class=\"lk\" data-l=\"rule|condition\">condition<\/a> on itself on a success. The <a class=\"lk\" data-l=\"rule|condition\">condition<\/a> also ends if the grappler has the <a class=\"lk\" data-l=\"cond|incapacitated\">Incapacitated<\/a> condition or if the distance between the Grappled target and the grappler exceeds the grapple's range. In addition, the grappler can release the target at any time (no action required).<\/p>","u":"https://5e.tools/variantrules.html#grappling_xphb"},"rule|hazard":{"n":"Hazard","h":"<p>A hazard is an environmental danger.<\/p>","u":"https://5e.tools/variantrules.html#hazard_xphb"},"rule|healing":{"n":"Healing","h":"<p>Healing is how you regain <a class=\"lk\" data-l=\"rule|hit points\">Hit Points<\/a>.<\/p>","u":"https://5e.tools/variantrules.html#healing_xphb"},"rule|heavily obscured":{"n":"Heavily Obscured","h":"<p>You have the <a class=\"lk\" data-l=\"cond|blinded\">Blinded<\/a> condition while trying to see something in a Heavily Obscured space.<\/p>","u":"https://5e.tools/variantrules.html#heavily%20obscured_xphb"},"rule|heroic inspiration":{"n":"Heroic Inspiration","h":"<p>If you (<a class=\"lk\" data-l=\"rule|player character\">a player character<\/a>) have Heroic Inspiration, you can expend it to reroll any die immediately after rolling it, and you must use the new roll.<\/p><p>If you gain Heroic Inspiration but already have it, it's lost unless you give it to a <a class=\"lk\" data-l=\"rule|player character\">player character<\/a> who lacks it.<\/p>","u":"https://5e.tools/variantrules.html#heroic%20inspiration_xphb"},"rule|high jump":{"n":"High Jump","h":"<p>When you make a High Jump, you leap into the air a number of feet equal to 3 plus your Strength modifier (minimum of 0 feet) if you move at least 10 feet on foot immediately before the jump. When you make a standing High Jump, you can jump only half that distance. Either way, each foot of the jump costs a foot of movement.<\/p><p>You can extend your arms half your height above yourself during the jump. Thus, you can reach a distance equal to the height of the jump plus 1½ times your height.<\/p>","u":"https://5e.tools/variantrules.html#high%20jump_xphb"},"rule|hit point dice":{"n":"Hit Point Dice","h":"<p>Hit Point Dice, or Hit Dice for short, help determine a <a class=\"lk\" data-l=\"rule|player character\">player character's<\/a> Hit Point maximum, as explained in 2. Most <a class=\"lk\" data-l=\"rule|monster\">monsters<\/a> also have Hit Dice. A creature can spend Hit Dice during a <a class=\"lk\" data-l=\"rule|short rest\">Short Rest<\/a> to regain <a class=\"lk\" data-l=\"rule|hit points\">Hit Points<\/a>.<\/p>","u":"https://5e.tools/variantrules.html#hit%20point%20dice_xphb"},"rule|hit points":{"n":"Hit Points","h":"<p>Hit Points (HP) are a measure of how difficult it is to kill or destroy a creature or an object. Damage reduces Hit Points, and healing restores them. You can't have more Hit Points than your Hit Point maximum, and you can't have less than 0.<\/p>","u":"https://5e.tools/variantrules.html#hit%20points_xphb"},"rule|hostile [attitude]":{"n":"Hostile","h":"<p>A Hostile creature views you unfavorably. You have <a class=\"lk\" data-l=\"rule|disadvantage\">Disadvantage<\/a> on an ability check to influence a Hostile creature.<\/p>","u":"https://5e.tools/variantrules.html#hostile%20%5Battitude%5D_xphb"},"rule|hover":{"n":"Hover","h":"<p>Some creatures can hover, as noted in their stat blocks, and some spells and other effects grant the ability to hover. Hovering while <a class=\"lk\" data-l=\"rule|flying\">flying<\/a> prevents you from falling in certain circumstances.<\/p>","u":"https://5e.tools/variantrules.html#hover_xphb"},"rule|illusions":{"n":"Illusions","h":"<p>Spells and other effects sometimes create magical illusions. Such an effect defines what the illusion does and which senses or mental faculties it deceives.<\/p><p>If an illusion manifests in space, the illusion is insubstantial and weightless, yet it seems to be affected by the environment as if the illusion were real unless the effect that created it specifies otherwise. For example, a visual illusion of a creature casts shadows and reflections, and wind appears to affect the illusory creature. Similarly, an audible illusion echoes in an echoey space.<\/p>","u":"https://5e.tools/variantrules.html#illusions_xphb"},"rule|immunity":{"n":"Immunity","h":"<p>If you have Immunity to a <a class=\"lk\" data-l=\"rule|damage types\">damage type<\/a> or a <a class=\"lk\" data-l=\"rule|condition\">condition<\/a>, it doesn't affect you in any way.<\/p>","u":"https://5e.tools/variantrules.html#immunity_xphb"},"rule|improvised weapons":{"n":"Improvised Weapons","h":"<p>An improvised weapon is an object wielded as a makeshift weapon, such as broken glass, a table leg, or a frying pan. A Simple or Martial weapon also counts as an improvised weapon if it's wielded in a way contrary to its design; if you use a Ranged weapon to make a melee attack or throw a Melee weapon that lacks the Thrown property, the weapon counts as an improvised weapon. An improvised weapon follows the rules below.<\/p><p><b><i>Proficiency.<\/i><\/b> Don't add your <a class=\"lk\" data-l=\"rule|proficiency\">Proficiency Bonus<\/a> to attack rolls with an improvised weapon.<\/p><p><b><i>Damage.<\/i><\/b> On a hit, the weapon deals 1d4 damage of a type the DM thinks is appropriate for the object.<\/p><p><b><i>Range.<\/i><\/b> If you throw the weapon, it has a normal range of 20 feet and a long range of 60 feet.<\/p><p><b><i>Weapon Equivalents.<\/i><\/b> If an improvised weapon resembles a Simple or Martial weapon, the DM may say it functions as that weapon and uses that weapon's rules. For example, the DM could treat a table leg as a Club.<\/p>","u":"https://5e.tools/variantrules.html#improvised%20weapons_xphb"},"rule|indifferent [attitude]":{"n":"Indifferent","h":"<p>An Indifferent creature has no desire to help or hinder you. Indifferent is the default attitude of a <a class=\"lk\" data-l=\"rule|monster\">monster<\/a>.<\/p>","u":"https://5e.tools/variantrules.html#indifferent%20%5Battitude%5D_xphb"},"rule|initiative":{"n":"Initiative","h":"<p>Initiative determines the order of turns during combat. The combat rules in 1 explain how to roll Initiative.<\/p><p>Sometimes a DM might have combatants use their Initiative scores instead of rolling Initiative. Your Initiative score equals 10 plus your Dexterity modifier. If you have <a class=\"lk\" data-l=\"rule|advantage\">Advantage<\/a> on Initiative rolls, increase your Initiative score by 5. If you have <a class=\"lk\" data-l=\"rule|disadvantage\">Disadvantage<\/a> on those rolls, decrease that score by 5.<\/p>","u":"https://5e.tools/variantrules.html#initiative_xphb"},"rule|jumping":{"n":"Jumping","h":"<p>When you jump, you make either a <a class=\"lk\" data-l=\"rule|long jump\">Long Jump<\/a> (horizontal) or a <a class=\"lk\" data-l=\"rule|high jump\">High Jump<\/a> (vertical).<\/p>","u":"https://5e.tools/variantrules.html#jumping_xphb"},"rule|knocking out a creature":{"n":"Knocking Out a Creature","h":"<p>When you would reduce a creature to 0 <a class=\"lk\" data-l=\"rule|hit points\">Hit Points<\/a> with a melee attack, you can instead reduce the creature to 1 Hit Point. The creature then has the <a class=\"lk\" data-l=\"cond|unconscious\">Unconscious<\/a> condition and starts a <a class=\"lk\" data-l=\"rule|short rest\">Short Rest<\/a>.<\/p><p>The creature remains Unconscious until it regains any <a class=\"lk\" data-l=\"rule|hit points\">Hit Points<\/a> or until someone uses an action to administer first aid to it, which requires a successful DC 10 Wisdom (<a class=\"lk\" data-l=\"skill|medicine\">Medicine<\/a>) check.<\/p>","u":"https://5e.tools/variantrules.html#knocking%20out%20a%20creature_xphb"},"rule|lightly obscured":{"n":"Lightly Obscured","h":"<p>You have <a class=\"lk\" data-l=\"rule|disadvantage\">Disadvantage<\/a> on Wisdom (<a class=\"lk\" data-l=\"skill|perception\">Perception<\/a>) checks to see something in a Lightly Obscured space.<\/p>","u":"https://5e.tools/variantrules.html#lightly%20obscured_xphb"},"rule|line [area of effect]":{"n":"Line","h":"<p>A Line is an area of effect that extends from a point of origin in a straight path along its length and covers an area defined by its width. The effect that creates a Line specifies its length and width.<\/p><p>A Line's point of origin isn't included in the area of effect unless its creator decides otherwise.<\/p>","u":"https://5e.tools/variantrules.html#line%20%5Barea%20of%20effect%5D_xphb"},"rule|long jump":{"n":"Long Jump","h":"<p>When you make a Long Jump, you leap horizontally a number of feet up to your Strength score if you move at least 10 feet immediately before the jump. When you make a standing Long Jump, you can leap only half that distance. Either way, each foot you jump costs a foot of movement.<\/p><p>If you land in <a class=\"lk\" data-l=\"rule|difficult terrain\">difficult terrain<\/a>, you must succeed on a DC 10 Dexterity (<a class=\"lk\" data-l=\"skill|acrobatics\">Acrobatics<\/a>) check or have the <a class=\"lk\" data-l=\"cond|prone\">Prone<\/a> condition.<\/p><p>This Long Jump rule assumes that the height of the jump doesn't matter, such as a jump across a stream or chasm. At your DM's option, you must succeed on a DC 10 Strength (<a class=\"lk\" data-l=\"skill|athletics\">Athletics<\/a>) check to clear a low obstacle (no taller than a quarter of the jump's distance), such as a hedge or low wall. Otherwise, you hit the obstacle.<\/p>","u":"https://5e.tools/variantrules.html#long%20jump_xphb"},"rule|long rest":{"n":"Long Rest","h":"<p>A Long Rest is a period of extended downtime—at least 8 hours—available to any creature. During a Long Rest, you sleep for at least 6 hours and perform no more than 2 hours of light activity, such as reading, talking, eating, or standing watch.<\/p><p>During sleep, you have the <a class=\"lk\" data-l=\"cond|unconscious\">Unconscious<\/a> condition. After you finish a Long Rest, you must wait at least 16 hours before starting another one.<\/p><p><b><i>Benefits of the Rest.<\/i><\/b> To start a Long Rest, you must have at least 1 <a class=\"lk\" data-l=\"rule|hit points\">Hit Point<\/a>. When you finish the rest, you gain the following benefits:<\/p><ul><li><b>Regain All HP<\/b> You regain all lost <a class=\"lk\" data-l=\"rule|hit points\">Hit Points<\/a> and all spent <a class=\"lk\" data-l=\"rule|hit point dice\">Hit Point Dice<\/a>. If your Hit Point maximum was reduced, it returns to normal.<\/li><li><b>Ability Scores Restored<\/b> If any of your ability scores were reduced, they return to normal.<\/li><li><b>Exhaustion Reduced<\/b> If you have the <a class=\"lk\" data-l=\"cond|exhaustion\">Exhaustion<\/a> condition, its level decreases by 1.<\/li><li><b>Special Feature<\/b> Some features are recharged by a Long Rest. If you have such a feature, it recharges in the way specified in its description.<\/li><\/ul><p><b><i>Interrupting the Rest.<\/i><\/b> A Long Rest is stopped by the following interruptions:<\/p><ul><li>Rolling <a class=\"lk\" data-l=\"rule|initiative\">Initiative<\/a><\/li><li>Casting a spell other than a cantrip<\/li><li>Taking any damage.<\/li><li>1 hour of walking or other physical exertion.<\/li><\/ul><p>If you rested at least 1 hour before the interruption you gain the benefits of a <a class=\"lk\" data-l=\"rule|short rest\">Short Rest<\/a>.<\/p><p>You can resume a Long Rest immediately after an interruption. If you do so, the rest requires 1 additional hour per interruption to finish.<\/p>","u":"https://5e.tools/variantrules.html#long%20rest_xphb"},"rule|magical effect":{"n":"Magical Effect","h":"<p>An effect is magical if it is created by a spell, a magic item, or a phenomenon that a rule labels as magical.<\/p>","u":"https://5e.tools/variantrules.html#magical%20effect_xphb"},"rule|monster":{"n":"Monster","h":"<p>A monster is a creature controlled by the DM, even if the creature is benevolent.<\/p>","u":"https://5e.tools/variantrules.html#monster_xphb"},"rule|nonplayer character":{"n":"Nonplayer Character","h":"<p>A nonplayer character (NPC) is a <a class=\"lk\" data-l=\"rule|monster\">monster<\/a> that has a personal name and a distinct personality.<\/p>","u":"https://5e.tools/variantrules.html#nonplayer%20character_xphb"},"rule|object":{"n":"Object","h":"<p>An object is a nonliving, distinct thing. Composite things, like buildings, comprise more than one object.<\/p>","u":"https://5e.tools/variantrules.html#object_xphb"},"rule|occupied space":{"n":"Occupied Space","h":"<p>A space is occupied if a creature is in it or if it is completely filled by objects.<\/p>","u":"https://5e.tools/variantrules.html#occupied%20space_xphb"},"rule|passive perception":{"n":"Passive Perception","h":"<p>Passive Perception is a score that reflects a creature's general awareness of its surroundings. The DM uses this score when determining whether a creature notices something without consciously making a Wisdom (<a class=\"lk\" data-l=\"skill|perception\">Perception<\/a>) check.<\/p><p>A creature's Passive Perception equals 10 plus the creature's Wisdom (<a class=\"lk\" data-l=\"skill|perception\">Perception<\/a>) check bonus. If the creature has <a class=\"lk\" data-l=\"rule|advantage\">Advantage<\/a> on such checks, increase the score by 5. If the creature has <a class=\"lk\" data-l=\"rule|disadvantage\">Disadvantage<\/a> on them, decrease the score by 5. For example, a level 1 character with a Wisdom of 15 and proficiency in Perception has a Passive Perception of 14 (10 + 2 + 2). If that character has <a class=\"lk\" data-l=\"rule|advantage\">Advantage<\/a> on Wisdom (<a class=\"lk\" data-l=\"skill|perception\">Perception<\/a>) checks, the score becomes 10 + 2 + 2 + 5.<\/p>","u":"https://5e.tools/variantrules.html#passive%20perception_xphb"},"rule|per day":{"n":"Per Day","h":"<p>If a rule says you can use something a certain number of times per day, that means you must finish a <a class=\"lk\" data-l=\"rule|long rest\">Long Rest<\/a> to use it again after you run out of uses.<\/p>","u":"https://5e.tools/variantrules.html#per%20day_xphb"},"rule|player character":{"n":"Player Character","h":"<p>A player character is a character controlled by a player.<\/p>","u":"https://5e.tools/variantrules.html#player%20character_xphb"},"rule|possession":{"n":"Possession","h":"<p>Some effects cause a creature to be possessed by another creature or entity. A possessing effect defines how the possession operates. Possession can be prevented by the <a class=\"lk\" data-l=\"spell|protection from evil and good\">Protection from Evil and Good<\/a> spell and ended by the <a href=\"https://5e.tools/spells.html#dispel%20evil%20and%20good_xphb\" target=\"_blank\" rel=\"noopener\">Dispel Evil and Good<\/a> spell.<\/p>","u":"https://5e.tools/variantrules.html#possession_xphb"},"rule|proficiency":{"n":"Proficiency","h":"<p>If you have proficiency with something, you can add your Proficiency Bonus to any <a class=\"lk\" data-l=\"rule|d20 test\">D20 Test<\/a> you make using that thing. A creature might have proficiency in a skill or <a class=\"lk\" data-l=\"rule|saving throw\">saving throw<\/a> or with a weapon or tool.<\/p>","u":"https://5e.tools/variantrules.html#proficiency_xphb"},"rule|reach":{"n":"Reach","h":"<p>A creature has a reach of 5 feet unless a rule says otherwise.<\/p>","u":"https://5e.tools/variantrules.html#reach_xphb"},"rule|reaction":{"n":"Reaction","h":"<p>A Reaction is a special action taken in response to a trigger defined in the Reaction's description. You can take a Reaction on another creature's turn, and if you take it on your turn, you can do so even if you also take an action, a <a class=\"lk\" data-l=\"rule|bonus action\">Bonus Action<\/a>, or both. Once you take a Reaction, you can't take another one until the start of your next turn. The <a class=\"lk\" data-l=\"act|opportunity attack\">Opportunity Attack<\/a> is a Reaction available to all creatures.<\/p>","u":"https://5e.tools/variantrules.html#reaction_xphb"},"rule|resistance":{"n":"Resistance","h":"<p>If you have Resistance to a <a class=\"lk\" data-l=\"rule|damage types\">damage type<\/a>, damage of that type is halved against you (round down). Resistance is applied only once to an instance of damage.<\/p>","u":"https://5e.tools/variantrules.html#resistance_xphb"},"rule|ritual":{"n":"Ritual","h":"<p>If you have a spell prepared that has the Ritual tag, you can cast that spell as a Ritual. The Ritual version of a spell takes 10 minutes longer to cast than normal. It also doesn't expend a spell slot, which means the ritual version of a spell can't be cast at a higher level.<\/p>","u":"https://5e.tools/variantrules.html#ritual_xphb"},"rule|round down":{"n":"Round Down","h":"<p>Whenever you divide or multiply a number in the game, round down if you end up with a fraction, even if the fraction is one-half or greater. Some rules make an exception and tell you to round up.<\/p>","u":"https://5e.tools/variantrules.html#round%20down_xphb"},"rule|save":{"n":"Save","h":"<p>Save is another name for a <a class=\"lk\" data-l=\"rule|saving throw\">saving throw<\/a>.<\/p>","u":"https://5e.tools/variantrules.html#save_xphb"},"rule|saving throw":{"n":"Saving Throw","h":"<p>A saving throw—also called a save—represents an attempt to avoid or resist a threat. You normally make a saving throw only when a rule requires you to do so, but you can decide to fail the save without rolling. The result of a save is detailed in the effect that allowed it. If a target is forced to make a save and lacks the ability score used by it, the target automatically fails.<\/p>","u":"https://5e.tools/variantrules.html#saving%20throw_xphb"},"rule|shape-shifting":{"n":"Shape-Shifting","h":"<p>If an effect, such as Wild Shape or the <a class=\"lk\" data-l=\"spell|polymorph\">Polymorph<\/a> spell, lets you shape-shift, its description specifies what happens to you. Unless that description says otherwise, any ongoing effects on you—<a class=\"lk\" data-l=\"rule|condition\">conditions<\/a>, spells, curses, and the like—carry over from one form to the other. You revert to your true form if you die.<\/p>","u":"https://5e.tools/variantrules.html#shape-shifting_xphb"},"rule|short rest":{"n":"Short Rest","h":"<p>A Short Rest is a 1-hour period of downtime, during which a creature does nothing more strenuous than reading, talking, eating, or standing watch. To start a Short Rest, you must have at least 1 <a class=\"lk\" data-l=\"rule|hit points\">Hit Point<\/a>.<\/p><p><b><i>Benefits of the Rest.<\/i><\/b> When you finish the rest, you gain the following benefits:<\/p><ul><li><b>Spend Hit Point Dice<\/b> You can spend one or more of your <a class=\"lk\" data-l=\"rule|hit point dice\">Hit Point Dice<\/a> to regain <a class=\"lk\" data-l=\"rule|hit points\">Hit Points<\/a>. For each <a class=\"lk\" data-l=\"rule|hit point dice\">Hit Point Die<\/a> you spend in this way, roll the die and add your Constitution modifier to it. You regain <a class=\"lk\" data-l=\"rule|hit points\">Hit Points<\/a> equal to the total (minimum of 1 Hit Point). You can decide to spend an additional <a class=\"lk\" data-l=\"rule|hit point dice\">Hit Point Die<\/a> after each roll.<\/li><li><b>Special Feature<\/b> Some features are recharged by a Short Rest. If you have such a feature, it recharges in the way specified in its description.<\/li><\/ul><p><b><i>Interrupting the Rest.<\/i><\/b> A Short Rest is stopped by the following interruptions:<\/p><ul><li>Rolling <a class=\"lk\" data-l=\"rule|initiative\">Initiative<\/a><\/li><li>Casting a spell other than a cantrip<\/li><li>Taking any damage<\/li><\/ul><p>An interrupted Short Rest confers no benefits.<\/p>","u":"https://5e.tools/variantrules.html#short%20rest_xphb"},"rule|simultaneous effects":{"n":"Simultaneous Effects","h":"<p>If two or more things happen at the same time on a turn, the person at the game table—player or DM whose turn it is decides the order in which those things happen. For example, if two effects occur at the start of a <a class=\"lk\" data-l=\"rule|player character\">player character's<\/a> turn, the player decides which of the effects happens first.<\/p>","u":"https://5e.tools/variantrules.html#simultaneous%20effects_xphb"},"rule|size":{"n":"Size","h":"<p>A creature or an object belongs to a size category: Tiny, Small, Medium, Large, Huge, or Gargantuan. A creature's size determines how much space the creature occupies in combat. An object's size affects its <a class=\"lk\" data-l=\"rule|hit points\">Hit Points<\/a>.<\/p>","u":"https://5e.tools/variantrules.html#size_xphb"},"rule|skill":{"n":"Skill","h":"<p>A skill is an 1 associated with an ability check. If you have proficiency in a skill, you can add your <a class=\"lk\" data-l=\"rule|proficiency\">Proficiency Bonus<\/a> when you make an ability check associated with that skill.<\/p>","u":"https://5e.tools/variantrules.html#skill_xphb"},"rule|speed":{"n":"Speed","h":"<p>A creature has a Speed, which is the distance in feet the creature can cover when it moves on its turn.<\/p><p><b><i>Special Speeds.<\/i><\/b> Some creatures have special speeds, such as a <a class=\"lk\" data-l=\"rule|burrow speed\">Burrow Speed<\/a>, <a class=\"lk\" data-l=\"rule|climb speed\">Climb Speed<\/a>, <a class=\"lk\" data-l=\"rule|fly speed\">Fly Speed<\/a>, or <a class=\"lk\" data-l=\"rule|swim speed\">Swim Speed<\/a>, each of which is defined in this glossary. If you have more than one speed, choose which one to use when you move; you can switch between the speeds during your move. Whenever you switch, subtract the distance already moved from the new speed. The result determines how much farther you can move. If the result is 0 or less, you can't use the new speed during the current move. For example, if you have a Speed of 30 and a <a class=\"lk\" data-l=\"rule|fly speed\">Fly Speed<\/a> of 40, you could fly 10 feet, walk 10 feet, and leap into the air to fly 20 feet more.<\/p><p><b><i>Changes to Your Speeds.<\/i><\/b> If an effect increases or decreases your Speed for a time, any special speed you have increases or decreases by an equal amount for the same duration. For example, if your Speed is reduced to 0 and you have a <a class=\"lk\" data-l=\"rule|climb speed\">Climb Speed<\/a>, your <a class=\"lk\" data-l=\"rule|climb speed\">Climb Speed<\/a> is also reduced to 0. Similarly, if your Speed is halved and you have a <a class=\"lk\" data-l=\"rule|fly speed\">Fly Speed<\/a>, your <a class=\"lk\" data-l=\"rule|fly speed\">Fly Speed<\/a> is also halved.<\/p>","u":"https://5e.tools/variantrules.html#speed_xphb"},"rule|spell":{"n":"Spell","h":"<p>A spell is a <a class=\"lk\" data-l=\"rule|magical effect\">magical effect<\/a> that has the characteristics described in 7.<\/p>","u":"https://5e.tools/variantrules.html#spell_xphb"},"rule|spell attack":{"n":"Spell Attack","h":"<p>A spell attack is an attack roll made as part of a spell or another <a class=\"lk\" data-l=\"rule|magical effect\">magical effect<\/a>.<\/p>","u":"https://5e.tools/variantrules.html#spell%20attack_xphb"},"rule|spellcasting focus":{"n":"Spellcasting Focus","h":"<p>A Spellcasting Focus is an object that certain creatures can use in place of a spell's Material components if those materials aren't consumed by the spell and don't have a cost specified. Some classes allow its members to use certain types of Spellcasting Focuses.<\/p>","u":"https://5e.tools/variantrules.html#spellcasting%20focus_xphb"},"rule|sphere [area of effect]":{"n":"Sphere","h":"<p>A Sphere is an area of effect that extends in straight lines from a point of origin outward in all directions. The effect that creates a Sphere specifies the distance it extends as the radius of the Sphere.<\/p><p>A Sphere's point of origin is included in the Sphere's area of effect.<\/p>","u":"https://5e.tools/variantrules.html#sphere%20%5Barea%20of%20effect%5D_xphb"},"rule|stable":{"n":"Stable","h":"<p>A creature is Stable if it has 0 <a class=\"lk\" data-l=\"rule|hit points\">Hit Points<\/a> but isn't required to make <a class=\"lk\" data-l=\"rule|death saving throw\">Death Saving Throws<\/a>.<\/p>","u":"https://5e.tools/variantrules.html#stable_xphb"},"rule|stat block":{"n":"Stat Block","h":"<p>A stat block contains the game statistics of a <a class=\"lk\" data-l=\"rule|monster\">monster<\/a>. Each stat block includes the following information presented after the <a class=\"lk\" data-l=\"rule|monster\">monster's<\/a> name.<\/p><p><b><i>Size.<\/i><\/b> A <a class=\"lk\" data-l=\"rule|monster\">monster<\/a> is Tiny, Small, Med ium, Large, Huge, or Gargantuan.<\/p><p><b><i>Creature Type.<\/i><\/b> This entry notes the family of beings a <a class=\"lk\" data-l=\"rule|monster\">monster<\/a> belongs to, along with any descriptive tags.<\/p><p><b><i>Alignment.<\/i><\/b> An alignment is suggested for the <a class=\"lk\" data-l=\"rule|monster\">monster<\/a>, with the DM determining its actual alignment.<\/p><p><b><i>AC, Initiative, and HP.<\/i><\/b> These entries give the <a class=\"lk\" data-l=\"rule|monster\">monster's<\/a> <a class=\"lk\" data-l=\"rule|armor class\">Armor Class<\/a>, <a class=\"lk\" data-l=\"rule|initiative\">Initiative<\/a>, and <a class=\"lk\" data-l=\"rule|hit points\">Hit Points<\/a>, which are detailed in 1. In parentheses after the <a class=\"lk\" data-l=\"rule|hit points\">Hit Points<\/a>, the <a class=\"lk\" data-l=\"rule|monster\">monster's<\/a> <a class=\"lk\" data-l=\"rule|hit point dice\">Hit Point Dice<\/a> are provided, along with the contribution of its Constitution, if any, to its <a class=\"lk\" data-l=\"rule|hit points\">Hit Points<\/a>. Following the <a class=\"lk\" data-l=\"rule|initiative\">Initiative<\/a> modifier is an <a class=\"lk\" data-l=\"rule|initiative\">Initiative<\/a> score. Some creatures that are created by magic lack Hit Dice and <a class=\"lk\" data-l=\"rule|initiative\">Initiative<\/a> information.<\/p><p><b><i>Speed.<\/i><\/b> Here the <a class=\"lk\" data-l=\"rule|monster\">monster's<\/a> Speed is provided, along with any special speeds.<\/p><p><b><i>Ability Scores.<\/i><\/b> A table provides the <a class=\"lk\" data-l=\"rule|monster\">monster's<\/a> ability scores, modifiers, and <a class=\"lk\" data-l=\"rule|saving throw\">saving throw<\/a> modifiers, all of which are detailed in 1.<\/p><p><b><i>Skills.<\/i><\/b> This entry lists the <a class=\"lk\" data-l=\"rule|monster\">monster's<\/a> skill proficiencies, if any.<\/p><p><b><i>Resistances and Vulnerabilities.<\/i><\/b> These entries list the <a class=\"lk\" data-l=\"rule|monster\">monster's<\/a> Resistances and Vulnerabilities, if any.<\/p><p><b><i>Immunities.<\/i><\/b> This section lists the <a class=\"lk\" data-l=\"rule|monster\">monster's<\/a> damage and <a class=\"lk\" data-l=\"rule|condition\">condition<\/a> Immunities, if any.<\/p><p><b><i>Gear.<\/i><\/b> If the <a class=\"lk\" data-l=\"rule|monster\">monster<\/a> has any equipment that can be given away or retrieved, it's listed in this entry.<\/p><p><b><i>Senses.<\/i><\/b> This entry lists the <a class=\"lk\" data-l=\"rule|monster\">monster's<\/a> special senses, such as <a class=\"lk\" data-l=\"sense|darkvision\">Darkvision<\/a>, and its Passive <a class=\"lk\" data-l=\"skill|perception\">Perception<\/a>.<\/p><p><b><i>Languages.<\/i><\/b> This entry lists any languages the <a class=\"lk\" data-l=\"rule|monster\">monster<\/a> knows.<\/p><p><b><i>CR.<\/i><\/b> Challenge Rating summarizes the threat a <a class=\"lk\" data-l=\"rule|monster\">monster<\/a> poses and is detailed in the Monster Manual. The Experience Points characters receive for defeating a <a class=\"lk\" data-l=\"rule|monster\">monster<\/a> and its <a class=\"lk\" data-l=\"rule|proficiency\">Proficiency Bonus<\/a> follow. Some creatures that are created by magic have no CR.<\/p><p><b><i>Traits.<\/i><\/b> The <a class=\"lk\" data-l=\"rule|monster\">monster's<\/a> traits, if any, are features that are active at all times or in certain situations.<\/p><p><b><i>Actions.<\/i><\/b> The <a class=\"lk\" data-l=\"rule|monster\">monster<\/a> can take these actions in addition to those detailed in this glossary.<\/p><p><b><i>Bonus Actions.<\/i><\/b> If the <a class=\"lk\" data-l=\"rule|monster\">monster<\/a> has <a class=\"lk\" data-l=\"rule|bonus action\">Bonus Action<\/a> options, they are listed in this section.<\/p><p><b><i>Reactions.<\/i><\/b> If the <a class=\"lk\" data-l=\"rule|monster\">monster<\/a> can take special <a class=\"lk\" data-l=\"rule|reaction\">Reactions<\/a>, those are listed in this section.<\/p><p><b><i>Attack Notation.<\/i><\/b> The entry for a <a class=\"lk\" data-l=\"rule|monster\">monster's<\/a> attack starts by identifying whether the attack is a melee or a ranged attack and then provides the attack roll's bonus, its reach or range, and what happens on a hit. An attack is against one target unless its entry says otherwise.<\/p><p><b><i>Saving Throw Effect Notation.<\/i><\/b> If an effect forces a <a class=\"lk\" data-l=\"rule|saving throw\">saving throw<\/a>, the effect's entry starts by identifying the kind of <a class=\"lk\" data-l=\"rule|saving throw\">saving throw<\/a> required and then provides the save's DC, a description of which creatures must make the save, and what happens on a failed or a successful save.<\/p><p><b><i>Damage Notation.<\/i><\/b> A stat block usually provides both a static number and a die expression for each instance of damage. For example, an attack might deal 4 (1d4 + 2) damage on a hit. The DM determines whether you use the static number or the die expression in parentheses; you don't use both.<\/p>","u":"https://5e.tools/variantrules.html#stat%20block_xphb"},"rule|swim speed":{"n":"Swim Speed","h":"<p>A Swim Speed can be used to swim without expending the extra movement normally associated with swimming.<\/p>","u":"https://5e.tools/variantrules.html#swim%20speed_xphb"},"rule|swimming":{"n":"Swimming","h":"<p>While you're swimming, each foot of movement costs 1 extra foot (2 extra feet in <a class=\"lk\" data-l=\"rule|difficult terrain\">difficult terrain<\/a>). You ignore this extra cost if you have a <a class=\"lk\" data-l=\"rule|swim speed\">Swim Speed<\/a> and use it to swim. At the DM's option, moving any distance in rough water might require a successful DC 15 Strength (<a class=\"lk\" data-l=\"skill|athletics\">Athletics<\/a>) check.<\/p>","u":"https://5e.tools/variantrules.html#swimming_xphb"},"rule|target":{"n":"Target","h":"<p>A target is the creature or object targeted by an attack roll, forced to make a <a class=\"lk\" data-l=\"rule|saving throw\">saving throw<\/a> by an effect, or selected to receive the effects of a spell or another phenomenon.<\/p>","u":"https://5e.tools/variantrules.html#target_xphb"},"rule|telepathy":{"n":"Telepathy","h":"<p>Telepathy is a magical ability that allows a creature to communicate mentally with another creature within a specified range. Unless a rule states otherwise, the contacted creature doesn't need to share a language with the telepath to understand this communication, but the contacted creature must be able to understand at least one language or be telepathic itself to understand.<\/p><p>A telepath doesn't need to see a contacted creature, and the telepath can start or end the telepathic contact at any time (no action required). Telepathic contact can't be initiated and is immediately broken if either the telepath or the other creature has the <a class=\"lk\" data-l=\"cond|incapacitated\">Incapacitated<\/a> condition. Telepathic contact is also broken if the contacted creature is no longer within the telepathy's range or if the telepath contacts a different creature within range.<\/p><p>A creature without telepathy can receive telepathic messages but can't initiate a telepathic conversation. Once a telepathic conversation starts, the non-telepath can communicate mentally to the telepath until the telepathic connection ends.<\/p>","u":"https://5e.tools/variantrules.html#telepathy_xphb"},"rule|teleportation":{"n":"Teleportation","h":"<p>Teleportation is a special kind of magical transportation. If you teleport, you disappear and reappear elsewhere instantly, without moving through the intervening space. This transportation doesn't expend movement unless a rule tells you otherwise, and teleportation never provokes <a class=\"lk\" data-l=\"act|opportunity attack\">Opportunity Attacks<\/a>.<\/p><p>When you teleport, all the equipment you're wearing and carrying teleports with you. If you're touching another creature when you teleport, that creature doesn't teleport with you unless the teleportation effect says otherwise.<\/p><p>If the destination space of your teleportation is occupied by another creature or blocked by a solid obstacle, you instead appear in the nearest unoccupied space of your choice.<\/p><p>The description of a teleportation effect tells you if you must see the teleportation's destination.<\/p>","u":"https://5e.tools/variantrules.html#teleportation_xphb"},"rule|temporary hit points":{"n":"Temporary Hit Points","h":"<p>Temporary Hit Points are granted by certain effects and act as a buffer against losing real <a class=\"lk\" data-l=\"rule|hit points\">Hit Points<\/a>.<\/p>","u":"https://5e.tools/variantrules.html#temporary%20hit%20points_xphb"},"rule|unarmed strike":{"n":"Unarmed Strike","h":"<p>Instead of using a weapon to make a melee attack, you can use a punch, kick, head-butt, or similar forceful blow. In game terms, this is an Unarmed Strike—a melee attack that involves you using your body to damage, grapple, or shove a target within 5 feet of you.<\/p><p>Whenever you use your Unarmed Strike, choose one of the following options for its effect.<\/p><p><b><i>Damage.<\/i><\/b> You make an attack roll against the target. Your bonus to the roll equals your Strength modifier plus your <a class=\"lk\" data-l=\"rule|proficiency\">Proficiency Bonus<\/a>. On a hit, the target takes Bludgeoning damage equal to 1 plus your Strength modifier.<\/p><p><b><i>Grapple.<\/i><\/b> The target must succeed on a Strength or Dexterity <a class=\"lk\" data-l=\"rule|saving throw\">saving throw<\/a> (it chooses which), or it has the <a class=\"lk\" data-l=\"cond|grappled\">Grappled<\/a> condition. The DC for the <a class=\"lk\" data-l=\"rule|saving throw\">saving throw<\/a> and any escape attempts equals 8 plus your Strength modifier and <a class=\"lk\" data-l=\"rule|proficiency\">Proficiency Bonus<\/a>. This grapple is possible only if the target is no more than one size larger than you and if you have a hand free to grab it.<\/p><p><b><i>Shove.<\/i><\/b> The target must succeed on a Strength or Dexterity <a class=\"lk\" data-l=\"rule|saving throw\">saving throw<\/a> (it chooses which), or you either push it 5 feet away or cause it to have the <a class=\"lk\" data-l=\"cond|prone\">Prone<\/a> condition. The DC for the <a class=\"lk\" data-l=\"rule|saving throw\">saving throw<\/a> equals 8 plus your Strength modifier and <a class=\"lk\" data-l=\"rule|proficiency\">Proficiency Bonus<\/a>. This shove is possible only if the target is no more than one size larger than you.<\/p>","u":"https://5e.tools/variantrules.html#unarmed%20strike_xphb"},"rule|unoccupied space":{"n":"Unoccupied Space","h":"<p>A space is unoccupied if no creatures are in it and it isn't completely filled by objects.<\/p>","u":"https://5e.tools/variantrules.html#unoccupied%20space_xphb"},"rule|vulnerability":{"n":"Vulnerability","h":"<p>If you have Vulnerability to a <a class=\"lk\" data-l=\"rule|damage types\">damage type<\/a>, damage of that type is doubled against you. Vulnerability is applied only once to an instance of damage.<\/p>","u":"https://5e.tools/variantrules.html#vulnerability_xphb"},"rule|weapon":{"n":"Weapon","h":"<p>A weapon is an object that is in the Simple or Martial weapon category.<\/p>","u":"https://5e.tools/variantrules.html#weapon_xphb"},"rule|weapon attack":{"n":"Weapon Attack","h":"<p>A weapon attack is an attack roll made with a weapon.<\/p>","u":"https://5e.tools/variantrules.html#weapon%20attack_xphb"},"sense|blindsight":{"n":"Blindsight","h":"<p>If you have Blindsight, you can see within a specific range without relying on physical sight. Within that range, you can see anything that isn't behind <a class=\"lk\" data-l=\"rule|cover\">Total Cover<\/a> even if you have the <a class=\"lk\" data-l=\"cond|blinded\">Blinded<\/a> condition or are in <a class=\"lk\" data-l=\"rule|darkness\">Darkness<\/a>. Moreover, in that range, you can see something that has the <a class=\"lk\" data-l=\"cond|invisible\">Invisible<\/a> condition.<\/p>","u":"https://5e.tools/senses.html#blindsight_xphb"},"sense|darkvision":{"n":"Darkvision","h":"<p>If you have Darkvision, you can see in <a class=\"lk\" data-l=\"rule|dim light\">Dim Light<\/a> within a specified range as if it were <a class=\"lk\" data-l=\"rule|bright light\">Bright Light<\/a> and in <a class=\"lk\" data-l=\"rule|darkness\">Darkness<\/a> within that range as if it were <a class=\"lk\" data-l=\"rule|dim light\">Dim Light<\/a>. You discern colors in that <a class=\"lk\" data-l=\"rule|darkness\">Darkness<\/a> only as shades of gray.<\/p>","u":"https://5e.tools/senses.html#darkvision_xphb"},"sense|tremorsense":{"n":"Tremorsense","h":"<p>A creature with Tremorsense can pinpoint the location of creatures and moving objects within a specific range, provided that the creature with Tremorsense and anything it is detecting are both in contact with the same surface (such as the ground, a wall, or a ceiling) or the same liquid.<\/p><p>Tremorsense can't detect creatures or objects in the air, and it doesn't count as a form of sight.<\/p>","u":"https://5e.tools/senses.html#tremorsense_xphb"},"sense|truesight":{"n":"Truesight","h":"<p>If you have Truesight, your vision is enhanced within a specified range. Within that range, your vision pierces through the following:<\/p><ul><li><b>Darkness<\/b> You can see in normal and magical <a class=\"lk\" data-l=\"rule|darkness\">Darkness<\/a>.<\/li><li><b>Invisibility<\/b> You see creatures and objects that have the <a class=\"lk\" data-l=\"cond|invisible\">Invisible<\/a> condition.<\/li><li><b>Visual Illusions<\/b> Visual illusions appear transparent to you, and you automatically succeed on <a class=\"lk\" data-l=\"rule|saving throw\">saving throws<\/a> against them.<\/li><li><b>Transformations<\/b> You discern the true form of any creature or object you see that has been transformed by magic.<\/li><li><b>Ethereal Plane<\/b> You see into the Ethereal Plane.<\/li><\/ul>","u":"https://5e.tools/senses.html#truesight_xphb"},"skill|acrobatics":{"n":"Acrobatics","h":"<p>Stay on your feet in a tricky situation, or perform an acrobatic stunt.<\/p>","u":"https://5e.tools/skills.html#acrobatics_xphb"},"skill|animal handling":{"n":"Animal Handling","h":"<p>Calm or train an animal, or get an animal to behave in a certain way.<\/p>","u":"https://5e.tools/skills.html#animal%20handling_xphb"},"skill|arcana":{"n":"Arcana","h":"<p>Recall lore about spells, magic items, and the planes of existence.<\/p>","u":"https://5e.tools/skills.html#arcana_xphb"},"skill|athletics":{"n":"Athletics","h":"<p>Jump farther than normal, stay afloat in rough water, or break something.<\/p>","u":"https://5e.tools/skills.html#athletics_xphb"},"skill|deception":{"n":"Deception","h":"<p>Tell a convincing lie, or wear a disguise convincingly.<\/p>","u":"https://5e.tools/skills.html#deception_xphb"},"skill|history":{"n":"History","h":"<p>Recall lore about historical events, people, nations, and cultures.<\/p>","u":"https://5e.tools/skills.html#history_xphb"},"skill|insight":{"n":"Insight","h":"<p>Discern a person's mood and intentions.<\/p>","u":"https://5e.tools/skills.html#insight_xphb"},"skill|intimidation":{"n":"Intimidation","h":"<p>Awe or threaten someone into doing what you want.<\/p>","u":"https://5e.tools/skills.html#intimidation_xphb"},"skill|investigation":{"n":"Investigation","h":"<p>Find obscure information in books, or deduce how something works.<\/p>","u":"https://5e.tools/skills.html#investigation_xphb"},"skill|medicine":{"n":"Medicine","h":"<p>Diagnose an illness, or determine what killed the recently slain.<\/p>","u":"https://5e.tools/skills.html#medicine_xphb"},"skill|nature":{"n":"Nature","h":"<p>Recall lore about terrain, plants, animals, and weather.<\/p>","u":"https://5e.tools/skills.html#nature_xphb"},"skill|perception":{"n":"Perception","h":"<p>Using a combination of senses, notice something that's easy to miss.<\/p>","u":"https://5e.tools/skills.html#perception_xphb"},"skill|performance":{"n":"Performance","h":"<p>Act, tell a story, perform music, or dance.<\/p>","u":"https://5e.tools/skills.html#performance_xphb"},"skill|persuasion":{"n":"Persuasion","h":"<p>Honestly and graciously convince someone of something.<\/p>","u":"https://5e.tools/skills.html#persuasion_xphb"},"skill|religion":{"n":"Religion","h":"<p>Recall lore about gods, religious rituals, and holy symbols.<\/p>","u":"https://5e.tools/skills.html#religion_xphb"},"skill|sleight of hand":{"n":"Sleight of Hand","h":"<p>Pick a pocket, conceal a handheld object, or perform legerdemain.<\/p>","u":"https://5e.tools/skills.html#sleight%20of%20hand_xphb"},"skill|stealth":{"n":"Stealth","h":"<p>Escape notice by moving quietly and hiding behind things.<\/p>","u":"https://5e.tools/skills.html#stealth_xphb"},"skill|survival":{"n":"Survival","h":"<p>Follow tracks, forage, find a trail, or avoid natural hazards.<\/p>","u":"https://5e.tools/skills.html#survival_xphb"},"mast|cleave":{"n":"Cleave","h":"<p>If you hit a creature with a melee attack roll using this weapon, you can make a melee attack roll with the weapon against a second creature within 5 feet of the first that is also within your reach. On a hit, the second creature takes the weapon's damage, but don't add your ability modifier to that damage unless that modifier is negative. You can make this extra attack only once per turn.<\/p>","u":"https://5e.tools/items.html#cleave_xphb"},"mast|graze":{"n":"Graze","h":"<p>If your attack roll with this weapon misses a creature, you can deal damage to that creature equal to the ability modifier you used to make the attack roll. This damage is the same type dealt by the weapon, and the damage can be increased only by increasing the ability modifier.<\/p>","u":"https://5e.tools/items.html#graze_xphb"},"mast|nick":{"n":"Nick","h":"<p>When you make the extra attack of the Light property, you can make it as part of the <a class=\"lk\" data-l=\"act|attack\">Attack<\/a> action instead of as a <a class=\"lk\" data-l=\"rule|bonus action\">Bonus Action<\/a>. You can make this extra attack only once per turn.<\/p>","u":"https://5e.tools/items.html#nick_xphb"},"mast|push":{"n":"Push","h":"<p>If you hit a creature with this weapon, you can push the creature up to 10 feet straight away from yourself if it is Large or smaller.<\/p>","u":"https://5e.tools/items.html#push_xphb"},"mast|sap":{"n":"Sap","h":"<p>If you hit a creature with this weapon, that creature has <a class=\"lk\" data-l=\"rule|disadvantage\">Disadvantage<\/a> on its next attack roll before the start of your next turn.<\/p>","u":"https://5e.tools/items.html#sap_xphb"},"mast|slow":{"n":"Slow","h":"<p>If you hit a creature with this weapon and deal damage to it, you can reduce its <a class=\"lk\" data-l=\"rule|speed\">Speed<\/a> by 10 feet until the start of your next turn. If the creature is hit more than once by weapons that have this property, the <a class=\"lk\" data-l=\"rule|speed\">Speed<\/a> reduction doesn't exceed 10 feet.<\/p>","u":"https://5e.tools/items.html#slow_xphb"},"mast|topple":{"n":"Topple","h":"<p>If you hit a creature with this weapon, you can force the creature to make a Constitution saving throw (DC 8 plus the ability modifier used to make the attack roll and your <a class=\"lk\" data-l=\"rule|proficiency\">Proficiency Bonus<\/a>). On a failed save, the creature has the <a class=\"lk\" data-l=\"cond|prone\">Prone<\/a> condition.<\/p>","u":"https://5e.tools/items.html#topple_xphb"},"mast|vex":{"n":"Vex","h":"<p>If you hit a creature with this weapon and deal damage to the creature, you have <a class=\"lk\" data-l=\"rule|advantage\">Advantage<\/a> on your next attack roll against that creature before the end of your next turn.<\/p>","u":"https://5e.tools/items.html#vex_xphb"}},"weapons":[{"n":"Battleaxe","cat":"martial","m":"Topple","p":["Versatile"],"d":"1d8","t":"Slashing"},{"n":"Blowgun","cat":"martial","m":"Vex","p":["Ammunition","Loading"],"d":"1","t":"Piercing"},{"n":"Club","cat":"simple","m":"Slow","p":["Light"],"d":"1d4","t":"Bludgeoning"},{"n":"Dagger","cat":"simple","m":"Nick","p":["Finesse","Light","Thrown"],"d":"1d4","t":"Piercing"},{"n":"Dart","cat":"simple","m":"Vex","p":["Finesse","Thrown"],"d":"1d4","t":"Piercing"},{"n":"Flail","cat":"martial","m":"Sap","p":[],"d":"1d8","t":"Bludgeoning"},{"n":"Glaive","cat":"martial","m":"Graze","p":["Heavy","Reach","Two-Handed"],"d":"1d10","t":"Slashing"},{"n":"Greataxe","cat":"martial","m":"Cleave","p":["Heavy","Two-Handed"],"d":"1d12","t":"Slashing"},{"n":"Greatclub","cat":"simple","m":"Push","p":["Two-Handed"],"d":"1d8","t":"Bludgeoning"},{"n":"Greatsword","cat":"martial","m":"Graze","p":["Heavy","Two-Handed"],"d":"2d6","t":"Slashing"},{"n":"Halberd","cat":"martial","m":"Cleave","p":["Heavy","Reach","Two-Handed"],"d":"1d10","t":"Slashing"},{"n":"Hand Crossbow","cat":"martial","m":"Vex","p":["Ammunition","Light","Loading"],"d":"1d6","t":"Piercing"},{"n":"Handaxe","cat":"simple","m":"Vex","p":["Light","Thrown"],"d":"1d6","t":"Slashing"},{"n":"Heavy Crossbow","cat":"martial","m":"Push","p":["Ammunition","Heavy","Loading","Two-Handed"],"d":"1d10","t":"Piercing"},{"n":"Javelin","cat":"simple","m":"Slow","p":["Thrown"],"d":"1d6","t":"Piercing"},{"n":"Lance","cat":"martial","m":"Topple","p":["Heavy","Reach","Two-Handed"],"d":"1d10","t":"Piercing"},{"n":"Light Crossbow","cat":"simple","m":"Slow","p":["Ammunition","Loading","Two-Handed"],"d":"1d8","t":"Piercing"},{"n":"Light Hammer","cat":"simple","m":"Nick","p":["Light","Thrown"],"d":"1d4","t":"Bludgeoning"},{"n":"Longbow","cat":"marti function applyDoc(path, v){
  const [coll, id] = path.split('/');

    const st = clone(v.state); normalise(st);
    if (JSON.stringify(st) !== JSON.stringify(chars[id])) { chars[id] = st; lsSet(LS_KEY, chars); return true; }
  }
  if (coll === 'texts' && v && v.map && JSON.stringify(v.map) !== JSON.stringify(texts)) { texts = clone(v.map); lsSet(LS_TEXT, texts); return true; }
  if (coll === 'party' && v) { party.notes = v.notes || ''; party.loot = v.loot || ''; party.coins = v.coins || party.coins; lsSet(LS_PARTY, party); return true; }
  if (coll === 'combat' && v) { const nx = {round: v.round || 0, turn: v.turn || null, list: v.list || []}; if (JSON.stringify(nx) === JSON.stringify(combat)) return false; combat = nx; lsSet(LS_COMBAT, combat); return true; }

async function connectBackend(){
  setSync('busy');
  try {
    await BE.start({
      onDoc: (path, v) => { if (v && v.by === BE.client) return; if (applyDoc(path, v)) softRender(); },
      onDel: path => { const [coll, id] = path.split('/'); if (party[coll]) { party[coll] = party[coll].filter(x => x.id !== id); lsSet(LS_PARTY, party); softRender(); } },
      loaded: seen => {
        ORDER.forEach(id => { if (!seen.has('chars/' + id)) save(id); });
        if (!seen.has('party/main') && (party.notes || party.loot)) saveParty();
        if (!seen.has('combat/main') && combat.list.length) saveCombat();
        ['quests','npcs','log'].forEach(coll => party[coll].forEach(it => { if (!seen.has(coll + '/' + it.id)) saveItem(coll, it); }));
        render();
      },
      onRolls: rows => { rolls = rows.map(rowToRoll); softRender(); },
      onRoll: r => { const x = rowToRoll(r); rolls.unshift(x); rolls = rolls.slice(0, 40); softRender(); toast(`${x.who ? x.who + ': ' : ''}${x.label} ${x.total}`); },
      status: s => setSync(s)
    });
    setSync('ok');
  } catch(e){ setSync('local'); toast('Could not reach the party database. Working on this device for now.'); }
}

async function connect(){
  if (BE) return connectBackend();
  try {
    if (!window.claude || !window.claude.use) return;
    const db = await window.claude.use('db'); if (!db) return;
    DB = db; setSync('ok');
    try { const user = await window.claude.use('user'); if (user && user.can) { const w = await user.can('data.write'); if (w === false) { canWrite = false; setSync('local'); } } } catch(e){}
    let first = true;
    db.collection('chars').onSnapshot(snap => {
      let changed = false;
      if (first) { first = false; const seen = new Set(snap.docs.map(d => d.id)); ORDER.forEach(id => { if (!seen.has(id) && canWrite && JSON.stringify(chars[id]) !== JSON.stringify(normalised(SHEETS[id]))) save(id); }); }
      snap.docs.forEach(d => { const v = d.data(); if (v && v.state && SHEETS[d.id] && v.state.v === SHEETS[d.id].v && !d.metadata.hasPendingWrites) {
        const st = clone(v.state); normalise(st);
        if (JSON.stringify(st) !== JSON.stringify(chars[d.id])) { chars[d.id] = st; changed = true; } } });
      if (changed) { lsSet(LS_KEY, chars); softRender(); }
    }, () => setSync('local'));
    db.doc('combat/main').onSnapshot(s => { const v = s.exists && s.data(); if (v && !s.metadata.hasPendingWrites) { if (applyDoc('combat/main', v)) softRender(); } else if (!v && canWrite && combat.list.length) saveCombat(); }, () => {});
    db.doc('texts/custom').onSnapshot(s => { const v = s.exists && s.data(); if (v && v.map && JSON.stringify(v.map) !== JSON.stringify(texts)) { texts = clone(v.map); lsSet(LS_TEXT, texts); softRender(); } }, () => {});
    db.doc('party/main').onSnapshot(s => { const v = s.exists && s.data(); if (v && !s.metadata.hasPendingWrites) { party.notes = v.notes || ''; party.loot = v.loot || ''; party.coins = v.coins || party.coins; lsSet(LS_PARTY, party); softRender(); } else if (!v && canWrite && (party.notes || party.loot)) saveParty(); }, () => {});
    ['quests','npcs','log'].forEach(coll => db.collection(coll).onSnapshot(s => {
      const items = s.docs.map(d => Object.assign({}, d.data(), {id: d.id}));
      if (!items.length && party[coll].length && canWrite) { party[coll].forEach(it => saveItem(coll, it)); return; }
      party[coll] = items; lsSet(LS_PARTY, party); softRender();
    }, () => {}));
  } catch(e){ setSync('local'); }
}

const eName = e => e.pc && chars[e.pc] ? chars[e.pc].name : (e.n || 'Creature');

const eAdv = e => e.pc && chars[e.pc] ? !!chars[e.pc].initAdv : !!e.adv;

function uniqueName(base){

function addCreatures(mod, value){

// ---------- drawers with back navigation ----------
let navStack = [], curReopen = null;
function openDrawer(title, body, foot, onBind, reopen){
  const s = document.getElementById('scrim'); if (s) s.remove();
  curReopen = reopen || null;
  const el = document.createElement('div');
  el.className = 'scrim'; el.id = 'scrim';
  el.innerHTML = `<div class="drawer" role="dialog" aria-modal="true" aria-label="${esc(String(title).replace(/<[^>]+>/g,''))}"><div class="hd">${navStack.length ? '<button class="x back" data-back-nav aria-label="Back">‹</button>' : ''}<h3>${title}</h3><button class="x" data-close aria-label="Close">×</button></div><div class="bd rt">${body}</div>${foot ? `<div class="ft">${foot}</div>` : ''}</div>`;
  el.addEventListener('click', e => {
    if (e.target === el || e.target.closest('[data-close]')) { closeDrawer(); return; }
    if (e.target.closest('[data-back-nav]')) { const fn = navStack.pop(); if (fn) fn(); }
  });
  document.body.appendChild(el);
  if (onBind) onBind(el);
  return el;
}
function closeDrawer(){ const s = document.getElementById('scrim'); if (s) s.remove(); navStack = []; curReopen = null; ctxOverride = null; }
function toast(msg){ document.querySelectorAll('.toast').forEach(t => t.remove()); const t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role','status'); t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 2800); }
const ctxChar = () => (ctxOverride && chars[ctxOverride]) ? chars[ctxOverride] : (PCS.includes(ui.cur) ? chars[ui.cur] : null);

function openEntity(ty, key){
  const c = ctxChar();

  if (ty === 'opt') {
    const v = R.invocations.find(x => x.n.toLowerCase() === key) || R.metamagic.find(x => x.n.toLowerCase() === key);
    if (!v) return;
    const isInv = R.invocations.includes(v), tk = (isInv ? 'inv:' : 'mm:') + v.n;
    const extra = c && isInv && hasInv(c, v.n) ? invContext(c, v.n) : '';
    const t = textFor(tk, v.h, false);
    return openDrawer(esc(v.n), (isInv ? `<p class="note">Eldritch Invocation${v.lv > 1 ? `, Warlock level ${v.lv}+` : ''}${v.pact ? `, needs ${lk('opt', v.pact.toLowerCase(), v.pact)}` : ''}</p>` : '<p class="note">Metamagic</p>') + extra + t.h + provenance(t, v.u, tk), '', null, back);
  }
  if (ty === 'feat') {
    const v = R.feats.find(x => x.n.toLowerCase() === key);
    const name = v ? v.n : key.replace(/\b\w/g, m => m.toUpperCase());
    const body = v && v.h ? v.h : (R.extraFeats[name] || `<p class="note">Not in the free SRD.</p>`);

    const url = v ? v.u : (key === 'mark of warding' ? 'https://5e.tools/feats.html#mark%20of%20warding_efa' : `https://5e.tools/feats.html#${encodeURIComponent(key)}_xphb`);

    const tk = `sp:${c.species}:${f.n}`, t = textFor(tk, f.h, c.species !== 'Human');

  }
  if (ty === 'weapon') {

  }

function spellDrawer(k, c){
  const sp = R.spells[k]; if (!sp) return;
  const entry = c ? spellList(c).find(s => s.k === k) : null;
  const d = c ? D(c) : null;
  const t = textFor('spell:' + k, sp.h + (sp.hl || ''), sp.own);
  let callout = '';
  if (c && d) {
    const bits = [];
    if (/saving throw/i.test(sp.h)) bits.push(`Your spell save DC: <b>${d.dc}</b>${d.innate ? ' (Innate Sorcery +1)' : ''}`);
    if (/spell attack|attack roll/i.test(sp.h)) bits.push(`Your spell attack: <b>${sgn(d.atk)}</b>${d.innate ? ' with Advantage (Innate Sorcery)' : ''}`);
    if (sp.l === 0 && /Cantrip Upgrade|level 5|levels 5/i.test((sp.hl || '') + sp.h)) bits.push(`Cantrip strength at level ${c.level}: <b>×${d.tier}</b> dice`);
    if (k === 'eldritch blast') bits.push(`Beams: <b>${d.tier}</b>${c.invTargets['Agonizing Blast'] === k ? `, each +${d.cm}` : ''}${c.invTargets['Eldritch Spear'] === k ? `, range ${120 + 30 * c.level} ft` : ''}${c.invTargets['Repelling Blast'] === k ? ', push 10 ft per hit' : ''}`);
    const mods = modifiersOf(c, k);
    if (mods.length) bits.push(`Modified by: ${mods.join(', ')}`);
    if (entry) bits.push(`Granted by: ${grantLink(c, entry)}${entry.always ? ', always prepared' : ''}`);
    if (bits.length) callout = `<div class="callout">${bits.join('<br>')}</div>`;
  }
  const meta = `<div class="meta"><div><span>Level</span>${sp.l ? ord(sp.l) + ' ' + sp.sc : sp.sc + ' cantrip'}</div><div><span>Casting time</span>${esc(sp.t)}${sp.rit ? ' or ' + lk('rule','ritual','Ritual') : ''}</div>
    <div><span>Range</span>${esc(sp.r)}</div><div><span>Duration</span>${sp.conc ? 'Concentration, ' + esc(sp.d.replace(/^Up to/,'up to')) : esc(sp.d)}</div>
    <div style="grid-column:1/-1"><span>Components</span>${esc(sp.c)}</div><div style="grid-column:1/-1"><span>Spell lists</span>${esc(sp.cls.join(', ') || 'None')}${sp.mark ? ', Mark of Warding' : ''}</div></div>`;
  const btns = [];
  if (c && entry) {
    if (sp.l > 0) {
      if (entry.src === 'arcanum') btns.push(`<button class="btn pri" data-cast="arc${entry.arc}">Cast (Arcanum)</button>`);
      else if (c.cls === 'Warlock' && entry.src !== 'mi') btns.push(`<button class="btn pri" data-cast="pact">Cast with Pact slot</button>`);

const d20 = () => 1 + Math.floor(Math.random() * 20);

// ---------- dice tray: for big batches of dice ----------
const tray = {pool:{4:0,6:0,8:0,10:0,12:0,20:0,100:0}, mod:0, mode:'sum', adv:'norm', label:'', last:null};
function trayExpr(){ const parts = Object.entries(tray.pool).filter(([,n]) => n).map(([f,n]) => `${n}d${f}`); return parts.join(' + ') + (tray.mod ? (tray.mod > 0 ? ' + ' : ' − ') + Math.abs(tray.mod) : ''); }
function rollTray(){
  const groups = Object.entries(tray.pool).filter(([,n]) => n);
  if (!groups.length) { toast('Add some dice first'); return; }
  const d20only = groups.length === 1 && groups[0][0] === '20';
  const one = f => 1 + Math.floor(Math.random() * f);
  const label = tray.label || trayExpr();
  if (tray.mode === 'each') {
    const out = [];
    groups.forEach(([f,n]) => { for (let i = 0; i < n; i++) {
      let v = one(+f), note = '';
      if (+f === 20 && tray.adv !== 'norm') { const b = one(20); note = `(${v},${b})`; v = tray.adv === 'adv' ? Math.max(v,b) : Math.min(v,b); }
      out.push({f, v, t: v + tray.mod, note});
    } });
    tray.last = {label, total: out.map(o => o.t).join(', '), detail: out.map(o => `d${o.f}${o.note} ${o.v}${tray.mod ? sgn(tray.mod) : ''}`).join(' · '), list: out};
    pushRoll({label: label + ' (each)', total: tray.last.total, detail: tray.last.detail, nat: d20only && out.length === 1 ? out[0].v : null}, true);
  } else {

    groups.forEach(([f,n]) => { const rs = Array.from({length:n}, () => one(+f)); sum += rs.reduce((a,b) => a+b, 0); det.push(`${n}d${f} [${rs.join(', ')}]`); });
    const total = sum + tray.mod;
    tray.last = {label, total, detail: det.join(' + ') + (tray.mod ? ` ${sgn(tray.mod)}` : '')};

async function shrink(file, max){
  const bmp = await createImageBitmap(file);
  const k = Math.min(1, max / Math.max(bmp.width, bmp.height));
  const cv = document.createElement('canvas'); cv.width = Math.round(bmp.width * k); cv.height = Math.round(bmp.height * k);
  cv.getContext('2d').drawImage(bmp, 0, 0, cv.width, cv.height);
  return await new Promise(r => cv.toBlob(r, 'image/jpeg', 0.85));
}
