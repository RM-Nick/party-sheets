<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Party Sheets</title>
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Party Sheets"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#111318">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%23191c22'/><path d='M32 8 54 20v24L32 56 10 44V20z' fill='none' stroke='%23e0a83a' stroke-width='4'/></svg>">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&family=IM+Fell+English+SC&display=swap">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}
/* Layout: one-column phone sheet. Sticky party bar on top, character hero, vitals strip, sticky tab bar at the bottom. */
:root{
  --bg:#e9ecf0; --surface:#ffffff; --surface2:#f2f4f7; --sunk:#dde1e7;
  --ink:#191c22; --muted:#5a616d; --line:#cdd2da;
  --good:#2b7a4b; --bad:#b0352d; --warn:#9a6400;
  --acc:#8f6411; --acc-ink:#ffffff; --acc-soft:#f3e8d2;
  --f-display:"IM Fell English SC", "Palatino Linotype", Palatino, Georgia, serif;
  --f-body:"Alegreya Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r:12px; --r-sm:8px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#111318; --surface:#1a1d24; --surface2:#20242c; --sunk:#0c0e12;
  --ink:#e7e9ee; --muted:#9aa1ad; --line:#333944;
  --good:#5cc28a; --bad:#ec6f63; --warn:#e2a64a;
  --acc:#e0a83a; --acc-ink:#1a1206; --acc-soft:#3a2f1a; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#111318; --surface:#1a1d24; --surface2:#20242c; --sunk:#0c0e12;
  --ink:#e7e9ee; --muted:#9aa1ad; --line:#333944;
  --good:#5cc28a; --bad:#ec6f63; --warn:#e2a64a;
  --acc:#e0a83a; --acc-ink:#1a1206; --acc-soft:#3a2f1a; color-scheme:dark }

body[data-c="mausfanger"]{ --acc:#b04e17; --acc-soft:#f6e1d3 }
body[data-c="mamuk"]{ --acc:#6a43b5; --acc-soft:#e8e0f6 }
body[data-c="mule"]{ --acc:#2c6b6f; --acc-soft:#d8ebec }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) body[data-c="mausfanger"]{ --acc:#f08a4b; --acc-ink:#1d0e04; --acc-soft:#3b2518 }
  :root:not([data-theme="light"]) body[data-c="mamuk"]{ --acc:#ac8ff0; --acc-ink:#140b26; --acc-soft:#2c2442 }
  :root:not([data-theme="light"]) body[data-c="mule"]{ --acc:#63b6bb; --acc-ink:#061a1b; --acc-soft:#183133 }}
:root[data-theme="dark"] body[data-c="mausfanger"]{ --acc:#f08a4b; --acc-ink:#1d0e04; --acc-soft:#3b2518 }
:root[data-theme="dark"] body[data-c="mamuk"]{ --acc:#ac8ff0; --acc-ink:#140b26; --acc-soft:#2c2442 }
:root[data-theme="dark"] body[data-c="mule"]{ --acc:#63b6bb; --acc-ink:#061a1b; --acc-soft:#183133 }

*{box-sizing:border-box}
html{ -webkit-text-size-adjust:100% }
body{ background:var(--bg); color:var(--ink); font-family:var(--f-body); font-size:16px; line-height:1.45; font-variant-numeric:tabular-nums; }
button,input,textarea,select{ font:inherit; color:inherit }
button{ cursor:pointer }
:focus-visible{ outline:2px solid var(--acc); outline-offset:2px }
a{ color:var(--acc) }
.wrap{ max-width:640px; margin:0 auto; padding-inline:16px; padding-block:0 96px }

/* party bar */
.party{ position:sticky; top:env(safe-area-inset-top,0px); z-index:20; background:var(--bg); padding-block:10px 8px; display:flex; gap:6px; align-items:center; overflow-x:auto; scrollbar-width:none; border-bottom:1px solid var(--line) }
.party::-webkit-scrollbar{ display:none }
.pc{ flex:0 0 auto; border:1px solid var(--line); background:var(--surface); border-radius:999px; padding:6px 12px; font-size:14px; white-space:nowrap }
.pc[aria-current="true"]{ background:var(--acc); color:var(--acc-ink); border-color:var(--acc) }
.sync{ display:inline-flex; font-size:12px; color:var(--muted); align-items:center; gap:5px; white-space:nowrap; margin-left:4px }
.sync i{ width:8px; height:8px; border-radius:50%; background:var(--muted); display:inline-block }
.sync[data-s="ok"] i{ background:var(--good) } .sync[data-s="busy"] i{ background:var(--warn) } .sync[data-s="local"] i{ background:var(--muted) }

/* hero */
.hero{ padding-block:18px 10px; display:grid; grid-template-columns:1fr auto; gap:4px 12px; align-items:end }
.hero h1{ font-family:var(--f-display); font-weight:400; font-size:clamp(30px,8vw,40px); line-height:1.05; margin:0; text-wrap:balance; letter-spacing:.01em }
.hero .sub{ grid-column:1/-1; color:var(--muted); font-size:15px }
.hero .sub b{ color:var(--ink); font-weight:600 }
.lvl{ display:flex; flex-direction:column; align-items:center; gap:4px }
.lvl .n{ font-family:var(--f-display); font-size:34px; line-height:1; color:var(--acc) }
.lvl small{ font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted) }
.btn{ border:1px solid var(--line); background:var(--surface); border-radius:var(--r-sm); padding:8px 12px; font-size:15px; min-height:40px }
.btn.pri{ background:var(--acc); color:var(--acc-ink); border-color:var(--acc); font-weight:600 }
.btn.ghost{ background:transparent }
.btn.sm{ min-height:32px; padding:4px 10px; font-size:14px }
.btn.danger{ color:var(--bad); border-color:var(--bad); background:transparent }
.btn:disabled{ opacity:.45; cursor:default }

/* vitals */
.vitals{ display:grid; grid-template-columns:1.6fr repeat(3,1fr); gap:8px; margin-block:6px 12px }
.vt{ background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:8px 6px; text-align:center; min-width:0 }
.vt .k{ font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted) }
.vt .v{ font-size:24px; font-weight:700; line-height:1.15 }
.vt .s{ font-size:12px; color:var(--muted) }
.hpbox{ text-align:left; padding:8px 10px; display:flex; flex-direction:column; gap:4px; cursor:pointer }
.hpbox .v{ font-size:clamp(22px,6.5vw,28px); white-space:nowrap } .hpbox .v small{ font-size:14px; color:var(--muted); font-weight:500 }
.bar{ height:6px; border-radius:3px; background:var(--sunk); overflow:hidden }
.bar i{ display:block; height:100%; background:var(--good) }
.bar.low i{ background:var(--warn) } .bar.crit i{ background:var(--bad) }
.mini{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:14px }
.mini .vt .v{ font-size:19px }

/* tabs */
.tabs{ position:fixed; left:0; right:0; bottom:0; z-index:30; background:var(--surface); border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom,0px) }
.tabs .in{ max-width:640px; margin:0 auto; display:grid; grid-template-columns:repeat(5,1fr) }
.tabs button{ border:0; background:none; padding:10px 2px 9px; font-size:13px; color:var(--muted); display:flex; flex-direction:column; align-items:center; gap:2px }
.tabs button svg{ width:22px; height:22px }
.tabs button[aria-current="true"]{ color:var(--acc); font-weight:700 }

/* sections */
h2.sec{ font-family:var(--f-display); font-weight:400; font-size:22px; margin:22px 0 8px; display:flex; align-items:baseline; gap:8px; flex-wrap:wrap }
h2.sec .aside{ font-family:var(--f-body); font-size:13px; color:var(--muted); margin-left:auto }
.card{ background:var(--surface); border:1px solid var(--line); border-radius:var(--r); }
.list > *{ border-bottom:1px solid var(--line) } .list > *:last-child{ border-bottom:0 }
.row{ display:flex; align-items:center; gap:10px; padding:11px 12px; min-width:0 }
.row .main{ flex:1; min-width:0 }
.row .t{ font-weight:600 }
.row .m{ font-size:13px; color:var(--muted) }
.row .r{ text-align:right; flex:0 0 auto }
.row.tap{ cursor:pointer; width:100%; background:none; border-left:0; border-right:0; border-top:0; text-align:left }
.row.tap:hover{ background:var(--surface2) }
.big{ font-size:20px; font-weight:700 }
.chip{ display:inline-block; font-size:11px; padding:1px 7px; border-radius:999px; border:1px solid var(--line); color:var(--muted); white-space:nowrap; vertical-align:1px }
.chip.acc{ border-color:var(--acc); color:var(--acc) }
.chip.fill{ background:var(--acc-soft); border-color:transparent; color:var(--ink) }
.warnbox{ border:1px solid var(--warn); background:color-mix(in srgb, var(--warn) 10%, var(--surface)); border-radius:var(--r); padding:10px 12px; font-size:14px; display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-block:8px }
.warnbox .main{ flex:1; min-width:180px }
.note{ font-size:13px; color:var(--muted) }

/* pips */
.pips{ display:flex; flex-wrap:wrap; gap:6px }
.pip{ width:26px; height:26px; border-radius:50%; border:2px solid var(--acc); background:var(--acc); padding:0 }
.pip[data-used="1"]{ background:transparent; border-color:var(--line) }
.res{ display:grid; grid-template-columns:1fr auto; gap:6px 10px; padding:11px 12px; align-items:center }
.res .main{ min-width:0 }
.counter{ display:flex; align-items:center; gap:6px }
.counter button{ width:34px; height:34px; border-radius:50%; border:1px solid var(--line); background:var(--surface2); font-size:18px; line-height:1 }
.counter b{ min-width:48px; text-align:center; font-size:18px }

/* abilities */
.abil{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px }
.ab{ background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:8px; text-align:center }
.ab .k{ font-size:12px; letter-spacing:.12em; color:var(--muted) }
.ab .mod{ font-size:26px; font-weight:700; line-height:1.1 }
.ab .sc{ font-size:13px; color:var(--muted) }
.ab .sv{ margin-top:4px; font-size:13px; border-top:1px dashed var(--line); padding-top:4px }
.ab .sv.p{ color:var(--acc); font-weight:700 }
.ab .sv .svb{ display:block; font-size:10.5px; font-weight:400; color:var(--muted) }
.ab input{ width:56px; text-align:center; border:1px solid var(--line); border-radius:6px; background:var(--surface2); padding:2px }
.dot{ width:10px; height:10px; border-radius:50%; border:1.5px solid var(--muted); display:inline-block; flex:0 0 auto }
.dot.p{ background:var(--acc); border-color:var(--acc) }
.dot.e{ background:var(--acc); border-color:var(--acc); box-shadow:0 0 0 2px var(--surface), 0 0 0 3.5px var(--acc) }

/* spells */
.filters{ display:flex; gap:6px; overflow-x:auto; padding-bottom:4px; scrollbar-width:none }
.filters::-webkit-scrollbar{ display:none }
.filters button{ flex:0 0 auto; border:1px solid var(--line); background:var(--surface); border-radius:999px; padding:5px 12px; font-size:14px }
.filters button[aria-pressed="true"]{ background:var(--ink); color:var(--bg); border-color:var(--ink) }
.lv{ width:30px; height:30px; border-radius:8px; background:var(--acc-soft); display:grid; place-items:center; font-weight:700; font-size:14px; flex:0 0 auto }
.lv.c{ background:var(--surface2); color:var(--muted); font-size:12px }
.off{ opacity:.55 }
.spellhead{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:10px }
.slotrow{ display:flex; align-items:center; gap:10px; padding:9px 12px }
.slotrow .lbl{ width:64px; font-size:14px; color:var(--muted); flex:0 0 auto }

/* text from rules */
.rt p{ margin:0 0 .6em } .rt ul{ margin:0 0 .6em; padding-left:1.2em } .rt li{ margin-bottom:.25em }
.rt .tw{ overflow-x:auto; margin-bottom:.6em } .rt table{ border-collapse:collapse; font-size:14px; min-width:100% }
.rt th,.rt td{ border-bottom:1px solid var(--line); padding:4px 6px; text-align:left; vertical-align:top }
.rt caption{ text-align:left; font-weight:700; padding:4px 0 }
.rt a.sp{ color:var(--acc); text-decoration:underline; text-decoration-style:dotted; cursor:pointer }
details.feat{ border-bottom:1px solid var(--line) } details.feat:last-child{ border-bottom:0 }
details.feat summary{ list-style:none; display:flex; align-items:center; gap:10px; padding:11px 12px; cursor:pointer }
details.feat summary::-webkit-details-marker{ display:none }
details.feat summary .main{ flex:1; min-width:0 }
details.feat summary::after{ content:""; width:8px; height:8px; border-right:2px solid var(--muted); border-bottom:2px solid var(--muted); transform:rotate(45deg); margin-right:4px; transition:transform .15s }
details.feat[open] summary::after{ transform:rotate(225deg) }
details.feat .body{ padding:0 12px 12px; font-size:15px }
.own{ font-size:12px; color:var(--muted); border-left:3px solid var(--acc); padding-left:8px; margin-top:6px }

/* sheet (bottom drawer) */
.scrim{ position:fixed; inset:0; background:rgb(0 0 0 / .45); z-index:50; display:flex; align-items:flex-end; justify-content:center }
.drawer{ background:var(--surface); width:100%; max-width:640px; max-height:88vh; border-radius:16px 16px 0 0; display:flex; flex-direction:column; padding-bottom:env(safe-area-inset-bottom,0px) }
.drawer .hd{ padding:14px 16px 10px; border-bottom:1px solid var(--line); display:flex; gap:10px; align-items:flex-start }
.drawer .hd h3{ margin:0; font-family:var(--f-display); font-weight:400; font-size:26px; line-height:1.1; flex:1; min-width:0; text-wrap:balance }
.drawer .bd{ padding:12px 16px 16px; overflow-y:auto; min-height:0 }
.drawer .ft{ padding:10px 16px 14px; border-top:1px solid var(--line); display:flex; gap:8px; flex-wrap:wrap }
.drawer .ft .btn{ flex:1 1 auto }
.x{ border:0; background:var(--surface2); width:34px; height:34px; border-radius:50%; font-size:20px; line-height:1; flex:0 0 auto }
.meta{ display:grid; grid-template-columns:1fr 1fr; gap:6px 12px; font-size:14px; margin-bottom:12px }
.meta div span{ display:block; font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted) }
.callout{ background:var(--acc-soft); border-radius:var(--r-sm); padding:8px 10px; font-size:14px; margin-bottom:10px }
.search{ width:100%; border:1px solid var(--line); background:var(--surface2); border-radius:var(--r-sm); padding:9px 12px; margin-bottom:8px }
.pick{ display:flex; gap:10px; align-items:flex-start; padding:10px 4px; border-bottom:1px solid var(--line) }
.pick input{ width:22px; height:22px; margin-top:2px; accent-color:var(--acc); flex:0 0 auto }
.pick .main{ flex:1; min-width:0 }
.pick .info{ border:1px solid var(--line); background:none; border-radius:50%; width:28px; height:28px; font-size:14px; flex:0 0 auto }
.steps{ display:flex; gap:4px; margin-bottom:12px }
.steps i{ flex:1; height:4px; border-radius:2px; background:var(--sunk) }
.steps i.on{ background:var(--acc) }
.field{ display:flex; flex-direction:column; gap:4px; margin-bottom:10px }
.field label{ font-size:13px; color:var(--muted) }
.field input,.field textarea,.field select{ border:1px solid var(--line); background:var(--surface2); border-radius:var(--r-sm); padding:8px 10px; width:100% }
textarea{ min-height:110px; resize:vertical; line-height:1.4 }
.coins{ display:grid; grid-template-columns:repeat(5,1fr); gap:6px }
.coins.six{ grid-template-columns:repeat(6,1fr) }
.coins .field input{ text-align:center; padding:8px 2px }
.seg{ display:flex; border:1px solid var(--line); border-radius:var(--r-sm); overflow:hidden }
.seg button{ flex:1; border:0; background:var(--surface); padding:8px; font-size:14px; border-right:1px solid var(--line) }
.seg button:last-child{ border-right:0 }
.seg button[aria-pressed="true"]{ background:var(--acc); color:var(--acc-ink); font-weight:700 }
.hpctl{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin-top:10px }
.numin{ font-size:28px; text-align:center; width:100%; border:1px solid var(--line); border-radius:var(--r-sm); background:var(--surface2); padding:8px }
.toast{ position:fixed; left:50%; transform:translateX(-50%); bottom:calc(76px + env(safe-area-inset-bottom,0px)); background:var(--ink); color:var(--bg); padding:8px 14px; border-radius:999px; font-size:14px; z-index:60; max-width:90vw }
.grid2{ display:grid; grid-template-columns:1fr 1fr; gap:8px }
.dsave{ display:flex; gap:14px; flex-wrap:wrap; align-items:center }
.dsave .pips .pip{ width:22px; height:22px }
.dsave .f .pip{ border-color:var(--bad); background:var(--bad) }
.dsave .s .pip{ border-color:var(--good); background:var(--good) }
.dsave .pip[data-used="1"]{ background:transparent !important; border-color:var(--line) !important }
.foot{ font-size:12px; color:var(--muted); margin-top:28px; line-height:1.5 }
@media (max-width:380px){ .vitals{ grid-template-columns:1.4fr repeat(3,1fr); gap:6px } .vt .v{ font-size:21px } }
@media (prefers-reduced-motion: reduce){ *{ transition:none !important } }

/* v2: links, status, rolls, party */
a.lk{ color:var(--acc); text-decoration:underline; text-decoration-style:dotted; text-underline-offset:2px; cursor:pointer }
a.lk:hover{ text-decoration-style:solid }
.herobtns{ grid-column:1/-1; display:flex; gap:8px; margin-top:8px; flex-wrap:wrap }
.btnrow{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:8px }
.stats{ display:flex; flex-wrap:wrap; gap:6px; margin:-4px 0 12px }
.stat{ display:inline-flex; align-items:center; gap:6px; font-size:14px; background:var(--surface); border:1px solid var(--line); border-radius:999px; padding:4px 6px 4px 12px }
.stat.conc{ border-color:var(--acc); background:var(--acc-soft) }
.xs{ border:1px solid var(--line); background:var(--surface2); border-radius:999px; min-width:26px; height:26px; padding:0 8px; font-size:13px }
.rollstrip{ display:flex; align-items:center; gap:12px; background:var(--surface); border:1px solid var(--acc); border-radius:var(--r); padding:8px 12px; margin:6px 0 4px; cursor:pointer }
.rollstrip .main{ flex:1; min-width:0; overflow-wrap:anywhere }
.rv{ font-size:26px; font-weight:700; min-width:48px; text-align:center; color:var(--acc); flex:0 0 auto }
.rv.sm{ font-size:20px; min-width:40px }
.rv.n20{ color:var(--good) } .rv.n1{ color:var(--bad) }
.x.back{ font-size:24px }
.members{ display:grid; grid-template-columns:1fr; gap:8px }
.member{ text-align:left; background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:10px 12px; display:flex; flex-direction:column; gap:4px; width:100% }
.member .mn{ font-family:var(--f-display); font-size:22px; line-height:1.1 }
.member .mstats{ display:flex; gap:14px; flex-wrap:wrap; font-size:14px; color:var(--muted) }
.member .mstats b{ color:var(--ink) }
.warnc{ color:var(--warn) }
.member[data-mc="amber"] .mn{ color:#8f6411 } .member[data-mc="mausfanger"] .mn{ color:#b04e17 } .member[data-mc="mamuk"] .mn{ color:#6a43b5 }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .member[data-mc="amber"] .mn{ color:#e0a83a } :root:not([data-theme="light"]) .member[data-mc="mausfanger"] .mn{ color:#f08a4b } :root:not([data-theme="light"]) .member[data-mc="mamuk"] .mn{ color:#ac8ff0 } }
:root[data-theme="dark"] .member[data-mc="amber"] .mn{ color:#e0a83a } :root[data-theme="dark"] .member[data-mc="mausfanger"] .mn{ color:#f08a4b } :root[data-theme="dark"] .member[data-mc="mamuk"] .mn{ color:#ac8ff0 }
.addrow{ display:flex; gap:8px; margin-bottom:8px }
.addrow input{ flex:1; min-width:0; border:1px solid var(--line); background:var(--surface); border-radius:var(--r-sm); padding:8px 10px }
.chk{ width:22px; height:22px; accent-color:var(--acc); flex:0 0 auto }
.tapt{ border:0; background:none; text-align:left; padding:0; cursor:pointer }
.done{ text-decoration:line-through; color:var(--muted) }
.pre{ white-space:pre-wrap; overflow-wrap:anywhere }
.info{ cursor:pointer }
.mod[role="button"], .sv[role="button"]{ cursor:pointer }

/* v3: portraits, dice tray, login */
.who{ display:flex; align-items:center; gap:12px; min-width:0 }
.avatar{ flex:0 0 auto; border-radius:50%; border:2px solid var(--acc); background:var(--acc-soft); padding:0; overflow:hidden; display:grid; place-items:center; color:var(--acc); font-family:var(--f-display) }
.avatar.lg{ width:56px; height:56px; font-size:28px }
.avatar.sm{ width:40px; height:40px; font-size:20px }
.avatar img{ width:100%; height:100%; object-fit:cover; display:block }
.mrow{ display:flex; align-items:center; gap:10px }
.bigportrait{ width:100%; max-height:60vh; object-fit:contain; border-radius:var(--r); margin-bottom:10px; background:var(--sunk) }
.dicechip{ border-style:dashed }
.dicegrid{ display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:8px }
.die{ display:flex; flex-direction:column; align-items:center; gap:4px }
.dbtn{ width:100%; min-height:52px; border-radius:12px; border:1px solid var(--line); background:var(--surface2); font-size:18px; font-weight:700 }
.dbtn:active{ background:var(--acc-soft) }
.dn{ font-size:14px; color:var(--acc); font-weight:700; min-height:18px }
.login{ max-width:380px; margin:12vh auto 0; display:flex; flex-direction:column; gap:6px }
.login h1{ font-family:var(--f-display); font-weight:400; font-size:40px; margin:0 }
.member[data-mc] .avatar{ border-width:2px }

.installbar{ display:flex; align-items:center; gap:8px; background:var(--acc-soft); border:1px solid var(--acc); border-radius:var(--r); padding:8px 8px 8px 12px; margin-top:10px; font-size:14px }
.installbar .main{ flex:1; min-width:0 }

/* Innate Sorcery, Font of Magic */
.vt.boost{ border-color:var(--acc); background:var(--acc-soft) }
.vt.boost .v{ color:var(--acc) }
.innatebar{ display:flex; align-items:center; gap:10px; background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:8px 12px; margin:-2px 0 10px; font-size:14px }
.innatebar .main{ flex:1; min-width:0 }
.innatebar.on{ border-color:var(--acc); background:var(--acc-soft) }
.pip.x{ background:var(--acc-soft); border-style:dashed }
.fontsp{ display:flex; align-items:baseline; gap:10px; margin-bottom:6px }
.fontsp .big{ font-size:40px; font-weight:700; color:var(--acc); line-height:1 }
.drawer h4{ margin:14px 0 6px; font-size:15px }
.drawer h4 .m{ font-weight:400; font-size:13px; color:var(--muted) }
.fontgrid{ display:grid; gap:6px }
.fontgrid .btn{ display:flex; justify-content:space-between; align-items:center; text-align:left }
.fontgrid .btn .m{ font-size:13px; opacity:.85 }
.stat.act{ border-color:var(--good) }
.stat .m{ font-size:12px; color:var(--muted) }
.chips{ display:flex; flex-wrap:wrap; gap:6px }
.chips .chip{ font-size:13px; padding:5px 10px; background:var(--surface); cursor:pointer }
.chip.on{ background:var(--acc); color:var(--acc-ink); border-color:var(--acc) }
.chip.ally{ border-color:var(--good); color:var(--good) }

/* whose turn */
.turnbar{ display:flex; align-items:center; gap:10px; background:var(--surface); border:1px solid var(--line); border-left:5px solid var(--muted); border-radius:var(--r); padding:8px 12px; margin:6px 0 8px; cursor:pointer; font-size:15px }
.turnbar .main{ flex:1; min-width:0 }
.turnbar .rnd{ font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); white-space:nowrap }
.turnbar .m{ font-size:13px; color:var(--muted); white-space:nowrap }
.turnbar.mine{ border-color:var(--acc); border-left-color:var(--acc); background:var(--acc-soft) }
.turnbar.next{ border-left-color:var(--warn) }
.pc .live{ display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--bad); vertical-align:1px; margin-left:3px }

/* DM overview cards */
[data-mc="amber"]{ --pcc:#8f6411 } [data-mc="mausfanger"]{ --pcc:#b04e17 } [data-mc="mamuk"]{ --pcc:#6a43b5 }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) [data-mc="amber"]{ --pcc:#e0a83a } :root:not([data-theme="light"]) [data-mc="mausfanger"]{ --pcc:#f08a4b } :root:not([data-theme="light"]) [data-mc="mamuk"]{ --pcc:#ac8ff0 } }
:root[data-theme="dark"] [data-mc="amber"]{ --pcc:#e0a83a } :root[data-theme="dark"] [data-mc="mausfanger"]{ --pcc:#f08a4b } :root[data-theme="dark"] [data-mc="mamuk"]{ --pcc:#ac8ff0 }
.member{ gap:8px; border-top:4px solid var(--pcc, var(--line)) }
.member .mhead{ display:flex; align-items:center; gap:10px; background:none; border:0; padding:0; text-align:left; width:100% }
.member .mhead .main{ flex:1; min-width:0; display:flex; flex-direction:column }
.member .mhead .m{ font-size:13px; color:var(--muted) }
.member .mn{ color:var(--pcc) !important }
.member .insp{ color:var(--warn); font-size:20px }
.member .avatar{ border-color:var(--pcc) }
.mhp{ display:flex; flex-direction:column; gap:4px; font-size:15px }
.mhp .m{ font-size:13px; color:var(--muted) }
.mgrid{ display:grid; grid-template-columns:repeat(4,1fr); gap:6px }
.mgrid > div{ background:var(--surface2); border-radius:var(--r-sm); padding:5px 4px; text-align:center; display:flex; flex-direction:column; min-width:0 }
.mgrid span{ font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); line-height:1.2 }
.mgrid b{ font-size:19px; line-height:1.2 }
.mgrid b.sm{ font-size:14px; padding-top:3px }
.mgrid b small{ font-size:11px; font-weight:400; color:var(--muted); margin-left:2px }
.mgrid .boost{ background:var(--acc-soft); outline:1px solid var(--acc) }
.ml{ display:grid; grid-template-columns:104px 1fr; gap:8px; font-size:14px; border-top:1px solid var(--line); padding-top:6px }
.ml .mk{ color:var(--muted); font-size:11px; letter-spacing:.02em; overflow-wrap:anywhere; text-transform:uppercase; padding-top:2px }
.ml .mv .m{ color:var(--muted); font-size:13px }
@media (min-width:760px){ .wrap{ max-width:720px } }

/* initiative tracker */
.ictl{ display:grid; grid-template-columns:1fr 2fr; gap:8px; margin:4px 0 8px }
.btn.big{ min-height:52px; font-size:18px }
.ilist{ display:flex; flex-direction:column; gap:6px; margin-bottom:6px }
.irow{ display:grid; grid-template-columns:64px 1fr auto; align-items:center; gap:10px; background:var(--surface); border:1px solid var(--line); border-left:6px solid var(--muted); border-radius:var(--r); padding:6px 10px 6px 8px; min-height:58px }
.irow[data-k="enemy"]{ border-left-color:var(--bad); background:color-mix(in srgb, var(--bad) 6%, var(--surface)) }
.irow[data-k="ally"]{ border-left-color:var(--good); background:color-mix(in srgb, var(--good) 9%, var(--surface)) }
.irow[data-k="ally"] .t{ color:var(--good) }
.irow[data-k="pc"] .t{ color:var(--pcc) }
.irow[data-cur="true"]{ outline:2px solid var(--ink); outline-offset:1px }
.irow[data-down="true"]{ opacity:.5; background:var(--surface2) }
.irow[data-down="true"] .t{ text-decoration:line-through }
.irow .main{ background:none; border:0; padding:4px 0; text-align:left; min-width:0; display:flex; flex-direction:column }
.irow .t{ font-weight:700; font-size:16px }
.irow .m{ font-size:13px; color:var(--muted); overflow-wrap:anywhere }
.irow .now{ color:var(--ink) }
.ival{ font-size:26px; font-weight:700; background:var(--surface2); border:1px solid var(--line); border-radius:var(--r-sm); height:46px; width:100% }
.iset{ display:flex; flex-direction:column; gap:3px; align-items:stretch }
.ini{ width:100%; border:1px solid var(--line); border-radius:var(--r-sm); background:var(--surface2); text-align:center; font-size:18px; padding:3px 2px }
.iset .xs{ height:22px; font-size:12px }
.ihp{ background:var(--surface2); border:1px solid var(--line); border-radius:var(--r-sm); padding:4px 8px; min-height:40px; min-width:56px }
.ihp b{ font-size:17px } .ihp small{ color:var(--muted) }
.iadd{ padding:10px 12px }
.allytick .main{ font-weight:600; color:var(--good) }
.allytick .main .m{ font-weight:400; color:var(--muted); font-size:13px }
.qgrid{ display:grid; grid-template-columns:repeat(7,1fr); gap:6px }
.qgrid .btn{ padding:6px 0; min-height:42px; font-weight:600 }
.standby{ margin-top:14px }
.standby summary{ cursor:pointer; color:var(--muted); padding:8px 2px; font-size:15px }
.standby .row{ opacity:.75 }
.drawer .ft .btn .m{ font-size:12px; opacity:.85; font-weight:400 }
</style></head><body>

<script>window.RULES={"spells":{"acid splash":{"n":"Acid Splash","l":0,"sc":"Evocation","t":"Action","r":"60 ft","c":"V, S","d":"Instantaneous","conc":false,"rit":false,"cls":["Sorcerer","Wizard"],"src":"XPHB","u":"https://5e.tools/spells.html#acid%20splash_xphb","srd":true,"h":"<p>You create an acidic bubble at a point within range, where it explodes in a 5-foot-radius <a class=\"lk\" data-l=\"rule|sphere [area of effect]\">Sphere<\/a>. Each creature in that <a class=\"lk\" data-l=\"rule|sphere [area of effect]\">Sphere<\/a> must succeed on a Dexterity saving throw or take 1d6 Acid damage.<\/p>","hl":"<p><b><i>Cantrip Upgrade.<\/i><\/b> The damage increases by 1d6 when you reach levels 5 (2d6), 11 (3d6), and 17 (4d6).<\/p>"},"aid":{"n":"Aid","l":2,"sc":"Abjuration","t":"Action","r":"30 ft","c":"V, S, M (a strip of white cloth)","d":"8 hours","conc":false,"rit":false,"cls":["Bard","Cleric","Druid","Paladin","Ranger"],"src":"XPHB","u":"https://5e.tools/spells.html#aid_xphb","srd":true,"h":"<p>Choose up to three creatures within range. Each target's <a class=\"lk\" data-l=\"rule|hit points\">Hit Point<\/a> maximum and current <a class=\"lk\" data-l=\"rule|hit points\">Hit Points<\/a> increase by 5 for the duration.<\/p>","hl":"<p><b><i>Using a Higher-Level Spell Slot.<\/i><\/b> Each target's <a class=\"lk\" data-l=\"rule|hit points\">Hit Points<\/a> increase by 5 for each spell slot level above 2.<\/p>"},"alarm":{"n":"Alarm","l":1,"sc":"Abjuration","t":"1 minute","r":"30 ft","c":"V, S, M (a bell and silver wire)","d":"8 hours","conc":false,"rit":true,"cls":["Ranger","Wizard"],"src":"XPHB","u":"https://5e.tools/spells.html#alarm_xphb","srd":true,"h":"<p>You set an alarm against intrusion. Choose a door, a window, or an area within range that is no larger than a 20-foot <a class=\"lk\" data-l=\"rule|cube [area of effect]\">Cube<\/a>. Until the spell ends, an alarm alerts you whenever a creature touches or enters the warded area. When you cast the spell, you can designate creatures that won't set off the alarm. You also choose whether the alarm is audible or mental:<\/p><ul><li><b>Audible Alarm<\/b> The alarm produces the sound of a handbell for 10 seconds within 60 feet of the warded area.<\/li><li><b>Mental Alarm<\/b> You are alerted by a mental ping if you are within 1 mile of the warded area. This ping awakens you if you're asleep.<\/li><\/ul>","mark":true},"alter self":{"n":"Alter Self","l":2,"sc":"Transmutation","t":"Action","r":"Self","c":"V, S","d":"Up to 1 hour","conc":true,"rit":false,"cls":["Sorcerer","Wizard"],"src":"XPHB","u":"https://5e.tools/spells.html#alter%20self_xphb","srd":true,"h":"<p>You alter your physical form. Choose one of the following options. Its effects last for the duration, during which you can take a <a class=\"lk\" data-l=\"act|magic\">Magic<\/a> action to replace the option you chose with a different one.<\/p><p><b><i>Aquatic Adaptation.<\/i><\/b> You sprout gills and grow webs between your fingers. You can breathe underwater and gain a <a class=\"lk\" data-l=\"rule|swim speed\">Swim Speed<\/a> equal to your <a class=\"lk\" data-l=\"rule|speed\">Speed<\/a>.<\/p><p><b><i>Change Appearance.<\/i><\/b> You alter your appearance. You decide what you look like, including your height, weight, facial features, sound of your voice, hair length, coloration, and other distinguishing characteristics. You can make yourself appear as a member of another species, though none of your statistics change. You can't appear as a creature of a different size, and your basic shape stays the same; if you're bipedal, you can't use this spell to become quadrupedal, for instance. For the duration, you can take a <a class=\"lk\" data-l=\"act|magic\">Magic<\/a> action to change your appearance in this way again.<\/p><p><b><i>Natural Weapons.<\/i><\/b> You grow claws (Slashing), fangs (Piercing), horns (Piercing), or hooves (Bludgeoning). When you use your <a class=\"lk\" data-l=\"rule|unarmed strike\">Unarmed Strike<\/a> to deal damage with that new growth, it deals 1d6 damage of the type in parentheses instead of dealing the normal damage for your <a class=\"lk\" data-l=\"rule|unarmed strike\">Unarmed Strike<\/a>, and you use your spellcasting ability modifier for the attack and damage rolls rather than using Strength.<\/p>"},"animate objects":{"n":"Animate Objects","l":5,"sc":"Transmutation","t":"Action","r":"120 ft","c":"V, S","d":"Up to 1 minute","conc":true,"rit":false,"cls":["Bard","Sorcerer","Wizard"],"src":"XPHB","u":"https://5e.tools/spells.html#animate%20objects_xphb","srd":true,"h":"<p>Objects animate at your command. Choose a number of nonmagical objects within range that aren't being worn or carried, aren't fixed to a surface, and aren't Gargantuan. The maximum number of objects is equal to your spellcasting ability modifier; for this number, a Medium or smaller target counts as one object, a Large target counts as two, and a Huge target counts as three.<\/p><p>Each target animates, sprouts legs, and becomes a Construct that uses the Animated Object stat block; this creature is under your control until the spell ends or until it is reduced to 0 <a class=\"lk\" data-l=\"rule|hit points\">Hit Points<\/a>. Each creature you make with this spell is an ally to you and your allies. In combat, it shares your <a class=\"lk\" data-l=\"rule|initiative\">Initiative<\/a> count and takes its turn immediately after yours.<\/p><p>Until the spell ends, you can take a <a class=\"lk\" data-l=\"rule|bonus action\">Bonus Action<\/a> to mentally command any creature you made with this spell if the creature is within 500 feet of you (if you control multiple creatures, you can command any of them at the same time, issuing the same command to each one). If you issue no commands, the creature takes the <a class=\"lk\" data-l=\"act|dodge\">Dodge<\/a> action and moves only to avoid harm. When the creature drops to 0 <a class=\"lk\" data-l=\"rule|hit points\">Hit Points<\/a>, it reverts to its object form, and any remaining damage carries over to that form.<\/p>","hl":"<p><b><i>Using a Higher-Level Spell Slot.<\/i><\/b> The creature's Slam damage increases by 1d4 (Medium or smaller), 1d6 (Large), or 1d12 (Huge) for each spell slot level above 5.<\/p>"},"antilife shell":{"n":"Antilife Shell","l":5,"sc":"Abjuration","t":"Action","r":"Self (10-ft Emanation)","c":"V, S","d":"Up to 1 hour","conc":true,"rit":false,"cls":["Druid"],"src":"XPHB","u":"https://5e.tools/spells.html#antilife%20shell_xphb","srd":true,"h":"<p>An aura extends from you in a 10-foot <a class=\"lk\" data-l=\"rule|emanation [area of effect]\">Emanation<\/a> for the duration. The aura prevents creatures other than Constructs and Undead from passing or reaching through it. An affected creature can cast spells or make attacks with Ranged or Reach weapons through the barrier.<\/p><p>If you move so that an affected creature is forced to pass through the barrier, the spell ends.<\/p>","mark":true},"arcane gate":{"n":"Arcane Gate","l":6,"sc":"Conjuration","t":"Action","r":"500 ft","c":"V, S","d":"Up to 10 minutes","conc":true,"rit":false,"cls":["Sorcerer","Warlock","Wizard"],"src":"XPHB","u":"https://5e.tools/spells.html#arcane%20gate_xphb","srd":false,"h":"<p>Open two linked, Large, sight-blocking portals: one at a point in range and one within 10 ft of you. Anything that goes in the open side of one comes out of the other as if they were next to each other. <a class=\"lk\" data-l=\"rule|bonus action\">Bonus Action<\/a>: swap which side of each portal is open.<\/p>","own":true},"arcane lock":{"n":"Arcane Lock","l":2,"sc":"Abjuration","t":"Action","r":"Touch","c":"V, S, M (gold dust worth 25+ GP, which the spell consumes)","d":"Until dispelled","conc":false,"rit":false,"cls":["Wizard"],"src":"XPHB","u":"https://5e.tools/spells.html#arcane%20lock_xphb","srd":true,"h":"<p>You touch a closed door, window, gate, container, or hatch and magically lock it for the duration. This lock can't be unlocked by any nonmagical means. You and any creatures you designate when you cast the spell can open and close the object despite the lock. You can also set a password that, when spoken within 5 feet of the object, unlocks it for 1 minute.<\/p>","mark":true},"arcane vigor":{"n":"Arcane Vigor","l":2,"sc":"Abjuration","t":"Bonus Action","r":"Self","c":"V, S","d":"Instantaneous","conc":false,"rit":false,"cls":["Sorcerer","Wizard"],"src":"XPHB","u":"https://5e.tools/spells.html#arcane%20vigor_xphb","srd":false,"h":"<p>Heal yourself by spending one or two of your unspent <a class=\"lk\" data-l=\"rule|hit point dice\">Hit Point Dice<\/a>: roll them and regain that total plus your spellcasting modifier.<\/p>","hl":"<p>Each slot level above 2 lets you roll one more Hit Point Die.<\/p>","own":true},"armor of agathys":{"n":"Armor of Agathys","l":1,"sc":"Abjuration","t":"Bonus Action","r":"Self","c":"V, S, M (a shard of blue glass)","d":"1 hour","conc":false,"rit":false,"cls":["Warlock"],"src":"XPHB","u":"https://5e.tools/spells.html#armor%20of%20agathys_xphb","srd":false,"h":"<p>You gain 5 <a class=\"lk\" data-l=\"rule|temporary hit points\">Temporary Hit Points<\/a>. While any remain, a creature that hits you with a melee attack takes 5 Cold damage. The spell ends when the temporary HP run out.<\/p>","hl":"<p>+5 <a class=\"lk\" data-l=\"rule|temporary hit points\">Temporary Hit Points<\/a> and +5 Cold damage per slot level above 1.<\/p>","own":true,"mark":true},"arms of hadar":{"n":"Arms of Hadar","l":1,"sc":"Conjuration","t":"Action","r":"Self (10-ft Emanation)","c":"V, S","d":"Instantaneous","conc":false,"rit":false,"cls":["Warlock"],"src":"XPHB","u":"https://5e.tools/spells.html#arms%20of%20hadar_xphb","srd":false,"h":"<p>Every creature within 10 ft of you makes a Strength save. Fail: 2d6 Necrotic damage and it can&#x27;t take Reactions until the start of its next turn. Success: half damage only.<\/p>","hl":"<p>+1d6 damage per slot level above 1.<\/p>","own":true},"astral projection":{"n":"Astral Projection","l":9,"sc":"Necromancy","t":"1 hour","r":"10 ft","c":"V, S, M (for each of the spell's targets, one jacinth worth 1,000+ GP and one silver bar worth 100+ GP, all of which the spell consumes)","d":"Until dispelled","conc":false,"rit":false,"cls":["Cleric","Warlock","Wizard"],"src":"XPHB","u":"https://5e.tools/spells.html#astral%20projection_xphb","srd":true,"h":"<p>You and up to eight willing creatures within range project your astral bodies into the Astral Plane (the spell ends instantly if you are already on that plane). Each target's body is left behind in a state of suspended animation; it has the <a class=\"lk\" data-l=\"cond|unconscious\">Unconscious<\/a> condition, doesn't need food or air, and doesn't age.<\/p><p>A target's astral form resembles its body in almost every way, replicating its game statistics and possessions. The principal difference is the addition of a silvery cord that trails from between the shoulder blades of the astral form. The cord fades from view after 1 foot. If the cord is cut—which happens only when an effect states that it does so—the target's body and astral form both die.<\/p><p>A target's astral form can travel through the Astral Plane. The moment an astral form leaves that plane, the target's body and possessions travel along the silver cord, causing the target to re-enter its body on the new plane.<\/p><p>Any damage or other effects that apply to an astral form have no effect on the target's body and vice versa. If a target's body or astral form drops to 0 <a class=\"lk\" data-l=\"rule|hit points\">Hit Points<\/a>, the spell ends for that target. The spell ends for all the targets if you take a <a class=\"lk\" data-l=\"act|magic\">Magic<\/a> action to dismiss it.<\/p><p>When the spell ends for a target who isn't dead, the target reappears in its body and exits the state of suspended animation.<\/p>"},"bane":{"n":"Bane","l":1,"sc":"Enchantment","t":"Action","r":"30 ft","c":"V, S, M (a drop of blood)","d":"Up to 1 minute","conc":true,"rit":false,"cls":["Bard","Cleric","Warlock"],"src":"XPHB","u":"https://5e.tools/spells.html#bane_xphb","srd":true,"h":"<p>Up to three creatures of your choice that you can see within range must each make a Charisma saving throw. Whenever a target that fails this save makes an attack roll or a saving throw before the spell ends, the target must subtract 1d4 from the attack roll or save.<\/p>","hl":"<p><b><i>Using a Higher-Level Spell Slot.<\/i><\/b> You can target one additional creature for each spell slot level above 1.<\/p>"},"banishment":{"n":"Banishment","l":4,"sc":"Abjuration","t":"Action","r":"30 ft","c":"V, S, M (a pentacle)","d":"Up to 1 minute","conc":true,"rit":false,"cls":["Cleric","Paladin","Sorcerer","Warlock","Wizard"],"src":"XPHB","u":"https://5e.tools/spells.html#banishment_xphb","srd":true,"h":"<p>One creature that you can see within range must succeed on a Charisma saving throw or be transported to a harmless demiplane for the duration. While there, the target has the <a class=\"lk\" data-l=\"cond|incapacitated\">Incapacitated<\/a> condition. When the spell ends, the target reappears in the space it left or in the nearest unoccupied space if that space is occupied.<\/p><p>If the target is an Aberration, a Celestial, an Elemental, a Fey, or a Fiend, the target doesn't return if the spell lasts for 1 minute. The target is instead transported to a random location on a plane (DM's choice) associated with its creature type.<\/p>","hl":"<p><b><i>Using a Higher-Level Spell Slot.<\/i><\/b> You can target one additional creature for each spell slot level above 4.<\/p>"},"befuddlement":{"n":"Befuddlement","l":8,"sc":"Enchantment","t":"Action","r":"150 ft","c":"V, S, M (a key ring with no keys)","d":"Instantaneous","conc":false,"rit":false,"cls":["Bard","Druid","Warlock","Wizard"],"src":"XPHB","u":"https://5e.tools/spells.html#befuddlement_xphb","srd":true,"h":"<p>You blast the mind of a creature that you can see within range. The target makes an Intelligence saving throw.<\/p><p>On a failed save, the target takes 10d12 Psychic damage and can't cast spells or take the <a class=\"lk\" data-l=\"act|magic\">Magic<\/a> action. At the end of every 30 days, the target repeats the save, ending the effect on a success. The effect can also be ended by the <a class=\"lk\" data-l=\"spell|greater restoration\">Greater Restoration<\/a>, <a href=\"https://5e.tools/spells.html#heal_xphb\" target=\"_blank\" rel=\"noopener\">Heal<\/a>, or <a class=\"lk\" data-l=\"spell|wish\">Wish<\/a> spell.<\/p><p>On a successful save, the target takes half as much damage only.<\/p>"},"bigby's hand":{"n":"Bigby's Hand","l":5,"sc":"Evocation","t":"Action","r":"120 ft","c":"V, S, M (an eggshell and a glove)","d":"Up to 1 minute","conc":true,"rit":false,"cls":["Sorcerer","Wizard"],"src":"XPHB","u":"https://5e.tools/spells.html#bigby%27s%20hand_xphb","srd":true,"h":"<p>You create a Large hand of shimmering magical energy in an unoccupied space that you can see within range. The hand lasts for the duration, and it moves at your command, mimicking the movements of your own hand.<\/p><p>The hand is an object that has AC 20 and <a class=\"lk\" data-l=\"rule|hit points\">Hit Points<\/a> equal to your <a class=\"lk\" data-l=\"rule|hit points\">Hit Point<\/a> maximum. If it drops to 0 <a class=\"lk\" data-l=\"rule|hit points\">Hit Points<\/a>, the spell ends. The hand doesn't occupy its space.<\/p><p>When you cast the spell and as a <a class=\"lk\" data-l=\"rule|bonus action\">Bonus Action<\/a> on your later turns, you can move the hand up to 60 feet and then cause one of the following effects:<\/p><ul><li><b>Clenched Fist<\/b> The hand strikes a target within 5 feet of it. Make a melee spell attack. On a hit, the target takes 5d8 Force damage.<\/li><li><b>Forceful Hand<\/b> The hand attempts to push a Huge or smaller creature within 5 feet of it. The target must succeed on a Strength saving throw, or the hand pushes the target up to 5 feet plus a number of feet equal to five times your spellcasting ability modifier. The hand moves with the target, remaining within 5 feet of it.<\/li><li><b>Grasping Hand<\/b> The hand attempts to grapple a Huge or smaller creature within 5 feet of it. The target must succeed on a Dexterity saving throw, or the target has the <a class=\"lk\" data-l=\"cond|grappled\">Grappled<\/a> condition, with an escape DC equal to your spell save DC. While the hand grapples the target, you can take a <a class=\"lk\" data-l=\"rule|bonus action\">Bonus Action<\/a> to cause the hand to crush it, dealing Bludgeoning damage to the target equal to 4d6 plus your spellcasting ability modifier.<\/li><li><b>Interposing Hand<\/b> The hand grants you <a class=\"lk\" data-l=\"rule|cover\">Half Cover<\/a> against attacks and other effects that originate from its space or that pass through it. In addition, its space counts as <a class=\"lk\" data-l=\"rule|difficult terrain\">Difficult Terrain<\/a> for your enemies.<\/li><\/ul>","hl":"<p><b><i>Using a Higher-Level Spell Slot.<\/i><\/b> The damage of the Clenched Fist increases by 2d8 and the damage of the Grasping Hand increases by 2d6 for each spell slot level above 5.<\/p>"},"blade ward":{"n":"Blade Ward","l":0,"sc":"Abjuration","t":"Action","r":"Self","c":"V, S","d":"Up to 1 minute","conc":true,"rit":false,"cls":["Bard","Sorcerer","Warlock","Wizard"],"src":"XPHB","u":"https://5e.tools/spells.html#blade%20ward_xphb","srd":false,"h":"<p>Until the spell ends, any creature making an attack roll against you subtracts 1d4 from the roll.<\/p>","own":true},"bless":{"n":"Bless","l":1,"sc":"Enchantment","t":"Action","r":"30 ft","c":"V, S, M (a Holy Symbol worth 5+ GP)","d":"Up to 1 minute","conc":true,"rit":false,"cls":["Cleric","Paladin"],"src":"XPHB","u":"https://5e.tools/spells.html#bless_xphb","srd":true,"h":"<p>You bless up to three creatures within range. Whenever a target makes an attack roll or a saving throw before the spell ends, the target adds 1d4 to the attack roll or save.<\/p>","hl":"<p><b><i>Using a Higher-Level Spell Slot.<\/i><\/b> You can target one additional creature for each spell slot level above 1.<\/p>"},"blight":{"n":"Blight","l":4,"sc":"Necromancy","t":"Action","r":"30 ft","c":"V, S","d":"Instantaneous","conc":false,"rit":false,"cls":["Druid","Sorcerer","Warlock","Wizard"],"src":"XPHB","u":"https://5e.tools/spells.html#blight_xphb","srd":true,"h":"<p>A creature that you can see within range makes a Constitution saving throw, taking 8d8 Necrotic damage on a failed save or half as much damage on a successful one. A Plant creature automatically fails the save.<\/p><p>Alternatively, target a nonmagical plant that isn't a creature, such as a tree or shrub. It doesn't make a save; it simply withers and dies.<\/p>","hl":"<p><b><i>Using a Higher-Level Spell Slot.<\/i><\/b> The damage increases by 1d8 for each spell slot level above 4.<\/p>"},"blindness/deafness":{"n":"Blindness/Deafness","l":2,"sc":"Transmutation","t":"Action","r":"120 ft","c":"V","d":"1 minute","conc":false,"rit":false,"cls":["Bard","Cleric","Sorcerer","Wizard"],"src":"XPHB","u":"https://5e.tools/spells.html#blindness/deafness_xphb","srd":true,"h":"<p>One creature that you can see within range must succeed on a Constitution saving throw, or it has the <a class=\"lk\" data-l=\"cond|blinded\">Blinded<\/a> or <a class=\"lk\" data-l=\"cond|deafened\">Deafened<\/a> condition (your choice) for the duration. At the end of each of its turns, the target repeats the save, ending the spell on itself on a success.<\/p>","hl":"<p><b><i>Using a Higher-Level Spell Slot.<\/i><\/b> You can target one additional creature for each spell slot level above 2.<\/p>"},"blink":{"n":"Blink","l":3,"sc":"Transmutation","t":"Action","r":"Self","c":"V, S","d":"1 minute","conc":false,"rit":false,"cls":["Sorcerer","Wizard"],"src":"XPHB","u":"https://5e.tools/spells.html#blink_xphb","srd":true,"h":"<p>Roll 1d6 at the end of each of your turns for the duration. On a roll of 4-6, you vanish from your current plane of existence and appear in the Ethereal Plane (the spell ends instantly if you are already on that plane). While on the Ethereal Plane, you can perceive the plane you left, which is cast in shades of gray, but you can't see anything there more than 60 feet away. You can affect and be affected only by other creatures on the Ethereal Plane, and creatures on the other plane can't perceive you unless they have a special ability that lets them perceive things on the Ethereal Plane.<\/p><p>You return to the other plane at the start of your next turn and when the spell ends if you are on the Ethereal Plane. You return to an unoccupied space of your choice that you can see within 10 feet of the space you left. If no unoccupied space is available within that range, you appear in the nearest unoccupied space.<\/p>"},"blur":{"n":"Blur","l":2,"sc":"Illusion","t":"Action","r":"Self","c":"V","d":"Up to 1 minute","conc":true,"rit":false,"cls":["Sorcerer","Wizard"],"src":"XPHB","u":"https://5e.tools/spells.html#blur_xphb","srd":true,"h":"<p>Your body becomes blurred. For the duration, any creature has <a class=\"lk\" data-l=\"rule|disadvantage\">Disadvantage<\/a> on attack rolls against you. An attacker is immune to this effect if it perceives you with <a class=\"lk\" data-l=\"sense|blindsight\">Blindsight<\/a> or <a class=\"lk\" data-l=\"sense|truesight\">Truesight<\/a>.<\/p>"},"burning hands":{"n":"Burning Hands","l":1,"sc":"Evocation","t":"Action","r":"Self (15-ft Cone)","c":"V, S","d":"Instantaneous","conc":false,"rit":false,"cls":["Sorcerer","Wizard"],"src":"XPHB","u":"https://5e.tools/spells.html#burning%20hands_xphb","srd":true,"h":"<p>A thin sheet of flames shoots forth from you. Each creature in a 15-foot <a class=\"lk\" data-l=\"rule|cone [area of effect]\">Cone<\/a> makes a Dexterity saving throw, taking 3d6 Fire damage on a failed save or half as much damage on a successful one.<\/p><p>Flammable objects in the <a class=\"lk\" data-l=\"rule|cone [area of effect]\">Cone<\/a> that aren't being worn or carried start burning.<\/p>","hl":"<p><b><i>Using a Higher-Level Spell Slot.<\/i><\/b> The damage increases by 1d6 for each spell slot level above 1.<\/p>"},"calm emotions":{"n":"Calm Emotions","l":2,"sc":"Enchantment","t":"Action","r":"60 ft","c":"V, S","d":"Up to 1 minute","conc":true,"rit":false,"cls":["Bard","Cleric"],"src":"XPHB","u":"https://5e.tools/spells.html#calm%20emotions_xphb","srd":true,"h":"<p>Each Humanoid in a 20-foot-radius <a class=\"lk\" data-l=\"rule|sphere [area of effect]\">Sphere<\/a> centered on a point you choose within range must succeed on a Charisma saving throw or be affected by one of the following effects (choose for each creature):<\/p><ul><li>The creature has <a class=\"lk\" data-l=\"rule|immunity\">Immunity<\/a> to the <a class=\"lk\" data-l=\"cond|charmed\">Charmed<\/a> and <a class=\"lk\" data-l=\"cond|frightened\">Frightened<\/a> conditions until the spell ends. If the creature was already <a class=\"lk\" data-l=\"cond|charmed\">Charmed<\/a> or <a class=\"lk\" data-l=\"cond|frightened\">Frightened<\/a>, those conditions are suppressed for the duration.<\/li><li>The creature becomes <a class=\"lk\" data-l=\"rule|indifferent [attitude]\">Indifferent<\/a> about creatures of your choice that it's <a class=\"lk\" data-l=\"rule|hostile [attitude]\">Hostile<\/a> toward. This indifference ends if the target takes damage or witnesses its allies taking damage. When the spell ends, the creature's attitude returns to normal.<\/li><\/ul>"},"chain lightning":{"n":"Chain Lightning","l":6,"sc":"Evocation","t":"Action","r":"150 ft","c":"V, S, M (three silver pins)","d":"Instantaneous","conc":false,"rit":false,"cls":["Sorcerer","Wizard"],"src":"XPHB","u":"https://5e.tools/spells.html#chain%20lightning_xphb","srd":true,"h":"<p>You launch a lightning bolt toward a target you can see within range. Three bolts then leap from that target to as many as three other targets of your choice, each of which must be within 30 feet of the first target. A target can be a creature or an object and can be targeted by only one of the bolts.<\/p><p>Each target makes a Dexterity saving throw, taking 10d8 Lightning damage on a failed save or half as much damage on a successful one.<\/p>","hl":"<p><b><i>Using a Higher-Level Spell Slot.<\/i><\/b> One additional bolt leaps from the first target to another target for each spell slot level above 6.<\/p>"},"charm monster":{"n":"Charm Monster","l":4,"sc":"Enchantment","t":"Action","r":"30 ft","c":"V, S","d":"1 hour","conc":false,"rit":false,"cls":["Bard","Druid","Sorcerer","Warlock","Wizard"],"src":"XPHB","u":"https://5e.tools/spells.html#charm%20monster_xphb","srd":true,"h":"<p>One creature you can see within range makes a Wisdom saving throw. It does so with <a class=\"lk\" data-l=\"rule|advantage\">Advantage<\/a> if you or your allies are fighting it. On a failed save, the target has the <a class=\"lk\" data-l=\"cond|charmed\">Charmed<\/a> condition until the spell ends or until you or your allies damage it. The <a class=\"lk\" data-l=\"cond|charmed\">Charmed<\/a> creature is <a class=\"lk\" data-l=\"rule|friendly [attitude]\">Friendly<\/a> to you. When the spell ends, the target knows it was <a class=\"lk\" data-l=\"cond|charmed\">Charmed<\/a> by you.<\/p>","hl":"<p><b><i>Using a Higher-Level Spell Slot.<\/i><\/b> You can target one additional creature for each spell slot level above 4.<\/p>"},"charm person":{"n":"Charm Person","l":1,"sc":"Enchantment","t":"Action","r":"30 ft","c":"V, S","d":"1 hour","conc":false,"rit":false,"cls":["Bard","Druid","Sorcerer","Warlock","Wizard"],"src":"XPHB","u":"https://5e.tools/spells.html#charm%20person_xphb","srd":true,"h":"<p>One Humanoid you can see within range makes a Wisdom saving throw. It does so with <a class=\"lk\" data-l=\"rule|advantage\">Advantage<\/a> if you or your allies are fighting it. On a failed save, the target has the <a class=\"lk\" data-l=\"cond|charmed\">Charmed<\/a> condition until the spell ends or until you or your allies damage it. The <a class=\"lk\" data-l=\"cond|charmed\">Charmed<\/a> creature is <a class=\"lk\" data-l=\"rule|friendly [attitude]\">Friendly<\/a> to you. When the spell ends, the target knows it was <a class=\"lk\" data-l=\"cond|charmed\">Charmed<\/a> by you.<\/p>","hl":"<p><b><i>Using a Higher-Level Spell Slot.<\/i><\/b> You can target one additional creature for each spell slot level above 1.<\/p>"},"chill touch":{"n":"Chill Touch","l":0,"sc":"Necromancy","t":"Action","r":"Touch","c":"V, S","d":"Instantaneous","conc":false,"rit":false,"cls":["Sorcerer","Warlock","Wizard"],"src":"XPHB","u":"https://5e.tools/spells.html#chill%20touch_xphb","srd":true,"h":"<p>Channeling the chill of the grave, make a melee spell attack against a target within reach. On a hit, the target takes 1d10 Necrotic damage, and it can't regain <a class=\"lk\" data-l=\"rule|hit points\">Hit Points<\/a> until the end of your next turn.<\/p>","hl":"<p><b><i>Cantrip Upgrade.<\/i><\/b> The damage increases by 1d10 when you reach levels 5 (2d10), 11 (3d10), and 17 (4d10).<\/p>"},"chromatic orb":{"n":"Chromatic Orb","l":1,"sc":"Evocation","t":"Action","r":"90 ft","c":"V, S, M (a diamond worth 50+ GP)","d":"Instantaneous","conc":false,"rit":false,"cls":["Sorcerer","Wizard"],"src":"XPHB","u":"https://5e.tools/spells.html#chromatic%20orb_xphb","srd":true,"h":"<p>You hurl an orb of energy at a target within range. Choose Acid, Cold, Fire, Lightning, Poison, or Thunder for the type of orb you create, and then make a ranged spell attack against the target. On a hit, the target takes 3d8 damage of the chosen type.<\/p><p>If you roll the same number on two or more of the d8s, the orb leaps to a different target of your choice within 30 feet of the target. Make an attack roll against the new target, and make a new damage roll. The orb can't leap again unless you cast the spell with a level 2+ spell slot.<\/p>","hl":"<p><b><i>Using a Higher-Level Spell Slot.<\/i><\/b> The damage increases by 1d8 for each spell slot level above 1. The orb can leap a maximum number of times equal to the level of the slot expended, and a creature can be targeted only once by each casting of this spell.<\/p>"},"circle of death":{"n":"Circle of Death","l":6,"sc":"Necromancy","t":"Action","r":"150 ft","c":"V, S, M (the powder of a crushed black pearl worth 500+ GP)","d":"Instantaneous","conc":false,"rit":false,"cls":["Sorcerer","Warlock","Wizard"],"src":"XPHB","u":"https://5e.tools/spells.html#circle%20of%20death_xphb","srd":true,"h":"<p>Negative energy ripples out in a 60-foot-radius <a class=\"lk\" data-l=\"rule|sphere [area of effect]\">Sphere<\/a> from a point you choose within range. Each creature in that area makes a Constitution saving throw, taking 8d8 Necrotic damage on a failed save or half as much damage on a successful one.<\/p>","hl":"<p><b><i>Using a Higher-Level Spell Slot.<\/i><\/b> The damage increases by 2d8 for each spell slot level above 6.<\/p>"},"clairvoyance":{"n":"Clairvoyance","l":3,"sc":"Divination","t":"10 minutes","r":"1 miles","c":"V, S, M (a focus worth 100+ GP, either a jeweled horn for hearing or a glass eye for seeing)","d":"Up to 10 minutes","conc":true,"rit":false,"cls":["Bard","Cleric","Sorcerer","Wizard"],"src":"XPHB","u":"https://5e.tools/spells.html#clairvoyance_xphb","srd":true,"h":"<p>You create an <a class=\"lk\" data-l=\"cond|invisible\">Invisible<\/a> sensor within range in a location familiar to you (a place you have visited or seen before) or in an obvious location that is unfamiliar to you (such as behind a door, around a corner, or in a grove of trees). The intangible, invulnerable sensor remains in place for the duration.<\/p><p>When you cast the spell, choose seeing or hearing. You can use the chosen sense through the sensor as if you were in its space. As a <a class=\"lk\" data-l=\"rule|bonus action\">Bonus Action<\/a>, you can switch between seeing and hearing.<\/p><p>A creature that sees the sensor (such as a creature benefiting from <a class=\"lk\" data-l=\"spell|see invisibility\">See Invisibility<\/a> or <a class=\"lk\" data-l=\"sense|truesight\">Truesight<\/a>) sees a luminous orb about the size of your fist.<\/p>"},"cloud of daggers":{"n":"Cloud of Daggers","l":2,"sc":"Conjuration","t":"Action","r":"60 ft","c":"V, S, M (a sliver of glass)","d":"Up to 1 minute","conc":true,"rit":false,"cls":["Bard","Sorcerer","Warlock","Wizard"],"src":"XPHB","u":"https://5e.tools/spells.html#cloud%20of%20daggers_xphb","srd":false,"h":"<p>Fill a 5-ft Cube at a point in range with spinning blades. A creature takes 4d4 Slashing when the Cube appears on it, when it enters the Cube, when it ends its turn there, or when the Cube moves onto it (once per turn). On later turns, a <a class=\"lk\" data-l=\"act|magic\">Magic action<\/a> teleports the Cube up to 30 ft.<\/p>","hl":"<p>+2d4 damage per slot level above 2.<\/p>","own":true},"cloudkill":{"n":"Cloudkill","l":5,"sc":"Conjuration","t":"Action","r":"120 ft","c":"V, S","d":"Up to 10 minutes","conc":true,"rit":false,"cls":["Sorcerer","Wizard"],"src":"XPHB","u":"https://5e.tools/spells.html#cloudkill_xphb","srd":true,"h":"<p>You create a 20-foot-radius <a class=\"lk\" data-l=\"rule|sphere [area of effect]\">Sphere<\/a> of yellow-green fog centered on a point within range. The fog lasts for the duration or until strong wind (such as the one created by <a class=\"lk\" data-l=\"spell|gust of wind\">Gust of Wind<\/a>) disperses it, ending the spell. Its area is <a class=\"lk\" data-l=\"rule|heavily obscured\">Heavily Obscured<\/a>.<\/p><p>Each creature in the <a class=\"lk\" data-l=\"rule|sphere [area of effect]\">Sphere<\/a> makes a Constitution saving throw, taking 5d8 Poison damage on a failed save or half as much damage on a successful one. A creature must also make this save when the <a class=\"lk\" data-l=\"rule|sphere [area of effect]\">Sphere<\/a> moves into its space and when it enters the <a class=\"lk\" data-l=\"rule|sphere [area of effect]\">Sphere<\/a> or ends its turn there. A creature makes this save only once per turn.<\/p><p>The <a class=\"lk\" data-l=\"rule|sphere [area of effect]\">Sphere<\/a> moves 10 feet away from you at the start of each of your turns.<\/p>","hl":"<p><b><i>Using a Higher-Level Spell Slot.<\/i><\/b> The damage increases by 1d8 for each spell slot level above 5.<\/p>"},"color spray":{"n":"Color Spray","l":1,"sc":"Illusion","t":"Action","r":"Self (15-ft Cone)","c":"V, S, M (a pinch of colorful sand)","d":"Instantaneous","conc":false,"rit":false,"cls":["Bard","Sorcerer","Wizard"],"src":"XPHB","u":"https://5e.tools/spells.html#color%20spray_xphb","srd":true,"h":"<p>You launch a dazzling array of flashing, colorful light. Each creature in a 15-foot <a class=\"lk\" data-l=\"rule|cone [area of effect]\">Cone<\/a> originating from you must succeed on a Constitution saving throw or have the <a class=\"lk\" data-l=\"cond|blinded\">Blinded<\/a> condition until the end of your next turn.<\/p>"},"command":{"n":"Command","l":1,"sc":"Enchantment","t":"Action","r":"60 ft","c":"V","d":"Instantaneous","conc":false,"rit":false,"cls":["Bard","Cleric","Paladin"],"src":"XPHB","u":"https://5e.tools/spells.html#command_xphb","srd":true,"h":"<p>You speak a one-word command to a creature you can see within range. The target must succeed on a Wisdom saving throw or follow the command on its next turn. Choose the command from these options:<\/p><ul><li><b>Approach<\/b> The target moves toward you by the shortest and most direct route, ending its turn if it moves within 5 feet of you.<\/li><li><b>Drop<\/b> The target drops whatever it is holding and then ends its turn.<\/li><li><b>Flee<\/b> The target spends its turn moving away from you by the fastest available means.<\/li><li><b>Grovel<\/b> The target has the <a class=\"lk\" data-l=\"cond|prone\">Prone<\/a> condition and then ends its turn.<\/li><li><b>Halt<\/b> On its turn, the target doesn't move and takes no action or <a class=\"lk\" data-l=\"rule|bonus action\">Bonus Action<\/a>.<\/li><\/ul>","hl":"<p><b><i>Using a Higher-Level Spell Slot.<\/i><\/b> You can affect one additional creature for each spell slot level above 1.<\/p>"},"comprehend languages":{"n":"Comprehend Languages","l":1,"sc":"Divination","t":"Action","r":"Self","c":"V, S, M (a pinch of soot and salt)","d":"1 hour","conc":false,"rit":true,"cls":["Bard","Sorcerer","Warlock","Wizard"],"src":"XPHB","u":"https://5e.tools/spells.html#comprehend%20languages_xphb","srd":true,"h":"<p>For the duration, you understand the literal meaning of any language that you hear or see signed. You also understand any written language that you see, but you must be touching the surface on which the words are written. It takes about 1 minute to read one page of text. This spell doesn't decode symbols or secret messages.<\/p>"},"cone of cold":{"n":"Cone of Cold","l":5,"sc":"Evocation","t":"Action","r":"Self (60-ft Cone)","c":"V, S, M (a small crystal or glass cone)","d":"Instantaneous","conc":false,"rit":false,"cls":["Druid","Sorcerer","Wizard"],"src":"XPHB","u":"https://5e.tools/spells.html#cone%20of%20cold_xphb","srd":true,"h":"<p>You unleash a blast of cold air. Each creature in a 60-foot <a class=\"lk\" data-l=\"rule|cone [area of effect]\">Cone<\/a> originating from you makes a Constitution saving throw, taking 8d8 Cold damage on a failed save or half as much damage on a successful one. A creature killed by this spell becomes a frozen statue until it thaws.<\/p>","hl":"<p><b><i>Using a Higher-Level Spell Slot.<\/i><\/b> The damage increases by 1d8 for each spell slot level above 5.<\/p>"},"confusion":{"n":"Confusion","l":4,"sc":"Enchantment","t":"Action","r":"90 ft","c":"V, S, M (three nut shells)","d":"Up to 1 minute","conc":true,"rit":false,"cls":["Bard","Druid","Sorcerer","Wizard"],"src":"XPHB","u":"https://5e.tools/spells.html#confusion_xphb","srd":true,"h":"<p>Each creature in a 10-foot-radius <a class=\"lk\" data-l=\"rule|sphere [area of effect]\">Sphere<\/a> centered on a point you choose within range must succeed on a Wisdom saving throw, or that target can't take Bonus Actions or Reactions and must roll 1d10 at the start of each of its turns to determine its behavior for that turn, consulting the table below.<\/p><div class=\"tw\"><table><tr><th>1d10<\/th><th>Behavior for the Turn<\/th><\/tr><tr><td>1<\/td><td>The target doesn't take an action, and it uses all its movement to move. Roll 1d4 for the direction: <b>1<\/b>, north; <b>2<\/b>, east; <b>3<\/b>, south; or <b>4<\/b>, west.<\/td><\/tr><tr><td>2-6<\/td><td>The target doesn't move or take actions.<\/td><\/tr><tr><td>7-8<\/td><td>The target doesn't move, and it takes the <a class=\"lk\" data-l=\"act|attack\">Attack<\/a> action to make one melee attack against a random creature within reach. If none are within reach, the target takes no action.<\/td><\/tr><tr><td>9-10<\/td><td>The target chooses its behavior.<\/td><\/tr><\/table><\/div><p>At the end of each of its turns, an affected target repeats the save, ending the spell on itself on a success.<\/p>","hl":"<p><b><i>Using a Higher-Level Spell Slot.<\/i><\/b> The <a class=\"lk\" data-l=\"rule|sphere [area of effect]\">Sphere<\/a>'s radius increases by 5 feet for each spell slot level above 4.<\/p>"},"contact other plane":{"n":"Contact Other Plane","l":5,"sc":"Divination","t":"1 minute","r":"Self","c":"V","d":"1 minute","conc":false,"rit":true,"cls":["Warlock","Wizard"],"src":"XPHB","u":"https://5e.tools/spells.html#contact%20other%20plane_xphb","srd":true,"h":"<p>You mentally contact a demigod, the spirit of a long-dead sage, or some other knowledgeable entity from another plane. Contacting this otherworldly intelligence can break your mind. When you cast this spell, make a DC 15 Intelligence saving throw. On a successful save, you can ask the entity up to five questions. You must ask your questions before the spell ends. The DM answers each question with one word, such as \"yes,\" \"no,\" \"maybe,\" \"never,\" \"irrelevant,\" or \"unclear\" (if the entity doesn't know the answer to the question). If a one-word answer would be misleading, the DM might instead offer a short phrase as an answer.<\/p><p>On a failed save, you take 6d6 Psychic damage and have the <a class=\"lk\" data-l=\"cond|incapacitated\">Incapacitated<\/a> condition until you finish a <a class=\"lk\" data-l=\"rule|long rest\">Long Rest<\/a>. A <a class=\"lk\" data-l=\"spell|greater restoration\">Greater Restoration<\/a> spell cast on you ends this effect.<\/p>"},"counterspell":{"n":"Counterspell","l":3,"sc":"Abjuration","t":"Reaction, which you take when you see a creature within 60 feet of yourself casting a spell with Verbal, Somatic, or Material components","r":"60 ft","c":"S","d":"Instantaneous","conc":false,"rit":false,"cls":["Sorcerer","Warlock","Wizard"],"src":"XPHB","u":"https://5e.tools/spells.html#counterspell_xphb","srd":true,"h":"<p>You attempt to interrupt a creature in the process of casting a spell. The creature makes a Constitution saving throw. On a failed save, the spell dissipates with no effect, and the action, <a class=\"lk\" data-l=\"rule|bonus action\">Bonus Action<\/a>, or <a class=\"lk\" data-l=\"rule|reaction\">Reaction<\/a> used to cast it is wasted. If that spell was cast with a spell slot, the slot isn't expended.<\/p>"},"create or destroy water":{"n":"Create or Destroy Water","l":1,"sc":"Transmutation","t":"Action","r":"30 ft","c":"V, S, M (a mix of water and sand)","d":"Instantaneous","conc":false,"rit":false,"cls":["Cleric","Druid"],"src":"XPHB","u":"https://5e.tools/spells.html#create%20or%20destroy%20water_xphb","srd":true,"h":"<p>You do one of the following:<\/p><ul><li><b>Create Water<\/b> You create up to 10 gallons of clean water within range in an open container. Alternatively, the water falls as rain in a 30-foot <a class=\"lk\" data-l=\"rule|cube [area of effect]\">Cube<\/a> within range, extinguishing exposed flames there.<\/li><li><b>Destroy Water<\/b> You destroy up to 10 gallons of water in an open container within range. Alternatively, you destroy fog in a 30-foot <a class=\"lk\" data-l=\"rule|cube [area of effect]\">Cube<\/a> within range.<\/li><\/ul>","hl":"<p><b><i>Using a Higher-Level Spell Slot.<\/i><\/b> You create or destroy 10 additional gallons of water, or the size of the <a class=\"lk\" data-l=\"rule|cube [area of effect]\">Cube<\/a> increases by 5 feet, for each spell slot level above 1.<\/p>"},"create undead":{"n":"Create Undead","l":6,"sc":"Necromancy","t":"1 minute","r":"10 ft","c":"V, S, M (one 150+ GP black onyx stone for each corpse)","d":"Instantaneous","conc":false,"rit":false,"cls":["Cleric","Warlock","Wizard"],"src":"XPHB","u":"https://5e.tools/spells.html#create%20undead_xphb","srd":true,"h":"<p>You can cast this spell only at night. Choose up to three corpses of Medium or Small Humanoids within range. Each one becomes a Ghoul under your control (see the Monster Manual for its stat block).<\/p><p>As a <a class=\"lk\" data-l=\"rule|bonus action\">Bonus Action<\/a> on each of your turns, you can mentally command any creature you animated with this spell if the creature is within 120 feet of you (if you control multiple creatures, you can command any of them at the same time, issuing the same command to them). You decide what action the creature will take and where it will move on its next turn, or you can issue a general command, such as to guard a particular place. If you issue no commands, the creature takes the <a class=\"lk\" data-l=\"act|dodge\">Dodge<\/a> action and moves only to avoid harm. Once given an order, the creature continues to follow the order until its task is complete.<\/p><p>The creature is under your control for 24 hours, after which it stops obeying any command you've given it. To maintain control of the creature for another 24 hours, you must cast this spell on the creature before the current 24-hour period ends. This use of the spell reasserts your control over up to three creatures you have animated with this spell rather than animating new ones.<\/p>","hl":"<p><b><i>Using a Higher-Level Spell Slot.<\/i><\/b> If you use a level 7 spell slot, you can animate or reassert control over four Ghouls. If you use a level 8 spell slot, you can animate or reassert control over five Ghouls or two Ghasts or Wights. If you use a level 9 spell slot, you can animate or reassert control over six Ghouls, three Ghasts or Wights, or two Mummies. See the Monster Manual for these stat blocks.<\/p>"},"creation":{"n":"Creation","l":5,"sc":"Illusion","t":"1 minute","r":"30 ft","c":"V, S, M (a paintbrush)","d":"Special","conc":false,"rit":false,"cls":["Sorcerer","Wizard"],"src":"XPHB","u":"https://5e.tools/spells.html#creation_xphb","srd":true,"h":"<p>You pull wisps of shadow material from the Shadowfell to create an object within range. It is either an object of vegetable matter (soft goods, rope, wood, and the like) or mineral matter (stone, crystal, metal, and the like). The object must be no larger than a 5-foot <a class=\"lk\" data-l=\"rule|cube [area of effect]\">Cube<\/a>, and the object must be of a form and material that you have seen.<\/p><p>The spell's duration depends on the object's material, as shown in the Materials table. If the object is composed of multiple materials, use the shortest duration. Using any object created by this spell as another spell's Material component causes the other spell to fail.<\/p><div class=\"tw\"><table><caption>Materials<\/caption><tr><th>Material<\/th><th>Duration<\/th><\/tr><tr><td>Vegetable matter<\/td><td>24 hours<\/td><\/tr><tr><td>Stone or crystal<\/td><td>12 hours<\/td><\/tr><tr><td>Precious metals<\/td><td>1 hour<\/td><\/tr><tr><td>Gems<\/td><td>10 minutes<\/td><\/tr><tr><td>Adamantine or mithral<\/td><td>1 minute<\/td><\/tr><\/table><\/div>","hl":"<p><b><i>Using a Higher-Level Spell Slot.<\/i><\/b> The <a class=\"lk\" data-l=\"rule|cube [area of effect]\">Cube<\/a> increases by 5 feet for each spell slot level above 5.<\/p>"},"crown of madness":{"n":"Crown of Madness","l":2,"sc":"Enchantment","t":"Action","r":"120 ft","c":"V, S","d":"Up to 1 minute","conc":true,"rit":false,"cls":["Bard","Sorcerer","Warlock","Wizard"],"src":"XPHB","u":"https://5e.tools/spells.html#crown%20of%20madness_xphb","srd":false,"h":"<p>A Humanoid you can see makes a Wisdom save or is <a class=\"lk\" data-l=\"cond|charmed\">Charmed<\/a>. On each of its turns, before moving, it must use its action to make a melee attack against a creature you pick mentally (if one is in reach). It repeats the save at the end of each of its turns. You must take a <a class=\"lk\" data-l=\"act|magic\">Magic action<\/a> each turn to keep control or the spell ends.<\/p>","own":true},"cure wounds":{"n":"Cure Wounds","l":1,"sc":"Abjuration","t":"Action","r":"Touch","c":"V, S","d":"Instantaneous","conc":false,"rit":false,"cls":["Bard","Cleric","Druid","Paladin","Ranger"],"src":"XPHB","u":"https://5e.tools/spells.html#cure%20wounds_xphb","srd":true,"h":"<p>A creature you touch regains a number of <a class=\"lk\" data-l=\"rule|hit points\">Hit Points<\/a> equal to 2d8 plus your spellcasting ability modifier.<\/p>","hl":"<p><b><i>Using a Higher-Level Spell Slot.<\/i><\/b> The healing increases by 2d8 for each spell slot level above 1.<\/p>"},"dancing lights":{"n":"Dancing Lights","l":0,"sc":"Illusion","t":"Action","r":"120 ft","c":"V, S, M (a bit of phosphorus)","d":"Up to 1 minute","conc":true,"rit":false,"cls":["Bard","Sorcerer","Wizard"],"src":"XPHB","u":"https://5e.tools/spells.html#dancing%20lights_xphb","srd":true,"h":"<p>You create up to four torch-size lights within range, making them appear as torches, lanterns, or glowing orbs that hover for the duration. Alternatively, you combine the four lights into one glowing Medium form that is vaguely humanlike. Whichever form you choose, each light sheds <a class=\"lk\" data-l=\"rule|dim light\">Dim Light<\/a> in a 10-foot radius.<\/p><p>As a <a class=\"lk\" data-l=\"rule|bonus action\">Bonus Action<\/a>, you can move the lights up to 60 feet to a space within range. A light must be within 20 feet of another light created by this spell, and a light vanishes if it exceeds the spell's range.<\/p>"},"darkness":{"n":"Darkness","l":2,"sc":"Evocation","t":"Action","r":"60 ft","c":"V, M (bat fur and a piece of coal)","d":"Up to 10 minutes","conc":true,"rit":false,"cls":["Sorcerer","Warlock","Wizard"],"src":"XPHB","u":"https://5e.tools/spells.html#darkness_xphb","srd":true,"h":"<p>For the duration, magical <a class=\"lk\" data-l=\"rule|darkness\">Darkness<\/a> spreads from a point within range and fills a 15-foot-radius <a class=\"lk\" data-l=\"rule|sphere [area of effect]\">Sphere<\/a>. <a class=\"lk\" data-l=\"sense|darkvision\">Darkvision<\/a> can't see through it, and nonmagical light can't illuminate it.<\/p><p>Alternatively, you cast the spell on an object that isn't being worn or carried, causing the <a class=\"lk\" data-l=\"rule|darkness\">Darkness<\/a> to fill a 15-foot <a class=\"lk\" data-l=\"rule|emanation [area of effect]\">Emanation<\/a> originating from that object. Covering that object with something opaque, such as a bowl or helm, blocks the <a class=\"lk\" data-l=\"rule|darkness\">Darkness<\/a>.<\/p><p>If any of this spell's area overlaps with an area of <a class=\"lk\" data-l=\"rule|bright light\">Bright Light<\/a> or <a class=\"lk\" data-l=\"rule|dim light\">Dim Light<\/a> created by a spell of level 2 or lower, that other spell is dispelled.<\/p>"},"darkvision":{"n":"Darkvision","l":2,"sc":"Transmutation","t":"Action","r":"Touch","c":"V, S, M (a dried carrot)","d":"8 hours","conc":false,"rit":false,"cls":["Druid","Ranger","Sorcerer","Wizard"],"src":"XPHB","u":"https://5e.tools/spells.html#darkvision_xphb","srd":true,"h":"<p>For the duration, a willing creature you touch has <a class=\"lk\" data-l=\"sense|darkvision\">Darkvision<\/a> with a range of 150 feet.<\/p>"},"daylight":{"n":"Daylight","l":3,"sc":"Evocation","t":"Action","r":"60 ft","c":"V, S","d":"1 hour","conc":false,"rit":false,"cls":["Cleric","Druid","Paladin","Ranger","Sorcerer"],"src":"XPHB","u":"https://5e.tools/spells.html#daylight_xphb","srd":true,"h":"<p>For the duration, sunlight spreads from a point within range and fills a 60-foot-radius <a class=\"lk\" data-l=\"rule|sphere [area of effect]\">Sphere<\/a>. The sunlight's area is <a class=\"lk\" data-l=\"rule|bright light\">Bright Light<\/a> and sheds <a class=\"lk\" data-l=\"rule|dim light\">Dim Light<\/a> for an additional 60 feet.<\/p><p>Alternatively, you cast the spell on an object that isn't being worn or carried, causing the sunlight to fill a 60-foot <a class=\"lk\" data-l=\"rule|emanation [area of effect]\">Emanation<\/a> originating from that object. Covering that object with something opaque, such as a bowl or helm, blocks the sunlight.<\/p><p>If any of this spell's area overlaps with an area of <a class=\"lk\" data-l=\"rule|darkness\">Darkness<\/a> created by a spell of level 3 or lower, that other spell is dispelled.<\/p>"},"delayed blast fireball":{"n":"Delayed Blast Fireball","l":7,"sc":"Evocation","t":"Action","r":"150 ft","c":"V, S, M (a ball of bat guano and sulfur)","d":"Up to 1 minute","conc":true,"rit":false,"cls":["Sorcerer","Wizard"],"src":"XPHB","u":"https://5e.tools/spells.html#delayed%20blast%20fireball_xphb","srd":true,"h":"<p>A beam of yellow light flashes from you, then condenses at a chosen point within range as a glowing bead for the duration. When the spell ends, the bead explodes, and each creature in a 20-foot-radius <a class=\"lk\" data-l=\"rule|sphere [area of effect]\">Sphere<\/a> centered on that point makes a Dexterity saving throw. A creature takes Fire damage equal to the total accumulated damage on a failed save or half as much damage on a successful one.<\/p><p>The spell's base damage is 12d6, and the damage increases by 1d6 whenever your turn ends and the spell hasn't ended.<\/p><p>If a creature touches the glowing bead before the spell ends, that creature makes a Dexterity saving throw. On a failed save, the spell ends, causing the bead to explode. On a successful save, the creature can throw the bead up to 40 feet. If the thrown bead enters a creature's space or collides with a solid object, the spell ends, and the bead explodes.<\/p><p>When the bead explodes, flammable objects in the explosion that aren't being worn or carried start burning.<\/p>","hl":"<p><b><i>Using a Higher-Level Spell Slot.<\/i><\/b> The base damage increases by 1d6 for each spell slot level above 7.<\/p>"},"demiplane":{"n":"Demiplane","l":8,"sc":"Conjuration","t":"Action","r":"60 ft","c":"S","d":"1 hour","conc":false,"rit":false,"cls":["Sorcerer","Warlock","Wizard"],"src":"XPHB","u":"https://5e.tools/spells.html#demiplane_xphb","srd":true,"h":"<p>You create a shadowy Medium door on a flat solid surface that you can see within range. This door can be opened and closed, and it leads to a demiplane that is an empty room 30 feet in each dimension, made of wood or stone (your choice).<\/p><p>When the spell ends, the door vanishes, and any objects inside the demiplane remain there. Any creatures inside also remain unless they opt to be shunted through the door as it vanishes, landing with the <a class=\"lk\" data-l=\"cond|prone\">Prone<\/a> condition in the unoccupied spaces closest to the door's former space.<\/p><p>Each time you cast this spell, you can create a new demiplane or connect the shadowy door to a demiplane you created with a previous casting of this spell. Additionally, if you know the nature and contents of a demiplane created by a casting of this spell by another creature, you can connect the shadowy door to that demiplane instead.<\/p>"},"detect evil and good":{"n":"Detect Evil and Good","l":1,"sc":"Divination","t":"Action","r":"Self (30-ft Sphere)","c":"V, S","d":"Up to 10 minutes","conc":true,"rit":false,"cls":["Cleric","Paladin"],"s
