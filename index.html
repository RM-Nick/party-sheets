rc":"XPHB","u":"https://5e.tools/spells.html#detect%20evil%20and%20good_xphb","srd":true,"h":"<p>For the duration, you sense the location of any Aberration, Celestial, Elemental, Fey, Fiend, or Undead within 30 feet of yourself. You also sense whether the <a href=\"https://5e.tools/spells.html#hallow_xphb\" target=\"_blank\" rel=\"noopener\">Hallow<\/a> spell is active there and, if so, where.<\/p><p>The spell is blocked by 1 foot of stone, dirt, or wood; 1 inch of metal; or a thin sheet of lead.<\/p>"},"detect magic":{"n":"Detect Magic","l":1,"sc":"Divination","t":"Action","r":"Self (30-ft Sphere)","c":"V, S","d":"Up to 10 minutes","conc":true,"rit":true,"cls":["Bard","Cleric","Druid","Paladin","Ranger","Sorcerer","Warlock","Wizard"],"src":"XPHB","u":"https://5e.tools/spells.html#detect%20magic_xphb","srd":true,"h":"<p>For the duration, you sense the presence of magical effects within 30 feet of yourself. If you sense such effects, you can take the <a class=\"lk\" data-l=\"act|magic\">Magic<\/a> action to see a faint aura around any visible creature or object in the area that bears the magic, and if an effect was created by a spell, you learn the spell's 7.<\/p><p>The spell is blocked by 1 foot of stone, dirt, or wood; 1 inch of metal; or a thin sheet of lead.<\/p>"},"detect poison and disease":{"n":"Detect Poison and Disease","l":1,"sc":"Divination","t":"Action","r":"Self (30-ft Sphere)","c":"V, S, M (a yew leaf)","d":"Up to 10 minutes","conc":true,"rit":true,"cls":["Cleric","Druid","Paladin","Ranger"],"src":"XPHB","u":"https://5e.tools/spells.html#detect%20poison%20and%20disease_xphb","srd":true,"h":"<p>For the duration, you sense the location of poisons, poisonous or venomous creatures, and magical contagions within 30 feet of yourself. You sense the kind of poison, creature, or contagion in each case.<\/p><p>The spell is blocked by 1 foot of stone, dirt, or wood; 1 inch of metal; or a thin sheet of lead.<\/p>"},"detect thoughts":{"n":"Detect Thoughts","l":2,"sc":"Divination","t":"Action","r":"Self","c":"V, S, M (1 Copper Piece)","d":"Up to 1 minute","conc":true,"rit":false,"cls":["Bard","Sorcerer","Wizard"],"src":"XPHB","u":"https://5e.tools/spells.html#detect%20thoughts_xphb","srd":true,"h":"<p>You activate one of the effects below. Until the spell ends, you can activate either effect as a <a class=\"lk\" data-l=\"act|magic\">Magic<\/a> action on your later turns.<\/p><p><b><i>Sense Thoughts.<\/i><\/b> You sense the presence of thoughts within 30 feet of yourself that belong to creatures that know languages or are telepathic. You don't read the thoughts, but you know that a thinking creature is present.<\/p><p>The spell is blocked by 1 foot of stone, dirt, or wood; 1 inch of metal; or a thin sheet of lead.<\/p><p><b><i>Read Thoughts.<\/i><\/b> Target one creature you can see within 30 feet of yourself or one creature within 30 feet of yourself that you detected with the Sense Thoughts option. You learn what is most on the target's mind right now. If the target doesn't know any languages and isn't telepathic, you learn nothing.<\/p><p>As a <a class=\"lk\" data-l=\"act|magic\">Magic<\/a> action on your next turn, you can try to probe deeper into the target's mind. If you probe deeper, the target makes a Wisdom saving throw. On a failed save, you discern the target's reasoning, emotions, and something that looms large in its mind (such as a worry, love, or hate). On a successful save, the spell ends. Either way, the target knows that you are probing into its mind, and until you shift your attention away from the target's mind, the target can take an action on its turn to make an Intelligence (<a class=\"lk\" data-l=\"skill|arcana\">Arcana<\/a>) check against your spell save DC, ending the spell on a success.<\/p>"},"dimension door":{"n":"Dimension Door","l":4,"sc":"Conjuration","t":"Action","r":"500 ft","c":"V","d":"Instantaneous","conc":false,"rit":false,"cls":["Bard","Sorcerer","Warlock","Wizard"],"src":"XPHB","u":"https://5e.tools/spells.html#dimension%20door_xphb","srd":true,"h":"<p>You teleport to a location within range. You arrive at exactly the spot desired. It can be a place you can see, one you can visualize, or one you can describe by stating distance and direction, such as \"200 feet straight downward\" or \"300 feet upward to the northwest at a 45-degree angle.\"<\/p><p>You can also teleport one willing creature. The creature must be within 5 feet of you when you teleport, and it teleports to a space within 5 feet of your destination space.<\/p><p>If you, the other creature, or both would arrive in a space occupied by a creature or completely filled by one or more objects, you and any creature traveling with you each take 4d6 Force damage, and the teleportation fails.<\/p>"},"disguise self":{"n":"Disguise Self","l":1,"sc":"Illusion","t":"Action","r":"Self","c":"V, S","d":"1 hour","conc":false,"rit":false,"cls":["Bard","Sorcerer","Wizard"],"src":"XPHB","u":"https://5e.tools/spells.html#disguise%20self_xphb","srd":true,"h":"<p>You make yourself—including your clothing, armor, weapons, and other belongings on your person—look different until the spell ends. You can seem 1 foot shorter or taller and can appear heavier or lighter. You must adopt a form that has the same basic arrangement of limbs as you have. Otherwise, the extent of the illusion is up to you.<\/p><p>The changes wrought by this spell fail to hold up to physical inspection. For example, if you use this spell to add a hat to your outfit, objects pass through the hat, and anyone who touches it would feel nothing.<\/p><p>To discern that you are disguised, a creature must take the <a class=\"lk\" data-l=\"act|study\">Study<\/a> action to inspect your appearance and succeed on an Intelligence (<a class=\"lk\" data-l=\"skill|investigation\">Investigation<\/a>) check against your spell save DC.<\/p>"},"disintegrate":{"n":"Disintegrate","l":6,"sc":"Transmutation","t":"Action","r":"60 ft","c":"V, S, M (a lodestone and dust)","d":"Instantaneous","conc":false,"rit":false,"cls":["Sorcerer","Wizard"],"src":"XPHB","u":"https://5e.tools/spells.html#disintegrate_xphb","srd":true,"h":"<p>You launch a green ray at a target you can see within range. The target can be a creature, a nonmagical object, or a creation of magical force, such as the wall created by <a href=\"https://5e.tools/spells.html#wall%20of%20force_xphb\" target=\"_blank\" rel=\"noopener\">Wall of Force<\/a>.<\/p><p>A creature targeted by this spell makes a Dexterity saving throw. On a failed save, the target takes 10d6 + 40 Force damage. If this damage reduces it to 0 <a class=\"lk\" data-l=\"rule|hit points\">Hit Points<\/a>, it and everything nonmagical it is wearing and carrying are disintegrated into gray dust. The target can be revived only by a <a href=\"https://5e.tools/spells.html#true%20resurrection_xphb\" target=\"_blank\" rel=\"noopener\">True Resurrection<\/a> or a <a class=\"lk\" data-l=\"spell|wish\">Wish<\/a> spell.<\/p><p>This spell automatically disintegrates a Large or smaller nonmagical object or a creation of magical force. If such a target is Huge or larger, this spell disintegrates a 10-foot-<a class=\"lk\" data-l=\"rule|cube [area of effect]\">Cube<\/a> portion of it.<\/p>","hl":"<p><b><i>Using a Higher-Level Spell Slot.<\/i><\/b> The damage increases by 3d6 for each spell slot level above 6.<\/p>"},"dispel magic":{"n":"Dispel Magic","l":3,"sc":"Abjuration","t":"Action","r":"120 ft","c":"V, S","d":"Instantaneous","conc":false,"rit":false,"cls":["Bard","Cleric","Druid","Paladin","Ranger","Sorcerer","Warlock","Wizard"],"src":"XPHB","u":"https://5e.tools/spells.html#dispel%20magic_xphb","srd":true,"h":"<p>Choose one creature, object, or magical effect within range. Any ongoing spell of level 3 or lower on the target ends. For each ongoing spell of level 4 or higher on the target, make an ability check using your spellcasting ability (DC 10 plus that spell's level). On a successful check, the spell ends.<\/p>","hl":"<p><b><i>Using a Higher-Level Spell Slot.<\/i><\/b> You automatically end a spell on the target if the spell's level is equal to or less than the level of the spell slot you use.<\/p>"},"dissonant whispers":{"n":"Dissonant Whispers","l":1,"sc":"Enchantment","t":"Action","r":"60 ft","c":"V","d":"Instantaneous","conc":false,"rit":false,"cls":["Bard"],"src":"XPHB","u":"https://5e.tools/spells.html#dissonant%20whispers_xphb","srd":true,"h":"<p>One creature of your choice that you can see within range hears a discordant melody in its mind. The target makes a Wisdom saving throw. On a failed save, it takes 3d6 Psychic damage and must immediately use its <a class=\"lk\" data-l=\"rule|reaction\">Reaction<\/a>, if available, to move as far away from you as it can, using the safest route. On a successful save, the target takes half as much damage only.<\/p>","hl":"<p><b><i>Using a Higher-Level Spell Slot.<\/i><\/b> The damage increases by 1d6 for each spell slot level above 1.<\/p>"},"dominate beast":{"n":"Dominate Beast","l":4,"sc":"Enchantment","t":"Action","r":"60 ft","c":"V, S","d":"Up to 1 minute","conc":true,"rit":false,"cls":["Druid","Ranger","Sorcerer"],"src":"XPHB","u":"https://5e.tools/spells.html#dominate%20beast_xphb","srd":true,"h":"<p>One Beast you can see within range must succeed on a Wisdom saving throw or have the <a class=\"lk\" data-l=\"cond|charmed\">Charmed<\/a> condition for the duration. The target has <a class=\"lk\" data-l=\"rule|advantage\">Advantage<\/a> on the save if you or your allies are fighting it. Whenever the target takes damage, it repeats the save, ending the spell on itself on a success.<\/p><p>You have a telepathic link with the <a class=\"lk\" data-l=\"cond|charmed\">Charmed<\/a> target while the two of you are on the same plane of existence. On your turn, you can use this link to issue commands to the target (no action required), such as \"<a class=\"lk\" data-l=\"act|attack\">Attack<\/a> that creature,\" \"Move over there,\" or \"Fetch that object.\" The target does its best to obey on its turn. If it completes an order and doesn't receive further direction from you, it acts and moves as it likes, focusing on protecting itself.<\/p><p>You can command the target to take a <a class=\"lk\" data-l=\"rule|reaction\">Reaction<\/a> but must take your own <a class=\"lk\" data-l=\"rule|reaction\">Reaction<\/a> to do so.<\/p>","hl":"<p><b><i>Using a Higher-Level Spell Slot.<\/i><\/b> Your <a class=\"lk\" data-l=\"cond|concentration\">Concentration<\/a> can last longer with a spell slot of level 5 (up to 10 minutes), 6 (up to 1 hour), or 7+ (up to 8 hours).<\/p>"},"dominate monster":{"n":"Dominate Monster","l":8,"sc":"Enchantment","t":"Action","r":"60 ft","c":"V, S","d":"Up to 1 hour","conc":true,"rit":false,"cls":["Bard","Sorcerer","Warlock","Wizard"],"src":"XPHB","u":"https://5e.tools/spells.html#dominate%20monster_xphb","srd":true,"h":"<p>One creature you can see within range must succeed on a Wisdom saving throw or have the <a class=\"lk\" data-l=\"cond|charmed\">Charmed<\/a> condition for the duration. The target has <a class=\"lk\" data-l=\"rule|advantage\">Advantage<\/a> on the save if you or your allies are fighting it. Whenever the target takes damage, it repeats the save, ending the spell on itself on a success.<\/p><p>You have a telepathic link with the <a class=\"lk\" data-l=\"cond|charmed\">Charmed<\/a> target while the two of you are on the same plane of existence. On your turn, you can use this link to issue commands to the target (no action required), such as \"<a class=\"lk\" data-l=\"act|attack\">Attack<\/a> that creature,\" \"Move over there,\" or \"Fetch that object.\" The target does its best to obey on its turn. If it completes an order and doesn't receive further direction from you, it acts and moves as it likes, focusing on protecting itself.<\/p><p>You can command the target to take a <a class=\"lk\" data-l=\"rule|reaction\">Reaction<\/a> but must take your own <a class=\"lk\" data-l=\"rule|reaction\">Reaction<\/a> to do so.<\/p>","hl":"<p><b><i>Using a Higher-Level Spell Slot.<\/i><\/b> Your <a class=\"lk\" data-l=\"cond|concentration\">Concentration<\/a> can last longer with a level 9 spell slot (up to 8 hours).<\/p>"},"dominate person":{"n":"Dominate Person","l":5,"sc":"Enchantment","t":"Action","r":"60 ft","c":"V, S","d":"Up to 1 minute","conc":true,"rit":false,"cls":["Bard","Sorcerer","Wizard"],"src":"XPHB","u":"https://5e.tools/spells.html#dominate%20person_xphb","srd":true,"h":"<p>One Humanoid you can see within range must succeed on a Wisdom saving throw or have the <a class=\"lk\" data-l=\"cond|charmed\">Charmed<\/a> condition for the duration. The target has <a class=\"lk\" data-l=\"rule|advantage\">Advantage<\/a> on the save if you or your allies are fighting it. Whenever the target takes damage, it repeats the save, ending the spell on itself on a success.<\/p><p>You have a telepathic link with the <a class=\"lk\" data-l=\"cond|charmed\">Charmed<\/a> target while the two of you are on the same plane of existence. On your turn, you can use this link to issue commands to the target (no action required), such as \"<a class=\"lk\" data-l=\"act|attack\">Attack<\/a> that creature,\" \"Move over there,\" or \"Fetch that object.\" The target does its best to obey on its turn. If it completes an order and doesn't receive further direction from you, it acts and moves as it likes, focusing on protecting itself.<\/p><p>You can command the target to take a <a class=\"lk\" data-l=\"rule|reaction\">Reaction<\/a> but must take your own <a class=\"lk\" data-l=\"rule|reaction\">Reaction<\/a> to do so.<\/p>","hl":"<p><b><i>Using a Higher-Level Spell Slot.<\/i><\/b> Your <a class=\"lk\" data-l=\"cond|concentration\">Concentration<\/a> can last longer with a spell slot of level 6 (up to 10 minutes), 7 (up to 1 hour), or 8+ (up to 8 hours).<\/p>"},"dragon's breath":{"n":"Dragon's Breath","l":2,"sc":"Transmutation","t":"Bonus Action","r":"Touch","c":"V, S, M (a hot pepper)","d":"Up to 1 minute","conc":true,"rit":false,"cls":["Sorcerer","Wizard"],"src":"XPHB","u":"https://5e.tools/spells.html#dragon%27s%20breath_xphb","srd":true,"h":"<p>You touch one willing creature, and choose Acid, Cold, Fire, Lightning, or Poison. Until the spell ends, the target can take a <a class=\"lk\" data-l=\"act|magic\">Magic<\/a> action to exhale a 15-foot <a class=\"lk\" data-l=\"rule|cone [area of effect]\">Cone<\/a>. Each creature in that area makes a Dexterity saving throw, taking 3d6 damage of the chosen type on a failed save or half as much damage on a successful one.<\/p>","hl":"<p><b><i>Using a Higher-Level Spell Slot.<\/i><\/b> The damage increases by 1d6 for each spell slot level above 2.<\/p>"},"dream":{"n":"Dream","l":5,"sc":"Illusion","t":"1 minute","r":"Self","c":"V, S, M (a handful of sand)","d":"8 hours","conc":false,"rit":false,"cls":["Bard","Warlock","Wizard"],"src":"XPHB","u":"https://5e.tools/spells.html#dream_xphb","srd":true,"h":"<p>You target a creature you know on the same plane of existence. You or a willing creature you touch enters a trance state to act as a dream messenger. While in the trance, the messenger is <a class=\"lk\" data-l=\"cond|incapacitated\">Incapacitated<\/a> and has a <a class=\"lk\" data-l=\"rule|speed\">Speed<\/a> of 0.<\/p><p>If the target is asleep, the messenger appears in the target's dreams and can converse with the target as long as it remains asleep, through the spell's duration. The messenger can also shape the dream's environment, creating landscapes, objects, and other images. The messenger can emerge from the trance at any time, ending the spell. The target recalls the dream perfectly upon waking.<\/p><p>If the target is awake when you cast the spell, the messenger knows it and can either end the trance (and the spell) or wait for the target to sleep, at which point the messenger enters its dreams.<\/p><p>You can make the messenger terrifying to the target. If you do so, the messenger can deliver a message of no more than ten words, and then the target makes a Wisdom saving throw. On a failed save, the target gains no benefit from its rest, and it takes 3d6 Psychic damage when it wakes up.<\/p>"},"druidcraft":{"n":"Druidcraft","l":0,"sc":"Transmutation","t":"Action","r":"30 ft","c":"V, S","d":"Instantaneous","conc":false,"rit":false,"cls":["Druid"],"src":"XPHB","u":"https://5e.tools/spells.html#druidcraft_xphb","srd":true,"h":"<p>Whispering to the spirits of nature, you create one of the following effects within range.<\/p><p><b><i>Weather Sensor.<\/i><\/b> You create a Tiny, harmless sensory effect that predicts what the weather will be at your location for the next 24 hours. The effect might manifest as a golden orb for clear skies, a cloud for rain, falling snowflakes for snow, and so on. This effect persists for 1 round.<\/p><p><b><i>Bloom.<\/i><\/b> You instantly make a flower blossom, a seed pod open, or a leaf bud bloom.<\/p><p><b><i>Sensory Effect.<\/i><\/b> You create a harmless sensory effect, such as falling leaves, spectral dancing fairies, a gentle breeze, the sound of an animal, or the faint odor of skunk. The effect must fit in a 5-foot <a class=\"lk\" data-l=\"rule|cube [area of effect]\">Cube<\/a>.<\/p><p><b><i>Fire Play.<\/i><\/b> You light or snuff out a candle, a torch, or a campfire.<\/p>"},"earthquake":{"n":"Earthquake","l":8,"sc":"Transmutation","t":"Action","r":"500 ft","c":"V, S, M (a fractured rock)","d":"Up to 1 minute","conc":true,"rit":false,"cls":["Cleric","Druid","Sorcerer"],"src":"XPHB","u":"https://5e.tools/spells.html#earthquake_xphb","srd":true,"h":"<p>Choose a point on the ground that you can see within range. For the duration, an intense tremor rips through the ground in a 100-foot-radius circle centered on that point. The ground there is <a class=\"lk\" data-l=\"rule|difficult terrain\">Difficult Terrain<\/a>.<\/p><p>When you cast this spell and at the end of each of your turns for the duration, each creature on the ground in the area makes a Dexterity saving throw. On a failed save, a creature has the <a class=\"lk\" data-l=\"cond|prone\">Prone<\/a> condition, and its <a class=\"lk\" data-l=\"cond|concentration\">Concentration<\/a> is broken.<\/p><p>You can also cause the effects below.<\/p><p><b><i>Fissures.<\/i><\/b> A total of 1d6 fissures open in the spell's area at the end of the turn you cast it. You choose the fissures' locations, which can't be under structures. Each fissure is 1d10 × 10 feet deep and 10 feet wide, and it extends from one edge of the spell's area to another edge. A creature in the same space as a fissure must succeed on a Dexterity saving throw or fall in. A creature that successfully saves moves with the fissure's edge as it opens.<\/p><p><b><i>Structures.<\/i><\/b> The tremor deals 50 Bludgeoning damage to any structure in contact with the ground in the area when you cast the spell and at the end of each of your turns until the spell ends. If a structure drops to 0 <a class=\"lk\" data-l=\"rule|hit points\">Hit Points<\/a>, it collapses.<\/p><p>A creature within a distance from a collapsing structure equal to half the structure's height makes a Dexterity saving throw. On a failed save, the creature takes 12d6 Bludgeoning damage, has the <a class=\"lk\" data-l=\"cond|prone\">Prone<\/a> condition, and is buried in the rubble, requiring a DC 20 Strength (<a class=\"lk\" data-l=\"skill|athletics\">Athletics<\/a>) check as an action to escape. On a successful save, the creature takes half as much damage only.<\/p>"},"eldritch blast":{"n":"Eldritch Blast","l":0,"sc":"Evocation","t":"Action","r":"120 ft","c":"V, S","d":"Instantaneous","conc":false,"rit":false,"cls":["Warlock"],"src":"XPHB","u":"https://5e.tools/spells.html#eldritch%20blast_xphb","srd":true,"h":"<p>You hurl a beam of crackling energy. Make a ranged spell attack against one creature or object in range. On a hit, the target takes 1d10 Force damage.<\/p>","hl":"<p><b><i>Cantrip Upgrade.<\/i><\/b> The spell creates two beams at level 5, three beams at level 11, and four beams at level 17. You can direct the beams at the same target or at different ones. Make a separate attack roll for each beam.<\/p>"},"elementalism":{"n":"Elementalism","l":0,"sc":"Transmutation","t":"Action","r":"30 ft","c":"V, S","d":"Instantaneous","conc":false,"rit":false,"cls":["Druid","Sorcerer","Wizard"],"src":"XPHB","u":"https://5e.tools/spells.html#elementalism_xphb","srd":true,"h":"<p>You exert control over the elements, creating one of the following effects within range.<\/p><p><b><i>Beckon Air.<\/i><\/b> You create a breeze strong enough to ripple cloth, stir dust, rustle leaves, and close open doors and shutters, all in a 5-foot <a class=\"lk\" data-l=\"rule|cube [area of effect]\">Cube<\/a>. Doors and shutters being held open by someone or something aren't affected.<\/p><p><b><i>Beckon Earth.<\/i><\/b> You create a thin shroud of dust or sand that covers surfaces in a 5-foot-square area, or you cause a single word to appear in your handwriting in a patch of dirt or sand.<\/p><p><b><i>Beckon Fire.<\/i><\/b> You create a thin cloud of harmless embers and colored, scented smoke in a 5-foot <a class=\"lk\" data-l=\"rule|cube [area of effect]\">Cube<\/a>. You choose the color and scent, and the embers can light candles, torches, or lamps in that area. The smoke's scent lingers for 1 minute.<\/p><p><b><i>Beckon Water.<\/i><\/b> You create a spray of cool mist that lightly dampens creatures and objects in a 5-foot <a class=\"lk\" data-l=\"rule|cube [area of effect]\">Cube<\/a>. Alternatively, you create 1 cup of clean water either in an open container or on a surface, and the water evaporates in 1 minute.<\/p><p><b><i>Sculpt Element.<\/i><\/b> You cause dirt, sand, fire, smoke, mist, or water that can fit in a 1-foot <a class=\"lk\" data-l=\"rule|cube [area of effect]\">Cube<\/a> to assume a crude shape (such as that of a creature) for 1 hour.<\/p>"},"enhance ability":{"n":"Enhance Ability","l":2,"sc":"Transmutation","t":"Action","r":"Touch","c":"V, S, M (fur or a feather)","d":"Up to 1 hour","conc":true,"rit":false,"cls":["Bard","Cleric","Druid","Ranger","Sorcerer","Wizard"],"src":"XPHB","u":"https://5e.tools/spells.html#enhance%20ability_xphb","srd":true,"h":"<p>You touch a creature and choose Strength, Dexterity, Intelligence, Wisdom, or Charisma. For the duration, the target has <a class=\"lk\" data-l=\"rule|advantage\">Advantage<\/a> on ability checks using the chosen ability.<\/p>","hl":"<p><b><i>Using a Higher-Level Spell Slot.<\/i><\/b> You can target one additional creature for each spell slot level above 2. You can choose a different ability for each target.<\/p>"},"enlarge/reduce":{"n":"Enlarge/Reduce","l":2,"sc":"Transmutation","t":"Action","r":"30 ft","c":"V, S, M (a pinch of powdered iron)","d":"Up to 1 minute","conc":true,"rit":false,"cls":["Bard","Druid","Sorcerer","Wizard"],"src":"XPHB","u":"https://5e.tools/spells.html#enlarge/reduce_xphb","srd":true,"h":"<p>For the duration, the spell enlarges or reduces a creature or an object you can see within range (see the chosen effect below). A targeted object must be neither worn nor carried. If the target is an unwilling creature, it can make a Constitution saving throw. On a successful save, the spell has no effect.<\/p><p>Everything that a targeted creature is wearing and carrying changes size with it. Any item it drops returns to normal size at once. A thrown weapon or piece of ammunition returns to normal size immediately after it hits or misses a target.<\/p><p><b><i>Enlarge.<\/i><\/b> The target's size increases by one category—from Medium to Large, for example. The target also has <a class=\"lk\" data-l=\"rule|advantage\">Advantage<\/a> on Strength checks and Strength saving throws. The target's attacks with its enlarged weapons or Unarmed Strikes deal an extra 1d4 damage on a hit.<\/p><p><b><i>Reduce.<\/i><\/b> The target's size decreases by one category—from Medium to Small, for example. The target also has <a class=\"lk\" data-l=\"rule|disadvantage\">Disadvantage<\/a> on Strength checks and Strength saving throws. The target's attacks with its reduced weapons or Unarmed Strikes deal 1d4 less damage on a hit (this can't reduce the damage below 1).<\/p>"},"enthrall":{"n":"Enthrall","l":2,"sc":"Enchantment","t":"Action","r":"60 ft","c":"V, S","d":"Up to 1 minute","conc":true,"rit":false,"cls":["Bard","Warlock"],"src":"XPHB","u":"https://5e.tools/spells.html#enthrall_xphb","srd":true,"h":"<p>You weave a distracting string of words, causing creatures of your choice that you can see within range to make a Wisdom saving throw. Any creature you or your companions are fighting automatically succeeds on this save. On a failed save, a target has a -10 penalty to Wisdom (<a class=\"lk\" data-l=\"skill|perception\">Perception<\/a>) checks and Passive <a class=\"lk\" data-l=\"skill|perception\">Perception<\/a> until the spell ends.<\/p>"},"etherealness":{"n":"Etherealness","l":7,"sc":"Conjuration","t":"Action","r":"Self","c":"V, S","d":"8 hours","conc":false,"rit":false,"cls":["Bard","Cleric","Sorcerer","Warlock","Wizard"],"src":"XPHB","u":"https://5e.tools/spells.html#etherealness_xphb","srd":true,"h":"<p>You step into the border regions of the Ethereal Plane, where it overlaps with your current plane. You remain in the Border Ethereal for the duration. During this time, you can move in any direction. If you move up or down, every foot of movement costs an extra foot. You can perceive the plane you left, which looks gray, and you can't see anything there more than 60 feet away.<\/p><p>While on the Ethereal Plane, you can affect and be affected only by creatures, objects, and effects on that plane. Creatures that aren't on the Ethereal Plane can't perceive or interact with you unless a feature gives them the ability to do so.<\/p><p>When the spell ends, you return to the plane you left in the spot that corresponds to your space in the Border Ethereal. If you appear in an occupied space, you are shunted to the nearest unoccupied space and take Force damage equal to twice the number of feet you are moved.<\/p><p>This spell ends instantly if you cast it while you are on the Ethereal Plane or a plane that doesn't border it, such as one of the Outer Planes.<\/p>","hl":"<p><b><i>Using a Higher-Level Spell Slot.<\/i><\/b> You can target up to three willing creatures (including yourself) for each spell slot level above 7. The creatures must be within 10 feet of you when you cast the spell.<\/p>"},"evard's black tentacles":{"n":"Evard's Black Tentacles","l":4,"sc":"Conjuration","t":"Action","r":"90 ft","c":"V, S, M (a tentacle)","d":"Up to 1 minute","conc":true,"rit":false,"cls":["Wizard"],"src":"XPHB","u":"https://5e.tools/spells.html#evard%27s%20black%20tentacles_xphb","srd":true,"h":"<p>Squirming, ebony tentacles fill a 20-foot square on ground that you can see within range. For the duration, these tentacles turn the ground in that area into <a class=\"lk\" data-l=\"rule|difficult terrain\">Difficult Terrain<\/a>.<\/p><p>Each creature in that area makes a Strength saving throw. On a failed save, it takes 3d6 Bludgeoning damage, and it has the <a class=\"lk\" data-l=\"cond|restrained\">Restrained<\/a> condition until the spell ends. A creature also makes that save if it enters the area or ends its turn there. A creature makes that save only once per turn.<\/p><p>A <a class=\"lk\" data-l=\"cond|restrained\">Restrained<\/a> creature can take an action to make a Strength (<a class=\"lk\" data-l=\"skill|athletics\">Athletics<\/a>) check against your spell save DC, ending the condition on itself on a success.<\/p>"},"expeditious retreat":{"n":"Expeditious Retreat","l":1,"sc":"Transmutation","t":"Bonus Action","r":"Self","c":"V, S","d":"Up to 10 minutes","conc":true,"rit":false,"cls":["Sorcerer","Warlock","Wizard"],"src":"XPHB","u":"https://5e.tools/spells.html#expeditious%20retreat_xphb","srd":true,"h":"<p>You take the <a class=\"lk\" data-l=\"act|dash\">Dash<\/a> action, and until the spell ends, you can take that action again as a <a class=\"lk\" data-l=\"rule|bonus action\">Bonus Action<\/a>.<\/p>"},"eyebite":{"n":"Eyebite","l":6,"sc":"Necromancy","t":"Action","r":"Self","c":"V, S","d":"Up to 1 minute","conc":true,"rit":false,"cls":["Bard","Sorcerer","Warlock","Wizard"],"src":"XPHB","u":"https://5e.tools/spells.html#eyebite_xphb","srd":true,"h":"<p>For the duration, your eyes become an inky void. One creature of your choice within 60 feet of you that you can see must succeed on a Wisdom saving throw or be affected by one of the following effects of your choice for the duration.<\/p><p>On each of your turns until the spell ends, you can take a <a class=\"lk\" data-l=\"act|magic\">Magic<\/a> action to target another creature but can't target a creature again if it has succeeded on a save against this casting of the spell.<\/p><p><b><i>Asleep.<\/i><\/b> The target has the <a class=\"lk\" data-l=\"cond|unconscious\">Unconscious<\/a> condition. It wakes up if it takes any damage or if another creature takes an action to shake it awake.<\/p><p><b><i>Panicked.<\/i><\/b> The target has the <a class=\"lk\" data-l=\"cond|frightened\">Frightened<\/a> condition. On each of its turns, the <a class=\"lk\" data-l=\"cond|frightened\">Frightened<\/a> target must take the <a class=\"lk\" data-l=\"act|dash\">Dash<\/a> action and move away from you by the safest and shortest route available. If the target moves to a space at least 60 feet away from you where it can't see you, this effect ends.<\/p><p><b><i>Sickened.<\/i><\/b> The target has the <a class=\"lk\" data-l=\"cond|poisoned\">Poisoned<\/a> condition.<\/p>"},"false life":{"n":"False Life","l":1,"sc":"Necromancy","t":"Action","r":"Self","c":"V, S, M (a drop of alcohol)","d":"Instantaneous","conc":false,"rit":false,"cls":["Sorcerer","Wizard"],"src":"XPHB","u":"https://5e.tools/spells.html#false%20life_xphb","srd":true,"h":"<p>You gain 2d4 + 4 <a class=\"lk\" data-l=\"rule|temporary hit points\">Temporary Hit Points<\/a>.<\/p>","hl":"<p><b><i>Using a Higher-Level Spell Slot.<\/i><\/b> You gain 5 additional <a class=\"lk\" data-l=\"rule|temporary hit points\">Temporary Hit Points<\/a> for each spell slot level above 1.<\/p>"},"fear":{"n":"Fear","l":3,"sc":"Illusion","t":"Action","r":"Self (30-ft Cone)","c":"V, S, M (a white feather)","d":"Up to 1 minute","conc":true,"rit":false,"cls":["Bard","Sorcerer","Warlock","Wizard"],"src":"XPHB","u":"https://5e.tools/spells.html#fear_xphb","srd":true,"h":"<p>Each creature in a 30-foot <a class=\"lk\" data-l=\"rule|cone [area of effect]\">Cone<\/a> must succeed on a Wisdom saving throw or drop whatever it is holding and have the <a class=\"lk\" data-l=\"cond|frightened\">Frightened<\/a> condition for the duration.<\/p><p>A <a class=\"lk\" data-l=\"cond|frightened\">Frightened<\/a> creature takes the <a class=\"lk\" data-l=\"act|dash\">Dash<\/a> action and moves away from you by the safest route on each of its turns unless there is nowhere to move. If the creature ends its turn in a space where it doesn't have line of sight to you, the creature makes a Wisdom saving throw. On a successful save, the spell ends on that creature.<\/p>"},"feather fall":{"n":"Feather Fall","l":1,"sc":"Transmutation","t":"Reaction, which you take when you or a creature you can see within 60 feet of you falls","r":"60 ft","c":"V, M (a small feather or piece of down)","d":"1 minute","conc":false,"rit":false,"cls":["Bard","Sorcerer","Wizard"],"src":"XPHB","u":"https://5e.tools/spells.html#feather%20fall_xphb","srd":true,"h":"<p>Choose up to five falling creatures within range. A falling creature's rate of descent slows to 60 feet per round until the spell ends. If a creature lands before the spell ends, the creature takes no damage from the fall, and the spell ends for that creature.<\/p>"},"find familiar":{"n":"Find Familiar","l":1,"sc":"Conjuration","t":"1 hour","r":"10 ft","c":"V, S, M (burning incense worth 10+ GP, which the spell consumes)","d":"Instantaneous","conc":false,"rit":true,"cls":["Wizard"],"src":"XPHB","u":"https://5e.tools/spells.html#find%20familiar_xphb","srd":true,"h":"<p>You gain the service of a familiar, a spirit that takes an animal form you choose: Bat, Cat, Frog, Hawk, Lizard, Octopus, Owl, Rat, Raven, Spider, Weasel, or another Beast that has a Challenge Rating of 0. Appearing in an unoccupied space within range, the familiar has the statistics of the chosen form, though it is a Celestial, Fey, or Fiend (your choice) instead of a Beast. Your familiar acts independently of you, but it obeys your commands.<\/p><p><b><i>Telepathic Connection.<\/i><\/b> While your familiar is within 100 feet of you, you can communicate with it telepathically. Additionally, as a <a class=\"lk\" data-l=\"rule|bonus action\">Bonus Action<\/a>, you can see through the familiar's eyes and hear what it hears until the start of your next turn, gaining the benefits of any special senses it has.<\/p><p>Finally, when you cast a spell with a range of touch, your familiar can deliver the touch. Your familiar must be within 100 feet of you, and it must take a <a class=\"lk\" data-l=\"rule|reaction\">Reaction<\/a> to deliver the touch when you cast the spell.<\/p><p><b><i>Combat.<\/i><\/b> The familiar is an ally to you and your allies. It rolls its own <a class=\"lk\" data-l=\"rule|initiative\">Initiative<\/a> and acts on its own turn. A familiar can't attack, but it can take other actions as normal.<\/p><p><b><i>Disappearance of the Familiar.<\/i><\/b> When the familiar drops to 0 <a class=\"lk\" data-l=\"rule|hit points\">Hit Points<\/a>, it disappears. It reappears after you cast this spell again. As a <a class=\"lk\" data-l=\"act|magic\">Magic<\/a> action, you can temporarily dismiss the familiar to a pocket dimension. Alternatively, you can dismiss it forever. As a <a class=\"lk\" data-l=\"act|magic\">Magic<\/a> action while it is temporarily dismissed, you can cause it to reappear in an unoccupied space within 30 feet of you. Whenever the familiar drops to 0 <a class=\"lk\" data-l=\"rule|hit points\">Hit Points<\/a> or disappears into the pocket dimension, it leaves behind in its space anything it was wearing or carrying.<\/p><p><b><i>One Familiar Only.<\/i><\/b> You can't have more than one familiar at a time. If you cast this spell while you have a familiar, you instead cause it to adopt a new eligible form.<\/p>"},"finger of death":{"n":"Finger of Death","l":7,"sc":"Necromancy","t":"Action","r":"60 ft","c":"V, S","d":"Instantaneous","conc":false,"rit":false,"cls":["Sorcerer","Warlock","Wizard"],"src":"XPHB","u":"https://5e.tools/spells.html#finger%20of%20death_xphb","srd":true,"h":"<p>You unleash negative energy toward a creature you can see within range. The target makes a Constitution saving throw, taking 7d8 + 30 Necrotic damage on a failed save or half as much damage on a successful one.<\/p><p>A Humanoid killed by this spell rises at the start of your next turn as a Zombie that follows your verbal orders.<\/p>"},"fire bolt":{"n":"Fire Bolt","l":0,"sc":"Evocation","t":"Action","r":"120 ft","c":"V, S","d":"Instantaneous","conc":false,"rit":false,"cls":["Sorcerer","Wizard"],"src":"XPHB","u":"https://5e.tools/spells.html#fire%20bolt_xphb","srd":true,"h":"<p>You hurl a mote of fire at a creature or an object within range. Make a ranged spell attack against the target. On a hit, the target takes 1d10 Fire damage. A flammable object hit by this spell starts burning if it isn't being worn or carried.<\/p>","hl":"<p><b><i>Cantrip Upgrade.<\/i><\/b> The damage increases by 1d10 when you reach levels 5 (2d10), 11 (3d10), and 17 (4d10).<\/p>"},"fire shield":{"n":"Fire Shield","l":4,"sc":"Evocation","t":"Action","r":"Self","c":"V, S, M (a bit of phosphorus or a firefly)","d":"10 minutes","conc":false,"rit":false,"cls":["Druid","Sorcerer","Wizard"],"src":"XPHB","u":"https://5e.tools/spells.html#fire%20shield_xphb","srd":true,"h":"<p>Wispy flames wreathe your body for the duration, shedding <a class=\"lk\" data-l=\"rule|bright light\">Bright Light<\/a> in a 10-foot radius and <a class=\"lk\" data-l=\"rule|dim light\">Dim Light<\/a> for an additional 10 feet.<\/p><p>The flames provide you with a warm shield or a chill shield, as you choose. The warm shield grants you <a class=\"lk\" data-l=\"rule|resistance\">Resistance<\/a> to Cold damage, and the chill shield grants you <a class=\"lk\" data-l=\"rule|resistance\">Resistance<\/a> to Fire damage.<\/p><p>In addition, whenever a creature within 5 feet of you hits you with a melee attack roll, the shield erupts with flame. The attacker takes 2d8 Fire damage from a warm shield or 2d8 Cold damage from a chill shield.<\/p>"},"fire storm":{"n":"Fire Storm","l":7,"sc":"Evocation","t":"Action","r":"150 ft","c":"V, S","d":"Instantaneous","conc":false,"rit":false,"cls":["Cleric","Druid","Sorcerer"],"src":"XPHB","u":"https://5e.tools/spells.html#fire%20storm_xphb","srd":true,"h":"<p>A storm of fire appears within range. The area of the storm consists of up to ten 10-foot Cubes, which you arrange as you like. Each <a class=\"lk\" data-l=\"rule|cube [area of effect]\">Cube<\/a> must be contiguous with at least one other <a class=\"lk\" data-l=\"rule|cube [area of effect]\">Cube<\/a>. Each creature in the area makes a Dexterity saving throw, taking 7d10 Fire damage on a failed save or half as much damage on a successful one.<\/p><p>Flammable objects in the area that aren't being worn or carried start burning.<\/p>"},"fireball":{"n":"Fireball","l":3,"sc":"Evocation","t":"Action","r":"150 ft","c":"V, S, M (a ball of bat guano and sulfur)","d":"Instantaneous","conc":false,"rit":false,"cls":["Sorcerer","Wizard"],"src":"XPHB","u":"https://5e.tools/spells.html#fireball_xphb","srd":true,"h":"<p>A bright streak flashes from you to a point you choose within range and then blossoms with a low roar into a fiery explosion. Each creature in a 20-foot-radius <a class=\"lk\" data-l=\"rule|sphere [area of effect]\">Sphere<\/a> centered on that point makes a Dexterity saving throw, taking 8d6 Fire damage on a failed save or half as much damage on a successful one.<\/p><p>Flammable objects in the area that aren't being worn or carried start burning.<\/p>","hl":"<p><b><i>Using a Higher-Level Spell Slot.<\/i><\/b> The damage increases by 1d6 for each spell slot level above 3.<\/p>"},"flame blade":{"n":"Flame Blade","l":2,"sc":"Evocation","t":"Bonus Action","r":"Self","c":"V, S, M (a sumac leaf)","d":"Up to 10 minutes","conc":true,"rit":false,"cls":["Druid","Sorcerer"],"src":"XPHB","u":"https://5e.tools/spells.html#flame%20blade_xphb","srd":true,"h":"<p>You evoke a fiery blade in your free hand. The blade is similar in size and shape to a scimitar, and it lasts for the duration. If you let go of the blade, it disappears, but you can evoke it again as a <a class=\"lk\" data-l=\"rule|bonus action\">Bonus Action<\/a>.<\/p><p>As a <a class=\"lk\" data-l=\"act|magic\">Magic<\/a> action, you can make a melee spell attack with the fiery blade. On a hit, the target takes Fire damage equal to 3d6 plus your spellcasting ability modifier.<\/p><p>The flaming blade sheds <a class=\"lk\" data-l=\"rule|bright light\">Bright Light<\/a> in a 10-foot radius and <a class=\"lk\" data-l=\"rule|dim light\">Dim Light<\/a> for an additional 10 feet.<\/p>","hl":"<p><b><i>Using a Higher-Level Spell Slot.<\/i><\/b> The damage increases by 1d6 for each spell slot level above 2.<\/p>"},"flaming sphere":{"n":"Flaming Sphere","l":2,"sc":"Evocation","t":"Action","r":"60 ft","c":"V, S, M (a ball of wax)","d":"Up to 1 minute","conc":true,"rit":false,"cls":["Druid","Sorcerer","Wizard"],"src":"XPHB","u":"https://5e.tools/spells.html#flaming%20sphere_xphb","srd":true,"h":"<p>You create a 5-foot-diameter sphere of fire in an unoccupied space on the ground within range. It lasts for the duration. Any creature that ends its turn within 5 feet of the sphere makes a Dexterity saving throw, taking 2d6 Fire damage on a failed save or half as much damage on a successful one.<\/p><p>As a <a class=\"lk\" data-l=\"rule|bonus action\">Bonus Action<\/a>, you can move the sphere up to 30 feet, rolling it along the ground. If you move the sphere into a creature's space, that creature makes the save against the sphere, and the sphere stops moving for the turn.<\/p><p>When you move the sphere, you can direct it over barriers up to 5 feet tall and jump it across pits up to 10 feet wide. Flammable objects that aren't being worn or carried start burning if touched by the sphere, and it sheds <a class=\"lk\" data-l=\"rule|bright light\">Bright Light<\/a> in a 20-foot radius and <a class=\"lk\" data-l=\"rule|dim light\">Dim Light<\/a> for an additional 20 feet.<\/p>","hl":"<p><b><i>Using a Higher-Level Spell Slot.<\/i><\/b> The damage increases by 1d6 for each spell slot level above 2.<\/p>"},"flesh to stone":{"n":"Flesh to Stone","l":6,"sc":"Transmutation","t":"Action","r":"60 ft","c":"V, S, M (a cockatrice feather)","d":"Up to 1 minute","conc":true,"rit":false,"cls":["Druid","Sorcerer","Wizard"],"src":"XPHB","u":"https://5e.tools/spells.html#flesh%20to%20stone_xphb","srd":true,"h":"<p>You attempt to turn one creature that you can see within range into stone. The target makes a Constitution saving throw. On a failed save, it has the <a class=\"lk\" data-l=\"cond|restrained\">Restrained<\/a> condition for the duration. On a successful save, its <a class=\"lk\" data-l=\"rule|speed\">Speed<\/a> is 0 until the start of your next turn. Constructs automatically succeed on the save.<\/p><p>A <a class=\"lk\" data-l=\"cond|restrained\">Restrained<\/a> target makes another Constitution saving throw at the end of each of its turns. If it successfully saves against this spell three times, the spell ends. If it fails its saves three times, it is turned to stone and has the <a class=\"lk\" data-l=\"cond|petrified\">Petrified<\/a> condition for the duration. The successes and failures needn't be consecutive; keep track of both until the target collects three of a kind.<\/p><p>If you maintain your <a class=\"lk\" data-l=\"cond|concentration\">Concentration<\/a> on this spell for the entire possible duration, the target is <a class=\"lk\" data-l=\"cond|petrified\">Petrified<\/a> until the condition is ended by <a class=\"lk\" data-l=\"spell|greater restoration\">Greater Restoration<\/a> or similar magic.<\/p>"},"fly":{"n":"Fly","l":3,"sc":"Transmutation","t":"Action","r":"Touch","c":"V, S, M (a feather)","d":"Up to 10 minutes","conc":true,"rit":false,"cls":["Sorcerer","Warlock","Wizard"],"src":"XPHB","u":"https://5e.tools/spells.html#fly_xphb","srd":true,"h":"<p>You touch a willing creature. For the duration, the target gains a <a class=\"lk\" data-l=\"rule|fly speed\">Fly Speed<\/a> of 60 feet and can hover. When the spell ends, the target falls if it is still aloft unless it can stop the fall.<\/p>","hl":"<p><b><i>Using a Higher-Level Spell Slot.<\/i><\/b> You can target one additional creature for each spell slot level above 3.<\/p>"},"fog cloud":{"n":"Fog Cloud","l":1,"sc":"Conjuration","t":"Action","r":"120 ft","c":"V, S","d":"Up to 1 hour","conc":true,"rit":false,"cls":["Druid","Ranger","Sorcerer","Wizard"],"src":"XPHB","u":"https://5e.tools/spells.html#fog%20cloud_xphb","srd":true,"h":"<p>You create a 20-foot-radius <a class=\"lk\" data-l=\"rule|sphere [area of effect]\">Sphere<\/a> of fog centered on a point within range. The <a class=\"lk\" data-l=\"rule|sphere [area of effect]\">Sphere<\/a> is <a class=\"lk\" data-l=\"rule|heavily obscured\">Heavily Obscured<\/a>. It lasts for the duration or until a strong wind (such as one created by <a class=\"lk\" data-l=\"spell|gust of wind\">Gust of Wind<\/a>) disperses it.<\/p>","hl":"<p><b><i>Using a Higher-Level Spell Slot.<\/i><\/b> The fog's radius increases by 20 feet for each spell slot level above 1.<\/p>"},"forcecage":{"n":"Forcecage","l":7,"sc":"Evocation","t":"Action","r":"100 ft","c":"V, S, M (ruby dust worth 1,500+ GP, which the spell consumes)","d":"Up to 1 hour","conc":true,"rit":false,"cls":["Bard","Warlock","Wizard"],"src":"XPHB","u":"https://5e.tools/spells.html#forcecage_xphb","srd":true,"h":"<p>An immobile, <a class=\"lk\" data-l=\"cond|invisible\">Invisible<\/a>, <a class=\"lk\" data-l=\"rule|cube [area of effect]\">Cube<\/a>-shaped prison composed of magical force springs into existence around an area you choose within range. The prison can be a cage or a solid box, as you choose.<\/p><p>A prison in the shape of a cage can be up to 20 feet on a side and is made from 1/2-inch diameter bars spaced 1/2 inch apart. A prison in the shape of a box can be up to 10 feet on a side, creating a solid barrier that prevents any matter from passing through it and blocking any spells cast into or out from the area.<\/p><p>When you cast the spell, any creature that is completely inside the cage's area is trapped. Creatures only partially within the area, or those too large to fit inside it, are pushed away from the center of the area until they are completely outside it.<\/p><p>A creature inside the cage can't leave it by nonmagical means. If the creature tries to use teleportation or interplanar travel to leave, it must first make a Charisma saving throw. On a successful save, the creature can use that magic to exit the cage. On a failed save, the creature doesn't exit the cage and wastes the spell or effect. The cage also extends into the Ethereal Plane, blocking ethereal travel.<\/p><p>This spell can't be dispelled by <a class=\"lk\" data-l=\"spell|dispel magic\">Dispel Magic<\/a>.<\/p>"},"foresight":{"n":"Foresight","l":9,"sc":"Divination","t":"1 minute","r":"Touch","c":"V, S, M (a hummingbird feather)","d":"8 hours","conc":false,"rit":false,"cls":["Bard","Druid","Warlock","Wizard"],"src":"XPHB","u":"https://5e.tools/spells.html#foresight_xphb","srd":true,"h":"<p>You touch a willing creature and bestow a limited ability to see into the immediate future. For the duration, the target has <a class=\"lk\" data-l=\"rule|advantage\">Advantage<\/a> on <a class=\"lk\" data-l=\"rule|d20 test\">D20 Tests<\/a>, and other creatures have <a class=\"lk\" data-l=\"rule|disadvantage\">Disadvantage<\/a> on attack rolls against it. The spell ends early if you cast it again.<\/p>"},"friends":{"n":"Friends","l":0,"sc":"Enchantment","t":"Action","r":"10 ft","c":"S, M (some makeup)","d":"Up to 1 minute","conc":true,"rit":false,"cls":["Bard","Sorcerer","Warlock","Wizard"],"src":"XPHB","u":"https://5e.tools/spells.html#friends_xphb","srd":false,"h":"<p>One creature you can see makes a Wisdom save or is <a class=\"lk\" data-l=\"cond|charmed\">Charmed<\/a> by you. It succeeds automatically if it isn&#x27;t Humanoid, if you are fighting it, or if you used this on it in the last 24 hours. The spell ends if it takes damage or you attack, deal damage or force a save. Afterwards it knows you charmed it.<\/p>","own":true},"gaseous form":{"n":"Gaseous Form","l":3,"sc":"Transmutation","t":"Action","r":"Touch","c":"V, S, M (a bit of gauze)","d":"Up to 1 hour","conc":true,"rit":false,"cls":["Sorcerer","Warlock","Wizard"],"src":"XPHB","u":"https://5e.tools/spells.html#gaseous%20form_xphb","srd":true,"h":"<p>A willing creature you touch shape-shifts, along with everything it's wearing and carrying, into a misty cloud for the duration. The spell ends on the target if it drops to 0 <a class=\"lk\" data-l=\"rule|hit points\">Hit Points<\/a> or if it takes a <a class=\"lk\" data-l=\"act|magic\">Magic<\/a> action to end the spell on itself.<\/p><p>While in this form, the target's only method of movement is a <a class=\"lk\" data-l=\"rule|fly speed\">Fly Speed<\/a> of 10 feet, and it can hover. The target can enter and occupy the space of another creature. The target has <a class=\"lk\" data-l=\"rule|resistance\">Resistance<\/a> to Bludgeoning, Piercing, and Slashing damage; it has <a class=\"lk\" data-l=\"rule|immunity\">Immunity<\/a> to the <a class=\"lk\" data-l=\"cond|prone\">Prone<\/a> condition; and it has <a class=\"lk\" data-l=\"rule|advantage\">Advantage<\/a> on Strength, Dexterity, and Constitution saving throws. The target can pass through narrow openings, but it treats liquids as though they were solid surfaces.<\/p><p>The target can't talk or manipulate objects, and any objects it was carrying or holding can't be dropped, used, or otherwise interacted with. Finally, the target can't attack or cast spells.<\/p>","hl":"<p><b><i>Using a Higher-Level Spell Slot.<\/i><\/b> You can target one additional creature for each spell slot level above 3.<\/p>"},"gate":{"n":"Gate","l":9,"sc":"Conjuration","t":"Action","r":"60 ft","c":"V, S, M (a diamond worth 5,000+ GP)","d":"Up to 1 minute","conc":true,"rit":false,"cls":["Cleric","Sorcerer","Warlock","Wizard"],"src":"XPHB","u":"https://5e.tools/spells.html#gate_xphb","srd":true,"h":"<p>You conjure a portal linking an unoccupied space you can see within range to a precise location on a different plane of existence. The portal is a circular opening, which you can make 5 to 20 feet in diameter. You can orient the portal in any direction you choose. The portal lasts for the duration, and the portal's destination is visible through it.<\/p><p>The portal has a front and a back on each plane where it appears. Travel through the portal is possible only by moving through its front. Anything that does so is instantly transported to the other plane, appearing in the unoccupied space nearest to the portal.<\/p><p>Deities and other planar rulers can prevent portals created by this spell from opening in their presence or anywhere within their domains.<\/p><p>When you cast this spell, you can speak the name of a specific creature (a pseudonym, title, or nickname doesn't work). If that creature is on a plane other than the one you are on, the portal opens next to the named creature and transports it to the nearest unoccupied space on your side of the portal. You gain no special power over the creature, and it is free to act as the DM deems appropriate. It might leave, attack you, or help you.<\/p>"},"glibness":{"n":"Glibness","l":8,"sc":"Enchantment","t":"Action","r":"Self","c":"V","d":"1 hour","conc":false,"rit":false,"cls":["Bard","Warlock"],"src":"XPHB","u":"https://5e.tools/spells.html#glibness_xphb","srd":true,"h":"<p>Until the spell ends, when you make a Charisma check, you can replace the number you roll with a 15. Additionally, no matter what you say, magic that would determine if you are telling the truth indicates that you are being truthful.<\/p>"},"globe of invulnerability":{"n":"Globe of Invulnerability","l":6,"sc":"Abjuration","t":"Action","r":"Self (10-ft Emanation)","c":"V, S, M (a glass bead)","d":"Up to 1 minute","conc":true,"rit":false,"cls":["Sorcerer","Wizard"],"src":"XPHB","u":"https://5e.tools/spells.html#globe%20of%20invulnerability_xphb","srd":true,"h":"<p>An immobile, shimmering barrier appears in a 10-foot <a class=\"lk\" data-l=\"rule|emanation [area of effect]\">Emanation<\/a> around you and remains for the duration.<\/p><p>Any spell of level 5 or lower cast from outside the barrier can't affect anything within it. Such a spell can target creatures and objects within the barrier, but the spell has no effect on them. Similarly, the area within the barrier is excluded from areas of effect created by such spells.<\/p>","hl":"<p><b><i>Using a Higher-Level Spell Slot.<\/i><\/b> The barrier blocks spells of 1 level higher for each spell slot level above 6.<\/p>"},"glyph of warding":{"n":"Glyph of Warding","l":3,"sc":"Abjuration","t":"1 hour","r":"Touch","c":"V, S, M (powdered diamond worth 200+ GP, which the spell consumes)","d":"Until dispelled or triggered","conc":false,"rit":false,"cls":["Bard","Cleric","Wizard"],"src":"XPHB","u":"https://5e.tools/spells.html#glyph%20of%20warding_xphb","srd":true,"h":"<p>You inscribe a glyph that later unleashes a magical effect. You inscribe it either on a surface (such as a table or a section of floor) or within an object that can be closed (such as a book or chest) to conceal the glyph. The glyph can cover an area no larger than 10 feet in diameter. If the surface or object is moved more than 10 feet from where you cast this spell, the glyph is broken, and the spell ends without being triggered.<\/p><p>The glyph is nearly imperceptible and requires a successful Wisdom (<a class=\"lk\" data-l=\"skill|perception\">Perception<\/a>) check against your spell save DC to notice.<\/p><p>When you inscribe the glyph, you set its trigger and choose whether it's an explosive rune or a spell glyph, as explained below.<\/p><p><b><i>Set the Trigger.<\/i><\/b> You decide what triggers the glyph when you cast the spell. For glyphs inscribed on a surface, common triggers include touching or stepping on the glyph, removing another object covering it, or approaching within a certain distance of it. For glyphs inscribed within an object, common triggers include opening that object or seeing the glyph. Once a glyph is triggered, this spell ends.<\/p><p>You can refine the trigger so that only creatures of certain types activate it (for example, the glyph could be set to affect Aberrations). You can also set conditions for creatures that don't trigger the glyph, such as those who say a certain password.<\/p><p><b><i>Explosive Rune.<\/i><\/b> When triggered, the glyph erupts with magical energy in a 20-foot-radius <a class=\"lk\" data-l=\"rule|sphere [area of effect]\">Sphere<\/a> centered on the glyph. Each creature in the area makes a Dexterity saving throw. A creature takes 5d8 Acid, Cold, Fire, Lightning, or Thunder damage (your choice when you create the glyph) on a failed save or half as much damage on a successful one.<\/p><p><b><i>Spell Glyph.<\/i><\/b> You can store a prepared spell of level 3 or lower in the glyph by casting it as part of creating the glyph. The spell must target a single creature or an area. The spell being stored has no immediate effect when cast in this way.<\/p><p>When the glyph is triggered, the stored spell takes effect. If the spell has a target, it targets the creature that triggered the glyph. If the spell affects an area, the area is centered on that creature. If the spell summons <a class=\"lk\" data-l=\"rule|hostile [attitude]\">Hostile<\/a> creatures or creates harmful objects or traps, they appear as close as possible to the intruder and attack it. If the spell requires <a class=\"lk\" data-l=\"cond|concentration\">Concentration<\/a>, it lasts until the end of its full duration.<\/p>","hl":"<p><b><i>Using a Higher-Level Spell Slot.<\/i><\/b> The damage of an explosive rune increases by 1d8 for each spell slot level above 3. If you create a spell glyph, you can store any spell of up to the same level as the spell slot you use for the Glyph of Warding.<\/p>","mark":true},"grease":{"n":"Grease","l":1,"sc":"Conjuration","t":"Action","r":"60 ft","c":"V, S, M (a bit of pork rind or butter)","d":"1 minute","conc":false,"rit":false,"cls":["Sorcerer","Wizard"],"src":"XPHB","u":"https://5e.tools/spells.html#grease_xphb","srd":true,"h":"<p>Nonflammable grease covers the ground in a 10-foot square centered on a point within range and turns it into <a class=\"lk\" data-l=\"rule|difficult terrain\">Difficult Terrain<\/a> for the duration.<\/p><p>When the grease appears, each creature standing in its area must succeed on a Dexterity saving throw or have the <a class=\"lk\" data-l=\"cond|prone\">Prone<\/a> condition. A creature that enters the area or ends its turn there must also succeed on that save or fall <a class=\"lk\" data-l=\"cond|prone\">Prone<\/a>.<\/p>"},"greater invisibility":{"n":"Greater Invisibility","l":4,"sc":"Illusion","t":"Action","r":"Touch","c":"V, S","d":"Up to 1 minute","conc":true,"rit":false,"cls":["Bard","Sorcerer","Wizard"],"src":"XPHB","u":"https://5e.tools/spells.html#greater%20invisibility_xphb","srd":true,"h":"<p>A creature you touch has the <a class=\"lk\" data-l=\"cond|invisible\">Invisible<\/a> condition until the spell ends.<\/p>"},"greater restoration":{"n":"Greater Restoration","l":5,"sc":"Abjuration","t":"Action","r":"Touch","c":"V, S, M (diamond dust worth 100+ GP, which the spell consumes)","d":"Instantaneous","conc":false,"rit":false,"cls":["Bard","Cleric","Druid","Paladin","Ranger"],"src":"XPHB","u":"https://5e.tools/spells.html#greater%20restoration_xphb","srd":true,"h":"<p>You touch a creature and magically remove one of the following effects from it:<\/p><ul><li>1 <a class=\"lk\" data-l=\"cond|exhaustion\">Exhaustion<\/a> level<\/li><li>The <a class=\"lk\" data-l=\"cond|charmed\">Charmed<\/a> or <a class=\"lk\" data-l=\"cond|petrified\">Petrified<\/a> condition<\/li><li>A curse, including the target's <a class=\"lk\" data-l=\"rule|attunement\">Attunement<\/a> to a cursed magic item<\/li><li>Any reduction to one of the target's ability scores<\/li><li>Any reduction to the target's <a class=\"lk\" data-l=\"rule|hit points\">Hit Point<\/a> maximum<\/li><\/ul>"},"guardian of faith":{"n":"Guardian of Faith","l":4,"sc":"Conjuration","t":"Action","r":"30 ft","c":"V","d":"8 hours","conc":false,"rit":false,"cls":["Cleric"],"src":"XPHB","u":"https://5e.tools/spells.html#guardian%20of%20faith_xphb","srd":true,"h":"<p>A Large spectral guardian appears and hovers for the duration in an unoccupied space that you can see within range. The guardian occupies that space and is invulnerable, and it appears in a form appropriate for your deity or pantheon.<\/p><p>Any enemy that moves to a space within 10 feet of the guardian for the first time on a turn or starts its turn there makes a Dexterity saving throw, taking 20 Radiant damage on a failed save or half as much damage on a successful one. The guardian vanishes when it has dealt a total of 60 damage.<\/p>"},"guidance":{"n":"Guidance","l":0,"sc":"Divination","t":"Action","r":"Touch","c":"V, S","d":"Up to 1 minute","conc":true,"rit":false,"cls":["Cleric","Druid"],"src":"XPHB","u":"https://5e.tools/spells.html#guidance_xphb","srd":true,"h":"<p>You touch a willing creature and choose a skill. Until the spell ends, the creature adds 1d4 to any ability check using the chosen skill.<\/p>"},"guiding bolt":{"n":"Guiding Bolt","l":1,"sc":"Evocation","t":"Action","r":"120 ft","c":"V, S","d":"1 round","conc":false,"rit":false,"cls":["Cleric"],"src":"XPHB","u":"https://5e.tools/spells.html#guiding%20bolt_xphb","srd":true,"h":"<p>You hurl a bolt of light toward a creature within range. Make a ranged spell attack against the target. On a hit, it takes 4d6 Radiant damage, and the next attack roll made against it before the end of your next turn has <a class=\"lk\" data-l=\"rule|advantage\">Advantage<\/a>.<\/p>","hl":"<p><b><i>Using a Higher-Level Spell Slot.<\/i><\/b> The damage increases by 1d6 for each spell slot level above 1.<\/p>"},"gust of wind":{"n":"Gust of Wind","l":2,"sc":"Evocation","t":"Action","r":"Self (60-ft Line)","c":"V, S, M (a legume seed)","d":"Up to 1 minute","conc":true,"rit":false,"cls":["Druid","Ranger","Sorcerer","Wizard"],"src":"XPHB","u":"https://5e.tools/spells.html#gust%20of%20wind_xphb","srd":true,"h":"<p>A <a class=\"lk\" data-l=\"rule|line [area of effect]\">Line<\/a> of strong wind 60 feet long and 10 feet wide blasts from you in a direction you choose for the duration. Each creature in the <a class=\"lk\" data-l=\"rule|line [area of effect]\">Line<\/a> must succeed on a Strength saving throw or be pushed 15 feet away from you in a direction following the <a class=\"lk\" data-l=\"rule|line [area of effect]\">Line<\/a>. A creature that ends its turn in the <a class=\"lk\" data-l=\"rule|line [area of effect]\">Line<\/a> must make the same save.<\/p><p>Any creature in the <a class=\"lk\" data-l=\"rule|line [area of effect]\">Line<\/a> must spend 2 feet of movement for every 1 foot it moves when moving closer to you.<\/p><p>The gust disperses gas or vapor, and it extinguishes candles and similar unprotected flames in the area. It causes protected flames, such as those of lanterns, to dance wildly and has a 50 percent chance to extinguish them.<\/p><p>As a <a class=\"lk\" data-l=\"rule|bonus action\">Bonus Action<\/a> on your later turns, you can change the direction in which the <a class=\"lk\" data-l=\"rule|line [area of effect]\">Line<\/a> blasts from you.<\/p>"},"hallucinatory terrain":{"n":"Hallucinatory Terrain","l":4,"sc":"Illusion","t":"10 minutes","r":"300 ft","c":"V, S, M (a mushroom)","d":"24 hours","conc":false,"rit":false,"cls":["Bard","Druid","Warlock","Wizard"],"src":"XPHB","u":"https://5e.tools/spells.html#hallucinatory%20terrain_xphb","srd":true,"h":"<p>You make natural terrain in a 150-foot <a class=\"lk\" data-l=\"rule|cube [area of effect]\">Cube<\/a> in range look, sound, and smell like another sort of natural terrain. Thus, open fields or a road can be made to resemble a swamp, hill, crevasse, or some other difficult or impassable terrain. A pond can be made to seem like a grassy meadow, a precipice like a gentle slope, or a rock-strewn gully like a wide and smooth road. Manufactured structures, equipment, and creatures within the area aren't changed.<\/p><p>The tactile characteristics of the terrain are unchanged, so creatures entering the area are likely to notice the illusion. If the difference isn't obvious by touch, a creature examining the illusion can take the <a class=\"lk\" data-l=\"act|study\">Study<\/a> action to make an Intelligence (<a class=\"lk\" data-l=\"skill|investigation\">Investigation<\/a>) check against your spell save DC to disbelieve it. If a creature discerns that the terrain is illusory, the creature sees a vague image superimposed on the real terrain.<\/p>"},"haste":{"n":"Haste","l":3,"sc":"Transmutation","t":"Action","r":"30 ft","c":"V, S, M (a shaving of licorice root)","d":"Up to 1 minute","conc":true,"rit":false,"cls":["Sorcerer","Wizard"],"src":"XPHB","u":"https://5e.tools/spells.html#haste_xphb","srd":true,"h":"<p>Choose a willing creature that you can see within range. Until the spell ends, the target's <a class=\"lk\" data-l=\"rule|speed\">Speed<\/a> is doubled, it gains a +2 bonus to <a class=\"lk\" data-l=\"rule|armor class\">Armor Class<\/a>, it has <a class=\"lk\" data-l=\"rule|advantage\">Advantage<\/a> on Dexterity saving throws, and it gains an additional action on each of its turns. That action can be used to take only the <a class=\"lk\" data-l=\"act|attack\">Attack<\/a> (one attack only), <a class=\"lk\" data-l=\"act|dash\">Dash<\/a>, <a class=\"lk\" data-l=\"act|disengage\">Disengage<\/a>, <a class=\"lk\" data-l=\"act|hide\">Hide<\/a>, or <a class=\"lk\" data-l=\"act|utilize\">Utilize<\/a> action.<\/p><p>When the spell ends, the target is <a class=\"lk\" data-l=\"cond|incapacitated\">Incapacitated<\/a> and has a <a class=\"lk\" data-l=\"rule|speed\">Speed<\/a> of 0 until the end of its next turn, as a wave of lethargy washes over it.<\/p>"},"healing word":{"n":"Healing Word","l":1,"sc":"Abjuration","t":"Bonus Action","r":"60 ft","c":"V","d":"Instantaneous","conc":false,"rit":false,"cls":["Bard","Cleric","Druid"],"src":"XPHB","u":"https://5e.tools/spells.html#healing%20word_xphb","srd":true,"h":"<p>A creature of your choice that you can see within range regains <a class=\"lk\" data-l=\"rule|hit points\">Hit Points<\/a> equal to 2d4 plus your spellcasting ability modifier.<\/p>","hl":"<p><b><i>Using a Higher-Level Spell Slot.<\/i><\/b> The healing increases by 2d4 for each spell slot level above 1.<\/p>"},"hellish rebuke":{"n":"Hellish Rebuke","l":1,"sc":"Evocation","t":"Reaction, which you take in response to taking damage from a creature that you can see within 60 feet of yourself","r":"60 ft","c":"V, S","d":"Instantaneous","conc":false,"rit":false,"cls":["Warlock"],"src":"XPHB","u":"https://5e.tools/spells.html#hellish%20rebuke_xphb","srd":true,"h":"<p>The creature that damaged you is momentarily surrounded by green flames. It makes a Dexterity saving throw, taking 2d10 Fire damage on a failed save or half as much damage on a successful one.<\/p>","hl":"<p><b><i>Using a Higher-Level Spell Slot.<\/i><\/b> The damage increases by 1d10 for each spell slot level above 1.<\/p>"},"hex":{"n":"Hex","l":1,"sc":"Enchantment","t":"Bonus Action","r":"90 ft","c":"V, S, M (the petrified eye of a newt)","d":"Up to 1 hour","conc":true,"rit":false,"cls":["Warlock"],"src":"XPHB","u":"https://5e.tools/spells.html#hex_xphb","srd":true,"h":"<p>You place a curse on a creature that you can see within range. Until the spell ends, you deal an extra 1d6 Necrotic damage to the target whenever you hit it with an attack roll. Also, choose one ability when you cast the spell. The target has <a class=\"lk\" data-l=\"rule|disadvantage\">Disadvantage<\/a> on ability checks made with the chosen ability.<\/p><p>If the target drops to 0 <a class=\"lk\" data-l=\"rule|hit points\">Hit Points<\/a> before this spell ends, you can take a <a class=\"lk\" data-l=\"rule|bonus action\">Bonus Action<\/a> on a later turn to curse a new creature.<\/p>","hl":"<p><b><i>Using a Higher-Level Spell Slot.<\/i><\/b> Your <a class=\"lk\" data-l=\"cond|concentration\">Concentration<\/a> can last longer with a spell slot of level 2 (up to 4 hours), 3-4 (up to 8 hours), or 5+ (24 hours).<\/p>"},"hold monster":{"n":"Hold Monster","l":5,"sc":"Enchantment","t":"Action","r":"90 ft","c":"V, S, M (a straight piece of iron)","d":"Up to 1 minute","conc":true,"rit":false,"cls":["Bard","Sorcerer","Warlock","Wizard"],"src":"XPHB","u":"https://5e.tools/spells.html#hold%20monster_xphb","srd":true,"h":"<p>Choose a creature that you can see within range. The target must succeed on a Wisdom saving throw or have the <a class=\"lk\" data-l=\"cond|paralyzed\">Paralyzed<\/a> condition for the duration. At the end of each of its turns, the target repeats the save, ending the spell on itself on a success.<\/p>","hl":"<p><b><i>Using a Higher-Level Spell Slot.<\/i><\/b> You can target one additional creature for each spell slot level above 5.<\/p>"},"hold person":{"n":"Hold Person","l":2,"sc":"Enchantment","t":"Action","r":"60 ft","c":"V, S, M (a straight piece of iron)","d":"Up to 1 minute","conc":true,"rit":false,"cls":["Bard","Cleric","Druid","Sorcerer","Warlock","Wizard"],"src":"XPHB","u":"https://5e.tools/spells.html#hold%20person_xphb","srd":true,"h":"<p>Choose a Humanoid that you can see within range. The target must succeed on a Wisdom saving throw or have the <a class=\"lk\" data-l=\"cond|paralyzed\">Paralyzed<\/a> condition for the duration. At the end of each of its turns, the target repeats the save, ending the spell on itself on a success.<\/p>","hl":"<p><b><i>Using a Higher-Level Spell Slot.<\/i><\/b> You can target one additional Humanoid for each spell slot level above 2.<\/p>"},"hunger of hadar":{"n":"Hunger of Hadar","l":3,"sc":"Conjuration","t":"Action","r":"150 ft","c":"V, S, M (a pickled tentacle)","d":"Up to 1 minute","conc":true,"rit":false,"cls":["Warlock"],"src":"XPHB","u":"https://5e.tools/spells.html#hunger%20of%20hadar_xphb","srd":false,"h":"<p>A 20-ft-radius Sphere of unlightable darkness appears. It is <a class=\"lk\" data-l=\"rule|difficult terrain\">Difficult Terrain<\/a> and creatures fully inside are <a class=\"lk\" data-l=\"cond|blinded\">Blinded<\/a>. A creature starting its turn inside takes 2d6 Cold. A creature ending its turn inside makes a Dexterity save or takes 2d6 Acid.<\/p>","hl":"<p>+1d6 to the Cold or the Acid damage (your choice) per slot level above 3.<\/p>","own":true},"hypnotic pattern":{"n":"Hypnotic Pattern","l":3,"sc":"Illusion","t":"Action","r":"120 ft","c":"S, M (a pinch of confetti)","d":"Up to 1 minute","conc":true,"rit":false,"cls":["Bard","Sorcerer","Warlock","Wizard"],"src":"XPHB","u":"https://5e.tools/spells.html#hypnotic%20pattern_xphb","srd":true,"h":"<p>You create a twisting pattern of colors in a 30-foot <a class=\"lk\" data-l=\"rule|cube [area of effect]\">Cube<\/a> within range. The pattern appears for a moment and vanishes. Each creature in the area who can see the pattern must succeed on a Wisdom saving throw or have the <a class=\"lk\" data-l=\"cond|charmed\">Charmed<\/a> condition for the duration. While <a class=\"lk\" data-l=\"cond|charmed\">Charmed<\/a>, the creature has the <a class=\"lk\" data-l=\"cond|incapacitated\">Incapacitated<\/a> condition and a <a class=\"lk\" data-l=\"rule|speed\">Speed<\/a> of 0.<\/p><p>The spell ends for an affected creature if it takes any damage or if someone else uses an action to shake the creature out of its stupor.<\/p>"},"ice knife":{"n":"Ice Knife","l":1,"sc":"Conjuration","t":"Action","r":"60 ft","c":"S, M (a drop of water or a piece of ice)","d":"Instantaneous","conc":false,"rit":false,"cls":["Druid","Sorcerer","Wizard"],"src":"XPHB","u":"https://5e.tools/spells.html#ice%20knife_xphb","srd":true,"h":"<p>You create a shard of ice and fling it at one creature within range. Make a ranged spell attack against the target. On a hit, the target takes 1d10 Piercing damage. Hit or miss, the shard then explodes. The target and each creature within 5 feet of it must succeed on a Dexterity saving throw or take 2d6 Cold damage.<\/p>","hl":"<p><b><i>Using a Higher-Level Spell Slot.<\/i><\/b> The Cold damage increases by 1d6 for each spell slot level above 1.<\/p>"},"ice storm":{"n":"Ice Storm","l":4,"sc":"Evocation","t":"Action","r":"300 ft","c":"V, S, M (a mitten)","d":"Instantaneous","conc":false,"rit":false,"cls":["Druid","Sorcerer","Wizard"],"src":"XPHB","u":"https://5e.tools/spells.html#ice%20storm_xphb","srd":true,"h":"<p>Hail falls in a 20-foot-radius, 40-foot-high <a class=\"lk\" data-l=\"rule|cylinder [area of effect]\">Cylinder<\/a> centered on a point within range. Each creature in the <a class=\"lk\" data-l=\"rule|cylinder [area of effect]\">Cylinder<\/a> makes a Dexterity saving throw. A creature takes 2d10 Bludgeoning damage and 4d6 Cold damage on a failed save or half as much damage on a successful one.<\/p><p>Hailstones turn ground in the <a class=\"lk\" data-l=\"rule|cylinder [area of effect]\">Cylinder<\/a> into <a class=\"lk\" data-l=\"rule|difficult terrain\">Difficult Terrain<\/a> until the end of your next turn.<\/p>","hl":"<p><b><i>Using a Higher-Level Spell Slot.<\/i><\/b> The Bludgeoning damage increases by 1d10 for each spell slot level above 4.<\/p>"},"identify":{"n":"Identify","l":1,"sc":"Divination","t":"1 minute","r":"Touch","c":"V, S, M (a pearl worth 100+ GP)","d":"Instantaneous","conc":false,"rit":true,"cls":["Bard","Wizard"],"src":"XPHB","u":"https://5e.tools/spells.html#identify_xphb","srd":true,"h":"<p>You touch an object throughout the spell's casting. If the object is a magic item or some other magical object, you learn its properties and how to use them, whether it requires <a class=\"lk\" data-l=\"rule|attunement\">Attunement<\/a>, and how many charges it has, if any. You learn whether any ongoing spells are affecting the item and what they are. If the item was created by a spell, you learn that spell's name.<\/p><p>If you instead touch a creature throughout the casting, you learn which ongoing spells, if any, are currently affecting it.<\/p>"},"illusory script":{"n":"Illusory Script","l":1,"sc":"Illusion","t":"1 minute","r":"Touch","c":"S, M (ink worth 10+ GP, which the spell consumes)","d":"10 days","conc":false,"rit":true,"cls":["Bard","Warlock","Wizard"],"src":"XPHB","u":"https://5e.tools/spells.html#illusory%20script_xphb","srd":true,"h":"<p>You write on parchment, paper, or another suitable material and imbue it with an illusion that lasts for the duration. To you and any creatures you designate when you cast the spell, the writing appears normal, seems to be written in your hand, and conveys whatever meaning you intended when you wrote the text. To all others, the writing appears as if it were written in an unknown or magical script that is unintelligible. Alternatively, the illusion can alter the meaning, handwriting, and language of the text, though the language must be one you know.<\/p><p>If the spell is dispelled, the original script and the illusion both disappear.<\/p><p>A creature that has <a class=\"lk\" data-l=\"sense|truesight\">Truesight<\/a> can read the hidden message.<\/p>"},"imprisonment":{"n":"Imprisonment","l":9,"sc":"Abjuration","t":"1 minute","r":"30 ft","c":"V, S, M (a statuette of the target worth 5,000+ GP)","d":"Until dispelled","conc":false,"rit":false,"cls":["Warlock","Wizard"],"src":"XPHB","u":"https://5e.tools/spells.html#imprisonment_xphb","srd":true,"h":"<p>You create a magical restraint to hold a creature that you can see within range. The target must make a Wisdom saving throw. On a successful save, the target is unaffected, and it is immune to this spell for the next 24 hours. On a failed save, the target is imprisoned. While imprisoned, the target doesn't need to breathe, eat, or drink, and it doesn't age. Divination spells can't locate or perceive the imprisoned target, and the target can't teleport.<\/p><p>Until the spell ends, the target is also affected by one of the following effects of your choice:<\/p><ul><li><b>Burial<\/b> The target is entombed beneath the earth in a hollow globe of magical force that is just large enough to contain the target. Nothing can pass into or out of the globe.<\/li><li><b>Chaining<\/b> Chains firmly rooted in the ground hold the target in place. The target has the <a class=\"lk\" data-l=\"cond|restrained\">Restrained<\/a> condition and can't be moved by any means.<\/li><li><b>Hedged Prison<\/b> The target is trapped in a demiplane that is warded against teleportation and planar travel. The demiplane is your choice of a labyrinth, a cage, a tower, or the like.<\/li><li><b>Minimus Containment<\/b> The target becomes 1 inch tall and is trapped inside an indestructible gemstone or a similar object. Light can pass through the gemstone (allowing the target to see out and other creatures to see in), but nothing else can pass through by any means.<\/li><li><b>Slumber<\/b> The target has the <a class=\"lk\" data-l=\"cond|unconscious\">Unconscious<\/a> condition and can't be awoken.<\/li><\/ul><p><b><i>Ending the Spell.<\/i><\/b> When you cast the spell, specify a trigger that will end it. The trigger can be as simple or as elaborate as you choose, but the DM must agree that it has a high likelihood of happening within the next decade. The trigger must be an observable action, such as someone making a particular offering at the temple of your god, saving your true love, or defeating a specific monster.<\/p><p>A <a class=\"lk\" data-l=\"spell|dispel magic\">Dispel Magic<\/a> spell can end the spell only if it is cast with a level 9 spell slot, targeting either the prison or the component used to create it.<\/p>"},"incendiary cloud":{"n":"Incendiary Cloud","l":8,"sc":"Conjuration","t":"Action","r":"150 ft","c":"V, S","d":"Up to 1 minute","conc":true,"rit":false,"cls":["Druid","Sorcerer","Wizard"],"src":"XPHB","u":"https://5e.tools/spells.html#incendiary%20cloud_xphb","srd":true,"h":"<p>A swirling cloud of embers and smoke fills a 20-foot-radius <a class=\"lk\" data-l=\"rule|sphere [area of effect]\">Sphere<\/a> centered on a point within range. The cloud's area is <a class=\"lk\" data-l=\"rule|heavily obscured\">Heavily Obscured<\/a>. It lasts for the duration or until a strong wind (like that created by <a class=\"lk\" data-l=\"spell|gust of wind\">Gust of Wind<\/a>) disperses it.<\/p><p>When the cloud appears, each creature in it makes a Dexterity saving throw, taking 10d8 Fire damage on a failed save or half as much damage on a successful one. A creature must also make this save when the <a class=\"lk\" data-l=\"rule|sphere [area of effect]\">Sphere<\/a> moves into its space and when it enters the <a class=\"lk\" data-l=\"rule|sphere [area of effect]\">Sphere<\/a> or ends its turn there. A creature makes this save only once per turn.<\/p><p>The cloud moves 10 feet away from you in a direction you choose at the start of each of your turns.<\/p>"},"inflict wounds":{"n":"Inflict Wounds","l":1,"sc":"Necromancy","t":"Action","r":"Touch","c":"V, S","d":"Instantaneous","conc":false,"rit":false,"cls":["Cleric"],"src":"XPHB","u":"https://5e.tools/spells.html#inflict%20wounds_xphb","srd":true,"h":"<p>A creature you touch makes a Constitution saving throw, taking 2d10 Necrotic damage on a failed save or half as much damage on a successful one.<\/p>","hl":"<p><b><i>Using a Higher-Level Spell Slot.<\/i><\/b> The damage increases by 1d10 for each spell slot level above 1.<\/p>"},"insect plague":{"n":"Insect Plague","l":5,"sc":"Conjuration","t":"Action","r":"300 ft","c":"V, S, M (a locust)","d":"Up to 10 minutes","conc":true,"rit":false,"cls":["Cleric","Druid","Sorcerer"],"src":"XPHB","u":"https://5e.tools/spells.html#insect%20plague_xphb","srd":true,"h":"<p>Swarming locusts fill a 20-foot-radius <a class=\"lk\" data-l=\"rule|sphere [area of effect]\">Sphere<\/a> centered on a point you choose within range. The <a class=\"lk\" data-l=\"rule|sphere [area of effect]\">Sphere<\/a> remains for the duration, and its area is <a class=\"lk\" data-l=\"rule|lightly obscured\">Lightly Obscured<\/a> and <a class=\"lk\" data-l=\"rule|difficult terrain\">Difficult Terrain<\/a>.<\/p><p>When the swarm appears, each creature in it makes a Constitution saving throw, taking 4d10 Piercing damage on a failed save or half as much damage on a successful one. A creature also makes this save when it enters the spell's area for the first time on a turn or ends its turn there. A creature makes this save only once per turn.<\/p>","hl":"<p><b><i>Using a Higher-Level Spell Slot.<\/i><\/b> The damage increases by 1d10 for each spell slot level above 5.<\/p>"},"invisibility":{"n":"Invisibility","l":2,"sc":"Illusion","t":"Action","r":"Touch","c":"V, S, M (an eyelash in gum arabic)","d":"Up to 1 hour","conc":true,"rit":false,"cls":["Bard","Sorcerer","Warlock","Wizard"],"src":"XPHB","u":"https://5e.tools/spells.html#invisibility_xphb","srd":true,"h":"<p>A creature you touch has the <a class=\"lk\" data-l=\"cond|invisible\">Invisible<\/a> condition until the spell ends. The spell ends early immediately after the target makes an attack roll, deals damage, or casts a spell.<\/p>","hl":"<p><b><i>Using a Higher-Level Spell Slot.<\/i><\/b> You can target one additional creature for each spell slot level above 2.<\/p>"},"jallarzi's storm of radiance":{"n":"Jallarzi's Storm of Radiance","l":5,"sc":"Evocation","t":"Action","r":"120 ft","c":"V, S, M (a pinch of phosphorus)","d":"Up to 1 minute","conc":true,"rit":false,"cls":["Warlock","Wizard"],"src":"XPHB","u":"https://5e.tools/spells.html#jallarzi%27s%20storm%20of%20radiance_xphb","srd":false,"h":"<p>A 10-ft-radius, 40-ft-high Cylinder of light and thunder. Creatures inside are <a class=\"lk\" data-l=\"cond|blinded\">Blinded<\/a> and <a class=\"lk\" data-l=\"cond|deafened\">Deafened<\/a> and can&#x27;t cast Verbal spells. Constitution save when it appears, on first entering in a turn, or on ending a turn there (once per turn): 2d10 Radiant plus 2d10 Thunder, half on a success.<\/p>","hl":"<p>+1d10 Radiant and +1d10 Thunder per slot level above 5.<\/p>","own":true},"jump":{"n":"Jump","l":1,"sc":"Transmutation","t":"Bonus Action","r":"Touch","c":"V, S, M (a grasshopper's hind leg)","d":"1 minute","conc":false,"rit":false,"cls":["Druid","Ranger","Sorcerer","Wizard"],"src":"XPHB","u":"https://5e.tools/spells.html#jump_xphb","srd":true,"h":"<p>You touch a willing creature. Once on each of its turns until the spell ends, that creature can jump up to 30 feet by spending 10 feet of movement.<\/p>","hl":"<p><b><i>Using a Higher-Level Spell Slot.<\/i><\/b> You can target one additional creature for each spell slot level above 1.<\/p>"},"knock":{"n":"Knock","l":2,"sc":"Transmutation","t":"Action","r":"60 ft","c":"V","d":"Instantaneous","conc":false,"rit":false,"cls":["Bard","Sorcerer","Wizard"],"src":"XPHB","u":"https:
