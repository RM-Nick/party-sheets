//5e.tools/spells.html#knock_xphb","srd":true,"h":"<p>Choose an object that you can see within range. The object can be a door, a box, a chest, a set of manacles, a padlock, or another object that contains a mundane or magical means that prevents access.<\/p><p>A target that is held shut by a mundane lock or that is stuck or barred becomes unlocked, unstuck, or unbarred. If the object has multiple locks, only one of them is unlocked.<\/p><p>If the target is held shut by <a class=\"lk\" data-l=\"spell|arcane lock\">Arcane Lock<\/a>, that spell is suppressed for 10 minutes, during which time the target can be opened and closed.<\/p><p>When you cast the spell, a loud knock, audible up to 300 feet away, emanates from the target.<\/p>","mark":true},"leomund's secret chest":{"n":"Leomund's Secret Chest","l":4,"sc":"Conjuration","t":"Action","r":"Touch","c":"V, S, M (a chest, 3 feet by 2 feet by 2 feet, constructed from rare materials worth 5,000+ GP, and a Tiny replica of the chest made from the same materials worth 50+ GP)","d":"Until dispelled","conc":false,"rit":false,"cls":["Wizard"],"src":"XPHB","u":"https://5e.tools/spells.html#leomund%27s%20secret%20chest_xphb","srd":true,"h":"<p>You hide a chest and all its contents on the Ethereal Plane. You must touch the chest and the miniature replica that serve as Material components for the spell. The chest can contain up to 12 cubic feet of nonliving material (3 feet by 2 feet by 2 feet).<\/p><p>While the chest remains on the Ethereal Plane, you can take a <a class=\"lk\" data-l=\"act|magic\">Magic<\/a> action and touch the replica to recall the chest. It appears in an unoccupied space on the ground within 5 feet of you. You can send the chest back to the Ethereal Plane by taking a <a class=\"lk\" data-l=\"act|magic\">Magic<\/a> action to touch the chest and the replica.<\/p><p>After 60 days, there is a cumulative 5 percent chance at the end of each day that the spell ends. The spell also ends if you cast this spell again or if the Tiny replica chest is destroyed. If the spell ends and the larger chest is on the Ethereal Plane, the chest remains there for you or someone else to find.<\/p>","mark":true},"lesser restoration":{"n":"Lesser Restoration","l":2,"sc":"Abjuration","t":"Bonus Action","r":"Touch","c":"V, S","d":"Instantaneous","conc":false,"rit":false,"cls":["Bard","Cleric","Druid","Paladin","Ranger"],"src":"XPHB","u":"https://5e.tools/spells.html#lesser%20restoration_xphb","srd":true,"h":"<p>You touch a creature and end one condition on it: <a class=\"lk\" data-l=\"cond|blinded\">Blinded<\/a>, <a class=\"lk\" data-l=\"cond|deafened\">Deafened<\/a>, <a class=\"lk\" data-l=\"cond|paralyzed\">Paralyzed<\/a>, or <a class=\"lk\" data-l=\"cond|poisoned\">Poisoned<\/a>.<\/p>"},"levitate":{"n":"Levitate","l":2,"sc":"Transmutation","t":"Action","r":"60 ft","c":"V, S, M (a metal spring)","d":"Up to 10 minutes","conc":true,"rit":false,"cls":["Sorcerer","Wizard"],"src":"XPHB","u":"https://5e.tools/spells.html#levitate_xphb","srd":true,"h":"<p>One creature or loose object of your choice that you can see within range rises vertically up to 20 feet and remains suspended there for the duration. The spell can levitate an object that weighs up to 500 pounds. An unwilling creature that succeeds on a Constitution saving throw is unaffected.<\/p><p>The target can move only by pushing or pulling against a fixed object or surface within reach (such as a wall or a ceiling), which allows it to move as if it were climbing. You can change the target's altitude by up to 20 feet in either direction on your turn. If you are the target, you can move up or down as part of your move. Otherwise, you can take a <a class=\"lk\" data-l=\"act|magic\">Magic<\/a> action to move the target, which must remain within the spell's range.<\/p><p>When the spell ends, the target floats gently to the ground if it is still aloft.<\/p>"},"light":{"n":"Light","l":0,"sc":"Evocation","t":"Action","r":"Touch","c":"V, M (a firefly or phosphorescent moss)","d":"1 hour","conc":false,"rit":false,"cls":["Bard","Cleric","Sorcerer","Wizard"],"src":"XPHB","u":"https://5e.tools/spells.html#light_xphb","srd":true,"h":"<p>You touch one Large or smaller object that isn't being worn or carried by someone else. Until the spell ends, the object sheds <a class=\"lk\" data-l=\"rule|bright light\">Bright Light<\/a> in a 20-foot radius and <a class=\"lk\" data-l=\"rule|dim light\">Dim Light<\/a> for an additional 20 feet. The light can be colored as you like.<\/p><p>Covering the object with something opaque blocks the light. The spell ends if you cast it again.<\/p>"},"lightning bolt":{"n":"Lightning Bolt","l":3,"sc":"Evocation","t":"Action","r":"Self (100-ft Line)","c":"V, S, M (a bit of fur and a crystal rod)","d":"Instantaneous","conc":false,"rit":false,"cls":["Sorcerer","Wizard"],"src":"XPHB","u":"https://5e.tools/spells.html#lightning%20bolt_xphb","srd":true,"h":"<p>A stroke of lightning forming a 100-foot-long, 5-foot-wide <a class=\"lk\" data-l=\"rule|line [area of effect]\">Line<\/a> blasts out from you in a direction you choose. Each creature in the <a class=\"lk\" data-l=\"rule|line [area of effect]\">Line<\/a> makes a Dexterity saving throw, taking 8d6 Lightning damage on a failed save or half as much damage on a successful one.<\/p>","hl":"<p><b><i>Using a Higher-Level Spell Slot.<\/i><\/b> The damage increases by 1d6 for each spell slot level above 3.<\/p>"},"mage armor":{"n":"Mage Armor","l":1,"sc":"Abjuration","t":"Action","r":"Touch","c":"V, S, M (a piece of cured leather)","d":"8 hours","conc":false,"rit":false,"cls":["Sorcerer","Wizard"],"src":"XPHB","u":"https://5e.tools/spells.html#mage%20armor_xphb","srd":true,"h":"<p>You touch a willing creature who isn't wearing armor. Until the spell ends, the target's base AC becomes 13 plus its Dexterity modifier. The spell ends early if the target dons armor.<\/p>","mark":true},"mage hand":{"n":"Mage Hand","l":0,"sc":"Conjuration","t":"Action","r":"30 ft","c":"V, S","d":"1 minute","conc":false,"rit":false,"cls":["Bard","Sorcerer","Warlock","Wizard"],"src":"XPHB","u":"https://5e.tools/spells.html#mage%20hand_xphb","srd":true,"h":"<p>A spectral, floating hand appears at a point you choose within range. The hand lasts for the duration. The hand vanishes if it is ever more than 30 feet away from you or if you cast this spell again.<\/p><p>When you cast the spell, you can use the hand to manipulate an object, open an unlocked door or container, stow or retrieve an item from an open container, or pour the contents out of a vial.<\/p><p>As a <a class=\"lk\" data-l=\"act|magic\">Magic<\/a> action on your later turns, you can control the hand thus again. As part of that action, you can move the hand up to 30 feet.<\/p><p>The hand can't attack, activate magic items, or carry more than 10 pounds.<\/p>"},"magic circle":{"n":"Magic Circle","l":3,"sc":"Abjuration","t":"1 minute","r":"10 ft","c":"V, S, M (salt and powdered silver worth 100+ GP, which the spell consumes)","d":"1 hour","conc":false,"rit":false,"cls":["Cleric","Paladin","Warlock","Wizard"],"src":"XPHB","u":"https://5e.tools/spells.html#magic%20circle_xphb","srd":true,"h":"<p>You create a 10-foot-radius, 20-foot-tall <a class=\"lk\" data-l=\"rule|cylinder [area of effect]\">Cylinder<\/a> of magical energy centered on a point on the ground that you can see within range. Glowing runes appear wherever the <a class=\"lk\" data-l=\"rule|cylinder [area of effect]\">Cylinder<\/a> intersects with the floor or other surface.<\/p><p>Choose one or more of the following types of creatures: Celestials, Elementals, Fey, Fiends, or Undead. The circle affects a creature of the chosen type in the following ways:<\/p><ul><li>The creature can't willingly enter the <a class=\"lk\" data-l=\"rule|cylinder [area of effect]\">Cylinder<\/a> by nonmagical means. If the creature tries to use teleportation or interplanar travel to do so, it must first succeed on a Charisma saving throw.<\/li><li>The creature has <a class=\"lk\" data-l=\"rule|disadvantage\">Disadvantage<\/a> on attack rolls against targets within the <a class=\"lk\" data-l=\"rule|cylinder [area of effect]\">Cylinder<\/a>.<\/li><li>Targets within the <a class=\"lk\" data-l=\"rule|cylinder [area of effect]\">Cylinder<\/a> can't be possessed by or gain the <a class=\"lk\" data-l=\"cond|charmed\">Charmed<\/a> or <a class=\"lk\" data-l=\"cond|frightened\">Frightened<\/a> condition from the creature.<\/li><\/ul><p>Each time you cast this spell, you can cause its magic to operate in the reverse direction, preventing a creature of the specified type from leaving the <a class=\"lk\" data-l=\"rule|cylinder [area of effect]\">Cylinder<\/a> and protecting targets outside it.<\/p>","hl":"<p><b><i>Using a Higher-Level Spell Slot.<\/i><\/b> The duration increases by 1 hour for each spell slot level above 3.<\/p>","mark":true},"magic missile":{"n":"Magic Missile","l":1,"sc":"Evocation","t":"Action","r":"120 ft","c":"V, S","d":"Instantaneous","conc":false,"rit":false,"cls":["Sorcerer","Wizard"],"src":"XPHB","u":"https://5e.tools/spells.html#magic%20missile_xphb","srd":true,"h":"<p>You create three glowing darts of magical force. Each dart strikes a creature of your choice that you can see within range. A dart deals 1d4 + 1 Force damage to its target. The darts all strike simultaneously, and you can direct them to hit one creature or several.<\/p>","hl":"<p><b><i>Using a Higher-Level Spell Slot.<\/i><\/b> The spell creates one more dart for each spell slot level above 1.<\/p>"},"magic weapon":{"n":"Magic Weapon","l":2,"sc":"Transmutation","t":"Bonus Action","r":"Touch","c":"V, S","d":"1 hour","conc":false,"rit":false,"cls":["Paladin","Ranger","Sorcerer","Wizard"],"src":"XPHB","u":"https://5e.tools/spells.html#magic%20weapon_xphb","srd":true,"h":"<p>You touch a nonmagical weapon. Until the spell ends, that weapon becomes a magic weapon with a +1 bonus to attack rolls and damage rolls. The spell ends early if you cast it again.<\/p>","hl":"<p><b><i>Using a Higher-Level Spell Slot.<\/i><\/b> The bonus increases to +2 with a level 3-5 spell slot. The bonus increases to +3 with a level 6+ spell slot.<\/p>"},"major image":{"n":"Major Image","l":3,"sc":"Illusion","t":"Action","r":"120 ft","c":"V, S, M (a bit of fleece)","d":"Up to 10 minutes","conc":true,"rit":false,"cls":["Bard","Sorcerer","Warlock","Wizard"],"src":"XPHB","u":"https://5e.tools/spells.html#major%20image_xphb","srd":true,"h":"<p>You create the image of an object, a creature, or some other visible phenomenon that is no larger than a 20-foot <a class=\"lk\" data-l=\"rule|cube [area of effect]\">Cube<\/a>. The image appears at a spot that you can see within range and lasts for the duration. It seems real, including sounds, smells, and temperature appropriate to the thing depicted, but it can't deal damage or cause conditions.<\/p><p>If you are within range of the illusion, you can take a <a class=\"lk\" data-l=\"act|magic\">Magic<\/a> action to cause the image to move to any other spot within range. As the image changes location, you can alter its appearance so that its movements appear natural for the image. For example, if you create an image of a creature and move it, you can alter the image so that it appears to be walking. Similarly, you can cause the illusion to make different sounds at different times, even making it carry on a conversation, for example.<\/p><p>Physical interaction with the image reveals it to be an illusion, for things can pass through it. A creature that takes a <a class=\"lk\" data-l=\"act|study\">Study<\/a> action to examine the image can determine that it is an illusion with a successful Intelligence (<a class=\"lk\" data-l=\"skill|investigation\">Investigation<\/a>) check against your spell save DC. If a creature discerns the illusion for what it is, the creature can see through the image, and its other sensory qualities become faint to the creature.<\/p>","hl":"<p><b><i>Using a Higher-Level Spell Slot.<\/i><\/b> The spell lasts until dispelled, without requiring <a class=\"lk\" data-l=\"cond|concentration\">Concentration<\/a>, if cast with a level 4+ spell slot.<\/p>"},"mass suggestion":{"n":"Mass Suggestion","l":6,"sc":"Enchantment","t":"Action","r":"60 ft","c":"V, M (a snake's tongue)","d":"24 hours","conc":false,"rit":false,"cls":["Bard","Sorcerer","Wizard"],"src":"XPHB","u":"https://5e.tools/spells.html#mass%20suggestion_xphb","srd":true,"h":"<p>You suggest a course of activity—described in no more than 25 words—to twelve or fewer creatures you can see within range that can hear and understand you. The suggestion must sound achievable and not involve anything that would obviously deal damage to any of the targets or their allies. For example, you could say, \"Walk to the village down that road, and help the villagers there harvest crops until sunset.\" Or you could say, \"Now is not the time for violence. Drop your weapons, and dance! Stop in an hour.\"<\/p><p>Each target must succeed on a Wisdom saving throw or have the <a class=\"lk\" data-l=\"cond|charmed\">Charmed<\/a> condition for the duration or until you or your allies deal damage to the target. Each <a class=\"lk\" data-l=\"cond|charmed\">Charmed<\/a> target pursues the suggestion to the best of its ability. The suggested activity can continue for the entire duration, but if the suggested activity can be completed in a shorter time, the spell ends for a target upon completing it.<\/p>","hl":"<p><b><i>Using a Higher-Level Spell Slot.<\/i><\/b> The duration is longer with a spell slot of level 7 (10 days), 8 (30 days), or 9 (366 days).<\/p>"},"mending":{"n":"Mending","l":0,"sc":"Transmutation","t":"1 minute","r":"Touch","c":"V, S, M (two lodestones)","d":"Instantaneous","conc":false,"rit":false,"cls":["Bard","Cleric","Druid","Sorcerer","Wizard"],"src":"XPHB","u":"https://5e.tools/spells.html#mending_xphb","srd":true,"h":"<p>This spell repairs a single break or tear in an object you touch, such as a broken chain link, two halves of a broken key, a torn cloak, or a leaking wineskin. As long as the break or tear is no larger than 1 foot in any dimension, you mend it, leaving no trace of the former damage.<\/p><p>This spell can physically repair a magic item, but it can't restore magic to such an object.<\/p>"},"message":{"n":"Message","l":0,"sc":"Transmutation","t":"Action","r":"120 ft","c":"S, M (a copper wire)","d":"1 round","conc":false,"rit":false,"cls":["Bard","Druid","Sorcerer","Wizard"],"src":"XPHB","u":"https://5e.tools/spells.html#message_xphb","srd":true,"h":"<p>You point toward a creature within range and whisper a message. The target (and only the target) hears the message and can reply in a whisper that only you can hear.<\/p><p>You can cast this spell through solid objects if you are familiar with the target and know it is beyond the barrier. Magical silence; 1 foot of stone, metal, or wood; or a thin sheet of lead blocks the spell.<\/p>"},"meteor swarm":{"n":"Meteor Swarm","l":9,"sc":"Evocation","t":"Action","r":"1 miles","c":"V, S","d":"Instantaneous","conc":false,"rit":false,"cls":["Sorcerer","Wizard"],"src":"XPHB","u":"https://5e.tools/spells.html#meteor%20swarm_xphb","srd":true,"h":"<p>Blazing orbs of fire plummet to the ground at four different points you can see within range. Each creature in a 40-foot-radius <a class=\"lk\" data-l=\"rule|sphere [area of effect]\">Sphere<\/a> centered on each of those points makes a Dexterity saving throw. A creature takes 20d6 Fire damage and 20d6 Bludgeoning damage on a failed save or half as much damage on a successful one. A creature in the area of more than one fiery <a class=\"lk\" data-l=\"rule|sphere [area of effect]\">Sphere<\/a> is affected only once.<\/p><p>A nonmagical object that isn't being worn or carried also takes the damage if it's in the spell's area, and the object starts burning if it's flammable.<\/p>"},"mind sliver":{"n":"Mind Sliver","l":0,"sc":"Enchantment","t":"Action","r":"60 ft","c":"V","d":"Instantaneous","conc":false,"rit":false,"cls":["Sorcerer","Warlock","Wizard"],"src":"XPHB","u":"https://5e.tools/spells.html#mind%20sliver_xphb","srd":false,"h":"<p>One creature you can see makes an Intelligence save. Fail: 1d6 Psychic damage, and it subtracts 1d4 from the next saving throw it makes before the end of your next turn.<\/p>","hl":"<p>Cantrip upgrade: 2d6 at level 5, 3d6 at 11, 4d6 at 17.<\/p>","own":true},"mind spike":{"n":"Mind Spike","l":2,"sc":"Divination","t":"Action","r":"120 ft","c":"S","d":"Up to 1 hour","conc":true,"rit":false,"cls":["Sorcerer","Warlock","Wizard"],"src":"XPHB","u":"https://5e.tools/spells.html#mind%20spike_xphb","srd":true,"h":"<p>You drive a spike of psionic energy into the mind of one creature you can see within range. The target makes a Wisdom saving throw, taking 3d8 Psychic damage on a failed save or half as much damage on a successful one. On a failed save, you also always know the target's location until the spell ends, but only while the two of you are on the same plane of existence. While you have this knowledge, the target can't become hidden from you, and if it has the <a class=\"lk\" data-l=\"cond|invisible\">Invisible<\/a> condition, it gains no benefit from that condition against you.<\/p>","hl":"<p><b><i>Using a Higher-Level Spell Slot.<\/i><\/b> The damage increases by 1d8 for each spell slot level above 2.<\/p>"},"minor illusion":{"n":"Minor Illusion","l":0,"sc":"Illusion","t":"Action","r":"30 ft","c":"S, M (a bit of fleece)","d":"1 minute","conc":false,"rit":false,"cls":["Bard","Sorcerer","Warlock","Wizard"],"src":"XPHB","u":"https://5e.tools/spells.html#minor%20illusion_xphb","srd":true,"h":"<p>You create a sound or an image of an object within range that lasts for the duration. See the descriptions below for the effects of each. The illusion ends if you cast this spell again.<\/p><p>If a creature takes a <a class=\"lk\" data-l=\"act|study\">Study<\/a> action to examine the sound or image, the creature can determine that it is an illusion with a successful Intelligence (<a class=\"lk\" data-l=\"skill|investigation\">Investigation<\/a>) check against your spell save DC. If a creature discerns the illusion for what it is, the illusion becomes faint to the creature.<\/p><p><b><i>Sound.<\/i><\/b> If you create a sound, its volume can range from a whisper to a scream. It can be your voice, someone else's voice, a lion's roar, a beating of drums, or any other sound you choose. The sound continues unabated throughout the duration, or you can make discrete sounds at different times before the spell ends.<\/p><p><b><i>Image.<\/i><\/b> If you create an image of an object—such as a chair, muddy footprints, or a small chest—it must be no larger than a 5-foot <a class=\"lk\" data-l=\"rule|cube [area of effect]\">Cube<\/a>. The image can't create sound, light, smell, or any other sensory effect. Physical interaction with the image reveals it to be an illusion, since things can pass through it.<\/p>"},"mirror image":{"n":"Mirror Image","l":2,"sc":"Illusion","t":"Action","r":"Self","c":"V, S","d":"1 minute","conc":false,"rit":false,"cls":["Bard","Sorcerer","Warlock","Wizard"],"src":"XPHB","u":"https://5e.tools/spells.html#mirror%20image_xphb","srd":true,"h":"<p>Three illusory duplicates of yourself appear in your space. Until the spell ends, the duplicates move with you and mimic your actions, shifting position so it's impossible to track which image is real.<\/p><p>Each time a creature hits you with an attack roll during the spell's duration, roll a d6 for each of your remaining duplicates. If any of the d6s rolls a 3 or higher, one of the duplicates is hit instead of you, and the duplicate is destroyed. The duplicates otherwise ignore all other damage and effects. The spell ends when all three duplicates are destroyed.<\/p><p>A creature is unaffected by this spell if it has the <a class=\"lk\" data-l=\"cond|blinded\">Blinded<\/a> condition, <a class=\"lk\" data-l=\"sense|blindsight\">Blindsight<\/a>, or <a class=\"lk\" data-l=\"sense|truesight\">Truesight<\/a>.<\/p>"},"mislead":{"n":"Mislead","l":5,"sc":"Illusion","t":"Action","r":"Self","c":"S","d":"Up to 1 hour","conc":true,"rit":false,"cls":["Bard","Warlock","Wizard"],"src":"XPHB","u":"https://5e.tools/spells.html#mislead_xphb","srd":true,"h":"<p>You gain the <a class=\"lk\" data-l=\"cond|invisible\">Invisible<\/a> condition at the same time that an illusory double of you appears where you are standing. The double lasts for the duration, but the invisibility ends immediately after you make an attack roll, deal damage, or cast a spell.<\/p><p>As a <a class=\"lk\" data-l=\"act|magic\">Magic<\/a> action, you can move the illusory double up to twice your <a class=\"lk\" data-l=\"rule|speed\">Speed<\/a> and make it gesture, speak, and behave in whatever way you choose. It is intangible and invulnerable.<\/p><p>You can see through its eyes and hear through its ears as if you were located where it is.<\/p>"},"misty step":{"n":"Misty Step","l":2,"sc":"Conjuration","t":"Bonus Action","r":"Self","c":"V","d":"Instantaneous","conc":false,"rit":false,"cls":["Sorcerer","Warlock","Wizard"],"src":"XPHB","u":"https://5e.tools/spells.html#misty%20step_xphb","srd":true,"h":"<p>Briefly surrounded by silvery mist, you teleport up to 30 feet to an unoccupied space you can see.<\/p>"},"mordenkainen's faithful hound":{"n":"Mordenkainen's Faithful Hound","l":4,"sc":"Conjuration","t":"Action","r":"30 ft","c":"V, S, M (a silver whistle)","d":"8 hours","conc":false,"rit":false,"cls":["Wizard"],"src":"XPHB","u":"https://5e.tools/spells.html#mordenkainen%27s%20faithful%20hound_xphb","srd":true,"h":"<p>You conjure a phantom watchdog in an unoccupied space that you can see within range. The hound remains for the duration or until the two of you are more than 300 feet apart from each other.<\/p><p>No one but you can see the hound, and it is intangible and invulnerable. When a Small or larger creature comes within 30 feet of it without first speaking the password that you specify when you cast this spell, the hound starts barking loudly. The hound has <a class=\"lk\" data-l=\"sense|truesight\">Truesight<\/a> with a range of 30 feet.<\/p><p>At the start of each of your turns, the hound attempts to bite one enemy within 5 feet of it. That enemy must succeed on a Dexterity saving throw or take 4d8 Force damage.<\/p><p>On your later turns, you can take a <a class=\"lk\" data-l=\"act|magic\">Magic<\/a> action to move the hound up to 30 feet.<\/p>","mark":true},"move earth":{"n":"Move Earth","l":6,"sc":"Transmutation","t":"Action","r":"120 ft","c":"V, S, M (a miniature shovel)","d":"Up to 2 hours","conc":true,"rit":false,"cls":["Druid","Sorcerer","Wizard"],"src":"XPHB","u":"https://5e.tools/spells.html#move%20earth_xphb","srd":true,"h":"<p>Choose an area of terrain no larger than 40 feet on a side within range. You can reshape dirt, sand, or clay in the area in any manner you choose for the duration. You can raise or lower the area's elevation, create or fill in a trench, erect or flatten a wall, or form a pillar. The extent of any such changes can't exceed half the area's largest dimension. For example, if you affect a 40-foot square, you can create a pillar up to 20 feet high, raise or lower the square's elevation by up to 20 feet, dig a trench up to 20 feet deep, and so on. It takes 10 minutes for these changes to complete. Because the terrain's transformation occurs slowly, creatures in the area can't usually be trapped or injured by the ground's movement.<\/p><p>At the end of every 10 minutes you spend <a class=\"lk\" data-l=\"cond|concentration\">Concentrating<\/a> on the spell, you can choose a new area of terrain to affect within range.<\/p><p>This spell can't manipulate natural stone or stone construction. Rocks and structures shift to accommodate the new terrain. If the way you shape the terrain would make a structure unstable, it might collapse.<\/p><p>Similarly, this spell doesn't directly affect plant growth. The moved earth carries any plants along with it.<\/p>"},"nystul's magic aura":{"n":"Nystul's Magic Aura","l":2,"sc":"Illusion","t":"Action","r":"Touch","c":"V, S, M (a small square of silk)","d":"24 hours","conc":false,"rit":false,"cls":["Wizard"],"src":"XPHB","u":"https://5e.tools/spells.html#nystul%27s%20magic%20aura_xphb","srd":true,"h":"<p>With a touch, you place an illusion on a willing creature or an object that isn't being worn or carried. A creature gains the Mask effect below, and an object gains the False Aura effect below. The effect lasts for the duration. If you cast the spell on the same target every day for 30 days, the illusion lasts until dispelled.<\/p><p><b><i>Mask (Creature).<\/i><\/b> Choose a creature type other than the target's actual type. Spells and other magical effects treat the target as if it were a creature of the chosen type.<\/p><p><b><i>False Aura (Object).<\/i><\/b> You change the way the target appears to spells and magical effects that detect magical auras, such as <a class=\"lk\" data-l=\"spell|detect magic\">Detect Magic<\/a>. You can make a nonmagical object appear magical, make a magic item appear nonmagical, or change the object's aura so that it appears to belong to a school of magic you choose.<\/p>","mark":true},"otiluke's freezing sphere":{"n":"Otiluke's Freezing Sphere","l":6,"sc":"Evocation","t":"Action","r":"300 ft","c":"V, S, M (a miniature crystal sphere)","d":"Instantaneous","conc":false,"rit":false,"cls":["Sorcerer","Wizard"],"src":"XPHB","u":"https://5e.tools/spells.html#otiluke%27s%20freezing%20sphere_xphb","srd":true,"h":"<p>A frigid globe streaks from you to a point of your choice within range, where it explodes in a 60-foot-radius <a class=\"lk\" data-l=\"rule|sphere [area of effect]\">Sphere<\/a>. Each creature in that area makes a Constitution saving throw, taking 10d6 Cold damage on a failed save or half as much damage on a successful one.<\/p><p>If the globe strikes a body of water, it freezes the water to a depth of 6 inches over an area 30 feet square. This ice lasts for 1 minute. Creatures that were swimming on the surface of frozen water are trapped in the ice and have the <a class=\"lk\" data-l=\"cond|restrained\">Restrained<\/a> condition. A trapped creature can take an action to make a Strength (<a class=\"lk\" data-l=\"skill|athletics\">Athletics<\/a>) check against your spell save DC to break free.<\/p><p>You can refrain from firing the globe after completing the spell's casting. If you do so, a globe about the size of a sling bullet, cool to the touch, appears in your hand. At any time, you or a creature you give the globe to can throw the globe (to a range of 40 feet) or hurl it with a sling (to the sling's normal range). It shatters on impact, with the same effect as a normal casting of the spell. You can also set the globe down without shattering it. After 1 minute, if the globe hasn't already shattered, it explodes.<\/p>","hl":"<p><b><i>Using a Higher-Level Spell Slot.<\/i><\/b> The damage increases by 1d6 for each spell slot level above 6.<\/p>"},"phantasmal force":{"n":"Phantasmal Force","l":2,"sc":"Illusion","t":"Action","r":"60 ft","c":"V, S, M (a bit of fleece)","d":"Up to 1 minute","conc":true,"rit":false,"cls":["Bard","Sorcerer","Wizard"],"src":"XPHB","u":"https://5e.tools/spells.html#phantasmal%20force_xphb","srd":true,"h":"<p>You attempt to craft an illusion in the mind of a creature you can see within range. The target makes an Intelligence saving throw. On a failed save, you create a phantasmal object, creature, or other phenomenon that is no larger than a 10-foot <a class=\"lk\" data-l=\"rule|cube [area of effect]\">Cube<\/a> and that is perceivable only to the target for the duration. The phantasm includes sound, temperature, and other stimuli.<\/p><p>The target can take a <a class=\"lk\" data-l=\"act|study\">Study<\/a> action to examine the phantasm with an Intelligence (<a class=\"lk\" data-l=\"skill|investigation\">Investigation<\/a>) check against your spell save DC. If the check succeeds, the target realizes that the phantasm is an illusion, and the spell ends.<\/p><p>While affected by the spell, the target treats the phantasm as if it were real and rationalizes any illogical outcomes from interacting with it. For example, if the target steps through a phantasmal bridge and survives the fall, it believes the bridge exists and something else caused it to fall.<\/p><p>An affected target can even take damage from the illusion if the phantasm represents a dangerous creature or hazard. On each of your turns, such a phantasm can deal 2d8 Psychic damage to the target if it is in the phantasm's area or within 5 feet of the phantasm. The target perceives the damage as a type appropriate to the illusion.<\/p>"},"planar binding":{"n":"Planar Binding","l":5,"sc":"Abjuration","t":"1 hour","r":"60 ft","c":"V, S, M (a jewel worth 1,000+ GP, which the spell consumes)","d":"24 hours","conc":false,"rit":false,"cls":["Bard","Cleric","Druid","Warlock","Wizard"],"src":"XPHB","u":"https://5e.tools/spells.html#planar%20binding_xphb","srd":true,"h":"<p>You attempt to bind a Celestial, an Elemental, a Fey, or a Fiend to your service. The creature must be within range for the entire casting of the spell. (Typically, the creature is first summoned into the center of the inverted version of the <a class=\"lk\" data-l=\"spell|magic circle\">Magic Circle<\/a> spell to trap it while this spell is cast.) At the completion of the casting, the target must succeed on a Charisma saving throw or be bound to serve you for the duration. If the creature was summoned or created by another spell, that spell's duration is extended to match the duration of this spell.<\/p><p>A bound creature must follow your commands to the best of its ability. You might command the creature to accompany you on an adventure, to guard a location, or to deliver a message. If the creature is <a class=\"lk\" data-l=\"rule|hostile [attitude]\">Hostile<\/a>, it strives to twist your commands to achieve its own objectives. If the creature carries out your commands completely before the spell ends, it travels to you to report this fact if you are on the same plane of existence. If you are on a different plane, it returns to the place where you bound it and remains there until the spell ends.<\/p>","hl":"<p><b><i>Using a Higher-Level Spell Slot.<\/i><\/b> The duration increases with a spell slot of level 6 (10 days), 7 (30 days), 8 (180 days), and 9 (366 days).<\/p>"},"plane shift":{"n":"Plane Shift","l":7,"sc":"Conjuration","t":"Action","r":"Touch","c":"V, S, M (a forked, metal rod worth 250+ GP and attuned to a plane of existence)","d":"Instantaneous","conc":false,"rit":false,"cls":["Cleric","Druid","Sorcerer","Warlock","Wizard"],"src":"XPHB","u":"https://5e.tools/spells.html#plane%20shift_xphb","srd":true,"h":"<p>You and up to eight willing creatures who link hands in a circle are transported to a different plane of existence. You can specify a target destination in general terms, such as the City of Brass on the Elemental Plane of Fire or the palace of Dispater on the second level of the Nine Hells, and you appear in or near that destination, as determined by the DM.<\/p><p>Alternatively, if you know the sigil sequence of a teleportation circle on another plane of existence, this spell can take you to that circle. If the teleportation circle is too small to hold all the creatures you transported, they appear in the closest unoccupied spaces next to the circle.<\/p>"},"poison spray":{"n":"Poison Spray","l":0,"sc":"Necromancy","t":"Action","r":"30 ft","c":"V, S","d":"Instantaneous","conc":false,"rit":false,"cls":["Druid","Sorcerer","Warlock","Wizard"],"src":"XPHB","u":"https://5e.tools/spells.html#poison%20spray_xphb","srd":true,"h":"<p>You spray toxic mist at a creature within range. Make a ranged spell attack against the target. On a hit, the target takes 1d12 Poison damage.<\/p>","hl":"<p><b><i>Cantrip Upgrade.<\/i><\/b> The damage increases by 1d12 when you reach levels 5 (2d12), 11 (3d12), and 17 (4d12).<\/p>"},"polymorph":{"n":"Polymorph","l":4,"sc":"Transmutation","t":"Action","r":"60 ft","c":"V, S, M (a caterpillar cocoon)","d":"Up to 1 hour","conc":true,"rit":false,"cls":["Bard","Druid","Sorcerer","Wizard"],"src":"XPHB","u":"https://5e.tools/spells.html#polymorph_xphb","srd":true,"h":"<p>You attempt to transform a creature that you can see within range into a Beast. The target must succeed on a Wisdom saving throw or shape-shift into Beast form for the duration. That form can be any Beast you choose that has a <a class=\"lk\" data-l=\"rule|challenge rating\">Challenge Rating<\/a> equal to or less than the target's (or the target's level if it doesn't have a <a class=\"lk\" data-l=\"rule|challenge rating\">Challenge Rating<\/a>). The target's game statistics are replaced by the stat block of the chosen Beast, but the target retains its alignment, personality, creature type, <a class=\"lk\" data-l=\"rule|hit points\">Hit Points<\/a>, and <a class=\"lk\" data-l=\"rule|hit point dice\">Hit Point Dice<\/a>.<\/p><p>The target gains a number of <a class=\"lk\" data-l=\"rule|temporary hit points\">Temporary Hit Points<\/a> equal to the <a class=\"lk\" data-l=\"rule|hit points\">Hit Points<\/a> of the Beast form. These <a class=\"lk\" data-l=\"rule|temporary hit points\">Temporary Hit Points<\/a> vanish if any remain when the spell ends. The spell ends early on the target if it has no <a class=\"lk\" data-l=\"rule|temporary hit points\">Temporary Hit Points<\/a> left.<\/p><p>The target is limited in the actions it can perform by the anatomy of its new form, and it can't speak or cast spells.<\/p><p>The target's gear melds into the new form. The creature can't use or otherwise benefit from any of that equipment.<\/p>"},"power word kill":{"n":"Power Word Kill","l":9,"sc":"Enchantment","t":"Action","r":"60 ft","c":"V","d":"Instantaneous","conc":false,"rit":false,"cls":["Bard","Sorcerer","Warlock","Wizard"],"src":"XPHB","u":"https://5e.tools/spells.html#power%20word%20kill_xphb","srd":true,"h":"<p>You compel one creature you can see within range to die. If the target has 100 <a class=\"lk\" data-l=\"rule|hit points\">Hit Points<\/a> or fewer, it dies. Otherwise, it takes 12d12 Psychic damage.<\/p>"},"power word stun":{"n":"Power Word Stun","l":8,"sc":"Enchantment","t":"Action","r":"60 ft","c":"V","d":"Instantaneous","conc":false,"rit":false,"cls":["Bard","Sorcerer","Warlock","Wizard"],"src":"XPHB","u":"https://5e.tools/spells.html#power%20word%20stun_xphb","srd":true,"h":"<p>You overwhelm the mind of one creature you can see within range. If the target has 150 <a class=\"lk\" data-l=\"rule|hit points\">Hit Points<\/a> or fewer, it has the <a class=\"lk\" data-l=\"cond|stunned\">Stunned<\/a> condition. Otherwise, its <a class=\"lk\" data-l=\"rule|speed\">Speed<\/a> is 0 until the start of your next turn.<\/p><p>The <a class=\"lk\" data-l=\"cond|stunned\">Stunned<\/a> target makes a Constitution saving throw at the end of each of its turns, ending the condition on itself on a success.<\/p>"},"prestidigitation":{"n":"Prestidigitation","l":0,"sc":"Transmutation","t":"Action","r":"10 ft","c":"V, S","d":"1 hour","conc":false,"rit":false,"cls":["Bard","Sorcerer","Warlock","Wizard"],"src":"XPHB","u":"https://5e.tools/spells.html#prestidigitation_xphb","srd":true,"h":"<p>You create a magical effect within range. Choose the effect from the options below. If you cast this spell multiple times, you can have up to three of its non-instantaneous effects active at a time.<\/p><p><b><i>Sensory Effect.<\/i><\/b> You create an instantaneous, harmless sensory effect, such as a shower of sparks, a puff of wind, faint musical notes, or an odd odor.<\/p><p><b><i>Fire Play.<\/i><\/b> You instantaneously light or snuff out a candle, a torch, or a small campfire.<\/p><p><b><i>Clean or Soil.<\/i><\/b> You instantaneously clean or soil an object no larger than 1 cubic foot.<\/p><p><b><i>Minor Sensation.<\/i><\/b> You chill, warm, or flavor up to 1 cubic foot of nonliving material for 1 hour.<\/p><p><b><i>Magic Mark.<\/i><\/b> You make a color, a small mark, or a symbol appear on an object or a surface for 1 hour.<\/p><p><b><i>Minor Creation.<\/i><\/b> You create a nonmagical trinket or an illusory image that can fit in your hand. It lasts until the end of your next turn. A trinket can deal no damage and has no monetary worth.<\/p>"},"prismatic spray":{"n":"Prismatic Spray","l":7,"sc":"Evocation","t":"Action","r":"Self (60-ft Cone)","c":"V, S","d":"Instantaneous","conc":false,"rit":false,"cls":["Bard","Sorcerer","Wizard"],"src":"XPHB","u":"https://5e.tools/spells.html#prismatic%20spray_xphb","srd":true,"h":"<p>Eight rays of light flash from you in a 60-foot <a class=\"lk\" data-l=\"rule|cone [area of effect]\">Cone<\/a>. Each creature in the <a class=\"lk\" data-l=\"rule|cone [area of effect]\">Cone<\/a> makes a Dexterity saving throw. For each target, roll 1d8 to determine which color ray affects it, consulting the Prismatic Rays table.<\/p><div class=\"tw\"><table><caption>Prismatic Rays<\/caption><tr><th>1d8<\/th><th>Ray<\/th><\/tr><tr><td>1<\/td><td><b>Red.<\/b> <i>Failed Save:<\/i> 12d6 Fire damage. <i>Successful Save:<\/i> Half as much damage.<\/td><\/tr><tr><td>2<\/td><td><b>Orange.<\/b> <i>Failed Save:<\/i> 12d6 Acid damage. <i>Successful Save:<\/i> Half as much damage.<\/td><\/tr><tr><td>3<\/td><td><b>Yellow.<\/b> <i>Failed Save:<\/i> 12d6 Lightning damage. <i>Successful Save:<\/i> Half as much damage.<\/td><\/tr><tr><td>4<\/td><td><b>Green.<\/b> <i>Failed Save:<\/i> 12d6 Poison damage. <i>Successful Save:<\/i> Half as much damage.<\/td><\/tr><tr><td>5<\/td><td><b>Blue.<\/b> <i>Failed Save:<\/i> 12d6 Cold damage. <i>Successful Save:<\/i> Half as much damage.<\/td><\/tr><tr><td>6<\/td><td><b>Indigo.<\/b> <i>Failed Save:<\/i> The target has the <a class=\"lk\" data-l=\"cond|restrained\">Restrained<\/a> condition and makes a Constitution saving throw at the end of each of its turns. If it successfully saves three times, the condition ends. If it fails three times, it has the <a class=\"lk\" data-l=\"cond|petrified\">Petrified<\/a> condition until it is freed by an effect like the <a class=\"lk\" data-l=\"spell|greater restoration\">Greater Restoration<\/a> spell. The successes and failures needn't be consecutive; keep track of both until the target collects three of a kind.<\/td><\/tr><tr><td>7<\/td><td><b>Violet.<\/b> <i>Failed Save:<\/i> The target has the <a class=\"lk\" data-l=\"cond|blinded\">Blinded<\/a> condition and makes a Wisdom saving throw at the start of your next turn. On a successful save, the condition ends. On a failed save, the condition ends, and the creature teleports to another plane of existence (DM's choice).<\/td><\/tr><tr><td>8<\/td><td><b>Special.<\/b> The target is struck by two rays. Roll twice, rerolling any 8.<\/td><\/tr><\/table><\/div>"},"produce flame":{"n":"Produce Flame","l":0,"sc":"Conjuration","t":"Bonus Action","r":"Self","c":"V, S","d":"10 minutes","conc":false,"rit":false,"cls":["Druid"],"src":"XPHB","u":"https://5e.tools/spells.html#produce%20flame_xphb","srd":true,"h":"<p>A flickering flame appears in your hand and remains there for the duration. While there, the flame emits no heat and ignites nothing, and it sheds <a class=\"lk\" data-l=\"rule|bright light\">Bright Light<\/a> in a 20-foot radius and <a class=\"lk\" data-l=\"rule|dim light\">Dim Light<\/a> for an additional 20 feet. The spell ends if you cast it again.<\/p><p>Until the spell ends, you can take a <a class=\"lk\" data-l=\"act|magic\">Magic<\/a> action to hurl fire at a creature or an object within 60 feet of you. Make a ranged spell attack. On a hit, the target takes 1d8 Fire damage.<\/p>","hl":"<p><b><i>Cantrip Upgrade.<\/i><\/b> The damage increases by 1d8 when you reach levels 5 (2d8), 11 (3d8), and 17 (4d8).<\/p>"},"protection from energy":{"n":"Protection from Energy","l":3,"sc":"Abjuration","t":"Action","r":"Touch","c":"V, S","d":"Up to 1 hour","conc":true,"rit":false,"cls":["Cleric","Druid","Ranger","Sorcerer","Wizard"],"src":"XPHB","u":"https://5e.tools/spells.html#protection%20from%20energy_xphb","srd":true,"h":"<p>For the duration, the willing creature you touch has <a class=\"lk\" data-l=\"rule|resistance\">Resistance<\/a> to one damage type of your choice: Acid, Cold, Fire, Lightning, or Thunder.<\/p>"},"protection from evil and good":{"n":"Protection from Evil and Good","l":1,"sc":"Abjuration","t":"Action","r":"Touch","c":"V, S, M (a flask of Holy Water worth 25+ GP, which the spell consumes)","d":"Up to 10 minutes","conc":true,"rit":false,"cls":["Cleric","Druid","Paladin","Warlock","Wizard"],"src":"XPHB","u":"https://5e.tools/spells.html#protection%20from%20evil%20and%20good_xphb","srd":true,"h":"<p>Until the spell ends, one willing creature you touch is protected against creatures that are Aberrations, Celestials, Elementals, Fey, Fiends, or Undead. The protection grants several benefits. Creatures of those types have <a class=\"lk\" data-l=\"rule|disadvantage\">Disadvantage<\/a> on attack rolls against the target. The target also can't be possessed by or gain the <a class=\"lk\" data-l=\"cond|charmed\">Charmed<\/a> or <a class=\"lk\" data-l=\"cond|frightened\">Frightened<\/a> conditions from them. If the target is already possessed, <a class=\"lk\" data-l=\"cond|charmed\">Charmed<\/a>, or <a class=\"lk\" data-l=\"cond|frightened\">Frightened<\/a> by such a creature, the target has <a class=\"lk\" data-l=\"rule|advantage\">Advantage<\/a> on any new saving throw against the relevant effect.<\/p>"},"purify food and drink":{"n":"Purify Food and Drink","l":1,"sc":"Transmutation","t":"Action","r":"10 ft","c":"V, S","d":"Instantaneous","conc":false,"rit":true,"cls":["Cleric","Druid","Paladin"],"src":"XPHB","u":"https://5e.tools/spells.html#purify%20food%20and%20drink_xphb","srd":true,"h":"<p>You remove poison and rot from nonmagical food and drink in a 5-foot-radius <a class=\"lk\" data-l=\"rule|sphere [area of effect]\">Sphere<\/a> centered on a point within range.<\/p>"},"rary's telepathic bond":{"n":"Rary's Telepathic Bond","l":5,"sc":"Divination","t":"Action","r":"30 ft","c":"V, S, M (two eggs)","d":"1 hour","conc":false,"rit":true,"cls":["Bard","Wizard"],"src":"XPHB","u":"https://5e.tools/spells.html#rary%27s%20telepathic%20bond_xphb","srd":true,"h":"<p>You forge a telepathic link among up to eight willing creatures of your choice within range, psychically linking each creature to all the others for the duration. Creatures that can't communicate in any languages aren't affected by this spell.<\/p><p>Until the spell ends, the targets can communicate telepathically through the bond whether or not they share a language. The communication is possible over any distance, though it can't extend to other planes of existence.<\/p>"},"ray of enfeeblement":{"n":"Ray of Enfeeblement","l":2,"sc":"Necromancy","t":"Action","r":"60 ft","c":"V, S","d":"Up to 1 minute","conc":true,"rit":false,"cls":["Warlock","Wizard"],"src":"XPHB","u":"https://5e.tools/spells.html#ray%20of%20enfeeblement_xphb","srd":true,"h":"<p>A beam of enervating energy shoots from you toward a creature within range. The target must make a Constitution saving throw. On a successful save, the target has <a class=\"lk\" data-l=\"rule|disadvantage\">Disadvantage<\/a> on the next attack roll it makes until the start of your next turn.<\/p><p>On a failed save, the target has <a class=\"lk\" data-l=\"rule|disadvantage\">Disadvantage<\/a> on Strength-based <a class=\"lk\" data-l=\"rule|d20 test\">D20 Tests<\/a> for the duration. During that time, it also subtracts 1d8 from all its damage rolls. The target repeats the save at the end of each of its turns, ending the spell on a success.<\/p>"},"ray of frost":{"n":"Ray of Frost","l":0,"sc":"Evocation","t":"Action","r":"60 ft","c":"V, S","d":"Instantaneous","conc":false,"rit":false,"cls":["Sorcerer","Wizard"],"src":"XPHB","u":"https://5e.tools/spells.html#ray%20of%20frost_xphb","srd":true,"h":"<p>A frigid beam of blue-white light streaks toward a creature within range. Make a ranged spell attack against the target. On a hit, it takes 1d8 Cold damage, and its <a class=\"lk\" data-l=\"rule|speed\">Speed<\/a> is reduced by 10 feet until the start of your next turn.<\/p>","hl":"<p><b><i>Cantrip Upgrade.<\/i><\/b> The damage increases by 1d8 when you reach levels 5 (2d8), 11 (3d8), and 17 (4d8).<\/p>"},"ray of sickness":{"n":"Ray of Sickness","l":1,"sc":"Necromancy","t":"Action","r":"60 ft","c":"V, S","d":"Instantaneous","conc":false,"rit":false,"cls":["Sorcerer","Wizard"],"src":"XPHB","u":"https://5e.tools/spells.html#ray%20of%20sickness_xphb","srd":true,"h":"<p>You shoot a greenish ray at a creature within range. Make a ranged spell attack against the target. On a hit, the target takes 2d8 Poison damage and has the <a class=\"lk\" data-l=\"cond|poisoned\">Poisoned<\/a> condition until the end of your next turn.<\/p>","hl":"<p><b><i>Using a Higher-Level Spell Slot.<\/i><\/b> The damage increases by 1d8 for each spell slot level above 1.<\/p>"},"remove curse":{"n":"Remove Curse","l":3,"sc":"Abjuration","t":"Action","r":"Touch","c":"V, S","d":"Instantaneous","conc":false,"rit":false,"cls":["Cleric","Paladin","Warlock","Wizard"],"src":"XPHB","u":"https://5e.tools/spells.html#remove%20curse_xphb","srd":true,"h":"<p>At your touch, all curses affecting one creature or object end. If the object is a cursed magic item, its curse remains, but the spell breaks its owner's <a class=\"lk\" data-l=\"rule|attunement\">Attunement<\/a> to the object so it can be removed or discarded.<\/p>"},"resistance":{"n":"Resistance","l":0,"sc":"Abjuration","t":"Action","r":"Touch","c":"V, S","d":"Up to 1 minute","conc":true,"rit":false,"cls":["Cleric","Druid"],"src":"XPHB","u":"https://5e.tools/spells.html#resistance_xphb","srd":true,"h":"<p>You touch a willing creature and choose a damage type: Acid, Bludgeoning, Cold, Fire, Lightning, Necrotic, Piercing, Poison, Radiant, Slashing, or Thunder. When the creature takes damage of the chosen type before the spell ends, the creature reduces the total damage taken by 1d4. A creature can benefit from this spell only once per turn.<\/p>"},"reverse gravity":{"n":"Reverse Gravity","l":7,"sc":"Transmutation","t":"Action","r":"100 ft","c":"V, S, M (a lodestone and iron filings)","d":"Up to 1 minute","conc":true,"rit":false,"cls":["Druid","Sorcerer","Wizard"],"src":"XPHB","u":"https://5e.tools/spells.html#reverse%20gravity_xphb","srd":true,"h":"<p>This spell reverses gravity in a 50-foot-radius, 100-foot high <a class=\"lk\" data-l=\"rule|cylinder [area of effect]\">Cylinder<\/a> centered on a point within range. All creatures and objects in that area that aren't anchored to the ground fall upward and reach the top of the <a class=\"lk\" data-l=\"rule|cylinder [area of effect]\">Cylinder<\/a>. A creature can make a Dexterity saving throw to grab a fixed object it can reach, thus avoiding the fall upward.<\/p><p>If a ceiling or an anchored object is encountered in this upward fall, creatures and objects strike it just as they would during a downward fall. If an affected creature or object reaches the <a class=\"lk\" data-l=\"rule|cylinder [area of effect]\">Cylinder<\/a>'s top without striking anything, it hovers there for the duration. When the spell ends, affected objects and creatures fall downward.<\/p>"},"revivify":{"n":"Revivify","l":3,"sc":"Necromancy","t":"Action","r":"Touch","c":"V, S, M (a diamond worth 300+ GP, which the spell consumes)","d":"Instantaneous","conc":false,"rit":false,"cls":["Cleric","Druid","Paladin","Ranger"],"src":"XPHB","u":"https://5e.tools/spells.html#revivify_xphb","srd":true,"h":"<p>You touch a creature that has died within the last minute. That creature revives with 1 <a class=\"lk\" data-l=\"rule|hit points\">Hit Point<\/a>. This spell can't revive a creature that has died of old age, nor does it restore any missing body parts.<\/p>"},"sacred flame":{"n":"Sacred Flame","l":0,"sc":"Evocation","t":"Action","r":"60 ft","c":"V, S","d":"Instantaneous","conc":false,"rit":false,"cls":["Cleric"],"src":"XPHB","u":"https://5e.tools/spells.html#sacred%20flame_xphb","srd":true,"h":"<p>Flame-like radiance descends on a creature that you can see within range. The target must succeed on a Dexterity saving throw or take 1d8 Radiant damage. The target gains no benefit from <a class=\"lk\" data-l=\"rule|cover\">Half Cover<\/a> or Three-Quarters <a class=\"lk\" data-l=\"rule|cover\">Cover<\/a> for this save.<\/p>","hl":"<p><b><i>Cantrip Upgrade.<\/i><\/b> The damage increases by 1d8 when you reach levels 5 (2d8), 11 (3d8), and 17 (4d8).<\/p>"},"sanctuary":{"n":"Sanctuary","l":1,"sc":"Abjuration","t":"Bonus Action","r":"30 ft","c":"V, S, M (a shard of glass from a mirror)","d":"1 minute","conc":false,"rit":false,"cls":["Cleric"],"src":"XPHB","u":"https://5e.tools/spells.html#sanctuary_xphb","srd":true,"h":"<p>You ward a creature within range. Until the spell ends, any creature who targets the warded creature with an attack roll or a damaging spell must succeed on a Wisdom saving throw or either choose a new target or lose the attack or spell. This spell doesn't protect the warded creature from areas of effect.<\/p><p>The spell ends if the warded creature makes an attack roll, casts a spell, or deals damage.<\/p>","mark":true},"scorching ray":{"n":"Scorching Ray","l":2,"sc":"Evocation","t":"Action","r":"120 ft","c":"V, S","d":"Instantaneous","conc":false,"rit":false,"cls":["Sorcerer","Wizard"],"src":"XPHB","u":"https://5e.tools/spells.html#scorching%20ray_xphb","srd":true,"h":"<p>You hurl three fiery rays. You can hurl them at one target within range or at several. Make a ranged spell attack for each ray. On a hit, the target takes 2d6 Fire damage.<\/p>","hl":"<p><b><i>Using a Higher-Level Spell Slot.<\/i><\/b> You create one additional ray for each spell slot level above 2.<\/p>"},"scrying":{"n":"Scrying","l":5,"sc":"Divination","t":"10 minutes","r":"Self","c":"V, S, M (a focus worth 1,000+ GP, such as a crystal ball, mirror, or water-filled font)","d":"Up to 10 minutes","conc":true,"rit":false,"cls":["Bard","Cleric","Druid","Warlock","Wizard"],"src":"XPHB","u":"https://5e.tools/spells.html#scrying_xphb","srd":true,"h":"<p>You can see and hear a creature you choose that is on the same plane of existence as you. The target makes a Wisdom saving throw, which is modified (see the tables below) by how well you know the target and the sort of physical connection you have to it. The target doesn't know what it is making the save against, only that it feels uneasy.<\/p><div class=\"tw\"><table><tr><th>Your Knowledge of the Target Is...<\/th><th>Save Modifier<\/th><\/tr><tr><td>Secondhand (heard of the target)<\/td><td>+5<\/td><\/tr><tr><td>Firsthand (met the target)<\/td><td>+0<\/td><\/tr><tr><td>Extensive (know the target well)<\/td><td>-5<\/td><\/tr><\/table><\/div><div class=\"tw\"><table><tr><th>You Have the Target's...<\/th><th>Save Modifier<\/th><\/tr><tr><td>Picture or other likeness<\/td><td>-2<\/td><\/tr><tr><td>Garment or other possession<\/td><td>-4<\/td><\/tr><tr><td>Body part, lock of hair, or bit of nail<\/td><td>-10<\/td><\/tr><\/table><\/div><p>On a successful save, the target isn't affected, and you can't use this spell on it again for 24 hours.<\/p><p>On a failed save, the spell creates an <a class=\"lk\" data-l=\"cond|invisible\">Invisible<\/a>, intangible sensor within 10 feet of the target. You can see and hear through the sensor as if you were there. The sensor moves with the target, remaining within 10 feet of it for the duration. If something can see the sensor, it appears as a luminous orb about the size of your fist.<\/p><p>Instead of targeting a creature, you can target a location you have seen. When you do so, the sensor appears at that location and doesn't move.<\/p>"},"see invisibility":{"n":"See Invisibility","l":2,"sc":"Divination","t":"Action","r":"Self","c":"V, S, M (a pinch of talc)","d":"1 hour","conc":false,"rit":false,"cls":["Bard","Sorcerer","Wizard"],"src":"XPHB","u":"https://5e.tools/spells.html#see%20invisibility_xphb","srd":true,"h":"<p>For the duration, you see creatures and objects that have the <a class=\"lk\" data-l=\"cond|invisible\">Invisible<\/a> condition as if they were visible, and you can see into the Ethereal Plane. Creatures and objects there appear ghostly.<\/p>"},"seeming":{"n":"Seeming","l":5,"sc":"Illusion","t":"Action","r":"30 ft","c":"V, S","d":"8 hours","conc":false,"rit":false,"cls":["Bard","Sorcerer","Wizard"],"src":"XPHB","u":"https://5e.tools/spells.html#seeming_xphb","srd":true,"h":"<p>You give an illusory appearance to each creature of your choice that you can see within range. An unwilling target can make a Charisma saving throw, and if it succeeds, it is unaffected by this spell.<\/p><p>You can give the same appearance or different ones to the targets. The spell can change the appearance of the targets' bodies and equipment. You can make each creature seem 1 foot shorter or taller and appear heavier or lighter. A target's new appearance must have the same basic arrangement of limbs as the target, but the extent of the illusion is otherwise up to you. The spell lasts for the duration.<\/p><p>The changes wrought by this spell fail to hold up to physical inspection. For example, if you use this spell to add a hat to a creature's outfit, objects pass through the hat.<\/p><p>A creature that takes the <a class=\"lk\" data-l=\"act|study\">Study<\/a> action to examine a target can make an Intelligence (<a class=\"lk\" data-l=\"skill|investigation\">Investigation<\/a>) check against your spell save DC. If it succeeds, it becomes aware that the target is disguised.<\/p>"},"sending":{"n":"Sending","l":3,"sc":"Divination","t":"Action","r":"Unlimited","c":"V, S, M (a copper wire)","d":"Instantaneous","conc":false,"rit":false,"cls":["Bard","Cleric","Wizard"],"src":"XPHB","u":"https://5e.tools/spells.html#sending_xphb","srd":true,"h":"<p>You send a short message of 25 words or fewer to a creature you have met or a creature described to you by someone who has met it. The target hears the message in its mind, recognizes you as the sender if it knows you, and can answer in a like manner immediately. The spell enables targets to understand the meaning of your message.<\/p><p>You can send the message across any distance and even to other planes of existence, but if the target is on a different plane than you, there is a 5 percent chance that the message doesn't arrive. You know if the delivery fails.<\/p><p>Upon receiving your message, a creature can block your ability to reach it again with this spell for 8 hours. If you try to send another message during that time, you learn that you are blocked, and the spell fails.<\/p>"},"shatter":{"n":"Shatter","l":2,"sc":"Evocation","t":"Action","r":"60 ft","c":"V, S, M (a chip of mica)","d":"Instantaneous","conc":false,"rit":false,"cls":["Bard","Sorcerer","Wizard"],"src":"XPHB","u":"https://5e.tools/spells.html#shatter_xphb","srd":true,"h":"<p>A loud noise erupts from a point of your choice within range. Each creature in a 10-foot-radius <a class=\"lk\" data-l=\"rule|sphere [area of effect]\">Sphere<\/a> centered there makes a Constitution saving throw, taking 3d8 Thunder damage on a failed save or half as much damage on a successful one. A Construct has <a class=\"lk\" data-l=\"rule|disadvantage\">Disadvantage<\/a> on the save.<\/p><p>A nonmagical object that isn't being worn or carried also takes the damage if it's in the spell's area.<\/p>","hl":"<p><b><i>Using a Higher-Level Spell Slot.<\/i><\/b> The damage increases by 1d8 for each spell slot level above 2.<\/p>"},"shield":{"n":"Shield","l":1,"sc":"Abjuration","t":"Reaction, which you take when you are hit by an attack roll or targeted by the Magic Missile spell","r":"Self","c":"V, S","d":"1 round","conc":false,"rit":false,"cls":["Sorcerer","Wizard"],"src":"XPHB","u":"https://5e.tools/spells.html#shield_xphb","srd":true,"h":"<p>An imperceptible barrier of magical force protects you. Until the start of your next turn, you have a +5 bonus to AC, including against the triggering attack, and you take no damage from <a class=\"lk\" data-l=\"spell|magic missile\">Magic Missile<\/a>.<\/p>"},"shield of faith":{"n":"Shield of Faith","l":1,"sc":"Abjuration","t":"Bonus Action","r":"60 ft","c":"V, S, M (a prayer scroll)","d":"Up to 10 minutes","conc":true,"rit":false,"cls":["Cleric","Paladin"],"src":"XPHB","u":"https://5e.tools/spells.html#shield%20of%20faith_xphb","srd":true,"h":"<p>A shimmering field surrounds a creature of your choice within range, granting it a +2 bonus to AC for the duration.<\/p>"},"shillelagh":{"n":"Shillelagh","l":0,"sc":"Transmutation","t":"Bonus Action","r":"Self","c":"V, S, M (mistletoe)","d":"1 minute","conc":false,"rit":false,"cls":["Druid"],"src":"XPHB","u":"https://5e.tools/spells.html#shillelagh_xphb","srd":true,"h":"<p>A Club or Quarterstaff you are holding is imbued with nature's power. For the duration, you can use your spellcasting ability instead of Strength for the attack and damage rolls of melee attacks using that weapon, and the weapon's damage die becomes a d8. If the attack deals damage, it can be Force damage or the weapon's normal damage type (your choice).<\/p><p>The spell ends early if you cast it again or if you let go of the weapon.<\/p>","hl":"<p><b><i>Cantrip Upgrade.<\/i><\/b> The damage die changes when you reach levels 5 (d10), 11 (d12), and 17 (2d6).<\/p>"},"shocking grasp":{"n":"Shocking Grasp","l":0,"sc":"Evocation","t":"Action","r":"Touch","c":"V, S","d":"Instantaneous","conc":false,"rit":false,"cls":["Sorcerer","Wizard"],"src":"XPHB","u":"https://5e.tools/spells.html#shocking%20grasp_xphb","srd":true,"h":"<p>Lightning springs from you to a creature that you try to touch. Make a melee spell attack against the target. On a hit, the target takes 1d8 Lightning damage, and it can't make <a class=\"lk\" data-l=\"act|opportunity attack\">Opportunity Attacks<\/a> until the start of its next turn.<\/p>","hl":"<p><b><i>Cantrip Upgrade.<\/i><\/b> The damage increases by 1d8 when you reach levels 5 (2d8), 11 (3d8), and 17 (4d8).<\/p>"},"silent image":{"n":"Silent Image","l":1,"sc":"Illusion","t":"Action","r":"60 ft","c":"V, S, M (a bit of fleece)","d":"Up to 10 minutes","conc":true,"rit":false,"cls":["Bard","Sorcerer","Wizard"],"src":"XPHB","u":"https://5e.tools/spells.html#silent%20image_xphb","srd":true,"h":"<p>You create the image of an object, a creature, or some other visible phenomenon that is no larger than a 15-foot <a class=\"lk\" data-l=\"rule|cube [area of effect]\">Cube<\/a>. The image appears at a spot within range and lasts for the duration. The image is purely visual; it isn't accompanied by sound, smell, or other sensory effects.<\/p><p>As a <a class=\"lk\" data-l=\"act|magic\">Magic<\/a> action, you can cause the image to move to any spot within range. As the image changes location, you can alter its appearance so that its movements appear natural for the image. For example, if you create an image of a creature and move it, you can alter the image so that it appears to be walking.<\/p><p>Physical interaction with the image reveals it to be an illusion, since things can pass through it. A creature that takes a <a class=\"lk\" data-l=\"act|study\">Study<\/a> action to examine the image can determine that it is an illusion with a successful Intelligence (<a class=\"lk\" data-l=\"skill|investigation\">Investigation<\/a>) check against your spell save DC. If a creature discerns the illusion for what it is, the creature can see through the image.<\/p>"},"sleep":{"n":"Sleep","l":1,"sc":"Enchantment","t":"Action","r":"60 ft","c":"V, S, M (a pinch of sand or rose petals)","d":"Up to 1 minute","conc":true,"rit":false,"cls":["Bard","Sorcerer","Wizard"],"src":"XPHB","u":"https://5e.tools/spells.html#sleep_xphb","srd":true,"h":"<p>Each creature of your choice in a 5-foot-radius <a class=\"lk\" data-l=\"rule|sphere [area of effect]\">Sphere<\/a> centered on a point within range must succeed on a Wisdom saving throw or have the <a class=\"lk\" data-l=\"cond|incapacitated\">Incapacitated<\/a> condition until the end of its next turn, at which point it must repeat the save. If the target fails the second save, the target has the <a class=\"lk\" data-l=\"cond|unconscious\">Unconscious<\/a> condition for the duration. The spell ends on a target if it takes damage or someone within 5 feet of it takes an action to shake it out of the spell's effect.<\/p><p>Creatures that don't sleep, such as elves, or that have <a class=\"lk\" data-l=\"rule|immunity\">Immunity<\/a> to the <a class=\"lk\" data-l=\"cond|exhaustion\">Exhaustion<\/a> condition automatically succeed on saves against this spell.<\/p>"},"sleet storm":{"n":"Sleet Storm","l":3,"sc":"Conjuration","t":"Action","r":"150 ft","c":"V, S, M (a miniature umbrella)","d":"Up to 1 minute","conc":true,"rit":false,"cls":["Druid","Sorcerer","Wizard"],"src":"XPHB","u":"https://5e.tools/spells.html#sleet%20storm_xphb","srd":true,"h":"<p>Until the spell ends, sleet falls in a 40-foot-tall, 20-foot-radius <a class=\"lk\" data-l=\"rule|cylinder [area of effect]\">Cylinder<\/a> centered on a point you choose within range. The area is <a class=\"lk\" data-l=\"rule|heavily obscured\">Heavily Obscured<\/a>, and exposed flames in the area are doused.<\/p><p>Ground in the <a class=\"lk\" data-l=\"rule|cylinder [area of effect]\">Cylinder<\/a> is <a class=\"lk\" data-l=\"rule|difficult terrain\">Difficult Terrain<\/a>. When a creature enters the <a class=\"lk\" data-l=\"rule|cylinder [area of effect]\">Cylinder<\/a> for the first time on a turn or starts its turn there, it must succeed on a Dexterity saving throw or have the <a class=\"lk\" data-l=\"cond|prone\">Prone<\/a> condition and lose <a class=\"lk\" data-l=\"cond|concentration\">Concentration<\/a>.<\/p>"},"slow":{"n":"Slow","l":3,"sc":"Transmutation","t":"Action","r":"120 ft","c":"V, S, M (a drop of molasses)","d":"Up to 1 minute","conc":true,"rit":false,"cls":["Bard","Sorcerer","Wizard"],"src":"XPHB","u":"https://5e.tools/spells.html#slow_xphb","srd":true,"h":"<p>You alter time around up to six creatures of your choice in a 40-foot <a class=\"lk\" data-l=\"rule|cube [area of effect]\">Cube<\/a> within range. Each target must succeed on a Wisdom saving throw or be affected by this spell for the duration.<\/p><p>An affected target's <a class=\"lk\" data-l=\"rule|speed\">Speed<\/a> is halved, it takes a -2 penalty to AC and Dexterity saving throws, and it can't take Reactions. On its turns, it can take either an action or a <a class=\"lk\" data-l=\"rule|bonus action\">Bonus Action<\/a>, not both, and it can make only one attack if it takes the <a class=\"lk\" data-l=\"act|attack\">Attack<\/a> action. If it casts a spell with a Somatic component, there is a 25 percent chance the spell fails as a result of the target making the spell's gestures too slowly.<\/p><p>An affected target repeats the save at the end of each of its turns, ending the spell on itself on a success.<\/p>"},"sorcerous burst":{"n":"Sorcerous Burst","l":0,"sc":"Evocation","t":"Action","r":"120 ft","c":"V, S","d":"Instantaneous","conc":false,"rit":false,"cls":["Sorcerer"],"src":"XPHB","u":"https://5e.tools/spells.html#sorcerous%20burst_xphb","srd":true,"h":"<p>You cast sorcerous energy at one creature or object within range. Make a ranged spell attack against the target. On a hit, the target takes 1d8 damage of a type you choose: Acid, Cold, Fire, Lightning, Poison, Psychic, or Thunder.<\/p><p>If you roll an 8 on a d8 for this spell, you can roll another d8, and add it to the damage. When you cast this spell, the maximum number of these d8s you can add to the spell's damage equals your spellcasting ability modifier.<\/p>","hl":"<p><b><i>Cantrip Upgrade.<\/i><\/b> The damage increases by 1d8 when you reach levels 5 (2d8), 11 (3d8), and 17 (4d8).<\/p>"},"spare the dying":{"n":"Spare the Dying","l":0,"sc":"Necromancy","t":"Action","r":"15 ft","c":"V, S","d":"Instantaneous","conc":false,"rit":false,"cls":["Cleric","Druid"],"src":"XPHB","u":"https://5e.tools/spells.html#spare%20the%20dying_xphb","srd":true,"h":"<p>Choose a creature within range that has 0 <a class=\"lk\" data-l=\"rule|hit points\">Hit Points<\/a> and isn't dead. The creature becomes <a class=\"lk\" data-l=\"rule|stable\">Stable<\/a>.<\/p>","hl":"<p><b><i>Cantrip Upgrade.<\/i><\/b> The range doubles when you reach levels 5 (30 feet), 11 (60 feet), and 17 (120 feet).<\/p>"},"speak with animals":{"n":"Speak with Animals","l":1,"sc":"Divination","t":"Action","r":"Self","c":"V, S","d":"10 minutes","conc":false,"rit":true,"cls":["Bard","Druid","Ranger","Warlock"],"src":"XPHB","u":"https://5e.tools/spells.html#speak%20with%20animals_xphb","srd":true,"h":"<p>For the duration, you can comprehend and verbally communicate with Beasts, and you can use any of the <a class=\"lk\" data-l=\"act|influence\">Influence<\/a> action's skill options with them.<\/p><p>Most Beasts have little to say about topics that don't pertain to survival or companionship, but at minimum, a Beast can give you information about nearby locations and monsters, including whatever it has perceived within the past day.<\/p>"},"spider climb":{"n":"Spider Climb","l":2,"sc":"Transmutation","t":"Action","r":"Touch","c":"V, S, M (a drop of bitumen and a spider)","d":"Up to 1 hour","conc":true,"rit":false,"cls":["Sorcerer","Warlock","Wizard"],"src":"XPHB","u":"https://5e.tools/spells.html#spider%20climb_xphb","srd":true,"h":"<p>Until the spell ends, one willing creature you touch gains the ability to move up, down, and across vertical surfaces and along ceilings, while leaving its hands free. The target also gains a <a class=\"lk\" data-l=\"rule|climb speed\">Climb Speed<\/a> equal to its <a class=\"lk\" data-l=\"rule|speed\">Speed<\/a>.<\/p>","hl":"<p><b><i>Using a Higher-Level Spell Slot.<\/i><\/b> You can target one additional creature for each spell slot level above 2.<\/p>"},"starry wisp":{"n":"Starry Wisp","l":0,"sc":"Evocation","t":"Action","r":"60 ft","c":"V, S","d":"Instantaneous","conc":false,"rit":false,"cls":["Bard","Druid"],"src":"XPHB","u":"https://5e.tools/spells.html#starry%20wisp_xphb","srd":true,"h":"<p>You launch a mote of light at one creature or object within range. Make a ranged spell attack against the target. On a hit, the target takes 1d8 Radiant damage, and until the end of your next turn, it emits <a class=\"lk\" data-l=\"rule|dim light\">Dim Light<\/a> in a 10-foot radius and can't benefit from the <a class=\"lk\" data-l=\"cond|invisible\">Invisible<\/a> condition.<\/p>","hl":"<p><b><i>Cantrip Upgrade.<\/i><\/b> The damage increases by 1d8 when you reach levels 5 (2d8), 11 (3d8), and 17 (4d8).<\/p>"},"stinking cloud":{"n":"Stinking Cloud","l":3,"sc":"Conjuration","t":"Action","r":"90 ft","c":"V, S, M (a rotten egg)","d":"Up to 1 minute","conc":true,"rit":false,"cls":["Bard","Sorcerer","Wizard"],"src":"XPHB","u":"https://5e.tools/spells.html#stinking%20cloud_xphb","srd":true,"h":"<p>You create a 20-foot-radius <a class=\"lk\" data-l=\"rule|sphere [area of effect]\">Sphere<\/a> of yellow, nauseating gas centered on a point within range. The cloud is <a class=\"lk\" data-l=\"rule|heavily obscured\">Heavily Obscured<\/a>. The cloud lingers in the air for the duration or until a strong wind (such as the one created by <a class=\"lk\" data-l=\"spell|gust of wind\">Gust of Wind<\/a>) disperses it.<\/p><p>Each creature that starts its turn in the <a class=\"lk\" data-l=\"rule|sphere [area of effect]\">Sphere<\/a> must succeed on a Constitution saving throw or have the <a class=\"lk\" data-l=\"cond|poisoned\">Poisoned<\/a> condition until the end of the current turn. While <a class=\"lk\" data-l=\"cond|poisoned\">Poisoned<\/a> in this way, the creature can't take an action or a <a class=\"lk\" data-l=\"rule|bonus action\">Bonus Action<\/a>.<\/p>"},"stoneskin":{"n":"Stoneskin","l":4,"sc":"Transmutation","t":"Action","r":"Touch","c":"V, S, M (diamond dust worth 100+ GP, which the spell consumes)","d":"Up to 1 hour","conc":true,"rit":false,"cls":["Druid","Ranger","Sorcerer","Wizard"],"src":"XPHB","u":"https://5e.tools/spells.html#stoneskin_xphb","srd":true,"h":"<p>Until the spell ends, one willing creature you touch has <a class=\"lk\" data-l=\"rule|resistance\">Resistance<\/a> to Bludgeoning, Piercing, and Slashing damage.<\/p>"},"suggestion":{"n":"Suggestion","l":2,"sc":"Enchantment","t":"Action","r":"30 ft","c":"V, M (a drop of honey)","d":"Up to 8 hours","conc":true,"rit":false,"cls":["Bard","Sorcerer","Warlock","Wizard"],"src":"XPHB","u":"https://5e.tools/spells.html#suggestion_xphb","srd":true,"h":"<p>You suggest a course of activity—described in no more than 25 words—to one creature you can see within range that can hear and understand you. The suggestion must sound achievable and not involve anything that would obviously deal damage to the target or its allies. For example, you could say, \"Fetch the key to the cult's treasure vault, and give the key to me.\" Or you could say, \"Stop fighting, leave this library peacefully, and don't return.\"<\/p><p>The target must succeed on a Wisdom saving throw or have the <a class=\"lk\" data-l=\"cond|charmed\">Charmed<\/a> condition for the duration or until you or your allies deal damage to the target. The <a class=\"lk\" data-l=\"cond|charmed\">Charmed<\/a> target pursues the suggestion to the best of its ability. The suggested activity can continue for the entire duration, but if the suggested activity can be completed in a shorter time, the spell ends for the target upon completing it.<\/p>"},"summon aberration":{"n":"Summon Aberration","l":4,"sc":"Conjuration","t":"Action","r":"90 ft","c":"V, S, M (a pickled tentacle and an eyeball in a platinum-inlaid vial worth 400+ GP)","d":"Up to 1 hour","conc":true,"rit":false,"cls":["Warlock","Wizard"],"src":"XPHB","u":"https://5e.tools/spells.html#summon%20aberration_xphb","srd":false,"h":"<p>Summon an Aberrant Spirit (choose Beholderkin, Mind Flayer or Slaad) using its stat block, which scales with the slot level. It is your ally, acts straight after you on your <a class=\"lk\" data-l=\"rule|initiative\">Initiative<\/a> and follows your spoken commands (no action needed). Without orders it Dodges and avoids danger.<\/p>","hl":"<p>The stat block uses the slot level you cast it with.<\/p>","own":true},"summon celestial":{"n":"Summon Celestial","l":5,"sc":"Conjuration","t":"Action","r":"90 ft","c":"V, S, M (a reliquary worth 500+ GP)","d":"Up to 1 hour","conc":true,"rit":false,"cls":["Cleric","Paladin"],"src":"XPHB","u":"https://5e.tools/spells.html#summon%20celestial_xphb","srd":false,"h":"<p>Summon an angelic Celestial Spirit (choose Avenger or Defender) using its stat block, which scales with the slot level. It is your ally, acts straight after you on your <a class=\"lk\" data-l=\"rule|initiative\">Initiative<\/a> and follows your spoken commands. Without orders it Dodges and avoids danger.<\/p>","hl":"<p>The stat block uses the slot level you cast it with.<\/p>","own":true},"summon fey":{"n":"Summon Fey","l":3,"sc":"Conjuration","t":"Action","r":"90 ft","c":"V, S, M (a gilded flower worth 300+ GP)","d":"Up to 1 hour","conc":true,"rit":false,"cls":["Druid","Ranger","Warlock","Wizard"],"src":"XPHB","u":"https://5e.tools/spells.html#summon%20fey_xphb","srd":false,"h":"<p>Summon a Fey Spirit (choose a Fuming, Mirthful or Tricksy mood) using its stat block, which scales with the slot level. It is your ally, acts straight after you on your <a class=\"lk\" data-l=\"rule|initiative\">Initiative<\/a> and follows your spoken commands. Without orders it Dodges and avoids danger.<\/p>","hl":"<p>The stat block uses the slot level you cast it with.<\/p>","own":true},"summon fiend":{"n":"Summon Fiend","l":6,"sc":"Conjuration","t":"Action","r":"90 ft","c":"V, S, M (a bloody vial worth 600+ GP)","d":"Up to 1 hour","conc":true,"rit":false,"cls":["Warlock","Wizard"],"src":"XPHB","u":"https://5e.tools/spells.html#summon%20fiend_xphb","srd":false,"h":"<p>Summon a Fiendish Spirit (choose Demon, Devil or Yugoloth) using its stat block, which scales with the slot level. It is your ally, acts straight after you on your <a class=\"lk\" data-l=\"rule|initiative\">Initiative<\/a> and follows your spoken commands. Without orders it Dodges and avoids danger.<\/p>","hl":"<p>The stat block uses the slot level you cast it with.<\/p>","own":true},"summon undead":{"n":"Summon Undead","l":3,"sc":"Necromancy","t":"Action","r":"90 ft","c":"V, S, M (a gilded skull worth 300+ GP)","d":"Up to 1 hour","conc":true,"rit":false,"cls":["Warlock","Wizard"],"src":"XPHB","u":"https://5e.tools/spells.html#summon%20undead_xphb","srd":false,"h":"<p>Summon an Undead Spirit (choose Ghostly, Putrid or Skeletal) using its stat block, which scales with the slot level. It is your ally, acts straight after you on your <a class=\"lk\" data-l=\"rule|initiative\">Initiative<\/a> and follows your spoken commands. Without orders it Dodges and avoids danger.<\/p>","hl":"<p>The stat block uses the slot level you cast it with.<\/p>","own":true},"sunbeam":{"n":"Sunbeam","l":6,"sc":"Evocation","t":"Action","r":"Self (60-ft Line)","c":"V, S, M (a magnifying glass)","d":"Up to 1 minute","conc":true,"rit":false,"cls":["Cleric","Druid","Sorcerer","Wizard"],"src":"XPHB","u":"https://5e.tools/spells.html#sunbeam_xphb","srd":true,"h":"<p>You launch a sunbeam in a 5-foot-wide, 60-foot-long <a class=\"lk\" data-l=\"rule|line [area of effect]\">Line<\/a>. Each creature in the <a class=\"lk\" data-l=\"rule|line [area of effect]\">Line<\/a> makes a Constitution saving throw. On a failed save, a creature takes 6d8 Radiant damage and has the <a class=\"lk\" data-l=\"cond|blinded\">Blinded<\/a> condition until the start of your next turn. On a successful save, it takes half as much damage only.<\/p><p>Until the spell ends, you can take a <a class=\"lk\" data-l=\"act|magic\">Magic<\/a> action to create a new <a class=\"lk\" data-l=\"rule|line [area of effect]\">Line<\/a> of radiance.<\/p><p>For the duration, a mote of brilliant radiance shines above you. It sheds <a class=\"lk\" data-l=\"rule|bright light\">Bright Light<\/a> in a 30-foot radius and <a class=\"lk\" data-l=\"rule|dim light\">Dim Light<\/a> for an additional 30 feet. This light is sunlight.<\/p>"},"sunburst":{"n":"Sunburst","l":8,"sc":"Evocation","t":"Action","r":"150 ft","c":"V, S, M (a piece of sunstone)","d":"Instantaneous","conc":false,"rit":false,"cls":["Cleric","Druid","Sorcerer","Wizard"],"src":"XPHB","u":"https://5e.tools/spells.html#sunburst_xphb","srd":true,"h":"<p>Brilliant sunlight flashes in a 60-foot-radius <a class=\"lk\" data-l=\"rule|sphere [area of effect]\">Sphere<\/a> centered on a point you choose within range. Each creature in the <a class=\"lk\" data-l=\"rule|sphere [area of effect]\">Sphere<\/a> makes a Constitution saving throw. On a failed save, a creature takes 12d6 Radiant damage and has the <a class=\"lk\" data-l=\"cond|blinded\">Blinded<\/a> condition for 1 minute. On a successful save, it takes half as much damage only.<\/p><p>A creature <a class=\"lk\" data-l=\"cond|blinded\">Blinded<\/a> by this spell makes another Constitution saving throw at the end of each of its turns, ending the effect on itself on a success.<\/p><p>This spell dispels <a class=\"lk\" data-l=\"rule|darkness\">Darkness<\/a> in its area that was created by any spell.<\/p>"},"synaptic static":{"n":"Synaptic Static","l":5,"sc":"Enchantment","t":"Action","r":"120 ft","c":"V, S","d":"Instantaneous","conc":false,"rit":false,"cls":["Bard","Sorcerer","Warlock","Wizard"],"src":"XPHB","u":"https://5e.tools/spells.html#synaptic%20static_xphb","srd":false,"h":"<p>Psychic blast in a 20-ft-radius Sphere. Intelligence save: 8d6 Psychic, half on a success. A creature that fails is muddled for 1 minute: it subtracts 1d6 from attack rolls, ability checks and <a class=\"lk\" data-l=\"cond|concentration\">Concentration<\/a> saves, and repeats the Intelligence save at the end of each of its turns to end it.<\/p>","own":true},"tasha's bubbling cauldron":{"n":"Tasha's Bubbling Cauldron","l":6,"sc":"Conjuration","t":"Action","r":"5 ft","c":"V, S, M (a gilded ladle worth 500 + GP)","d":"10 minutes","conc":false,"rit":false,"cls":["Warlock","Wizard"],"src":"XPHB","u":"https://5e.tools/spells.html#tasha%27s%20bubbling%20cauldron_xphb","srd":false,"h":"<p>A fixed cauldron appears within 5 ft and brews copies of one Common or Uncommon potion you choose. You or an ally can take one out as a <a class=\"lk\" data-l=\"rule|bonus action\">Bonus Action<\/a>. It makes a number of potions equal to your spellcasting modifier (minimum 1). Unused potions vanish if you cast the spell again.<\/p>","own":true},"tasha's hideous laughter":{"n":"Tasha's Hideous Laughter","l":1,"sc":"Enchantment","t":"Action","r":"30 ft","c":"V, S, M (a tart and a feather)","d":"Up to 1 minute","conc":true,"rit":false,"cls":["Bard","Warlock","Wizard"],"src":"XPHB","u":"https://5e.tools/spells.html#tasha%27s%20hideous%20laughter_xphb","srd":true,"h":"<p>One creature of your choice that you can see within range makes a Wisdom saving throw. On a failed save, it has the <a class=\"lk\" data-l=\"cond|prone\">Prone<\/a> and <a class=\"lk\" data-l=\"cond|incapacitated\">Incapacitated<\/a> conditions for the duration. During that time, it laughs uncontrollably if it's capable of laughter, and it can't end the <a class=\"lk\" data-l=\"cond|prone\">Prone<\/a> condition on itself.<\/p><p>At the end of each of its turns and each time it takes damage, it makes another Wisdom saving throw. The target has <a class=\"lk\" data-l=\"rule|advantage\">Advantage<\/a> on the save if the save is triggered by damage. On a successful save, the spell ends.<\/p>","hl":"<p><b><i>Using a Higher-Level Spell Slot.<\/i><\/b> You can target one additional creature for each spell slot level above 1.<\/p>"},"telekinesis":{"n":"Telekinesis","l":5,"sc":"Transmutation","t":"Action","r":"60 ft","c":"V, S","d":"Up to 10 minutes","conc":true,"rit":false,"cls":["Sorcerer","Wizard"],"src":"XPHB","u":"https://5e.tools/spells.html#telekinesis_xphb","srd":true,"h":"<p>You gain the ability to move or manipulate creatures or objects by thought. When you cast the spell and as a <a class=\"lk\" data-l=\"act|magic\">Magic<\/a> action on your later turns before the spell ends, you can exert your will on one creature or object that you can see within range, causing the appropriate effect below. You can affect the same target round after round or choose a new one at any time. If you switch targets, the prior target is no longer affected by the spell.<\/p><p><b><i>Creature.<\/i><\/b> You can try to move a Huge or smaller creature. The target must succeed on a Strength saving throw, or you move it up to 30 feet in any direction within the spell's range. Until the end of your next turn, the creature has the <a class=\"lk\" data-l=\"cond|restrained\">Restrained<\/a> condition, and if you lift it into the air, it is suspended there. It falls at the end of your next turn unless you use this option on it again and it fails the save.<\/p><p><b><i>Object.<\/i><\/b> You can try to move a Huge or smaller object. If the object isn't being worn or carried, you automatically move it up to 30 feet in any direction within the spell's range.<\/p><p>If the object is worn or carried by a creature, that creature must succeed on a Strength saving throw, or you pull the object away and move it up to 30 feet in any direction within the spell's range.<\/p><p>You can exert fine control on objects with your telekinetic grip, such as manipulating a simple tool, opening a door or a container, stowing or retrieving an item
