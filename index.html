pact":"Pact Of The Chain","cantrip":false,"rep":false,"h":"<p>When you cast <a class=\"lk\" data-l=\"spell|find familiar\">Find Familiar<\/a>, you infuse the summoned familiar with a measure of your eldritch power, granting the creature the following benefits.<\/p><p><b><i>Aerial or Aquatic.<\/i><\/b> The familiar gains either a <a class=\"lk\" data-l=\"rule|fly speed\">Fly Speed<\/a> or a <a class=\"lk\" data-l=\"rule|swim speed\">Swim Speed<\/a> (your choice) of 40 feet.<\/p><p><b><i>Quick Attack.<\/i><\/b> As a <a class=\"lk\" data-l=\"rule|bonus action\">Bonus Action<\/a>, you can command the familiar to take the <a class=\"lk\" data-l=\"act|attack\">Attack<\/a> action.<\/p><p><b><i>Necrotic or Radiant Damage.<\/i><\/b> Whenever the familiar deals Bludgeoning, Piercing, or Slashing damage, you can make it deal Necrotic or Radiant damage instead.<\/p><p><b><i>Your Save DC.<\/i><\/b> If the familiar forces a creature to make a saving throw, it uses your spell save DC.<\/p><p><b><i>Resistance.<\/i><\/b> When the familiar takes damage, you can take a <a class=\"lk\" data-l=\"rule|reaction\">Reaction<\/a> to grant it <a class=\"lk\" data-l=\"rule|resistance\">Resistance<\/a> against that damage.<\/p>","u":"https://5e.tools/optionalfeatures.html#investment%20of%20the%20chain%20master_xphb"},{"n":"Master of Myriad Forms","lv":5,"pact":null,"cantrip":false,"rep":false,"h":"<p>You can cast <a class=\"lk\" data-l=\"spell|alter self\">Alter Self<\/a> without expending a spell slot.<\/p>","u":"https://5e.tools/optionalfeatures.html#master%20of%20myriad%20forms_xphb"},{"n":"One with Shadows","lv":5,"pact":null,"cantrip":false,"rep":false,"h":"<p>While you're in an area of <a class=\"lk\" data-l=\"rule|dim light\">Dim Light<\/a> or <a class=\"lk\" data-l=\"rule|darkness\">Darkness<\/a>, you can cast <a class=\"lk\" data-l=\"spell|invisibility\">Invisibility<\/a> on yourself without expending a spell slot.<\/p>","u":"https://5e.tools/optionalfeatures.html#one%20with%20shadows_xphb"},{"n":"Thirsting Blade","lv":5,"pact":"Pact Of The Blade","cantrip":false,"rep":false,"h":"<p>You gain the Extra Attack feature for your pact weapon only. With that feature, you can attack twice with the weapon instead of once when you take the <a class=\"lk\" data-l=\"act|attack\">Attack<\/a> action on your turn.<\/p>","u":"https://5e.tools/optionalfeatures.html#thirsting%20blade_xphb"},{"n":"Whispers of the Grave","lv":7,"pact":null,"cantrip":false,"rep":false,"h":"<p>You can cast <a href=\"https://5e.tools/spells.html#speak%20with%20dead_xphb\" target=\"_blank\" rel=\"noopener\">Speak with Dead<\/a> without expending a spell slot.<\/p>","u":"https://5e.tools/optionalfeatures.html#whispers%20of%20the%20grave_xphb"},{"n":"Gift of the Protectors","lv":9,"pact":"Pact Of The Tome","cantrip":false,"rep":false,"h":"<p>A new page appears in your Book of Shadows when you conjure it. With your permission, a creature can take an action to write its name on that page, which can contain a number of names equal to your Charisma modifier (minimum of one name).<\/p><p>When any creature whose name is on the page is reduced to 0 <a class=\"lk\" data-l=\"rule|hit points\">Hit Points<\/a> but not killed outright, the creature magically drops to 1 <a class=\"lk\" data-l=\"rule|hit points\">Hit Point<\/a> instead. Once this magic is triggered, no creature can benefit from it until you finish a <a class=\"lk\" data-l=\"rule|long rest\">Long Rest<\/a>.<\/p><p>As a <a class=\"lk\" data-l=\"act|magic\">Magic<\/a> action, you can erase a name on the page by touching it.<\/p>","u":"https://5e.tools/optionalfeatures.html#gift%20of%20the%20protectors_xphb"},{"n":"Lifedrinker","lv":9,"pact":"Pact Of The Blade","cantrip":false,"rep":false,"h":"<p>Once per turn when you hit a creature with your pact weapon, you can deal an extra 1d6 Necrotic, Psychic, or Radiant damage (your choice) to the creature, and you can expend one of your <a class=\"lk\" data-l=\"rule|hit point dice\">Hit Point Dice<\/a> to roll it and regain a number of <a class=\"lk\" data-l=\"rule|hit points\">Hit Points<\/a> equal to the roll plus your Constitution modifier (minimum of 1 <a class=\"lk\" data-l=\"rule|hit points\">Hit Point<\/a>).<\/p>","u":"https://5e.tools/optionalfeatures.html#lifedrinker_xphb"},{"n":"Visions of Distant Realms","lv":9,"pact":null,"cantrip":false,"rep":false,"h":"<p>You can cast <a href=\"https://5e.tools/spells.html#arcane%20eye_xphb\" target=\"_blank\" rel=\"noopener\">Arcane Eye<\/a> without expending a spell slot.<\/p>","u":"https://5e.tools/optionalfeatures.html#visions%20of%20distant%20realms_xphb"},{"n":"Devouring Blade","lv":12,"pact":"Thirsting Blade","cantrip":false,"rep":false,"h":"<p>The Extra Attack of your <a class=\"lk\" data-l=\"opt|thirsting blade\">Thirsting Blade<\/a> invocation confers two extra attacks rather than one.<\/p>","u":"https://5e.tools/optionalfeatures.html#devouring%20blade_xphb"},{"n":"Witch Sight","lv":15,"pact":null,"cantrip":false,"rep":false,"h":"<p>You have <a class=\"lk\" data-l=\"sense|truesight\">Truesight<\/a> with a range of 30 feet.<\/p>","u":"https://5e.tools/optionalfeatures.html#witch%20sight_xphb"}],"metamagic":[{"n":"Careful Spell","h":"<p>When you cast a spell that forces other creatures to make a saving throw, you can protect some of those creatures from the spell's full force. To do so, spend 1 Sorcery Point and choose a number of those creatures up to your Charisma modifier (minimum of one creature). A chosen creature automatically succeeds on its saving throw against the spell, and it takes no damage if it would normally take half damage on a successful save.<\/p>","u":"https://5e.tools/optionalfeatures.html#careful%20spell_xphb"},{"n":"Distant Spell","h":"<p>When you cast a spell that has a range of at least 5 feet, you can spend 1 Sorcery Point to double the spell's range. Or when you cast a spell that has a range of Touch, you can spend 1 Sorcery Point to make the spell's range 30 feet.<\/p>","u":"https://5e.tools/optionalfeatures.html#distant%20spell_xphb"},{"n":"Empowered Spell","h":"<p>When you roll damage for a spell, you can spend 1 Sorcery Point to reroll a number of the damage dice up to your Charisma modifier (minimum of one), and you must use the new rolls.<\/p><p>You can use Empowered Spell even if you've already used a different Metamagic option during the casting of the spell.<\/p>","u":"https://5e.tools/optionalfeatures.html#empowered%20spell_xphb"},{"n":"Extended Spell","h":"<p>When you cast a spell that has a duration of 1 minute or longer, you can spend 1 Sorcery Point to double its duration to a maximum duration of 24 hours.<\/p><p>If the affected spell requires <a class=\"lk\" data-l=\"cond|concentration\">Concentration<\/a>, you have <a class=\"lk\" data-l=\"rule|advantage\">Advantage<\/a> on any saving throw you make to maintain that <a class=\"lk\" data-l=\"cond|concentration\">Concentration<\/a>.<\/p>","u":"https://5e.tools/optionalfeatures.html#extended%20spell_xphb"},{"n":"Heightened Spell","h":"<p>When you cast a spell that forces a creature to make a saving throw, you can spend 2 Sorcery Points to give one target of the spell <a class=\"lk\" data-l=\"rule|disadvantage\">Disadvantage<\/a> on saves against the spell.<\/p>","u":"https://5e.tools/optionalfeatures.html#heightened%20spell_xphb"},{"n":"Quickened Spell","h":"<p>When you cast a spell that has a casting time of an action, you can spend 2 Sorcery Points to change the casting time to a <a class=\"lk\" data-l=\"rule|bonus action\">Bonus Action<\/a> for this casting. You can't modify a spell in this way if you've already cast a level 1+ spell on the current turn, nor can you cast a level 1+ spell on this turn after modifying a spell in this way.<\/p>","u":"https://5e.tools/optionalfeatures.html#quickened%20spell_xphb"},{"n":"Seeking Spell","h":"<p>If you make an attack roll for a spell and miss, you can spend 1 Sorcery Point to reroll the d20, and you must use the new roll.<\/p><p>You can use Seeking Spell even if you've already used a different Metamagic option during the casting of the spell.<\/p>","u":"https://5e.tools/optionalfeatures.html#seeking%20spell_xphb"},{"n":"Subtle Spell","h":"<p>When you cast a spell, you can spend 1 Sorcery Point to cast it without any Verbal, Somatic, or Material components, except Material components that are consumed by the spell or that have a cost specified in the spell.<\/p>","u":"https://5e.tools/optionalfeatures.html#subtle%20spell_xphb"},{"n":"Transmuted Spell","h":"<p>When you cast a spell that deals a type of damage from the following list, you can spend 1 Sorcery Point to change that damage type to one of the other listed types: Acid, Cold, Fire, Lightning, Poison, Thunder.<\/p>","u":"https://5e.tools/optionalfeatures.html#transmuted%20spell_xphb"},{"n":"Twinned Spell","h":"<p>When you cast a spell, such as <a class=\"lk\" data-l=\"spell|charm person\">Charm Person<\/a>, that can be cast with a higher-level spell slot to target an additional creature, you can spend 1 Sorcery Point to increase the spell's effective level by 1.<\/p>","u":"https://5e.tools/optionalfeatures.html#twinned%20spell_xphb"}],"feats":[{"n":"Boon of Combat Prowess","cat":"EB","pre":"Level 19+","u":"https://5e.tools/feats.html#boon%20of%20combat%20prowess_xphb","ab":["str","dex","con","int","wis","cha"],"h":"<p>You gain the following benefits.<\/p><p><b><i>Peerless Aim.<\/i><\/b> When you miss with an attack roll, you can hit instead. Once you use this benefit, you can't use it again until the start of your next turn.<\/p>"},{"n":"Boon of Dimensional Travel","cat":"EB","pre":"Level 19+","u":"https://5e.tools/feats.html#boon%20of%20dimensional%20travel_xphb","ab":["str","dex","con","int","wis","cha"],"h":"<p>You gain the following benefits.<\/p><p><b><i>Blink Steps.<\/i><\/b> Immediately after you take the <a class=\"lk\" data-l=\"act|attack\">Attack<\/a> action or the <a class=\"lk\" data-l=\"act|magic\">Magic<\/a> action, you can teleport up to 30 feet to an unoccupied space you can see.<\/p>"},{"n":"Boon of Energy Resistance","cat":"EB","pre":"Level 19+","u":"https://5e.tools/feats.html#boon%20of%20energy%20resistance_xphb","ab":["str","dex","con","int","wis","cha"]},{"n":"Boon of Fate","cat":"EB","pre":"Level 19+","u":"https://5e.tools/feats.html#boon%20of%20fate_xphb","ab":["str","dex","con","int","wis","cha"],"h":"<p>You gain the following benefits.<\/p><p><b><i>Improve Fate.<\/i><\/b> When you or another creature within 60 feet of you succeeds on or fails a <a class=\"lk\" data-l=\"rule|d20 test\">D20 Test<\/a>, you can roll 2d4 and apply the total rolled as a bonus or penalty to the d20 roll. Once you use this benefit, you can't use it again until you roll <a class=\"lk\" data-l=\"rule|initiative\">Initiative<\/a> or finish a <a class=\"lk\" data-l=\"rule|short rest\">Short<\/a> or <a class=\"lk\" data-l=\"rule|long rest\">Long Rest<\/a>.<\/p>"},{"n":"Boon of Fortitude","cat":"EB","pre":"Level 19+","u":"https://5e.tools/feats.html#boon%20of%20fortitude_xphb","ab":["str","dex","con","int","wis","cha"]},{"n":"Boon of Irresistible Offense","cat":"EB","pre":"Level 19+","u":"https://5e.tools/feats.html#boon%20of%20irresistible%20offense_xphb","ab":["str","dex"],"h":"<p>You gain the following benefits.<\/p><p><b><i>Overcome Defenses.<\/i><\/b> The Bludgeoning, Piercing, and Slashing damage you deal always ignores <a class=\"lk\" data-l=\"rule|resistance\">Resistance<\/a>.<\/p><p><b><i>Overwhelming Strike.<\/i><\/b> When you roll a 20 on the d20 for an attack roll, you can deal extra damage to the target equal to the ability score increased by this feat. The extra damage's type is the same as the attack's type.<\/p>"},{"n":"Boon of Recovery","cat":"EB","pre":"Level 19+","u":"https://5e.tools/feats.html#boon%20of%20recovery_xphb","ab":["str","dex","con","int","wis","cha"]},{"n":"Boon of Skill","cat":"EB","pre":"Level 19+","u":"https://5e.tools/feats.html#boon%20of%20skill_xphb","ab":["str","dex","con","int","wis","cha"]},{"n":"Boon of Speed","cat":"EB","pre":"Level 19+","u":"https://5e.tools/feats.html#boon%20of%20speed_xphb","ab":["str","dex","con","int","wis","cha"]},{"n":"Boon of Spell Recall","cat":"EB","pre":"Level 19+","u":"https://5e.tools/feats.html#boon%20of%20spell%20recall_xphb","ab":["int","wis","cha"],"h":"<p>You gain the following benefits.<\/p><p><b><i>Free Casting.<\/i><\/b> Whenever you cast a spell with a level 1-4 spell slot, roll 1d4. If the number you roll is the same as the slot's level, the slot isn't expended.<\/p>"},{"n":"Boon of Truesight","cat":"EB","pre":"Level 19+","u":"https://5e.tools/feats.html#boon%20of%20truesight_xphb","ab":["str","dex","con","int","wis","cha"],"h":"<p>You gain the following benefits.<\/p><p><b><i>Truesight.<\/i><\/b> You have <a class=\"lk\" data-l=\"sense|truesight\">Truesight<\/a> with a range of 60 feet.<\/p>"},{"n":"Boon of the Night Spirit","cat":"EB","pre":"Level 19+","u":"https://5e.tools/feats.html#boon%20of%20the%20night%20spirit_xphb","ab":["str","dex","con","int","wis","cha"],"h":"<p>You gain the following benefits.<\/p><p><b><i>Merge with Shadows.<\/i><\/b> While within <a class=\"lk\" data-l=\"rule|dim light\">Dim Light<\/a> or <a class=\"lk\" data-l=\"rule|darkness\">Darkness<\/a>, you can give yourself the <a class=\"lk\" data-l=\"cond|invisible\">Invisible<\/a> condition as a <a class=\"lk\" data-l=\"rule|bonus action\">Bonus Action<\/a>. The condition ends on you immediately after you take an action, a <a class=\"lk\" data-l=\"rule|bonus action\">Bonus Action<\/a>, or a <a class=\"lk\" data-l=\"rule|reaction\">Reaction<\/a>.<\/p><p><b><i>Shadowy Form.<\/i><\/b> While within <a class=\"lk\" data-l=\"rule|dim light\">Dim Light<\/a> or <a class=\"lk\" data-l=\"rule|darkness\">Darkness<\/a>, you have <a class=\"lk\" data-l=\"rule|resistance\">Resistance<\/a> to all damage except Psychic and Radiant.<\/p>"},{"n":"Ability Score Improvement","cat":"G","pre":"Level 4+","u":"https://5e.tools/feats.html#ability%20score%20improvement_xphb","ab":["str","dex","con","int","wis","cha"],"h":"<p>Increase one ability score of your choice by 2, or increase two ability scores of your choice by 1. This feat can't increase an ability score above 20.<\/p><p><b><i>Repeatable.<\/i><\/b> You can take this feat more than once.<\/p>"},{"n":"Actor","cat":"G","pre":"Level 4+","u":"https://5e.tools/feats.html#actor_xphb","ab":["cha"]},{"n":"Athlete","cat":"G","pre":"Level 4+","u":"https://5e.tools/feats.html#athlete_xphb","ab":["str","dex"]},{"n":"Charger","cat":"G","pre":"Level 4+","u":"https://5e.tools/feats.html#charger_xphb","ab":["str","dex"]},{"n":"Chef","cat":"G","pre":"Level 4+","u":"https://5e.tools/feats.html#chef_xphb","ab":["con","wis"]},{"n":"Crossbow Expert","cat":"G","pre":"Level 4+","u":"https://5e.tools/feats.html#crossbow%20expert_xphb","ab":["dex"]},{"n":"Crusher","cat":"G","pre":"Level 4+","u":"https://5e.tools/feats.html#crusher_xphb","ab":["str","con"]},{"n":"Defensive Duelist","cat":"G","pre":"Level 4+","u":"https://5e.tools/feats.html#defensive%20duelist_xphb","ab":["dex"]},{"n":"Dual Wielder","cat":"G","pre":"Level 4+","u":"https://5e.tools/feats.html#dual%20wielder_xphb","ab":["str","dex"]},{"n":"Durable","cat":"G","pre":"Level 4+","u":"https://5e.tools/feats.html#durable_xphb","ab":["con"]},{"n":"Elemental Adept","cat":"G","pre":"Level 4+","u":"https://5e.tools/feats.html#elemental%20adept_xphb","ab":["int","wis","cha"]},{"n":"Fey-Touched","cat":"G","pre":"Level 4+","u":"https://5e.tools/feats.html#fey-touched_xphb","ab":["int","wis","cha"]},{"n":"Grappler","cat":"G","pre":"Level 4+","u":"https://5e.tools/feats.html#grappler_xphb","ab":["str","dex"],"h":"<p>You gain the following benefits.<\/p><p><b><i>Punch and Grab.<\/i><\/b> When you hit a creature with an <a class=\"lk\" data-l=\"rule|unarmed strike\">Unarmed Strike<\/a> as part of the <a class=\"lk\" data-l=\"act|attack\">Attack<\/a> action on your turn, you can use both the Damage and the Grapple option. You can use this benefit only once per turn.<\/p><p><b><i>Attack Advantage.<\/i><\/b> You have <a class=\"lk\" data-l=\"rule|advantage\">Advantage<\/a> on attack rolls against a creature <a class=\"lk\" data-l=\"cond|grappled\">Grappled<\/a> by you.<\/p><p><b><i>Fast Wrestler.<\/i><\/b> You don't have to spend extra movement to move a creature <a class=\"lk\" data-l=\"cond|grappled\">Grappled<\/a> by you if the creature is your size or smaller.<\/p>"},{"n":"Great Weapon Master","cat":"G","pre":"Level 4+","u":"https://5e.tools/feats.html#great%20weapon%20master_xphb","ab":["str"]},{"n":"Heavily Armored","cat":"G","pre":"Level 4+","u":"https://5e.tools/feats.html#heavily%20armored_xphb","ab":["con","str"]},{"n":"Heavy Armor Master","cat":"G","pre":"Level 4+","u":"https://5e.tools/feats.html#heavy%20armor%20master_xphb","ab":["con","str"]},{"n":"Inspiring Leader","cat":"G","pre":"Level 4+","u":"https://5e.tools/feats.html#inspiring%20leader_xphb","ab":["wis","cha"]},{"n":"Keen Mind","cat":"G","pre":"Level 4+","u":"https://5e.tools/feats.html#keen%20mind_xphb","ab":["int"]},{"n":"Lightly Armored","cat":"G","pre":"Level 4+","u":"https://5e.tools/feats.html#lightly%20armored_xphb","ab":["str","dex"]},{"n":"Mage Slayer","cat":"G","pre":"Level 4+","u":"https://5e.tools/feats.html#mage%20slayer_xphb","ab":["str","dex"]},{"n":"Martial Weapon Training","cat":"G","pre":"Level 4+","u":"https://5e.tools/feats.html#martial%20weapon%20training_xphb","ab":["str","dex"]},{"n":"Medium Armor Master","cat":"G","pre":"Level 4+","u":"https://5e.tools/feats.html#medium%20armor%20master_xphb","ab":["str","dex"]},{"n":"Moderately Armored","cat":"G","pre":"Level 4+","u":"https://5e.tools/feats.html#moderately%20armored_xphb","ab":["str","dex"]},{"n":"Mounted Combatant","cat":"G","pre":"Level 4+","u":"https://5e.tools/feats.html#mounted%20combatant_xphb","ab":["str","dex","wis"]},{"n":"Observant","cat":"G","pre":"Level 4+","u":"https://5e.tools/feats.html#observant_xphb","ab":["int","wis"]},{"n":"Piercer","cat":"G","pre":"Level 4+","u":"https://5e.tools/feats.html#piercer_xphb","ab":["str","dex"]},{"n":"Poisoner","cat":"G","pre":"Level 4+","u":"https://5e.tools/feats.html#poisoner_xphb","ab":["dex","int"]},{"n":"Polearm Master","cat":"G","pre":"Level 4+","u":"https://5e.tools/feats.html#polearm%20master_xphb","ab":["dex","str"]},{"n":"Resilient","cat":"G","pre":"Level 4+","u":"https://5e.tools/feats.html#resilient_xphb","ab":["str","dex","con","int","wis","cha"],"h":"<p>+1 to one ability score (to a maximum of 20) and proficiency in saving throws with that ability.<\/p>","own":true},{"n":"Ritual Caster","cat":"G","pre":"Level 4+","u":"https://5e.tools/feats.html#ritual%20caster_xphb","ab":["int","wis","cha"]},{"n":"Sentinel","cat":"G","pre":"Level 4+","u":"https://5e.tools/feats.html#sentinel_xphb","ab":["str","dex"]},{"n":"Shadow-Touched","cat":"G","pre":"Level 4+","u":"https://5e.tools/feats.html#shadow-touched_xphb","ab":["int","wis","cha"]},{"n":"Sharpshooter","cat":"G","pre":"Level 4+","u":"https://5e.tools/feats.html#sharpshooter_xphb","ab":["dex"]},{"n":"Shield Master","cat":"G","pre":"Level 4+","u":"https://5e.tools/feats.html#shield%20master_xphb","ab":["str"]},{"n":"Skill Expert","cat":"G","pre":"Level 4+","u":"https://5e.tools/feats.html#skill%20expert_xphb","ab":["str","dex","con","int","wis","cha"]},{"n":"Skulker","cat":"G","pre":"Level 4+","u":"https://5e.tools/feats.html#skulker_xphb","ab":["dex"]},{"n":"Slasher","cat":"G","pre":"Level 4+","u":"https://5e.tools/feats.html#slasher_xphb","ab":["str","dex"]},{"n":"Speedy","cat":"G","pre":"Level 4+","u":"https://5e.tools/feats.html#speedy_xphb","ab":["dex","con"],"h":"<p>+1 to Dexterity or Constitution (max 20). Your <a class=\"lk\" data-l=\"rule|speed\">Speed<\/a> increases by 10 ft. When you <a class=\"lk\" data-l=\"act|dash\">Dash<\/a>, <a class=\"lk\" data-l=\"rule|difficult terrain\">Difficult Terrain<\/a> costs no extra movement that turn. Opportunity Attacks against you have <a class=\"lk\" data-l=\"rule|disadvantage\">Disadvantage<\/a>.<\/p>","own":true},{"n":"Spell Sniper","cat":"G","pre":"Level 4+","u":"https://5e.tools/feats.html#spell%20sniper_xphb","ab":["int","wis","cha"]},{"n":"Telekinetic","cat":"G","pre":"Level 4+","u":"https://5e.tools/feats.html#telekinetic_xphb","ab":["int","wis","cha"]},{"n":"Telepathic","cat":"G","pre":"Level 4+","u":"https://5e.tools/feats.html#telepathic_xphb","ab":["int","wis","cha"]},{"n":"War Caster","cat":"G","pre":"Level 4+","u":"https://5e.tools/feats.html#war%20caster_xphb","ab":["int","wis","cha"]},{"n":"Weapon Master","cat":"G","pre":"Level 4+","u":"https://5e.tools/feats.html#weapon%20master_xphb","ab":["str","dex"]},{"n":"Alert","cat":"O","pre":"","u":"https://5e.tools/feats.html#alert_xphb","h":"<p>You gain the following benefits.<\/p><p><b><i>Initiative Proficiency.<\/i><\/b> When you roll <a class=\"lk\" data-l=\"rule|initiative\">Initiative<\/a>, you can add your <a class=\"lk\" data-l=\"rule|proficiency\">Proficiency Bonus<\/a> to the roll.<\/p><p><b><i>Initiative Swap.<\/i><\/b> Immediately after you roll <a class=\"lk\" data-l=\"rule|initiative\">Initiative<\/a>, you can swap your <a class=\"lk\" data-l=\"rule|initiative\">Initiative<\/a> with the <a class=\"lk\" data-l=\"rule|initiative\">Initiative<\/a> of one willing ally in the same combat. You can't make this swap if you or the ally has the <a class=\"lk\" data-l=\"cond|incapacitated\">Incapacitated<\/a> condition.<\/p>"},{"n":"Crafter","cat":"O","pre":"","u":"https://5e.tools/feats.html#crafter_xphb"},{"n":"Healer","cat":"O","pre":"","u":"https://5e.tools/feats.html#healer_xphb"},{"n":"Lucky","cat":"O","pre":"","u":"https://5e.tools/feats.html#lucky_xphb"},{"n":"Magic Initiate","cat":"O","pre":"","u":"https://5e.tools/feats.html#magic%20initiate_xphb","h":"<p>You gain the following benefits.<\/p><p><b><i>Two Cantrips.<\/i><\/b> You learn two cantrips of your choice from the Cleric, Druid, or Wizard spell list. Intelligence, Wisdom, or Charisma is your spellcasting ability for this feat's spells (choose when you select this feat).<\/p><p><b><i>Level 1 Spell.<\/i><\/b> Choose a level 1 spell from the same list you selected for this feat's cantrips. You always have that spell prepared. You can cast it once without a spell slot, and you regain the ability to cast it in that way when you finish a <a class=\"lk\" data-l=\"rule|long rest\">Long Rest<\/a>. You can also cast the spell using any spell slots you have.<\/p><p><b><i>Spell Change.<\/i><\/b> Whenever you gain a new level, you can replace one of the spells you chose for this feat with a different spell of the same level from the chosen spell list.<\/p><p><b><i>Repeatable.<\/i><\/b> You can take this feat more than once, but you must choose a different spell list each time.<\/p>"},{"n":"Musician","cat":"O","pre":"","u":"https://5e.tools/feats.html#musician_xphb"},{"n":"Savage Attacker","cat":"O","pre":"","u":"https://5e.tools/feats.html#savage%20attacker_xphb","h":"<p>You've trained to deal particularly damaging strikes. Once per turn when you hit a target with a weapon, you can roll the weapon's damage dice twice and use either roll against the target.<\/p>"},{"n":"Skilled","cat":"O","pre":"","u":"https://5e.tools/feats.html#skilled_xphb","h":"<p>You gain proficiency in any combination of three skills or tools of your choice.<\/p><p><b><i>Repeatable.<\/i><\/b> You can take this feat more than once.<\/p>"},{"n":"Tavern Brawler","cat":"O","pre":"","u":"https://5e.tools/feats.html#tavern%20brawler_xphb"},{"n":"Tough","cat":"O","pre":"","u":"https://5e.tools/feats.html#tough_xphb","h":"<p>Your Hit Point maximum rises by twice your character level, and by 2 more each time you gain a level.<\/p>","own":true}],"species":{"Tabaxi":[{"n":"Cat's Claws","h":"<p>Your claws count as unarmed strikes that deal 1d6 Slashing (the rules use Strength; this sheet records bronze magic claws at +8, 1d6+5).<\/p>"},{"n":"Cat's Talent","h":"<p>Proficiency in Perception and Stealth.<\/p>"},{"n":"Darkvision","h":"<p>See in dim light within 60 ft as if bright, and in darkness as if dim (shades of grey).<\/p>"},{"n":"Feline Agility","h":"<p>When you move on your turn in combat you can double your <a class=\"lk\" data-l=\"rule|speed\">Speed<\/a> until the end of the turn. You can&#x27;t do it again until you spend a turn moving 0 ft.<\/p>"},{"n":"Climbing","h":"<p>Climb <a class=\"lk\" data-l=\"rule|speed\">Speed<\/a> equal to your walking <a class=\"lk\" data-l=\"rule|speed\">Speed<\/a>.<\/p>"}],"Changeling":[{"n":"Fey","h":"<p>Your creature type is Fey.<\/p>"},{"n":"Changeling Instincts","h":"<p>Proficiency in two of Deception, Insight, Intimidation, Performance or Persuasion.<\/p>"},{"n":"Shapechanger","h":"<p>Action: change your appearance and voice (colouring, hair, sex, height between Medium and Small, even another species). You can&#x27;t copy someone you&#x27;ve never seen and must keep the same limb layout. Clothing doesn&#x27;t change. Lasts until you revert with an action or die.<\/p>"}],"Human":[{"n":"Resourceful","h":"<p>You gain <a class=\"lk\" data-l=\"rule|heroic inspiration\">Heroic Inspiration<\/a> whenever you finish a <a class=\"lk\" data-l=\"rule|long rest\">Long Rest<\/a>.<\/p>"},{"n":"Skillful","h":"<p>You gain proficiency in one skill of your choice.<\/p>"},{"n":"Versatile","h":"<p>You gain an Origin feat of your choice.<\/p>"}]},"extraFeats":{"Tough":"<p>Your Hit Point maximum rises by twice your character level, and by 2 more each time you gain a level.<\/p>","Resilient":"<p>+1 to one ability score (to a maximum of 20) and proficiency in saving throws with that ability.<\/p>","Speedy":"<p>+1 to Dexterity or Constitution (max 20). Your <a class=\"lk\" data-l=\"rule|speed\">Speed<\/a> increases by 10 ft. When you <a class=\"lk\" data-l=\"act|dash\">Dash<\/a>, <a class=\"lk\" data-l=\"rule|difficult terrain\">Difficult Terrain<\/a> costs no extra movement that turn. Opportunity Attacks against you have <a class=\"lk\" data-l=\"rule|disadvantage\">Disadvantage<\/a>.<\/p>","Mark of Warding":"<p>Warder&#x27;s Intuition: add 1d4 to Intelligence (Investigation) checks and checks using Thieves&#x27; Tools. Wards and Seals: <a class=\"lk\" data-l=\"spell|alarm\">Alarm<\/a> and <a class=\"lk\" data-l=\"spell|mage armor\">Mage Armor<\/a> are always prepared and each can be cast once per <a class=\"lk\" data-l=\"rule|long rest\">Long Rest<\/a> without a slot; from character level 3 the same applies to <a class=\"lk\" data-l=\"spell|arcane lock\">Arcane Lock<\/a>. Spells of the Mark: <a class=\"lk\" data-l=\"spell|armor of agathys\">Armor of Agathys<\/a>, <a class=\"lk\" data-l=\"spell|sanctuary\">Sanctuary<\/a>, <a class=\"lk\" data-l=\"spell|knock\">Knock<\/a>, Nystul&#x27;s Magic Aura, <a class=\"lk\" data-l=\"spell|glyph of warding\">Glyph of Warding<\/a>, <a class=\"lk\" data-l=\"spell|magic circle\">Magic Circle<\/a>, Leomund&#x27;s Secret Chest, Mordenkainen&#x27;s Faithful Hound and <a class=\"lk\" data-l=\"spell|antilife shell\">Antilife Shell<\/a> join your Sorcerer spell list.<\/p>","Rustic Hospitality":"<p>(Folk Hero background, 2014 rules.) Ordinary folk will shelter and hide you, short of risking their lives.<\/p>"},"gloss":{"cond|blinded":{"n":"Blinded","h":"<p>While you have the Blinded condition, you experience the following effects.<\/p><p><b><i>Can't See.<\/i><\/b> You can't see and automatically fail any ability check that requires sight.<\/p><p><b><i>Attacks Affected.<\/i><\/b> <a class=\"lk\" data-l=\"act|attack\">Attack<\/a> rolls against you have <a class=\"lk\" data-l=\"rule|advantage\">Advantage<\/a>, and your attack rolls have <a class=\"lk\" data-l=\"rule|disadvantage\">Disadvantage<\/a>.<\/p>","u":"https://5e.tools/conditionsdiseases.html#blinded_xphb"},"cond|charmed":{"n":"Charmed","h":"<p>While you have the Charmed condition, you experience the following effects.<\/p><p><b><i>Can't Harm the Charmer.<\/i><\/b> You can't attack the charmer or target the charmer with damaging abilities or <a class=\"lk\" data-l=\"rule|magical effect\">magical effects<\/a>.<\/p><p><b><i>Social Advantage.<\/i><\/b> The charmer has <a class=\"lk\" data-l=\"rule|advantage\">Advantage<\/a> on any ability check to interact with you socially.<\/p>","u":"https://5e.tools/conditionsdiseases.html#charmed_xphb"},"cond|deafened":{"n":"Deafened","h":"<p>While you have the Deafened condition, you experience the following effect.<\/p><p><b><i>Can't Hear.<\/i><\/b> You can't hear and automatically fail any ability check that requires hearing.<\/p>","u":"https://5e.tools/conditionsdiseases.html#deafened_xphb"},"cond|exhaustion":{"n":"Exhaustion","h":"<p>While you have the Exhaustion condition, you experience the following effects.<\/p><p><b><i>Exhaustion Levels.<\/i><\/b> This condition is cumulative. Each time you receive it, you gain 1 Exhaustion level. You die if your Exhaustion level is 6.<\/p><p><b><i>D20 Tests Affected.<\/i><\/b> When you make a D20 Test, the roll is reduced by 2 times your Exhaustion level.<\/p><p><b><i>Speed Reduced.<\/i><\/b> Your <a class=\"lk\" data-l=\"rule|speed\">Speed<\/a> is reduced by a number of feet equal to 5 times your Exhaustion level.<\/p><p><b><i>Removing Exhaustion Levels.<\/i><\/b> Finishing a <a class=\"lk\" data-l=\"rule|long rest\">Long Rest<\/a> removes 1 of your Exhaustion levels. When your Exhaustion level reaches 0, the condition ends.<\/p>","u":"https://5e.tools/conditionsdiseases.html#exhaustion_xphb"},"cond|frightened":{"n":"Frightened","h":"<p>While you have the Frightened condition, you experience the following effects.<\/p><p><b><i>Ability Checks and Attacks Affected.<\/i><\/b> You have <a class=\"lk\" data-l=\"rule|disadvantage\">Disadvantage<\/a> on ability checks and attack rolls while the source of fear is within line of sight.<\/p><p><b><i>Can't Approach.<\/i><\/b> You can't willingly move closer to the source of fear.<\/p>","u":"https://5e.tools/conditionsdiseases.html#frightened_xphb"},"cond|grappled":{"n":"Grappled","h":"<p>While you have the Grappled condition, you experience the following effects.<\/p><p><b><i>Speed 0.<\/i><\/b> Your <a class=\"lk\" data-l=\"rule|speed\">Speed<\/a> is 0 and can't increase.<\/p><p><b><i>Attacks Affected.<\/i><\/b> You have <a class=\"lk\" data-l=\"rule|disadvantage\">Disadvantage<\/a> on attack rolls against any target other than the grappler.<\/p><p><b><i>Movable.<\/i><\/b> The grappler can drag or carry you when it moves, but every foot of movement costs it 1 extra foot unless you are Tiny or two or more sizes smaller than it.<\/p>","u":"https://5e.tools/conditionsdiseases.html#grappled_xphb"},"cond|incapacitated":{"n":"Incapacitated","h":"<p>While you have the Incapacitated condition, you experience the following effects.<\/p><p><b><i>Inactive.<\/i><\/b> You can't take any <a class=\"lk\" data-l=\"rule|action\">action<\/a>, <a class=\"lk\" data-l=\"rule|bonus action\">Bonus Action<\/a>, or <a class=\"lk\" data-l=\"rule|reaction\">Reaction<\/a>.<\/p><p><b><i>No Concentration.<\/i><\/b> Your <a class=\"lk\" data-l=\"cond|concentration\">Concentration<\/a> is broken.<\/p><p><b><i>Speechless.<\/i><\/b> You can't speak.<\/p><p><b><i>Surprised.<\/i><\/b> If you're Incapacitated when you roll <a class=\"lk\" data-l=\"rule|initiative\">Initiative<\/a>, you have <a class=\"lk\" data-l=\"rule|disadvantage\">Disadvantage<\/a> on the roll.<\/p>","u":"https://5e.tools/conditionsdiseases.html#incapacitated_xphb"},"cond|invisible":{"n":"Invisible","h":"<p>While you have the Invisible condition, you experience the following effects.<\/p><p><b><i>Surprise.<\/i><\/b> If you're Invisible when you roll <a class=\"lk\" data-l=\"rule|initiative\">Initiative<\/a>, you have <a class=\"lk\" data-l=\"rule|advantage\">Advantage<\/a> on the roll.<\/p><p><b><i>Concealed.<\/i><\/b> You aren't affected by any effect that requires its target to be seen unless the effect's creator can somehow see you. Any equipment you are wearing or carrying is also concealed.<\/p><p><b><i>Attacks Affected.<\/i><\/b> <a class=\"lk\" data-l=\"act|attack\">Attack<\/a> rolls against you have <a class=\"lk\" data-l=\"rule|disadvantage\">Disadvantage<\/a>, and your attack rolls have <a class=\"lk\" data-l=\"rule|advantage\">Advantage<\/a>. If a creature can somehow see you, you don't gain this benefit against that creature.<\/p>","u":"https://5e.tools/conditionsdiseases.html#invisible_xphb"},"cond|paralyzed":{"n":"Paralyzed","h":"<p>While you have the Paralyzed condition, you experience the following effects.<\/p><p><b><i>Incapacitated.<\/i><\/b> You have the <a class=\"lk\" data-l=\"cond|incapacitated\">Incapacitated<\/a> condition.<\/p><p><b><i>Speed 0.<\/i><\/b> Your <a class=\"lk\" data-l=\"rule|speed\">Speed<\/a> is 0 and can't increase.<\/p><p><b><i>Saving Throws Affected.<\/i><\/b> You automatically fail Strength and Dexterity <a class=\"lk\" data-l=\"rule|saving throw\">saving throws<\/a>.<\/p><p><b><i>Attacks Affected.<\/i><\/b> <a class=\"lk\" data-l=\"act|attack\">Attack<\/a> rolls against you have <a class=\"lk\" data-l=\"rule|advantage\">Advantage<\/a>.<\/p><p><b><i>Automatic Critical Hits.<\/i><\/b> Any attack roll that hits you is a <a class=\"lk\" data-l=\"rule|critical hit\">Critical Hit<\/a> if the attacker is within 5 feet of you.<\/p>","u":"https://5e.tools/conditionsdiseases.html#paralyzed_xphb"},"cond|petrified":{"n":"Petrified","h":"<p>While you have the Petrified condition, you experience the following effects.<\/p><p><b><i>Turned to Inanimate Substance.<\/i><\/b> You are transformed, along with any nonmagical objects you are wearing and carrying, into a solid inanimate substance (usually stone). Your weight increases by a factor of ten, and you cease aging.<\/p><p><b><i>Incapacitated.<\/i><\/b> You have the <a class=\"lk\" data-l=\"cond|incapacitated\">Incapacitated<\/a> condition.<\/p><p><b><i>Speed 0.<\/i><\/b> Your <a class=\"lk\" data-l=\"rule|speed\">Speed<\/a> is 0 and can't increase.<\/p><p><b><i>Attacks Affected.<\/i><\/b> <a class=\"lk\" data-l=\"act|attack\">Attack<\/a> rolls against you have <a class=\"lk\" data-l=\"rule|advantage\">Advantage<\/a>.<\/p><p><b><i>Saving Throws Affected.<\/i><\/b> You automatically fail Strength and Dexterity <a class=\"lk\" data-l=\"rule|saving throw\">saving throws<\/a>.<\/p><p><b><i>Resist Damage.<\/i><\/b> You have <a class=\"lk\" data-l=\"rule|resistance\">Resistance<\/a> to all damage.<\/p><p><b><i>Poison Immunity.<\/i><\/b> You have <a class=\"lk\" data-l=\"rule|immunity\">Immunity<\/a> to the <a class=\"lk\" data-l=\"cond|poisoned\">Poisoned<\/a> condition.<\/p>","u":"https://5e.tools/conditionsdiseases.html#petrified_xphb"},"cond|poisoned":{"n":"Poisoned","h":"<p>While you have the Poisoned condition, you experience the following effect.<\/p><p><b><i>Ability Checks and Attacks Affected.<\/i><\/b> You have <a class=\"lk\" data-l=\"rule|disadvantage\">Disadvantage<\/a> on attack rolls and ability checks.<\/p>","u":"https://5e.tools/conditionsdiseases.html#poisoned_xphb"},"cond|prone":{"n":"Prone","h":"<p>While you have the Prone condition, you experience the following effects.<\/p><p><b><i>Restricted Movement.<\/i><\/b> Your only movement options are to <a class=\"lk\" data-l=\"rule|crawling\">crawl<\/a> or to spend an amount of movement equal to half your <a class=\"lk\" data-l=\"rule|speed\">Speed<\/a> (round down) to right yourself and thereby end the condition. If your <a class=\"lk\" data-l=\"rule|speed\">Speed<\/a> is 0, you can't right yourself.<\/p><p><b><i>Attacks Affected.<\/i><\/b> You have <a class=\"lk\" data-l=\"rule|disadvantage\">Disadvantage<\/a> on attack rolls. An attack roll against you has <a class=\"lk\" data-l=\"rule|advantage\">Advantage<\/a> if the attacker is within 5 feet of you. Otherwise, that attack roll has <a class=\"lk\" data-l=\"rule|disadvantage\">Disadvantage<\/a>.<\/p>","u":"https://5e.tools/conditionsdiseases.html#prone_xphb"},"cond|restrained":{"n":"Restrained","h":"<p>While you have the Restrained condition, you experience the following effects.<\/p><p><b><i>Speed 0.<\/i><\/b> Your <a class=\"lk\" data-l=\"rule|speed\">Speed<\/a> is 0 and can't increase.<\/p><p><b><i>Attacks Affected.<\/i><\/b> <a class=\"lk\" data-l=\"act|attack\">Attack<\/a> rolls against you have <a class=\"lk\" data-l=\"rule|advantage\">Advantage<\/a>, and your attack rolls have <a class=\"lk\" data-l=\"rule|disadvantage\">Disadvantage<\/a>.<\/p><p><b><i>Saving Throws Affected.<\/i><\/b> You have <a class=\"lk\" data-l=\"rule|disadvantage\">Disadvantage<\/a> on Dexterity <a class=\"lk\" data-l=\"rule|saving throw\">saving throws<\/a>.<\/p>","u":"https://5e.tools/conditionsdiseases.html#restrained_xphb"},"cond|stunned":{"n":"Stunned","h":"<p>While you have the Stunned condition, you experience the following effects.<\/p><p><b><i>Incapacitated.<\/i><\/b> You have the <a class=\"lk\" data-l=\"cond|incapacitated\">Incapacitated<\/a> condition.<\/p><p><b><i>Saving Throws Affected.<\/i><\/b> You automatically fail Strength and Dexterity <a class=\"lk\" data-l=\"rule|saving throw\">saving throws<\/a>.<\/p><p><b><i>Attacks Affected.<\/i><\/b> <a class=\"lk\" data-l=\"act|attack\">Attack<\/a> rolls against you have <a class=\"lk\" data-l=\"rule|advantage\">Advantage<\/a>.<\/p>","u":"https://5e.tools/conditionsdiseases.html#stunned_xphb"},"cond|unconscious":{"n":"Unconscious","h":"<p>While you have the Unconscious condition, you experience the following effects.<\/p><p><b><i>Inert.<\/i><\/b> You have the <a class=\"lk\" data-l=\"cond|incapacitated\">Incapacitated<\/a> and <a class=\"lk\" data-l=\"cond|prone\">Prone<\/a> conditions, and you drop whatever you're holding. When this condition ends, you remain <a class=\"lk\" data-l=\"cond|prone\">Prone<\/a>.<\/p><p><b><i>Speed 0.<\/i><\/b> Your <a class=\"lk\" data-l=\"rule|speed\">Speed<\/a> is 0 and can't increase.<\/p><p><b><i>Attacks Affected.<\/i><\/b> <a class=\"lk\" data-l=\"act|attack\">Attack<\/a> rolls against you have <a class=\"lk\" data-l=\"rule|advantage\">Advantage<\/a>.<\/p><p><b><i>Saving Throws Affected.<\/i><\/b> You automatically fail Strength and Dexterity <a class=\"lk\" data-l=\"rule|saving throw\">saving throws<\/a>.<\/p><p><b><i>Automatic Critical Hits.<\/i><\/b> Any attack roll that hits you is a <a class=\"lk\" data-l=\"rule|critical hit\">Critical Hit<\/a> if the attacker is within 5 feet of you.<\/p><p><b><i>Unaware.<\/i><\/b> You're unaware of your surroundings.<\/p>","u":"https://5e.tools/conditionsdiseases.html#unconscious_xphb"},"cond|bloodied":{"n":"Bloodied","h":"<p>A creature is Bloodied while it has half its <a class=\"lk\" data-l=\"rule|hit points\">Hit Points<\/a> or fewer remaining.<\/p>","u":"https://5e.tools/conditionsdiseases.html#bloodied_xphb"},"cond|concentration":{"n":"Concentration","h":"<p>Some spells and other effects require Concentration to remain active, as specified in their descriptions. If the effect's creator loses Concentration, the effect ends. If the effect has a maximum duration, the effect's description specifies how long the creator can concentrate on it: up to 1 minute, 1 hour, or some other duration. The creator can end Concentration at any time (no action required). The following factors break Concentration.<\/p><p><b><i>Another Concentration Effect.<\/i><\/b> You lose Concentration on an effect the moment you start casting a spell that requires Concentration or activate another effect that requires Concentration.<\/p><p><b><i>Damage.<\/i><\/b> If you take damage, you must succeed on a Constitution <a class=\"lk\" data-l=\"rule|saving throw\">saving throw<\/a> to maintain Concentration. The DC equals 10 or half the damage taken (round down), whichever number is higher, up to a maximum DC of 30.<\/p><p><b><i>Incapacitated or Dead.<\/i><\/b> Your Concentration ends if you have the <a class=\"lk\" data-l=\"cond|incapacitated\">Incapacitated<\/a> condition or you die.<\/p>","u":"https://5e.tools/conditionsdiseases.html#concentration_xphb"},"cond|surprised":{"n":"Surprised","h":"<p>If a creature is caught unawares by the start of combat, that creature is surprised, which causes it to have <a class=\"lk\" data-l=\"rule|disadvantage\">Disadvantage<\/a> on its <a class=\"lk\" data-l=\"rule|initiative\">Initiative<\/a> roll.<\/p>","u":"https://5e.tools/conditionsdiseases.html#surprised_xphb"},"act|attack":{"n":"Attack","h":"<p>When you take the Attack action, you can make one attack roll with a weapon or an <a class=\"lk\" data-l=\"rule|unarmed strike\">Unarmed Strike<\/a>.<\/p><p><b><i>Equipping and Unequipping Weapons.<\/i><\/b> You can either equip or unequip one weapon when you make an attack as part of this action. You do so either before or after the attack. If you equip a weapon before an attack, you don't need to use it for that attack. Equipping a weapon includes drawing it from a sheath or picking it up. Unequipping a weapon includes sheathing, stowing, or dropping it.<\/p><p><b><i>Moving Between Attacks.<\/i><\/b> If you move on your turn and have a feature, such as Extra Attack, that gives you more than one attack as part of the Attack action, you can use some or all of that movement to move between those attacks.<\/p>","u":"https://5e.tools/actions.html#attack_xphb"},"act|dash":{"n":"Dash","h":"<p>When you take the Dash action, you gain extra movement for the current turn. The increase equals your <a class=\"lk\" data-l=\"rule|speed\">Speed<\/a> after applying any modifiers. With a <a class=\"lk\" data-l=\"rule|speed\">Speed<\/a> of 30 feet, for example, you can move up to 60 feet on your turn if you Dash. If your <a class=\"lk\" data-l=\"rule|speed\">Speed<\/a> of 30 feet is reduced to 15 feet, you can move up to 30 feet this turn if you Dash.<\/p><p>If you have a special speed, such as a <a class=\"lk\" data-l=\"rule|fly speed\">Fly Speed<\/a> or <a class=\"lk\" data-l=\"rule|swim speed\">Swim Speed<\/a>, you can use that speed instead of your <a class=\"lk\" data-l=\"rule|speed\">Speed<\/a> when you take this action. You choose which speed to use each time you take it.<\/p>","u":"https://5e.tools/actions.html#dash_xphb"},"act|disengage":{"n":"Disengage","h":"<p>If you take the Disengage action, your movement doesn't provoke <a class=\"lk\" data-l=\"act|opportunity attack\">Opportunity Attacks<\/a> for the rest of the current turn.<\/p>","u":"https://5e.tools/actions.html#disengage_xphb"},"act|dodge":{"n":"Dodge","h":"<p>If you take the Dodge action, you gain the following benefits: until the start of your next turn, any attack roll made against you has <a class=\"lk\" data-l=\"rule|disadvantage\">Disadvantage<\/a> if you can see the attacker, and you make Dexterity <a class=\"lk\" data-l=\"rule|saving throw\">saving throws<\/a> with <a class=\"lk\" data-l=\"rule|advantage\">Advantage<\/a>.<\/p><p>You lose these benefits if you have the <a class=\"lk\" data-l=\"cond|incapacitated\">Incapacitated<\/a> condition or if your <a class=\"lk\" data-l=\"rule|speed\">Speed<\/a> is 0.<\/p>","u":"https://5e.tools/actions.html#dodge_xphb"},"act|don or doff a shield":{"n":"Don or Doff a Shield","h":"<p>A Shield can be donned or doffed as an action.<\/p>","u":"https://5e.tools/actions.html#don%20or%20doff%20a%20shield_xphb"},"act|end concentration":{"n":"End Concentration","h":"<p>Some spells and other effects require Concentration to remain active, as specified in their descriptions. You can end Concentration at any time (no action required).<\/p>","u":"https://5e.tools/actions.html#end%20concentration_xphb"},"act|escape a grapple":{"n":"Escape a Grapple","h":"<p>A Grappled creature can use its action to make a Strength (<a class=\"lk\" data-l=\"skill|athletics\">Athletics<\/a>) or Dexterity (<a class=\"lk\" data-l=\"skill|acrobatics\">Acrobatics<\/a>) check against the grapple's escape DC, ending the <a class=\"lk\" data-l=\"rule|condition\">condition<\/a> on itself on a success. The <a class=\"lk\" data-l=\"rule|condition\">condition<\/a> also ends if the grappler has the <a class=\"lk\" data-l=\"cond|incapacitated\">Incapacitated<\/a> condition or if the distance between the Grappled target and the grappler exceeds the grapple's range.<\/p>","u":"https://5e.tools/actions.html#escape%20a%20grapple_xphb"},"act|help":{"n":"Help","h":"<p>When you take the Help action, you do one of the following.<\/p><p><b><i>Assist an Ability Check.<\/i><\/b> Choose one of your skill or tool proficiencies and one ally who is near enough for you to assist verbally or physically when they make an ability check. That ally has <a class=\"lk\" data-l=\"rule|advantage\">Advantage<\/a> on the next ability check they make with the chosen skill or tool. This benefit expires if the ally doesn't use it before the start of your next turn. The DM has final say on whether your assistance is possible.<\/p><p><b><i>Assist an Attack Roll.<\/i><\/b> You momentarily distract an enemy within 5 feet of you, giving <a class=\"lk\" data-l=\"rule|advantage\">Advantage<\/a> to the next attack roll by one of your allies against that enemy. This benefit expires at the start of your next turn.<\/p><p>Additionally, the Help action may be used to 1.<\/p>","u":"https://5e.tools/actions.html#help_xphb"},"act|hide":{"n":"Hide","h":"<p>With the Hide action, you try to conceal yourself. To do so, you must succeed on a DC 15 Dexterity (<a class=\"lk\" data-l=\"skill|stealth\">Stealth<\/a>) check while you're <a class=\"lk\" data-l=\"rule|heavily obscured\">Heavily Obscured<\/a> or behind <a class=\"lk\" data-l=\"rule|cover\">Three-Quarters Cover or Total Cover<\/a>, and you must be out of any enemy's line of sight; if you can see a creature, you can discern whether it can see you.<\/p><p>On a successful check, you have the <a class=\"lk\" data-l=\"cond|invisible\">Invisible<\/a> condition while hidden. Make note of your check's total, which is the DC for a creature to find you with a Wisdom (<a class=\"lk\" data-l=\"skill|perception\">Perception<\/a>) check.<\/p><p>You stop being hidden immediately after any of the following occurs: you make a sound louder than a whisper, an enemy finds you, you make an attack roll, or you cast a spell with a Verbal component.<\/p>","u":"https://5e.tools/actions.html#hide_xphb"},"act|influence":{"n":"Influence","h":"<p>With the Influence action, you urge a monster to do something. Describe or roleplay how you're communicating with the monster. Are you trying to deceive, intimidate, amuse, or gently persuade? The DM then determines whether the monster feels willing, unwilling, or hesitant due to your interaction; this determination establishes whether an ability check is necessary, as explained below.<\/p><p><b><i>Willing.<\/i><\/b> If your urging aligns with the monster's desires, no ability check is necessary; the monster fulfills your request in a way it prefers.<\/p><p><b><i>Unwilling.<\/i><\/b> If your urging is repugnant to the monster or counter to its alignment, no ability check is necessary; it doesn't comply.<\/p><p><b><i>Hesitant.<\/i><\/b> If you urge the monster to do something that it is hesitant to do, you must make an ability check, which is affected by the monster's attitude: Indifferent, Friendly, or Hostile, each of which is defined in this glossary. The Influence Checks table suggests which ability check to make based on how you're interacting with the monster. The DM chooses the check, which has a default DC equal to 15 or the monster's Intelligence score, whichever is higher. On a successful check, the monster does as urged. On a failed check, you must wait 24 hours (or a duration set by the DM) before urging it in the same way again.<\/p><div class=\"tw\"><table><caption>Influence Checks<\/caption><tr><th>Ability Check<\/th><th>Interaction<\/th><\/tr><tr><td>Charisma (<a class=\"lk\" data-l=\"skill|deception\">Deception<\/a>)<\/td><td>Deceiving a monster that understands you<\/td><\/tr><tr><td>Charisma (<a class=\"lk\" data-l=\"skill|intimidation\">Intimidation<\/a>)<\/td><td>Intimidating a monster<\/td><\/tr><tr><td>Charisma (<a class=\"lk\" data-l=\"skill|performance\">Performance<\/a>)<\/td><td>Amusing a monster<\/td><\/tr><tr><td>Charisma (<a class=\"lk\" data-l=\"skill|persuasion\">Persuasion<\/a>)<\/td><td>Persuading a monster that understands you<\/td><\/tr><tr><td>Wisdom (<a class=\"lk\" data-l=\"skill|animal handling\">Animal Handling<\/a>)<\/td><td>Gently coaxing a Beast or Monstrosity<\/td><\/tr><\/table><\/div>","u":"https://5e.tools/actions.html#influence_xphb"},"act|magic":{"n":"Magic","h":"<p>When you take the <a class=\"lk\" data-l=\"act|magic\">Magic<\/a> action, you cast a spell that has a casting time of an action or use a feature or magic item that requires a <a class=\"lk\" data-l=\"act|magic\">Magic<\/a> action to be activated.<\/p><p>If you cast a spell that has a casting time of 1 minute or longer, you must take the <a class=\"lk\" data-l=\"act|magic\">Magic<\/a> action on each turn of that casting, and you must maintain <a class=\"lk\" data-l=\"cond|concentration\">Concentration<\/a> while you do so. If your <a class=\"lk\" data-l=\"cond|concentration\">Concentration<\/a> is broken, the spell fails, but you don't expend a spell slot.<\/p>","u":"https://5e.tools/actions.html#magic_xphb"},"act|opportunity attack":{"n":"Opportunity Attack","h":"<p>You can make an Opportunity Attack when a creature that you can see leaves your reach using its action, its <a class=\"lk\" data-l=\"rule|bonus action\">Bonus Action<\/a>, its <a class=\"lk\" data-l=\"rule|reaction\">Reaction<\/a>, or one of its speeds. To make the Opportunity Attack, take a <a class=\"lk\" data-l=\"rule|reaction\">Reaction<\/a> to make one melee attack with a weapon or an <a class=\"lk\" data-l=\"rule|unarmed strike\">Unarmed Strike<\/a> against the provoking creature. The attack occurs right before the creature leaves your reach.<\/p>","u":"https://5e.tools/actions.html#opportunity%20attack_xphb"},"act|ready":{"n":"Ready","h":"<p>You take the Ready action to wait for a particular circumstance before you act. To do so, you take this action on your turn, which lets you act by taking a <a class=\"lk\" data-l=\"rule|reaction\">Reaction<\/a> before the start of your next turn.<\/p><p>First, you decide what perceivable circumstance will trigger your <a class=\"lk\" data-l=\"rule|reaction\">Reaction<\/a>. Then, you choose the action you will take in response to that trigger, or you choose to move up to your <a class=\"lk\" data-l=\"rule|speed\">Speed<\/a> in response to it. Examples include \"If the cultist steps on the trapdoor, I'll pull the lever that opens it,\" and \"If the zombie steps next to me, I move away.\"<\/p><p>When the trigger occurs, you can either take your <a class=\"lk\" data-l=\"rule|reaction\">Reaction<\/a> right after the trigger finishes or ignore the trigger.<\/p><p>When you Ready a spell, you cast it as normal (expending any resources used to cast it) but hold its energy, which you release with your <a class=\"lk\" data-l=\"rule|reaction\">Reaction<\/a> when the trigger occurs. To be readied, a spell must have a casting time of an action, and holding on to the spell's magic requires <a class=\"lk\" data-l=\"cond|concentration\">Concentration<\/a>, which you can maintain up to the start of your next turn. If your <a class=\"lk\" data-l=\"cond|concentration\">Concentration<\/a> is broken, the spell dissipates without taking effect.<\/p>","u":"https://5e.tools/actions.html#ready_xphb"},"act|search":{"n":"Search","h":"<p>When you take the Search action, you make a Wisdom check to discern something that isn't obvious. The Search table suggests which skills are applicable when you take this action, depending on what you're trying to detect.<\/p><div class=\"tw\"><table><caption>Search<\/caption><tr><th>Skill<\/th><th>Thing to Detect<\/th><\/tr><tr><td><a class=\"lk\" data-l=\"skill|insight\">Insight<\/a><\/td><td>Creature's state of mind<\/td><\/tr><tr><td><a class=\"lk\" data-l=\"skill|medicine\">Medicine<\/a><\/td><td>Creature's ailment or cause of death<\/td><\/tr><tr><td><a class=\"lk\" data-l=\"skill|perception\">Perception<\/a><\/td><td>Concealed creature or object<\/td><\/tr><tr><td><a class=\"lk\" data-l=\"skill|survival\">Survival<\/a><\/td><td>Tracks or food<\/td><\/tr><\/table><\/div>","u":"https://5e.tools/actions.html#search_xphb"},"act|study":{"n":"Study","h":"<p>When you take the Study action, you make an Intelligence check to study your memory, a book, a clue, or another source of knowledge and call to mind an important piece of information about it.<\/p><p>The Areas of Knowledge table suggests which skills are applicable to various areas of knowledge.<\/p><div class=\"tw\"><table><caption>Areas of Knowledge<\/caption><tr><th>Skill<\/th><th>Areas<\/th><\/tr><tr><td><a class=\"lk\" data-l=\"skill|arcana\">Arcana<\/a><\/td><td>Spells, magic items, eldritch symbols, magical traditions, planes of existence, and certain creatures (Aberrations, Constructs, Elementals, Fey, and Monstrosities)<\/td><\/tr><tr><td><a class=\"lk\" data-l=\"skill|history\">History<\/a><\/td><td>Historic events and people, ancient civilizations, wars, and certain creatures (Giants and Humanoids)<\/td><\/tr><tr><td><a class=\"lk\" data-l=\"skill|investigation\">Investigation<\/a><\/td><td>Traps, ciphers, riddles, and gadgetry<\/td><\/tr><tr><td><a class=\"lk\" data-l=\"skill|nature\">Nature<\/a><\/td><td>Terrain, flora, weather, and certain creatures (Beasts, Dragons, Oozes, and Plants)<\/td><\/tr><tr><td><a class=\"lk\" data-l=\"skill|religion\">Religion<\/a><\/td><td>Deities, religious hierarchies and rites, holy symbols, cults, and certain creatures (Celestials, Fiends, and Undead)<\/td><\/tr><\/table><\/div>","u":"https://5e.tools/actions.html#study_xphb"},"act|two-weapon fighting":{"n":"Two-Weapon Fighting","h":"<p>When you take the <a class=\"lk\" data-l=\"act|attack\">Attack<\/a> action on your turn and attack with a Light weapon, you can make one extra attack as a <a class=\"lk\" data-l=\"rule|bonus action\">Bonus Action<\/a> later on the same turn. That extra attack must be made with a different Light weapon, and you don't add your ability modifier to the extra attack's damage unless that modifier is negative. For example, you can attack with a Shortsword in one hand and a Dagger in the other using the <a class=\"lk\" data-l=\"act|attack\">Attack<\/a> action and a <a class=\"lk\" data-l=\"rule|bonus action\">Bonus Action<\/a>, but you don't add your Strength or Dexterity modifier to the damage roll of the <a class=\"lk\" data-l=\"rule|bonus action\">Bonus Action<\/a> unless that modifier is negative.<\/p>","u":"https://5e.tools/actions.html#two-weapon%20fighting_xphb"},"act|utilize":{"n":"Utilize","h":"<p>You normally interact with an object while doing something else, such as when you draw a sword as part of the <a class=\"lk\" data-l=\"act|attack\">Attack<\/a> action. When an object requires an action for its use, you take the Utilize action.<\/p>","u":"https://5e.tools/actions.html#utilize_xphb"},"rule|ability check":{"n":"Ability Check","h":"<p>An ability check is a <a class=\"lk\" data-l=\"rule|d20 test\">D20 Test<\/a> that represents using one of the six abilities—or a specific skill associated with an ability—to overcome a challenge.<\/p>","u":"https://5e.tools/variantrules.html#ability%20check_xphb"},"rule|ability score and modifier":{"n":"Ability Score and Modifier","h":"<p>A creature has six ability scores—Strength, Dexterity, Constitution, Intelligence, Wisdom, and Charisma—each of which has a corresponding modifier. Add the modifier when you make a <a class=\"lk\" data-l=\"rule|d20 test\">D20 Test<\/a> with the corresponding ability or when a rule asks you to do so.<\/p>","u":"https://5e.tools/variantrules.html#ability%20score%20and%20modifier_xphb"},"rule|action":{"n":"Action","h":"<p>On your turn, you can take one action. Choose which action to take from those below or from the special actions provided by your features. These actions are defined elsewhere in this glossary:<\/p><ul><li><a class=\"lk\" data-l=\"act|attack\">Attack<\/a><\/li><li><a class=\"lk\" data-l=\"act|dodge\">Dodge<\/a><\/li><li><a class=\"lk\" data-l=\"act|dash\">Dash<\/a><\/li><li><a class=\"lk\" data-l=\"act|help\">Help<\/a><\/li><li><a class=\"lk\" data-l=\"act|disengage\">Disengage<\/a><\/li><li><a class=\"lk\" data-l=\"act|hide\">Hide<\/a><\/li><li><a class=\"lk\" data-l=\"act|influence\">Influence<\/a><\/li><li><a class=\"lk\" data-l=\"act|magic\">Magic<\/a><\/li><li><a class=\"lk\" data-l=\"act|ready\">Ready<\/a><\/li><li><a class=\"lk\" data-l=\"act|search\">Search<\/a><\/li><li><a class=\"lk\" data-l=\"act|study\">Study<\/a><\/li><li><a class=\"lk\" data-l=\"act|utilize\">Utilize<\/a><\/li><\/ul>","u":"https://5e.tools/variantrules.html#action_xphb"},"rule|advantage":{"n":"Advantage","h":"<p>If you have Advantage on a <a class=\"lk\" data-l=\"rule|d20 test\">D20 Test<\/a>, roll two d20s, and use the higher roll. A roll can't be affected by more than one Advantage, and Advantage and <a class=\"lk\" data-l=\"rule|disadvantage\">Disadvantage<\/a> on the same roll cancel each other.<\/p>","u":"https://5e.tools/variantrules.html#advantage_xphb"},"rule|adventure":{"n":"Adventure","h":"<p>An adventure is a series of <a class=\"lk\" data-l=\"rule|encounter\">encounters<\/a>. A story emerges through playing them.<\/p>","u":"https://5e.tools/variantrules.html#adventure_xphb"},"rule|alignment":{"n":"Alignment","h":"<p>A creature's alignment broadly describes its ethical attitudes and ideals. Alignment is a combination of two factors: one identifies morality (good, evil, or neutral), and the other describes attitudes toward order (lawful, chaotic, or neutral). These factors allow for nine possible combinations, such as Lawful Good and Neutral Evil.<\/p>","u":"https://5e.tools/variantrules.html#alignment_xphb"},"rule|ally":{"n":"Ally","h":"<p>A creature is your ally if it is a member of your adventuring party, your friend, on your side in combat, or a creature that the rules or the DM designates as your ally.<\/p>","u":"https://5e.tools/variantrules.html#ally_xphb"},"rule|area of effect":{"n":"Area of Effect","h":"<p>The descriptions of many spells and other features specify that they have an area of effect, which typically has one of six shapes. These shapes are defined elsewhere in this glossary:<\/p><ul><li><a class=\"lk\" data-l=\"rule|cone [area of effect]\">Cone<\/a><\/li><li><a class=\"lk\" data-l=\"rule|cube [area of effect]\">Cube<\/a><\/li><li><a class=\"lk\" data-l=\"rule|cylinder [area of effect]\">Cylinder<\/a><\/li><li><a class=\"lk\" data-l=\"rule|emanation [area of effect]\">Emanation<\/a><\/li><li><a class=\"lk\" data-l=\"rule|line [area of effect]\">Line<\/a><\/li><li><a class=\"lk\" data-l=\"rule|sphere [area of effect]\">Sphere<\/a><\/li><\/ul><p>An area of effect has a point of origin, a location from which the effect's energy erupts. The rules for each shape specify how to position its point of origin. If all straight lines extending from the point of origin to a location in the area of effect are blocked, that location isn't included in the area of effect. To block a line, an obstruction must provide <a class=\"lk\" data-l=\"rule|cover\">Total Cover<\/a>.<\/p><p>If the creator of an area of effect places it at an unseen point and an obstruction—such as a wall—is between the creator and that point, the point of origin comes into being on the near side of the obstruction.<\/p>","u":"https://5e.tools/variantrules.html#area%20of%20effect_xphb"},"rule|armor class":{"n":"Armor Class","h":"<p>An Armor Class (AC) is the target number for an attack roll. AC represents how difficult it is to hit a target.<\/p><p>Your base AC calculation is 10 plus your Dexterity modifier. If a rule gives you another base AC calculation, you choose which calculation to use; you can't use more than one.<\/p>","u":"https://5e.tools/variantrules.html#armor%20class_xphb"},"rule|armor training":{"n":"Armor Training","h":"<p>Armor training allows you to use armor of a certain category without the following drawbacks. If you wear Light, Medium, or Heavy armor and lack training with it, you have <a class=\"lk\" data-l=\"rule|disadvantage\">Disadvantage<\/a> on any <a class=\"lk\" data-l=\"rule|d20 test\">D20 Test<\/a> that involves Strength or Dexterity, and you can't cast spells. If you use a Shield and lack training with it, you don't gain its AC bonus.<\/p>","u":"https://5e.tools/variantrules.html#armor%20training_xphb"},"rule|attack roll":{"n":"Attack Roll","h":"<p>An attack roll is a <a class=\"lk\" data-l=\"rule|d20 test\">D20 Test<\/a> that represents making an attack with a weapon, an <a class=\"lk\" data-l=\"rule|unarmed strike\">Unarmed Strike<\/a>, or a spell.<\/p>","u":"https://5e.tools/variantrules.html#attack%20roll_xphb"},"rule|attitude":{"n":"Attitude","h":"<p>A <a class=\"lk\" data-l=\"rule|monster\">monster<\/a> has a starting attitude toward a <a class=\"lk\" data-l=\"rule|player character\">player character<\/a>: <a class=\"lk\" data-l=\"rule|friendly [attitude]\">Friendly<\/a>, <a class=\"lk\" data-l=\"rule|hostile [attitude]\">Hostile<\/a>, or <a class=\"lk\" data-l=\"rule|indifferent [attitude]\">Indifferent<\/a>.<\/p>","u":"https://5e.tools/variantrules.html#attitude_xphb"},"rule|attunement":{"n":"Attunement","h":"<p>Some magic items require a creature to form a bond—called Attunement—with them before the creature can use an item's magical properties. A creature can have Attunement with no more than three magic items at a time.<\/p>","u":"https://5e.tools/variantrules.html#attunement_xphb"},"rule|bonus action":{"n":"Bonus Action","h":"<p>A Bonus Action is a special action that you can take on the same turn that you take an action. You can't take more than one Bonus Action on a turn, and you have a Bonus Action to take only if a rule explicitly says so.<\/p>","u":"https://5e.tools/variantrules.html#bonus%20action_xphb"},"rule|breaking objects":{"n":"Breaking Objects","h":"<p>Objects can be harmed by attacks and by some spells, using the rules below. If an object is exceedingly fragile, the DM may allow a creature to break it automatically with the <a class=\"lk\" data-l=\"act|attack\">Attack<\/a> or <a class=\"lk\" data-l=\"act|utilize\">Utilize<\/a> action.<\/p><p><b><i>Armor Class.<\/i><\/b> The Object <a class=\"lk\" data-l=\"rule|armor class\">Armor Class<\/a> table suggests ACs for various substances.<\/p><div class=\"tw\"><table><caption>Object Armor Class<\/caption><tr><th>AC<\/th><th>Substance<\/th><\/tr><tr><td>11<\/td><td>Cloth, paper, rope<\/td><\/tr><tr><td>13<\/td><td>Crystal, glass, ice<\/td><\/tr><tr><td>15<\/td><td>Wood<\/td><\/tr><tr><td>17<\/td><td>Stone<\/td><\/tr><tr><td>19<\/td><td>Iron, steel<\/td><\/tr><tr><td>21<\/td><td>Mithral<\/td><\/tr><tr><td>23<\/td><td>Adamantite<\/td><\/tr><\/table><\/div><p><b><i>Hit Points.<\/i><\/b> An object is destroyed when it has 0 Hit Points. The Object Hit Points table suggests <a class=\"lk\" data-l=\"rule|hit points\">Hit Points<\/a> for fragile and resilient objects that are Large or smaller. To track Hit Points for a Huge or Gargantuan object, divide it into Large or smaller sections, and track each section's <a class=\"lk\" data-l=\"rule|hit points\">Hit Points<\/a> separately. The DM determines whether destroying part of an object causes the whole thing to collapse.<\/p><div class=\"tw\"><table><caption>Object Hit Points<\/caption><tr><th>Size<\/th><th>Fragile<\/th><th>Resilient<\/th><\/tr><tr><td>Tiny (bottle, lock)<\/td><td>2 (1d4)<\/td><td>5 (2d4)<\/td><\/tr><tr><td>Small (chest, lute)<\/td><td>3 (1d6)<\/td><td>10 (3d6)<\/td><\/tr><tr><td>Medium (barrel, chandelier)<\/td><td>4 (1d8)<\/td><td>18 (4d8)<\/td><\/tr><tr><td>Large (cart, dining table)<\/td><td>5 (1d10)<\/td><td>27 (5d10)<\/td><\/tr><\/table><\/div><p><b><i>Damage Types and Objects.<\/i><\/b> Objects have <a class=\"lk\" data-l=\"rule|immunity\">Immunity<\/a> to Poison and Psychic damage. The DM might decide that some <a class=\"lk\" data-l=\"rule|damage types\">damage types<\/a> are more or less effective against an object. For example, Bludgeoning damage works well for smashing things but not for cutting. Paper or cloth objects might have <a class=\"lk\" data-l=\"rule|vulnerability\">Vulnerability<\/a> to Fire damage.<\/p><p><b><i>Damage Threshold.<\/i><\/b> Big objects, such as castle walls, often have extra resilience represented by a damage threshold.<\/p><p><b><i>No Ability Scores.<\/i><\/b> An object lacks ability scores unless a rule assigns scores to the object. Without ability scores, an object can't make ability checks, and it fails all saving throws.<\/p>","u":"https://5e.tools/variantrules.html#breaking%20objects_xphb"},"rule|bright light":{"n":"Bright Light","h":"<p>Bright Light is normal illumination.<\/p>","u":"https://5e.tools/variantrules.html#bright%20light_xphb"},"rule|burrow speed":{"n":"Burrow Speed","h":"<p>A creature that has a Burrow Speed can use that speed to move through sand, earth, mud, or ice. The creature can't burrow through solid rock unless the creature has a trait that allows it to do so.<\/p>","u":"https://5e.tools/variantrules.html#burrow%20speed_xphb"},"rule|campaign":{"n":"Campaign","h":"<p>A campaign is a series of <a class=\"lk\" data-l=\"rule|adventure\">adventures<\/a>.<\/p>","u":"https://5e.tools/variantrules.html#campaign_xphb"},"rule|cantrip":{"n":"Cantrip","h":"<p>A cantrip is a level 0 spell, which is cast without a spell slot.<\/p>","u":"https://5e.tools/variantrules.html#cantrip_xphb"},"rule|carrying capacity":{"n":"Carrying Capacity","h":"<p>Your size and Strength score determines the maximum weight in pounds that you can carry, as shown in the Carrying Capacity table. The table also shows the maximum weight you can drag, lift or push.<\/p><p>While dragging, lifting, or pushing weight in excess of the maximum weight you can carry, your Speed can be no more than 5 feet.<\/p><div class=\"tw\"><table><caption>Carrying Capacity<\/caption><tr><th>Creature Size<\/th><th>Carry<\/th><th>Drag/Lift/Push<\/th><\/tr><tr><td>Tiny<\/td><td>#$prompt_number:title=Enter Strength Score$# × 7.5 lb.<\/td><td>#$prompt_number:title=Enter Strength Score$# × 15 lb.<\/td><\/tr><tr><td>Small/Medium<\/td><td>#$prompt_number:title=Enter Strength Score$# × 15 lb.<\/td><td>#$prompt_number:title=Enter Strength Score$# × 30 lb.<\/td><\/tr><tr><td>Large<\/td><td>#$prompt_number:title=Enter Strength Score$# × 30 lb.<\/td><td>#$prompt_number:title=Enter Strength Score$# × 60 lb.<\/td><\/tr><tr><td>Huge<\/td><td>#$prompt_number:title=Enter Strength Score$# × 60 lb.<\/td><td>#$prompt_number:title=Enter Strength Score$# × 120 lb.<\/td><\/tr><tr><td>Gargantuan<\/td><td>#$prompt_number:title=Enter Strength Score$# × 120 lb.<\/td><td>#$prompt_number:title=Enter Strength Score$# × 240 lb.<\/td><\/tr><\/table><\/div>","u":"https://5e.tools/variantrules.html#carrying%20capacity_xphb"},"rule|challenge rating":{"n":"Challenge Rating","h":"<p>Challenge Rating (CR) summarizes the threat a <a class=\"lk\" data-l=\"rule|monster\">monster<\/a> poses to a group of four <a class=\"lk\" data-l=\"rule|player character\">player characters<\/a>. Compare a <a class=\"lk\" data-l=\"rule|monster\">monster's<\/a> CR to the characters' level. If the CR is higher, the <a class=\"lk\" data-l=\"rule|monster\">monster<\/a> is likely a danger. If the CR is lower, the <a class=\"lk\" data-l=\"rule|monster\">monster<\/a> likely poses little threat. But circumstances and the number of <a class=\"lk\" data-l=\"rule|player character\">player characters<\/a> can significantly alter how threatening a <a class=\"lk\" data-l=\"rule|monster\">monster<\/a> is in actual play. The Dungeon Master's Guide provides guidance to the DM on using CR while planning potential combat <a class=\"lk\" data-l=\"rule|encounter\">encounters<\/a>.<\/p>","u":"https://5e.tools/variantrules.html#challenge%20rating_xphb"},"rule|character sheet":{"n":"Character Sheet","h":"<p>A character sheet is a paper or digital record that you use to track your character's information.<\/p>","u":"https://5e.tools/variantrules.html#character%20sheet_xphb"},"rule|climb speed":{"n":"Climb Speed","h":"<p>A Climb Speed can be used in place of <a class=\"lk\" data-l=\"rule|speed\">Speed<\/a> to traverse a vertical surface without expending the extra movement normally associated with climbing.<\/p>","u":"https://5e.tools/variantrules.html#climb%20speed_xphb"},"rule|climbing":{"n":"Climbing","h":"<p>While you're climbing, each foot of movement costs 1 extra foot (2 extra feet in <a class=\"lk\" data-l=\"rule|difficult terrain\">difficult terrain<\/a>). You ignore this extra cost if you have a <a class=\"lk\" data-l=\"rule|climb speed\">Climb Speed<\/a> and use it to climb. At the DM's option, climbing a slippery surface or one with few handholds might require a successful DC 15 Strength (<a class=\"lk\" data-l=\"skill|athletics\">Athletics<\/a>) check.<\/p>","u":"https://5e.tools/variantrules.html#climbing_xphb"},"rule|condition":{"n":"Condition","h":"<p>A condition is a temporary game state. The definition of a condition says how it affects its recipient, and various rules define how to end a condition. This glossary defines these conditions:<\/p><ul><li><a class=\"lk\" data-l=\"cond|blinded\">Blinded<\/a><\/li><li><a class=\"lk\" data-l=\"cond|charmed\">Charmed<\/a><\/li><li><a class=\"lk\" data-l=\"cond|deafened\">Deafened<\/a><\/li><li><a class=\"lk\" data-l=\"cond|exhaustion\">Exhaustion<\/a><\/li><li><a class=\"lk\" data-l=\"cond|frightened\">Frightened<\/a><\/li><li><a class=\"lk\" data-l=\"cond|grappled\">Grappled<\/a><\/li><li><a class=\"lk\" data-l=\"cond|incapacitated\">Incapacitated<\/a><\/li><li><a class=\"lk\" data-l=\"cond|invisible\">Invisible<\/a><\/li><li><a class=\"lk\" data-l=\"cond|paralyzed\">Paralyzed<\/a><\/li><li><a class=\"lk\" data-l=\"cond|petrified\">Petrified<\/a><\/li><li><a class=\"lk\" data-l=\"cond|poisoned\">Poisoned<\/a><\/li><li><a class=\"lk\" data-l=\"cond|prone\">Prone<\/a><\/li><li><a class=\"lk\" data-l=\"cond|restrained\">Restrained<\/a><\/li><li><a class=\"lk\" data-l=\"cond|stunned\">Stunned<\/a><\/li><li><a class=\"lk\" data-l=\"cond|unconscious\">Unconscious<\/a><\/li><\/ul><p>A condition doesn't stack with itself; a recipient either has a condition or doesn't. The <a class=\"lk\" data-l=\"cond|exhaustion\">Exhaustion<\/a> condition is an exception to that rule.<\/p>","u":"https://5e.tools/variantrules.html#condition_xphb"},"rule|cone [area of effect]":{"n":"Cone","h":"<p>A Cone is an area of effect that extends in straight lines from a point of origin in a direction its creator chooses. A Cone's width at any point along its length is equal to that point's distance from the point of origin. For example, a Cone is 15 feet wide at a point along its length that is 15 feet from the point of origin. The effect that creates a Cone specifies its maximum length.<\/p><p>A Cone's point of origin isn't included in the area of effect unless its creator decides otherwise.<\/p>","u":"https://5e.tools/variantrules.html#cone%20%5Barea%20of%20effect%5D_xphb"},"rule|cover":{"n":"Cover","h":"<p>Cover provides a degree of protection to a target behind it. There are three degrees of cover, each of which provides a different benefit to a target: Half Cover (+2 bonus to AC and Dexterity saving throws), Three-Quarters Cover (+5 bonus to AC and Dexterity <a class=\"lk\" data-l=\"rule|saving throw\">saving throws<\/a>), and Total Cover (can't be targeted directly). If behind more than one degree of cover, a target benefits only from the most protective degree.<\/p>","u":"https://5e.tools/variantrules.html#cover_xphb"},"rule|crawling":{"n":"Crawling","h":"<p>While you're crawling, each foot of movement costs 1 extra foot (2 extra feet in <a class=\"lk\" data-l=\"rule|difficult terrain\">difficult terrain<\/a>).<\/p>","u":"https://5e.tools/variantrules.html#crawling_xphb"},"rule|creature":{"n":"Creature","h":"<p>Any being in the game, including <a class=\"lk\" data-l=\"rule|player character\">a player's character<\/a>, is a creature.<\/p>","u":"https://5e.tools/variantrules.html#creature_xphb"},"rule|creature type":{"n":"Creature Type","h":"<p>Every creature, including every <a class=\"lk\" data-l=\"rule|player character\">player character<\/a>, has a tag in the rules that identifies the type of creature it is. Most <a class=\"lk\" data-l=\"rule|player character\">player characters<\/a> are of the Humanoid type. These are the game's creature types:<\/p><ul><li>Aberration<\/li><li>Beast<\/li><li>Celestial<\/li><li>Construct<\/li><li>Dragon<\/li><li>Elemental<\/li><li>Fey<\/li><li>Fiend<\/li><li>Giant<\/li><li>Humanoid<\/li><li>Monstrosity<\/li><li>Ooze<\/li><li>Plant<\/li><li>Undead<\/li><\/ul><p>The types don't have rules themselves, but some rules in the game affect creatures of certain types in different ways.<\/p>","u":"https://5e.tools/variantrules.html#creature%20type_xphb"},"rule|critical hit":{"n":"Critical Hit","h":"<p>If you roll a 20 on the d20 for an attack roll, you score a Critical Hit, and the attack hits regardless of any modifiers or the target's AC. A Critical Hit lets you roll extra dice for the attack's damage against the target. Roll all of the attack's damage dice twice and add them together. Then add any relevant modifiers.<\/p>","u":"https://5e.tools/variantrules.html#critical%20hit_xphb"},"rule|cube [area of effect]":{"n":"Cube","h":"<p>A Cube is an area of effect that extends in straight lines from a point of origin located anywhere on a face of the Cube. The effect that creates a Cube specifies its size, which is the length of each side. A Cube's point of origin isn't included in the area of effect unless its creator decides otherwise.<\/p>","u":"https://5e.tools/variantrules.html#cube%20%5Barea%20of%20effect%5D_xphb"},"rule|curses":{"n":"Curses","h":"<p>Some game effects curse a creature or an object. The effect that confers a curse defines what the curse does. Curses can be removed by the <a class=\"lk\" data-l=\"spell|remove curse\">Remove Curse<\/a> and <a class=\"lk\" data-l=\"spell|greater restoration\">Greater Restoration<\/a> spells or other magic that explicitly ends curses.<\/p>","u":"https://5e.tools/variantrules.html#curses_xphb"},"rule|cylinder [area of effect]":{"n":"Cylinder","h":"<p>A Cylinder is an area of effect that extends in straight lines from a point of origin located at the center of the circular top or bottom of the Cylinder. The effect that creates a Cylinder specifies the radius of the Cylinder's base and the Cylinder's height.<\/p><p>A Cylinder's point of origin is included in the area of effect.<\/p>","u":"https://5e.tools/variantrules.html#cylinder%20%5Barea%20of%20effect%5D_xphb"},"rule|d20 test":{"n":"D20 Test","h":"<p>D20 Tests encompass the three main d20 rolls of the game: <a class=\"lk\" data-l=\"rule|ability check\">ability checks<\/a>, <a class=\"lk\" data-l=\"rule|attack roll\">attack rolls<\/a>, and <a class=\"lk\" data-l=\"rule|saving throw\">saving throws<\/a>. If something in the game affects D20 Tests, it affects all three of these rolls. The DM determines whether a D20 Test is warranted in a given circumstance.<\/p>","u":"https://5e.tools/variantrules.html#d20%20test_xphb"},"rule|damage":{"n":"Damage","h":"<p>Damage represents harm that causes a creature or an object to lose <a class=\"lk\" data-l=\"rule|hit points\">Hit Points<\/a>.<\/p>","u":"https://5e.tools/variantrules.html#damage_xphb"},"rule|damage roll":{"n":"Damage Roll","h":"<p>A damage roll is a die roll, adjusted by any applicable modifiers, that deals damage to a target.<\/p>","u":"https://5e.tools/variantrules.html#damage%20roll_xphb"},"rule|damage threshold":{"n":"Damage Threshold","h":"<p>A creature or an object that has a damage threshold has <a class=\"lk\" data-l=\"rule|immunity\">Immunity<\/a> to all damage unless it takes an amount of damage from a single attack or effect equal to or greater than its damage threshold, in which case it takes that entire instance of damage. Any damage that fails to meet or exceed the damage threshold is superficial and doesn't reduce <a class=\"lk\" data-l=\"rule|hit points\">Hit Points<\/a>. For example, if an object has a damage threshold of 10, the object takes no damage if 9 damage is dealt to it, since that damage fails to exceed the threshold. If the same object is dealt 11 damage, it takes all of that damage.<\/p>","u":"https://5e.tools/variantrules.html#damage%20threshold_xphb"},"rule|damage types":{"n":"Damage Types","h":"<p>Attacks and other harmful effects deal different types of damage. Damage types have no rules of their own, but other rules, such as Resistance, rely on the types. The Damage Types table offers examples to help a DM assign a type to a new effect.<\/p><div class=\"tw\"><table><caption>Damage Types<\/caption><tr><th>Type<\/th><th>Examples<\/th><\/tr><tr><td>Acid<\/td><td>Corrosive liquids, digestive enzymes<\/td><\/tr><tr><td>Bludgeoning<\/td><td>Blunt objects, constriction, falling<\/td><\/tr><tr><td>Cold<\/td><td>Freezing water, icy blasts<\/td><\/tr><tr><td>Fire<\/td><td>Flames, unbearable heat<\/td><\/tr><tr><td>Force<\/td><td>Pure magical energy<\/td><\/tr><tr><td>Lightning<\/td><td>Electricity<\/td><\/tr><tr><td>Necrotic<\/td><td>Life-draining energy<\/td><\/tr><tr><td>Piercing<\/td><td>Fangs, puncturing objects<\/td><\/tr><tr><td>Poison<\/td><td>Toxic gas, venom<\/td><\/tr><tr><td>Psychic<\/td><td>Mind-rending energy<\/td><\/tr><tr><td>Radiant<\/td><td>Holy energy, searing radiation<\/td><\/tr><tr><td>Slashing<\/td><td>Claws, cutting objects<\/td><\/tr><tr><td>Thunder<\/td><td>Concussive sound<\/td><\/tr><\/table><\/div>","u":"https://5e.tools/variantrules.html#damage%20types_xphb"},"rule|darkness":{"n":"Darkness","h":"<p>An area of Darkness is <a class=\"lk\" data-l=\"rule|heavily obscured\">Heavily Obscured<\/a>.<\/p>","u":"https://5e.tools/variantrules.html#darkness_xphb"},"rule|dead":{"n":"Dead","h":"<p>A dead creature has no <a class=\"lk\" data-l=\"rule|hit points\">Hit Points<\/a> and can't regain them unless it is first revived by magic such as the <a href=\"https://5e.tools/spells.html#raise%20dead_xphb\" target=\"_blank\" rel=\"noopener\">Raise Dead<\/a> or <a class=\"lk\" data-l=\"spell|revivify\">Revivify<\/a> spell. When such a spell is cast, the spirit knows who is casting it and can refuse. The spirit of a dead creature has left the body and departed for the Outer Planes, and reviving the creature requires calling the spirit back.<\/p><p>If the creature returns to life, the revival effect determines the creature's current <a class=\"lk\" data-l=\"rule|hit points\">Hit Points<\/a>. Unless otherwise stated, the creature returns to life with any <a class=\"lk\" data-l=\"rule|condition\">conditions<\/a>, magical contagions, or curses that were affecting it at death if the durations of those effects are still ongoing. If the creature died with any <a class=\"lk\" data-l=\"cond|exhaustion\">Exhaustion<\/a> levels, it returns with 1 fewer level. If the creature had <a class=\"lk\" data-l=\"rule|attunement\">Attunement<\/a> to one or more magic items, it is no longer attuned to them.<\/p>","u":"https://5e.tools/variantrules.html#dead_xphb"},"rule|death saving throw":{"n":"Death Saving Throw","h":"<p>A <a class=\"lk\" data-l=\"rule|player character\">player character<\/a> must make a Death Saving Throw (also called a Death Save) if they start their turn with 0 <a class=\"lk\" data-l=\"rule|hit points\">Hit Points<\/a>.<\/p>","u":"https://5e.tools/variantrules.html#death%20saving%20throw_xphb"},"rule|difficult terrain":{"n":"Difficult Terrain","h":"<p>If a space is Difficult Terrain, every foot of movement in that space costs 1 extra foot. For example, moving 5 feet through Difficult Terrain costs 10 feet of movement. Difficult Terrain isn't cumulative; either a space
